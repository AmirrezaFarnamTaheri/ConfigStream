name: Post-615 Remediation

on:
  push:
    branches: [agent/post-615-hardening]
    paths:
      - '.github/workflows/post-615-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/post-615-hardening
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Refactor tester launch boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          manager = Path('src/configstream/testers/go_tester/manager.py')
          text = manager.read_text(encoding='utf-8')
          text = text.replace('import tempfile\n', '')
          text = text.replace('from ...constants import VWARP_SOCKS5_PORT, VWARP_BIND_ADDRESS\n', '')
          if 'class GoBatchTester:' not in text:
              raise SystemExit('expected streaming class declaration not found')
          text = text.replace('class GoBatchTester:', 'class _StreamingGoBatchTester:', 1)
          start_marker = '    async def _ensure_process(self) -> None:\n'
          end_marker = '    @staticmethod\n    async def _cancel_task'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          fail_closed = '''    async def _ensure_process(self) -> None:\n        """The streaming base deliberately cannot launch an executable.\n\n        Process creation is a security boundary owned by secure_manager.GoBatchTester,\n        which verifies executable identity and constructs a minimal child environment.\n        Keeping the transport base fail-closed prevents future imports or refactors from\n        accidentally bypassing those controls.\n        """\n        raise RuntimeError(\n            "streaming Go tester base cannot launch a process; use the verified launcher"\n        )\n\n'''
          text = text[:start] + fail_closed + text[end:]
          manager.write_text(text, encoding='utf-8')

          secure = Path('src/configstream/testers/go_tester/secure_manager.py')
          secure_text = secure.read_text(encoding='utf-8')
          old = '''from .manager import (\n    GO_TESTER_STREAM_LIMIT,\n    GoBatchTester as _StreamingGoBatchTester,\n)'''
          new = '''from .manager import GO_TESTER_STREAM_LIMIT, _StreamingGoBatchTester'''
          if old not in secure_text:
              raise SystemExit('expected secure_manager base import not found')
          secure.write_text(secure_text.replace(old, new, 1), encoding='utf-8')

          test_base = Path('tests/unit/test_go_batch_tester_remediation.py')
          test_text = test_base.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'Strategy: import the base streaming class directly from manager.py (bypassing\n'
              'the binary-identity verification in secure_manager.py), and patch\n'
              '_ensure_process to a no-op so test_batch can reach the drain() path.',
              'Strategy: import the private streaming transport base directly from manager.py.\n'
              'The base cannot launch a subprocess; tests patch _ensure_process so IPC methods\n'
              'can be exercised without crossing the verified process-launch boundary.',
          )
          test_text = test_text.replace(
              '# Import the *base* streaming class to avoid binary discovery in secure_manager\n'
              'from configstream.testers.go_tester.manager import GoBatchTester as _BaseTester',
              '# Import the private transport base; it is intentionally incapable of spawning.\n'
              'from configstream.testers.go_tester.manager import _StreamingGoBatchTester as _BaseTester',
          )
          test_base.write_text(test_text, encoding='utf-8')

          regression = Path('tests/unit/test_comprehensive_hardening.py')
          reg_text = regression.read_text(encoding='utf-8')
          marker = 'async def test_streaming_go_tester_base_is_fail_closed() -> None:'
          if marker not in reg_text:
              reg_text += '''\n\n@pytest.mark.asyncio\nasync def test_streaming_go_tester_base_is_fail_closed() -> None:\n    from configstream.testers.go_tester.manager import _StreamingGoBatchTester\n\n    tester = object.__new__(_StreamingGoBatchTester)\n    with pytest.raises(RuntimeError, match="cannot launch a process"):\n        await tester._ensure_process()\n'''
              regression.write_text(reg_text, encoding='utf-8')

          budget_path = Path('config/exception-boundary-budget.json')
          budget = json.loads(budget_path.read_text(encoding='utf-8'))
          path = 'src/configstream/testers/go_tester/manager.py'
          if budget['path_ceilings'].get(path) != 15:
              raise SystemExit(f'unexpected manager exception ceiling: {budget["path_ceilings"].get(path)!r}')
          budget['path_ceilings'][path] = 13
          budget['total_ceiling'] = sum(budget['path_ceilings'].values())
          if budget['total_ceiling'] != 226:
              raise SystemExit(f'unexpected total exception ceiling: {budget["total_ceiling"]}')
          budget_path.write_text(json.dumps(budget, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          manager_text = manager.read_text(encoding='utf-8')
          if 'os.environ.copy()' in manager_text:
              raise SystemExit('unsafe full environment inheritance remains in streaming base')
          if 'create_subprocess_exec' in manager_text[manager_text.index(start_marker):manager_text.index(end_marker, manager_text.index(start_marker))]:
              raise SystemExit('streaming base still launches a subprocess')
          if manager_text.count('except Exception') != 13:
              raise SystemExit(f'expected 13 broad boundaries in manager, found {manager_text.count("except Exception")}')
          PY
      - name: Install pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/unit/test_comprehensive_hardening.py \
            tests/unit/test_go_batch_tester_remediation.py \
            tests/unit/test_secure_go_batch_serialization.py \
            tests/unit/test_validate_exception_boundaries.py
      - name: Regenerate governed evidence
        run: |
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
      - name: Verify repository contracts
        run: python scripts/verify_repository.py
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/configstream/testers/go_tester/manager.py \
            src/configstream/testers/go_tester/secure_manager.py \
            tests/unit/test_go_batch_tester_remediation.py \
            tests/unit/test_comprehensive_hardening.py \
            config/exception-boundary-budget.json \
            docs/DEBT_MATRIX.md \
            docs/debt_matrix.json \
            docs/generated/environment-variables.md \
            docs/generated/environment-variables.json
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit'
            exit 1
          fi
          git commit -m 'fix(security): make tester transport base fail closed'
          git push origin HEAD:agent/post-615-hardening
