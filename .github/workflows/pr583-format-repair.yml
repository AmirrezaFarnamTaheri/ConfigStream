name: PR583 one-shot format repair

on:
  push:
    branches:
      - codex/fix-actions-and-runtime-resilience

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/fix-actions-and-runtime-resilience
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize metadata helper spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/configstream/output/metadata.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    return default\n\n\n\ndef _normalize_drop_reason",
              "    return default\n\n\ndef _normalize_drop_reason",
              1,
          )
          text = text.replace(
              "    return key\n\ndef save_metadata",
              "    return key\n\n\ndef save_metadata",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/pr583-format-repair.yml
          python scripts/generate_environment_catalog.py --check
          python scripts/validate_function_size_budget.py
          python -m compileall -q src/configstream/output/metadata.py

      - name: Commit format repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: normalize metadata helper spacing"
          git push origin HEAD:codex/fix-actions-and-runtime-resilience
