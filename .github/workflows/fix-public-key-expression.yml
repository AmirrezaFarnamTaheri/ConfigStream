name: Restore Public Key Expression

on:
  push:
    branches: [agent/fix-active-audit-items]
    paths:
      - '.github/workflows/fix-public-key-expression.yml'

permissions:
  contents: write

concurrency:
  group: restore-public-key-expression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Restore literal secret expression without workflow interpolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/main.yml')
          text = source.read_text(encoding='utf-8')
          old = '          CS_PUBLIC_KEY: \n        run: |\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one blank final-gate public key binding, found {text.count(old)}')
          expression = chr(36) + '{{ secrets.CS_PUBLIC_KEY }}'
          new = f'          CS_PUBLIC_KEY: {expression}\n        run: |\n'
          text = text.replace(old, new, 1)
          Path('audit-main.yml').write_text(text, encoding='utf-8')
          PY
      - name: Stage corrected workflow as ordinary blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 audit-main.yml)"
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/audit-main.yml?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(
            --method PUT
            -H 'Accept: application/vnd.github+json'
            "/repos/${GITHUB_REPOSITORY}/contents/audit-main.yml"
            -f message='chore: stage corrected public-key workflow binding'
            -f content="$encoded"
            -f branch="$GITHUB_REF_NAME"
          )
          if [ -n "$existing" ]; then
            args+=( -f sha="$existing" )
          fi
          gh api "${args[@]}" >/dev/null
