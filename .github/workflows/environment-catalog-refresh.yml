name: Environment Catalog Refresh

on:
  push:
    branches: [agent/fix-singbox-wireguard-runtime-conformance]
    paths:
      - '.github/workflows/environment-catalog-refresh.yml'

permissions:
  contents: write

concurrency:
  group: environment-catalog-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/fix-singbox-wireguard-runtime-conformance
      - name: Regenerate environment catalog
        run: python scripts/generate_environment_catalog.py
      - name: Commit exact generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md
          if git diff --cached --quiet; then
            echo "Environment catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): regenerate environment catalog"
          git push origin HEAD:agent/fix-singbox-wireguard-runtime-conformance
