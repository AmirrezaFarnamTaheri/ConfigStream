name: ConfigStream Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'sources/**'
      - 'src/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -e .

      # --- CACHE INTELLIGENCE DATABASES ---
      - name: Restore Smart Cache
        uses: actions/cache@v4
        with:
          path: data/*.db
          key: configstream-smart-db-${{ github.run_id }}
          restore-keys: |
            configstream-smart-db-
      # ------------------------------------

      - name: Download GeoIP Databases
        run: |
          mkdir -p data
          # You should implement a secure download here or verify presence
          # For now, assuming the repo might track them or another step handles it.
          # Ideally, use a MaxMind license key in secrets to download fresh DBs.

      - name: Run Pipeline
        run: |
          configstream merge \
            --sources sources/batch_1.txt \
            --output output/ \
            --max-workers 50 \
            --timeout 8 \
            --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
