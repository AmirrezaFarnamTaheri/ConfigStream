name: ConfigStream Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # --- Build Docker Image ---
  build_container:
    name: Build & Push Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: echo "REPO_LOWERCASE=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}:latest
            ghcr.io/${{ env.REPO_LOWERCASE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run Linters
        run: |
          black --check .
          flake8 .
          mypy .

  build_wasm:
    name: Build WASM Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build WASM Binary
        run: |
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-wasm
          path: |
            frontend/assets/wasm/tester.wasm
            frontend/assets/js/wasm_exec.js

  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Install Playwright
        run: python -m playwright install --with-deps

      - name: Run tests
        run: python -m pytest --cov=src/configstream --cov-report=term-missing

  pipeline:
    name: Run Batch Shard (${{ matrix.batch_number }})
    runs-on: ubuntu-latest
    needs: [build_container, lint, test]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        batch_number: [1, 2, 3, 4, 5, 6]
      fail-fast: false

    container:
      image: ghcr.io/${{ github.repository | lower }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        PYTHONPATH: /app/src

    steps:
      - name: Checkout (for sources only, logic is in container)
        uses: actions/checkout@v4

      - name: Restore Cache (Adaptive Logic)
        uses: actions/cache@v3
        with:
          path: |
            data/adaptive_timeout.db
            data/source_quality.db
            data/test_cache.json
            data/GeoLite2-City.mmdb
          key: configstream-data-${{ github.ref }}
          restore-keys: |
            configstream-data-

      - name: Download GeoIP databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: python -m configstream.cli update-databases

      - name: Run pipeline for Batch ${{ matrix.batch_number }}
        env:
          BATCH_NUMBER: ${{ matrix.batch_number }}
        run: |
          set -euxo pipefail
          echo "Running pipeline for batch $BATCH_NUMBER"
          python -m configstream.cli merge \
            --sources "sources/batch_${BATCH_NUMBER}.txt" \
            --output "output_batch_${BATCH_NUMBER}" \
            --max-workers 50 \
            --timeout 24 \
            --max-latency 6000 | tee "pipeline_batch_${BATCH_NUMBER}.log"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-run-${{ github.sha }}-${{ matrix.batch_number }}
          path: |
            output_batch_${{ matrix.batch_number }}/
            pipeline_batch_${{ matrix.batch_number }}.log
            data/test_cache.json

  merge_results:
    name: Merge & Fan-Out
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && github.event_name != 'pull_request'
    permissions:
        contents: write # For Releases
        id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[dev] requests huggingface_hub

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-run-${{ github.sha }}-*
          path: artifacts
          merge-multiple: true

      - name: Download WASM for Deployment
        uses: actions/download-artifact@v4
        with:
          name: frontend-wasm
          path: frontend/
          # This restores assets/wasm/tester.wasm and assets/js/wasm_exec.js into frontend/
          # effectively populating the frontend source before copying to output

      - name: Restore previous outputs for merge
        run: |
          set -euxo pipefail
          if [ -z "$(ls -A artifacts)" ]; then
              echo "No artifacts found to restore."
              exit 0
          fi
          find artifacts -mindepth 1 -maxdepth 1 -type d -name 'output_batch_*' -exec mv {} . \;
          find artifacts -type f -name '*.log' -exec mv {} . \;

      - name: Run merge script
        env:
            WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
        run: python -m scripts.merge_batches

      - name: Copy Frontend Assets
        run: |
          cp -r frontend/* output/
          # Ensure no overwrite of generated files if any collision (unlikely but safe)
          # Actually, frontend shouldn't contain proxies.json etc.

      - name: Generate Stealth Assets
        env:
          # You must generate a Fernet key once (python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          # And save it as a Repository Secret: STEGO_KEY
          STEGO_KEY: ${{ secrets.STEGO_KEY }}
        run: |
          # Ensure we have a cover image
          mkdir -p output/assets
          # If no cover image exists, use a fallback or skip (prevent failure if assets are missing)
          if [ -f "frontend/assets/images/header-bg.png" ]; then
             cp frontend/assets/images/header-bg.png output/assets/cover.png
             # Run the packer script
             python -c "from configstream.transport.stego import generate_stego_assets; from pathlib import Path; generate_stego_assets(Path('output'), Path('output/assets'), '${{ env.STEGO_KEY }}')"
          else
             echo "Cover image not found, skipping steganography generation."
          fi

      - name: Generate Version Tag
        id: tag
        run: |
          TAG=v$(date +'%Y.%m.%d-%H%M')
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # --- Fan-Out Distribution (Parallel) ---

      - name: Upload to Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/upload_telegram.py &

      - name: Upload to Hugging Face
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python scripts/upload_hf.py --path output/ --repo-id $HF_REPO_ID --token $HF_TOKEN &

      - name: Upload to Google Drive Mirror
        if: env.GDRIVE_FOLDER_ID != ''
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # Ensure dependencies are installed (if not in previous steps)
          pip install google-api-python-client google-auth
          python scripts/upload_gdrive.py --path output/ --folder-id $GDRIVE_FOLDER_ID &

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ConfigStream ${{ steps.tag.outputs.tag }}
          files: |
             output/singbox.json
             output/clash.yaml
             output/singbox-vpn.json
             output/vpn_subscription_base64.txt
             output/stealth_cover.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Wait for Background Jobs
        run: wait
