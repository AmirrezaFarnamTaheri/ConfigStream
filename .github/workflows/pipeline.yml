name: ConfigStream Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-container:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pipeline:
    name: Run Batch Shard (${{ matrix.batch_number }})
    runs-on: ubuntu-latest
    needs: [build-container]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        batch_number: [1, 2, 3, 4, 5, 6]
      fail-fast: false

    container:
      image: ghcr.io/${{ github.repository }}:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        BATCH_NUMBER: ${{ matrix.batch_number }}
        PYTHONPATH: src

    steps:
      - name: Checkout (for source files if needed, though image has them)
        uses: actions/checkout@v4

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            data/adaptive_timeout.db
            data/source_quality.db
            data/test_cache.json
            data/GeoLite2-City.mmdb
            output/.etag-cache.json
          key: configstream-persistent-cache-${{ github.ref }}
          restore-keys: |
            configstream-persistent-cache-

      - name: Run pipeline for Batch ${{ env.BATCH_NUMBER }}
        run: |
          set -euxo pipefail
          echo "Running pipeline for batch $BATCH_NUMBER"
          # Use the tester binary implicitly via configstream logic
          python -m configstream.cli merge \
            --sources "sources/batch_${BATCH_NUMBER}.txt" \
            --output "output_batch_${BATCH_NUMBER}" \
            --max-workers 50 \
            --timeout 24 \
            --max-latency 6000 | tee "pipeline_batch_${BATCH_NUMBER}.log"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-run-${{ github.sha }}-${{ env.BATCH_NUMBER }}
          path: |
            output_batch_${{ env.BATCH_NUMBER }}/
            pipeline_batch_${{ env.BATCH_NUMBER }}.log
            data/test_cache.json

  merge_results:
    name: Merge Shard Results
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && github.event_name != 'pull_request'

    container:
      image: ghcr.io/${{ github.repository }}:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-run-${{ github.sha }}-*
          path: artifacts
          merge-multiple: true

      - name: Restore previous outputs for merge
        run: |
          set -euxo pipefail
          if [ -z "$(ls -A artifacts)" ]; then
              echo "No artifacts found to restore."
              exit 0
          fi
          # Move artifacts to current directory structure
          find artifacts -mindepth 1 -maxdepth 1 -type d -name 'output_batch_*' -exec mv {} . \;
          find artifacts -type f -name '*.log' -exec mv {} . \;

      - name: Run merge script
        env:
          WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
        run: python -m scripts.merge_batches

      - name: Upload Pipeline Results
        uses: actions/upload-artifact@v4
        with:
          name: configstream-data
          path: output/
          retention-days: 1

  # --- Fan-Out Distribution Jobs ---

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: merge_results
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pipeline artifact
        uses: actions/download-artifact@v4
        with:
          name: configstream-data
          path: output/

      - name: Copy Frontend Assets
        run: cp -r frontend/* output/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  upload-telegram:
    name: Upload to Telegram
    runs-on: ubuntu-latest
    needs: merge_results
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    container:
        image: ghcr.io/${{ github.repository }}:main
        credentials:
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
    env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        OUTPUT_DIR: output
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download pipeline artifact
        uses: actions/download-artifact@v4
        with:
          name: configstream-data
          path: output/
      - name: Run Upload Script
        run: python scripts/upload_telegram.py

  upload-huggingface:
    name: Upload to Hugging Face
    runs-on: ubuntu-latest
    needs: merge_results
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    container:
        image: ghcr.io/${{ github.repository }}:main
        credentials:
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
    env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        OUTPUT_DIR: output
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download pipeline artifact
        uses: actions/download-artifact@v4
        with:
          name: configstream-data
          path: output/
      - name: Run Upload Script
        run: python scripts/upload_hf.py

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: merge_results
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download pipeline artifact
        uses: actions/download-artifact@v4
        with:
          name: configstream-data
          path: output/

      - name: Generate Tag
        id: tag
        run: echo "tag_name=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: |
            output/singbox.json
            output/singbox-vpn.json
            output/singbox-chains.json
            output/clash.yaml
            output/proxies.json.gz
          draft: false
          prerelease: false
