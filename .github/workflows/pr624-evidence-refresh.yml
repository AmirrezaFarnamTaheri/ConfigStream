name: PR624 Evidence Refresh

on:
  push:
    branches:
      - agent/fix-singbox-113-wireguard-runtime
    paths:
      - '.github/workflows/pr624-evidence-refresh.yml'

permissions:
  contents: write

concurrency:
  group: pr624-evidence-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-singbox-113-wireguard-runtime
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate deterministic supply-chain evidence
        run: |
          python scripts/generate_supply_chain_evidence.py --root .
          python scripts/generate_supply_chain_evidence.py --root . --check
      - name: Commit exact generated evidence
        run: |
          if git diff --quiet -- docs/generated/sbom.cdx.json docs/generated/dependency-licenses.json docs/generated/dependency-licenses.md; then
            echo "Supply-chain evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/sbom.cdx.json docs/generated/dependency-licenses.json docs/generated/dependency-licenses.md
          git commit -m "chore(deps): refresh supply-chain evidence"
          git push origin HEAD:agent/fix-singbox-113-wireguard-runtime
