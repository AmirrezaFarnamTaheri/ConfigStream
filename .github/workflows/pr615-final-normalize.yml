name: PR615 Final Normalize

on:
  push:
    branches: [agent/fix-active-audit-items]
    paths:
      - '.github/workflows/pr615-final-normalize.yml'

permissions:
  contents: write

concurrency:
  group: pr615-final-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-active-audit-items
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check black==26.5.1
      - name: Format exact PR Python diff
        env:
          BASE_SHA: 40966ab9bb64b3f4d8c8b1c4f16bba0e48c8876b
        run: |
          mapfile -t python_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          if (( ${#python_files[@]} > 0 )); then
            python -m black --fast --target-version py310 "${python_files[@]}"
            python -m black --check --fast --target-version py310 "${python_files[@]}"
          fi
      - name: Regenerate exact governed evidence
        run: |
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/generate_triage_report.py
          python scripts/validate_exception_boundaries.py
          python scripts/generate_environment_catalog.py --check
          python scripts/generate_debt_matrix.py --check
          python scripts/generate_triage_report.py --check
          python -m compileall -q src/configstream tests/test_scanner.py tests/unit/security/test_utls_wrapper.py tests/unit/test_go_tester_process_lifecycle.py tests/unit/tools/test_vwarp_scanner_lifecycle.py
      - name: Commit normalized tracked state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs config TRIAGE_REPORT.md
          if git diff --cached --quiet; then
            echo 'No normalization changes to commit.'
            exit 0
          fi
          git commit -m 'chore: normalize final audit remediation state'
          git push origin HEAD:agent/fix-active-audit-items
