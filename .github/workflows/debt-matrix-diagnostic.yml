name: Debt Matrix Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/debt-matrix-diagnostic.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Remove diagnostic workflow from scanned index
        run: git rm .github/workflows/debt-matrix-diagnostic.yml
      - name: Regenerate and validate debt matrix
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/generate_debt_matrix.py --check
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('docs/debt_matrix.json').read_text(encoding='utf-8'))
          print(json.dumps(payload['summary'], sort_keys=True))
          PY
      - name: Upload exact generated debt evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-debt-matrix-${{ github.run_id }}
          path: |
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
          if-no-files-found: error
          retention-days: 1
