name: Finalize Debt Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/debt-matrix-diagnostic.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Remove helper before scanning tracked tree
        run: git rm .github/workflows/debt-matrix-diagnostic.yml
      - name: Regenerate and validate debt plus triage evidence
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/generate_debt_matrix.py --check
          python scripts/generate_triage_report.py
          python scripts/generate_triage_report.py --check
          git diff --check
      - name: Enforce generated-file allowlist
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/debt-matrix-diagnostic.yml',
              'docs/DEBT_MATRIX.md',
              'docs/debt_matrix.json',
              'TRIAGE_REPORT.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected changes: ' + ', '.join(unexpected))
          required = {'docs/DEBT_MATRIX.md', 'docs/debt_matrix.json', 'TRIAGE_REPORT.md'}
          missing = sorted(required - changed)
          if missing:
              raise SystemExit('expected generated changes missing: ' + ', '.join(missing))
          print('Validated changes:', ', '.join(sorted(changed)))
          PY
      - name: Commit generated evidence and helper removal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh debt and triage evidence"
          git push origin HEAD:feat/post-audit-remediation-v3.1.0
