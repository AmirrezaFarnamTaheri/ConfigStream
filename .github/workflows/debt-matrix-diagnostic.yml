name: Debt Matrix Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Regenerate debt artifacts and print exact diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          git diff --no-ext-diff -- docs/debt_matrix.json docs/DEBT_MATRIX.md
          if ! git diff --quiet -- docs/debt_matrix.json docs/DEBT_MATRIX.md; then
            echo "Debt artifacts differ from generated merge-tree output."
            exit 1
          fi
