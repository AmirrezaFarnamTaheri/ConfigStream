name: Apply Suppression Cleanup

on:
  push:
    branches:
      - agent/comprehensive-hardening
    paths:
      - .github/workflows/apply-suppression-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/comprehensive-hardening
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install bandit
      - name: Remove only inactive suppression tokens
        run: python scripts/clean_stale_bandit_suppressions.py
      - name: Validate suppression integrity
        run: |
          python scripts/validate_bandit_suppressions.py --require-active
          python -m compileall -q src/configstream scripts tools
          python scripts/check_license_headers.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/configstream scripts tools
          git commit -m "chore(security): remove obsolete Bandit suppressions"
          git push origin HEAD:agent/comprehensive-hardening
