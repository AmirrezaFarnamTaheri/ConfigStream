name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  BUILD_VERSION: ${{ vars.PYTHON_BUILD_VERSION }}
  PYINSTALLER_VERSION: ${{ vars.PYINSTALLER_VERSION }}

jobs:
  verify:
    name: Verify Release Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Require exact build-tool pins
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BUILD_VERSION" "$PYINSTALLER_VERSION"; do
            case "$value" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo 'PYTHON_BUILD_VERSION and PYINSTALLER_VERSION must be exact repository variables' >&2; exit 1;;
            esac
          done
      - name: Install and verify
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          pytest -q
          python scripts/validate_versions.py
          python scripts/validate_capability_registry.py
          python scripts/validate_core_compatibility.py
          python scripts/validate_module_ownership.py

  build_python:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build with pinned frontend
        run: |
          set -euo pipefail
          pip install "build==$BUILD_VERSION"
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          configstream --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/attest-build-provenance@c07444704da0babd85e546bc4553b5e43a85db9a
        with:
          subject-path: dist/*

  build_native:
    name: Build Native ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            artifact: ConfigStream-linux-x86_64
          - name: Windows x86-64
            os: windows-latest
            artifact: ConfigStream-windows-x86_64.exe
          - name: macOS
            os: macos-latest
            artifact: ConfigStream-macos.dmg
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned native packager
        shell: bash
        run: |
          set -euo pipefail
          pip install . "pyinstaller==$PYINSTALLER_VERSION"
          python -c "from pathlib import Path; Path('build_entrypoint.py').write_text('from configstream.cli import main\nif __name__ == \\\"__main__\\\":\n    main()\n', encoding='utf-8')"
      - name: Build native executable
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --clean --noconfirm --onefile --name configstream build_entrypoint.py
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/configstream "dist/${{ matrix.artifact }}"
          chmod 0755 "dist/${{ matrix.artifact }}"
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/configstream.exe "dist/${{ matrix.artifact }}"
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmg-root
          cp dist/configstream dmg-root/ConfigStream
          chmod 0755 dmg-root/ConfigStream
          hdiutil create -volname ConfigStream \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/${{ matrix.artifact }}"
      - name: Require exact native output
        shell: bash
        run: test -s "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.artifact }}-${{ github.sha }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
      - uses: actions/attest-build-provenance@c07444704da0babd85e546bc4553b5e43a85db9a
        with:
          subject-path: dist/${{ matrix.artifact }}

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_python]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: false

  create_release:
    name: Publish Signed Release Assets
    runs-on: ubuntu-latest
    needs: [build_python, build_native, publish_pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect and verify mandatory release set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name 'ConfigStream-linux-x86_64' \) -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -ge 1
          test -s dist/ConfigStream-linux-x86_64
          test -s dist/ConfigStream-windows-x86_64.exe
          test -s dist/ConfigStream-macos.dmg
          sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          generate_release_notes: true
          files: dist/*
