name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify_release_state:
    name: Verify Canonical Release State
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Validate repository contracts and release state
        run: |
          set -euo pipefail
          python scripts/verify_repository.py --profile static
          python scripts/validate_status.py
          python scripts/validate_versions.py
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = str(project["project"]["version"])
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match project version v{version}")

          readiness = json.loads(Path("docs/readiness.json").read_text(encoding="utf-8"))
          if not (
              readiness.get("verdict") == "PASS"
              and readiness.get("release_gate") == "ready"
              and readiness.get("production_ready") is True
          ):
              raise SystemExit("canonical readiness state does not authorize a production release")
          PY

  build_python:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    needs: [verify_release_state]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Verify Version Consistency
        run: python scripts/validate_versions.py
      - name: Validate capability registry
        run: python scripts/validate_capability_registry.py
      - name: Validate core compatibility report
        run: python scripts/validate_core_compatibility.py
      - name: Validate module ownership map
        run: python scripts/validate_module_ownership.py
      - name: Run tests
        run: pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/*
      - name: Attest Python distributions
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/*

  build_native:
    name: Build Native Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [verify_release_state]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install native packaging dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install . --no-deps
      - name: Build single-file binary with PyInstaller
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("build_entrypoint.py").write_text(
              "from configstream.cli import main\n"
              "if __name__ == '__main__':\n"
              "    main()\n",
              encoding="utf-8",
          )
          PY
          python -m PyInstaller --onefile --name configstream build_entrypoint.py
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          mkdir -p AppDir/usr/bin
          cp dist/configstream AppDir/usr/bin/configstream
          cp frontend/assets/images/icon-192x192.png AppDir/configstream.png
          cat > AppDir/configstream.desktop <<'EOF'
          [Desktop Entry]
          Name=ConfigStream
          Exec=configstream
          Icon=configstream
          Type=Application
          Categories=Network;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/configstream" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fSsL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir dist/ConfigStream-linux-x86_64.AppImage
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          mkdir -p dmg-root
          cp dist/configstream dmg-root/ConfigStream
          hdiutil create -volname ConfigStream \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            dist/ConfigStream-macos.dmg
      - name: Normalize native artifact names
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv dist/configstream.exe dist/ConfigStream-windows-x86_64.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            ls -l dist/ConfigStream-macos.dmg
          else
            ls -l dist/ConfigStream-linux-x86_64.AppImage
          fi
      - name: Upload native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/ConfigStream-windows-x86_64.exe
            dist/ConfigStream-macos.dmg
            dist/ConfigStream-linux-x86_64.AppImage
          if-no-files-found: ignore
      - name: Attest Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/ConfigStream-linux-x86_64.AppImage
      - name: Attest Windows binary
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/ConfigStream-windows-x86_64.exe
      - name: Attest macOS DMG
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/ConfigStream-macos.dmg

  publish_pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [build_python]
    permissions:
      id-token: write
    steps:
      - name: Download Python distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          skip-existing: true

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_python, build_native, publish_pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euxo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -lah dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*
