name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_python:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          pip install -e ".[dev]"
          pip install build
      - name: Verify Version Consistency
        run: python scripts/validate_versions.py
      - name: Validate capability registry
        run: python scripts/validate_capability_registry.py
      - name: Validate core compatibility report
        run: python scripts/validate_core_compatibility.py
      - name: Validate module ownership map
        run: python scripts/validate_module_ownership.py
      - name: Run tests
        run: pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
      - name: Attest Python distributions
        uses: actions/attest-build-provenance@c07444704da0babd85e546bc4553b5e43a85db9a # v2.2.0
        with:
          subject-path: dist/*

  build_native:
    name: Build Native Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native packaging dependencies
        run: |
          pip install .
          pip install pyinstaller
      - name: Build single-file binary with PyInstaller
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("build_entrypoint.py").write_text(
              "from configstream.cli import main\n"
              "if __name__ == '__main__':\n"
              "    main()\n",
              encoding="utf-8",
          )
          PY
          python -m PyInstaller --onefile --name configstream build_entrypoint.py
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          mkdir -p AppDir/usr/bin
          cp dist/configstream AppDir/usr/bin/configstream
          cp frontend/assets/images/icon-192x192.png AppDir/configstream.png
          cat > AppDir/configstream.desktop <<'EOF'
          [Desktop Entry]
          Name=ConfigStream
          Exec=configstream
          Icon=configstream
          Type=Application
          Categories=Network;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/configstream" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fSsL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir dist/ConfigStream-linux-x86_64.AppImage
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          mkdir -p dmg-root
          cp dist/configstream dmg-root/ConfigStream
          hdiutil create -volname ConfigStream \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            dist/ConfigStream-macos-universal.dmg
      - name: Normalize native artifact names
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv dist/configstream.exe dist/ConfigStream-windows-x86_64.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            # DMG already produced with stable name.
            ls -l dist/ConfigStream-macos-universal.dmg
          else
            ls -l dist/ConfigStream-linux-x86_64.AppImage
          fi
      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/ConfigStream-windows-x86_64.exe
            dist/ConfigStream-macos-universal.dmg
            dist/ConfigStream-linux-x86_64.AppImage
          if-no-files-found: ignore
      - name: Attest Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@c07444704da0babd85e546bc4553b5e43a85db9a # v2.2.0
        with:
          subject-path: dist/ConfigStream-linux-x86_64.AppImage
      - name: Attest Windows binary
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@c07444704da0babd85e546bc4553b5e43a85db9a # v2.2.0
        with:
          subject-path: dist/ConfigStream-windows-x86_64.exe
      - name: Attest macOS DMG
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@c07444704da0babd85e546bc4553b5e43a85db9a # v2.2.0
        with:
          subject-path: dist/ConfigStream-macos-universal.dmg

  publish_pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [build_python]
    permissions:
      id-token: write
    steps:
      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          skip-existing: true

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_python, build_native, publish_pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euxo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -lah dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: dist/*

