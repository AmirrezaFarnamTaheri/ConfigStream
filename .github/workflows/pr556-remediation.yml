name: PR 556 Remediation

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          # The legacy canvas generator was unreferenced, conflicted with the comprehensive
          # generator for ownership of architecture.html, and carried four independent review
          # defects. Keep one canonical architecture generator instead of maintaining two.
          legacy = ROOT / 'scripts/build_architecture_page.py'
          if legacy.exists():
              legacy.unlink()

          # Asset generator: make output independent of the caller's CWD and use logging.
          path = 'scripts/make_assets.py'
          text = read(path)
          text = text.replace(
              'import html\nfrom pathlib import Path\n',
              'import html\nimport logging\nfrom pathlib import Path\n',
              1,
          )
          text = text.replace(
              'OUT_DIR = Path("assets")\n',
              'OUT_DIR = Path(__file__).resolve().parents[1] / "assets"\nLOGGER = logging.getLogger(__name__)\n',
              1,
          )
          text = text.replace(
              '    print(f"  wrote {name:22s} {target.stat().st_size:6d} B")\n',
              '    LOGGER.info("  wrote %-22s %6d B", name, target.stat().st_size)\n',
              1,
          )
          text = text.replace(
              'def main() -> None:\n    print("Generating precision cyber-minimalist SVG assets...")\n',
              'def main() -> None:\n    logging.basicConfig(level=logging.INFO, format="%(message)s")\n    LOGGER.info("Generating precision cyber-minimalist SVG assets...")\n',
              1,
          )
          text = text.replace(
              '    print("All assets generated successfully in assets/!")\n',
              '    LOGGER.info("All assets generated successfully in %s", OUT_DIR)\n',
              1,
          )
          write(path, text)

          # Asset validation: use defusedxml and sanitize parser diagnostics before printing.
          path = 'scripts/validate_assets.py'
          text = read(path)
          start = text.index('def _validate_svg_xml(tracked: list[Path]) -> list[str]:')
          end = text.index('\n\ndef validate_assets()', start)
          hardened_svg = '''def _validate_svg_xml(tracked: list[Path]) -> list[str]:
              from defusedxml import ElementTree as SafeET
              from defusedxml.common import DefusedXmlException

              errors: list[str] = []
              for path in tracked:
                  if path.suffix.lower() != ".svg":
                      continue
                  try:
                      SafeET.parse(path)
                  except (DefusedXmlException, SyntaxError, UnicodeDecodeError, OSError) as exc:
                      from configstream.security_validator import SecurityValidator

                      message = SecurityValidator.sanitize_log_message(str(exc))
                      errors.append(
                          f"malformed SVG XML in {_repo_relative(path)}: {message}"
                      )
              return errors
          '''
          text = text[:start] + hardened_svg + text[end:]
          write(path, text)

          # Runtime version validation: inspect every literal go-version declaration rather
          # than accepting one matching substring anywhere in all workflows.
          path = 'scripts/validate_runtime_versions.py'
          text = read(path)
          start = text.index('    workflow_text = "\\n".join(')
          end = text.index('\n\n    return errors', start)
          workflow_validation = '''    workflow_paths = sorted((root / ".github/workflows").glob("*.y*ml"))
              go_versions: list[tuple[Path, str]] = []
              for path in workflow_paths:
                  workflow_text = path.read_text(encoding="utf-8")
                  for match in re.finditer(
                      r"(?m)^\\s*go-version:\\s*['\\\"]?([^'\\\"\\s#]+)", workflow_text
                  ):
                      go_versions.append((path, match.group(1)))
                  for match in re.finditer(
                      r"(?m)^\\s*node-version:\\s*['\\\"]?([^'\\\"\\s#]+)", workflow_text
                  ):
                      _expect(
                          errors,
                          match.group(1) == str(node["ci"]),
                          f"{path.relative_to(root)} node-version {match.group(1)!r} != {node['ci']!r}",
                      )

              _expect(errors, bool(go_versions), "workflows must declare a Go version")
              for path, observed in go_versions:
                  _expect(
                      errors,
                      observed == go_ci,
                      f"{path.relative_to(root)} go-version {observed!r} != {go_ci!r}",
                  )'''
          # de-indent the Python source fragment by the indentation introduced by this heredoc.
          workflow_validation = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow_validation.splitlines()
          )
          text = text[:start] + workflow_validation + text[end:]
          write(path, text)

          # Explicit regression test: go.ci must override the toolchain fallback.
          path = 'tests/unit/test_validate_runtime_versions.py'
          text = read(path)
          if 'test_validator_prefers_explicit_go_ci' not in text:
              text += r'''

          def test_validator_prefers_explicit_go_ci(tmp_path: Path) -> None:
              (tmp_path / "config").mkdir()
              (tmp_path / ".github/workflows").mkdir(parents=True)
              (tmp_path / "src/go/tester").mkdir(parents=True)
              (tmp_path / "config/runtime-versions.json").write_text(
                  json.dumps(
                      {
                          "python": {"minimum": "3.10", "container": "3.12"},
                          "node": {"minimum_major": 24, "container": "24", "ci": "24"},
                          "go": {
                              "language": "1.24.0",
                              "toolchain": "1.24.3",
                              "ci": "1.24.4",
                              "container": "1.24",
                          },
                      }
                  ),
                  encoding="utf-8",
              )
              (tmp_path / "pyproject.toml").write_text(
                  '[project]\nrequires-python = ">=3.10"\n', encoding="utf-8"
              )
              (tmp_path / "package.json").write_text(
                  json.dumps({"engines": {"node": ">=24"}}), encoding="utf-8"
              )
              (tmp_path / "Dockerfile").write_text(
                  "FROM golang:1.24-alpine@sha256:deadbeef AS builder\n"
                  "FROM node:24-slim@sha256:deadbeef AS node-runtime\n"
                  "FROM python:3.12-slim@sha256:deadbeef\n",
                  encoding="utf-8",
              )
              (tmp_path / ".github/workflows/ci.yml").write_text(
                  "go-version: '1.24.4'\nnode-version: '24'\n", encoding="utf-8"
              )
              (tmp_path / "src/go/tester/go.mod").write_text(
                  "module example\n\ngo 1.24.0\n\ntoolchain go1.24.3\n",
                  encoding="utf-8",
              )

              errors = validate_runtime_versions.validate_repository(tmp_path)

              assert not any("go-version" in error for error in errors), errors
          '''
              # Strip the heredoc's ten-space prefix from the appended source.
              suffix_start = text.index('\n\n          def test_validator_prefers_explicit_go_ci')
              prefix, suffix = text[:suffix_start], text[suffix_start:]
              suffix = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in suffix.splitlines()
              )
              text = prefix + suffix
          write(path, text)

          # Canonical Go runtime is 1.24.3 in config/runtime-versions.json.
          replace_once('.github/workflows/main.yml', "          go-version: '1.23'", "          go-version: '1.24.3'")
          readme = read('README.md')
          readme = readme.replace('Go 1.23+', 'Go 1.24+')
          write('README.md', readme)

          # Validate topology as executable graph data, including uniqueness and every flow step.
          topology_validator = '''# SPDX-License-Identifier: AGPL-3.0-or-later
          """Validate the comprehensive architecture topology and its executable flow graph."""

          from __future__ import annotations

          import json
          from pathlib import Path

          TOPOLOGY_PATH = Path("system_topology.json")
          ALLOWED_LAYERS = {
              "infrastructure",
              "presentation",
              "application",
              "domain",
              "persistence",
          }


          def load_topology(path: Path = TOPOLOGY_PATH) -> dict[str, object]:
              """Load and validate the AST-verified system architecture topology."""
              if not path.is_file():
                  raise FileNotFoundError(f"Topology file {path} not found")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise ValueError(f"Topology file {path} does not contain a JSON object")
              typed_data: dict[str, object] = dict(data)
              validate_topology(typed_data)
              return typed_data


          def _require_non_empty_string(value: object, label: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise ValueError(f"{label} must be a non-empty string")
              return value


          def validate_topology(data: dict[str, object]) -> None:
              """Validate node, edge, and flow schemas plus all graph references."""
              required_keys = {"metadata", "nodes", "edges", "flows"}
              missing = required_keys - set(data)
              if missing:
                  raise ValueError(
                      f"Topology missing required top-level keys: {sorted(missing)}"
                  )
              if not isinstance(data.get("metadata"), dict):
                  raise ValueError("Topology metadata must be a JSON object")

              raw_nodes = data.get("nodes")
              raw_edges = data.get("edges")
              raw_flows = data.get("flows")
              if not isinstance(raw_nodes, list) or len(raw_nodes) < 50:
                  raise ValueError("Expected at least 50 architectural nodes")
              if not isinstance(raw_edges, list) or len(raw_edges) < 70:
                  raise ValueError("Expected at least 70 architectural edges")
              if not isinstance(raw_flows, list) or len(raw_flows) < 10:
                  raise ValueError("Expected at least 10 execution flows")

              node_ids: set[str] = set()
              for index, node in enumerate(raw_nodes):
                  if not isinstance(node, dict):
                      raise ValueError(f"Node entry {index} is not a JSON object")
                  node_id = _require_non_empty_string(node.get("id"), f"Node {index} id")
                  if node_id in node_ids:
                      raise ValueError(f"Duplicate node id: {node_id}")
                  node_ids.add(node_id)
                  layer = _require_non_empty_string(
                      node.get("layer"), f"Node {node_id} layer"
                  )
                  if layer not in ALLOWED_LAYERS:
                      raise ValueError(f"Node {node_id} uses unknown layer: {layer}")

              edge_ids: set[str] = set()
              for index, edge in enumerate(raw_edges):
                  if not isinstance(edge, dict):
                      raise ValueError(f"Edge entry {index} is not a JSON object")
                  edge_id = _require_non_empty_string(edge.get("id"), f"Edge {index} id")
                  if edge_id in edge_ids:
                      raise ValueError(f"Duplicate edge id: {edge_id}")
                  edge_ids.add(edge_id)
                  src = _require_non_empty_string(edge.get("source"), f"Edge {edge_id} source")
                  dst = _require_non_empty_string(edge.get("target"), f"Edge {edge_id} target")
                  if src not in node_ids:
                      raise ValueError(f"Edge source '{src}' does not exist in nodes")
                  if dst not in node_ids:
                      raise ValueError(f"Edge target '{dst}' does not exist in nodes")

              flow_ids: set[str] = set()
              for index, flow in enumerate(raw_flows):
                  if not isinstance(flow, dict):
                      raise ValueError(f"Flow entry {index} is not a JSON object")
                  flow_id = _require_non_empty_string(flow.get("id"), f"Flow {index} id")
                  if flow_id in flow_ids:
                      raise ValueError(f"Duplicate flow id: {flow_id}")
                  flow_ids.add(flow_id)
                  steps = flow.get("steps")
                  if not isinstance(steps, list) or not steps:
                      raise ValueError(f"Flow {flow_id} must contain a non-empty steps list")
                  for expected_number, step in enumerate(steps, start=1):
                      if not isinstance(step, dict):
                          raise ValueError(
                              f"Flow {flow_id} step {expected_number} is not a JSON object"
                          )
                      if step.get("step_number") != expected_number:
                          raise ValueError(
                              f"Flow {flow_id} step numbering must be contiguous from 1"
                          )
                      src = _require_non_empty_string(
                          step.get("from"), f"Flow {flow_id} step {expected_number} from"
                      )
                      dst = _require_non_empty_string(
                          step.get("to"), f"Flow {flow_id} step {expected_number} to"
                      )
                      if src not in node_ids:
                          raise ValueError(
                              f"Flow {flow_id} step {expected_number} source '{src}' does not exist"
                          )
                      if dst not in node_ids:
                          raise ValueError(
                              f"Flow {flow_id} step {expected_number} target '{dst}' does not exist"
                          )


          def main() -> None:
              data = load_topology()
              nodes = data["nodes"]
              edges = data["edges"]
              flows = data["flows"]
              assert isinstance(nodes, list)
              assert isinstance(edges, list)
              assert isinstance(flows, list)
              print(
                  f"Verified {len(nodes)} nodes, {len(edges)} edges, "
                  f"and {len(flows)} flows in {TOPOLOGY_PATH}"
              )


          if __name__ == "__main__":
              main()
          '''
          topology_validator = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in topology_validator.splitlines()
          )
          write('scripts/generate_comprehensive_topology.py', topology_validator)

          topology_tests = '''# SPDX-License-Identifier: AGPL-3.0-or-later
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path

          import pytest

          from scripts.generate_comprehensive_topology import validate_topology


          def _topology() -> dict[str, object]:
              payload = json.loads(Path("system_topology.json").read_text(encoding="utf-8"))
              assert isinstance(payload, dict)
              return payload


          def test_repository_topology_is_valid() -> None:
              validate_topology(_topology())


          def test_duplicate_node_id_is_rejected() -> None:
              data = copy.deepcopy(_topology())
              nodes = data["nodes"]
              assert isinstance(nodes, list)
              assert isinstance(nodes[0], dict) and isinstance(nodes[1], dict)
              nodes[1]["id"] = nodes[0]["id"]
              with pytest.raises(ValueError, match="Duplicate node id"):
                  validate_topology(data)


          def test_malformed_edge_is_rejected() -> None:
              data = copy.deepcopy(_topology())
              edges = data["edges"]
              assert isinstance(edges, list)
              edges[0] = "not-an-edge"
              with pytest.raises(ValueError, match="not a JSON object"):
                  validate_topology(data)


          def test_flow_step_dangling_node_is_rejected() -> None:
              data = copy.deepcopy(_topology())
              flows = data["flows"]
              assert isinstance(flows, list) and isinstance(flows[0], dict)
              steps = flows[0]["steps"]
              assert isinstance(steps, list) and isinstance(steps[0], dict)
              steps[0]["to"] = "missing-node"
              with pytest.raises(ValueError, match="target 'missing-node' does not exist"):
                  validate_topology(data)
          '''
          topology_tests = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in topology_tests.splitlines()
          )
          write('tests/unit/test_comprehensive_topology.py', topology_tests)

          # Repository hygiene: prune ignored trees before walking them.
          path = 'scripts/validate_repository_hygiene.py'
          text = read(path)
          if 'import os\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport os\n', 1)
          start = text.index('    font_files = [')
          end = text.index('    if font_files:', start)
          pruned_walk = '''    font_files: list[str] = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [name for name in dirnames if name not in IGNORED_DIRS]
                  directory = Path(dirpath)
                  for filename in filenames:
                      path = directory / filename
                      if path.suffix.lower() in FORBIDDEN_FONT_SUFFIXES:
                          font_files.append(path.relative_to(root).as_posix())
          '''
          pruned_walk = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in pruned_walk.splitlines()
          )
          text = text[:start] + pruned_walk + text[end:]
          write(path, text)

          # Comprehensive dashboard: align layer schema, remove implicit event dependency,
          # consume flow.steps, derive counters from data, and safely embed JSON in <script>.
          path = 'scripts/build_comprehensive_architecture_page.py'
          text = read(path)
          text = text.replace(
              '<button class="mode-tab active" onclick="switchView(\'swimlanes\')">Swimlane Flow</button>',
              '<button class="mode-tab active" data-view="swimlanes" onclick="switchView(\'swimlanes\')">Swimlane Flow</button>',
              1,
          )
          text = text.replace(
              '<button class="mode-tab" onclick="switchView(\'blast\')">Blast Radius Matrix</button>',
              '<button class="mode-tab" data-view="blast" onclick="switchView(\'blast\')">Blast Radius Matrix</button>',
              1,
          )
          text = text.replace(
              '<button class="mode-tab" onclick="switchView(\'flows\')">Protocol Flow Simulator</button>',
              '<button class="mode-tab" data-view="flows" onclick="switchView(\'flows\')">Protocol Flow Simulator</button>',
              1,
          )
          text = text.replace('placeholder="Search 52 components..."', 'placeholder="Search components..."', 1)
          text = text.replace('<span class="val" id="statNodes">52</span>', '<span class="val" id="statNodes">0</span>', 1)
          text = text.replace('<span class="val" id="statEdges">78</span>', '<span class="val" id="statEdges">0</span>', 1)
          text = text.replace('<span class="val" id="statFlows">12</span>', '<span class="val" id="statFlows">0</span>', 1)

          layer_start = text.index('const LAYER_CONFIG = {')
          layer_end = text.index('\n};', layer_start) + 3
          layer_config = '''const LAYER_CONFIG = {
            'infrastructure': { title: '1. Infrastructure & External Endpoints', desc: 'External feeds, network targets, native cores, and distribution infrastructure.', color: '#06B6D4', glow: 'rgba(6, 182, 212, 0.15)' },
            'presentation': { title: '2. Presentation & User Interfaces', desc: 'CLI, bot, web, and browser-facing entry points into the platform.', color: '#8B5CF6', glow: 'rgba(139, 92, 246, 0.15)' },
            'application': { title: '3. Application Orchestration', desc: 'Pipeline workers, queues, CI orchestration, merging, and runtime coordination.', color: '#F59E0B', glow: 'rgba(245, 158, 11, 0.15)' },
            'domain': { title: '4. Domain Validation & Transformation', desc: 'Admission policy, parsing, security, testing, ranking, washing, and generation logic.', color: '#10B981', glow: 'rgba(16, 185, 129, 0.15)' },
            'persistence': { title: '5. Persistence & Evidence Stores', desc: 'Caches, history, generated artifacts, evidence, and durable runtime state.', color: '#3B82F6', glow: 'rgba(59, 130, 246, 0.15)' }
          };'''
          layer_config = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in layer_config.splitlines()
          )
          text = text[:layer_start] + layer_config + text[layer_end:]

          text = text.replace(
              "function init() {\n  renderSwimlanes(TOPOLOGY.nodes);\n  setupFlows();",
              "function init() {\n  document.getElementById('statNodes').innerText = String(TOPOLOGY.nodes.length);\n  document.getElementById('statEdges').innerText = String(TOPOLOGY.edges.length);\n  document.getElementById('statFlows').innerText = String(TOPOLOGY.flows.length);\n  document.getElementById('nodeSearch').placeholder = `Search ${TOPOLOGY.nodes.length} components...`;\n  renderSwimlanes(TOPOLOGY.nodes);\n  setupFlows();",
              1,
          )
          text = text.replace(
              "  nodes.forEach(n => {\n    if (byLayer[n.layer]) byLayer[n.layer].push(n);\n    else byLayer['infrastructure'].push(n);\n  });",
              "  nodes.forEach(n => {\n    if (!byLayer[n.layer]) {\n      throw new Error(`Unknown topology layer: ${n.layer} (${n.id})`);\n    }\n    byLayer[n.layer].push(n);\n  });",
              1,
          )
          text = text.replace(
              "  event.target.classList.add('active');",
              "  const activeTab = document.querySelector(`.mode-tab[data-view=\"${view}\"]`);\n  if (activeTab) activeTab.classList.add('active');",
              1,
          )

          flow_start = text.index('function loadSelectedFlow(idx) {')
          flow_end = text.index('function clearFlowHighlights() {', flow_start)
          flow_functions = '''function loadSelectedFlow(idx) {
            const parsedIndex = Number.parseInt(idx, 10);
            activeFlowIndex = Number.isNaN(parsedIndex) ? 0 : parsedIndex;
            activeFlowStep = 0;
            const flow = TOPOLOGY.flows[activeFlowIndex];
            if (!flow) return;

            const steps = Array.isArray(flow.steps) ? flow.steps : [];
            const track = document.getElementById('flowStepsTrack');
            track.innerHTML = '';
            steps.forEach((step, sidx) => {
              const pill = document.createElement('div');
              pill.className = `flow-step-pill ${sidx === 0 ? 'active' : ''}`;
              const from = String(step.from || '').replace(/_/g, ' ');
              const to = String(step.to || '').replace(/_/g, ' ');
              pill.innerText = `${step.step_number || sidx + 1}. ${from} → ${to}`;
              pill.onclick = () => setFlowStep(sidx);
              track.appendChild(pill);
            });

            if (steps.length === 0) {
              document.getElementById('flowStepCounter').innerText = 'Step 0 of 0';
              document.getElementById('flowStepNotes').innerText = 'This flow has no steps.';
              clearFlowHighlights();
              return;
            }
            highlightFlowStep();
          }

          function setFlowStep(sidx) {
            activeFlowStep = sidx;
            document.querySelectorAll('.flow-step-pill').forEach((p, idx) => {
              p.classList.toggle('active', idx === sidx);
            });
            highlightFlowStep();
          }

          function stepFlowPrev() {
            if (activeFlowStep > 0) setFlowStep(activeFlowStep - 1);
          }

          function stepFlowNext() {
            const flow = TOPOLOGY.flows[activeFlowIndex];
            if (!flow) return;
            const steps = Array.isArray(flow.steps) ? flow.steps : [];
            if (activeFlowStep < steps.length - 1) setFlowStep(activeFlowStep + 1);
          }

          function highlightFlowStep() {
            clearFlowHighlights();
            const flow = TOPOLOGY.flows[activeFlowIndex];
            if (!flow) return;
            const steps = Array.isArray(flow.steps) ? flow.steps : [];
            if (steps.length === 0) return;

            activeFlowStep = Math.min(activeFlowStep, steps.length - 1);
            const step = steps[activeFlowStep];
            const sourceNodeId = step.from;
            const targetNodeId = step.to;
            document.getElementById('flowStepCounter').innerText = `Step ${activeFlowStep + 1} of ${steps.length}`;

            [sourceNodeId, targetNodeId].forEach(nodeId => {
              const card = document.getElementById(`node-${nodeId}`);
              if (card) card.classList.add('flow-highlight');
            });
            const targetCard = document.getElementById(`node-${targetNodeId}`);
            if (targetCard) {
              targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            document.getElementById('flowStepNotes').innerHTML = `
              <strong>Flow:</strong> ${flow.name}<br>
              <strong>Transition:</strong> <code style="color: var(--amber);">${sourceNodeId} → ${targetNodeId}</code> (${activeFlowStep + 1}/${steps.length})<br>
              <strong>Action:</strong> ${step.action || 'n/a'}<br>
              <strong>Payload:</strong> <code>${step.payload || 'n/a'}</code><br>
              <strong>Source:</strong> <code>${step.file_citation || 'n/a'}</code><br>
              <span style="color: var(--text-muted);">${flow.description}</span>
            `;
          }

          '''
          flow_functions = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in flow_functions.splitlines()
          )
          text = text[:flow_start] + flow_functions + text[flow_end:]

          generator_start = text.index('def generate_architecture_html() -> None:')
          generator_end = text.index('\n\nif __name__ == "__main__":', generator_start)
          safe_generator = r'''def _serialize_for_inline_script(value: object) -> str:
              """Serialize JSON without allowing data to terminate or corrupt a script tag."""
              serialized = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              return (
                  serialized.replace("&", "\\u0026")
                  .replace("<", "\\u003c")
                  .replace(">", "\\u003e")
                  .replace("\u2028", "\\u2028")
                  .replace("\u2029", "\\u2029")
              )


          def generate_architecture_html() -> None:
              top_data = json.loads(TOPOLOGY_PATH.read_text(encoding="utf-8"))
              top_json = _serialize_for_inline_script(top_data)
              html = _HTML_TEMPLATE.replace("__TOPOLOGY_JSON__", top_json)
              OUTPUT_PATH.write_text(html, encoding="utf-8")
              print(
                  f"Successfully compiled {OUTPUT_PATH} "
                  f"({len(html.splitlines())} lines, {len(html)} bytes)"
              )'''
          safe_generator = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in safe_generator.splitlines()
          )
          text = text[:generator_start] + safe_generator + text[generator_end:]

          if 'flow.path' in text:
              raise SystemExit('flow.path remains in comprehensive architecture generator')
          if 'event.target.classList' in text:
              raise SystemExit('implicit event dependency remains in comprehensive architecture generator')
          write(path, text)

          # CI: bounded checkout history makes the timeout meaningful; leave enough time for
          # the actual test suite, and verify generated architecture drift explicitly.
          path = '.github/workflows/ci.yml'
          text = read(path)
          text = text.replace('    timeout-minutes: 25\n', '    timeout-minutes: 45\n', 1)
          text = text.replace('          fetch-depth: 0\n', '          fetch-depth: 2\n', 1)
          marker = '      - name: Run unified static repository verification\n        run: python scripts/verify_repository.py --profile static\n'
          architecture_check = marker + '''      - name: Validate generated architecture dashboard
              run: |
                python scripts/generate_comprehensive_topology.py
                python scripts/build_comprehensive_architecture_page.py
                git diff --exit-code -- architecture.html system_topology.json
          '''
          architecture_check = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in architecture_check.splitlines()
          ) + '\n'
          if 'Validate generated architecture dashboard' not in text:
              if marker not in text:
                  raise SystemExit('CI static verification marker not found')
              text = text.replace(marker, architecture_check, 1)
          write(path, text)

          # Strong postconditions for the review findings.
          assert 'scripts/build_architecture_page.py' not in [p.as_posix() for p in ROOT.rglob('*') if p.is_file()]
          assert "go-version: '1.23'" not in read('.github/workflows/main.yml')
          assert 'Go 1.23+' not in read('README.md')
          assert 'OUT_DIR = Path("assets")' not in read('scripts/make_assets.py')
          assert 'xml.etree.ElementTree' not in read('scripts/validate_assets.py')
          PY

      - name: Regenerate deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_comprehensive_topology.py
          python scripts/build_comprehensive_architecture_page.py
          python scripts/make_assets.py
          cp architecture.html /tmp/architecture.html.first
          python scripts/build_comprehensive_architecture_page.py
          cmp architecture.html /tmp/architecture.html.first

      - name: Run focused validation
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest==9.1.1 defusedxml==0.7.1 tomli==2.4.1
          python -m compileall -q scripts tests/unit
          python scripts/generate_comprehensive_topology.py
          python scripts/validate_runtime_versions.py
          python scripts/validate_repository_hygiene.py
          python scripts/validate_assets.py
          python -m pytest -q \
            tests/unit/test_validate_runtime_versions.py \
            tests/unit/test_comprehensive_topology.py

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git commit -m "fix: address PR review and CI regressions"
          git push origin HEAD:feat/post-audit-remediation-v3.1.0
