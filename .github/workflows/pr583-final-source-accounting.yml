name: PR583 Final Source Accounting

on:
  push:
    branches:
      - codex/fix-actions-and-runtime-resilience

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Apply, validate, regenerate, and finalize
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr583-final-source-accounting.yml
          python - <<'PY'
          from pathlib import Path

          path = Path("src/configstream/pipeline/consumer.py")
          text = path.read_text(encoding="utf-8")

          old_empty = '''        if not parsed_batch:
              work_queue.task_done()
              continue

          fingerprint_keys = [proxy_unique_key(p) for p in parsed_batch]
          '''
          new_empty = '''        fingerprint_keys = [proxy_unique_key(p) for p in parsed_batch]

          if not parsed_batch:
              process_end_time = asyncio.get_running_loop().time()
              total_duration = (process_end_time - process_start_time) * 1000
              fetch_duration = (metadata.get("fetch_duration") or 0.0) * 1000
              full_duration_ms = total_duration + (
                  fetch_duration if metadata.get("count_source", True) else 0.0
              )
              failure_modes: Dict[str, int] = {}
              if metadata and isinstance(metadata.get("drop_stats"), dict):
                  failure_modes.update(metadata.get("drop_stats", {}))
              failure_modes["parse_empty"] = (
                  failure_modes.get("parse_empty", 0) + len(raw_lines)
              )
              await _record_source_outcome(
                  source=source,
                  metadata=metadata,
                  fetched_count=0,
                  working_count=0,
                  full_duration_ms=full_duration_ms,
                  geoip_stats={},
                  failure_modes=failure_modes,
                  fingerprint_keys=fingerprint_keys,
                  settings=settings,
                  loop=loop,
                  quality_tracker=quality_tracker,
                  stats=stats,
              )
              logger.warning(
                  "(No parseable proxies) Source Summary [%s]: Raw=%d Parsed=0 Dur=%.0fms",
                  safe_source,
                  len(raw_lines),
                  full_duration_ms,
              )
              work_queue.task_done()
              continue
          '''
          if old_empty not in text:
              raise SystemExit("parse-empty anchor not found")
          text = text.replace(old_empty, new_empty, 1)

          old_record = '''        if (
              not source.startswith("supplied-proxies")
              and not source.startswith("supplied-config")
              and not source.startswith("sources/")
          ):
              try:
                  batch_number = str(getattr(settings, "BATCH_NUMBER", "")).strip()
                  batch_source = f"batch_{batch_number}" if batch_number else "pipeline"
                  await loop.run_in_executor(
                      None,
                      record_source_chunk,
                      quality_tracker,
                      source,
                      stats.trace_id,
                      int(metadata.get("chunk_index", 1) or 1),
                      fetched_count,
                      working_count,
                      full_duration_ms,
                      geoip_stats,
                      failure_modes,
                      batch_source,
                      int(stats.start_time.timestamp()),
                      fingerprint_keys,
                  )
              except Exception:  # nosec B110
                  logging.getLogger(__name__).debug("Suppressed broad exception")
                  pass
          '''
          new_record = '''        await _record_source_outcome(
              source=source,
              metadata=metadata,
              fetched_count=fetched_count,
              working_count=working_count,
              full_duration_ms=full_duration_ms,
              geoip_stats=geoip_stats,
              failure_modes=failure_modes,
              fingerprint_keys=fingerprint_keys,
              settings=settings,
              loop=loop,
              quality_tracker=quality_tracker,
              stats=stats,
          )
          '''
          if old_record not in text:
              raise SystemExit("source-record anchor not found")
          text = text.replace(old_record, new_record, 1)

          anchor = '''\n\ndef _deduplicate_batch(\n'''
          helper = '''\n\nasync def _record_source_outcome(
              *,
              source: str,
              metadata: Dict[str, Any],
              fetched_count: int,
              working_count: int,
              full_duration_ms: float,
              geoip_stats: Dict[str, int],
              failure_modes: Dict[str, int],
              fingerprint_keys: List[tuple[Any, ...]],
              settings: AppSettings,
              loop: asyncio.AbstractEventLoop,
              quality_tracker: SourceQualityTracker,
              stats: PipelineStats,
          ) -> None:
              if (
                  source.startswith("supplied-proxies")
                  or source.startswith("supplied-config")
                  or source.startswith("sources/")
              ):
                  return

              try:
                  batch_number = str(getattr(settings, "BATCH_NUMBER", "")).strip()
                  batch_source = f"batch_{batch_number}" if batch_number else "pipeline"
                  await loop.run_in_executor(
                      None,
                      record_source_chunk,
                      quality_tracker,
                      source,
                      stats.trace_id,
                      int(metadata.get("chunk_index", 1) or 1),
                      fetched_count,
                      working_count,
                      full_duration_ms,
                      geoip_stats,
                      failure_modes,
                      batch_source,
                      int(stats.start_time.timestamp()),
                      fingerprint_keys,
                  )
              except Exception:  # nosec B110
                  logging.getLogger(__name__).debug("Suppressed broad exception")
          '''
          if anchor not in text:
              raise SystemExit("helper insertion anchor not found")
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

          black src/configstream/pipeline/consumer.py src/configstream/source_run_aggregation.py tests/unit/test_source_run_aggregation.py
          flake8 src/configstream/pipeline/consumer.py src/configstream/source_run_aggregation.py tests/unit/test_source_run_aggregation.py
          mypy src/configstream/pipeline/consumer.py src/configstream/source_run_aggregation.py tests/unit/test_source_run_aggregation.py
          pytest -q tests/unit/test_source_run_aggregation.py tests/unit/test_producer_quality_accounting.py --disable-warnings --maxfail=1

          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_triage_report.py
          python scripts/collect_repository_forensics.py
          python scripts/verify_repository.py --profile static

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: account for parse-empty source chunks"
          git push origin HEAD:codex/fix-actions-and-runtime-resilience
