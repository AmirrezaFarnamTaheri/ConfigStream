name: Deploy Mirror

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download Artifacts
        # Assuming artifacts are generated by previous pipeline run or this is standalone
        run: mkdir -p output

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: configstream-mirror
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Deploy to IPFS (Pinata)
        # Example step using a generic IPFS action
        if: env.PINATA_API_KEY != ''
        uses: aquiladev/ipfs-action@v1
        with:
          path: ./output
          service: pinata
          pinataKey: ${{ secrets.PINATA_API_KEY }}
          pinataSecret: ${{ secrets.PINATA_SECRET_KEY }}
        continue-on-error: true
