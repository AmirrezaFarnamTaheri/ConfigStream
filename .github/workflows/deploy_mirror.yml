name: Deploy Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download latest pipeline output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_RUN=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$LATEST_RUN" ]; then
            echo "No successful pipeline run found; skipping mirror deploy."
            exit 0
          fi
          gh run download "$LATEST_RUN" \
            --name pipeline-output \
            --dir output

          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "No output directory found after download; skipping mirror deploy."
            exit 0
          fi

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⏭️ Vercel deployment skipped (VERCEL_TOKEN not set)"
            exit 0
          fi
          npm install -g vercel
          vercel deploy --prod --token=$VERCEL_TOKEN

      - name: Deploy to Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "⏭️ Netlify deployment skipped (NETLIFY_AUTH_TOKEN not set)"
            exit 0
          fi
          npm install -g netlify-cli
          netlify deploy --prod --dir=output --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN

      - name: Deploy to IPFS
        if: ${{ secrets.PINATA_JWT != '' }}
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "⏭️ IPFS deployment skipped (PINATA_JWT not set)"
            exit 0
          fi
          npm install -g @pinata/cli
          pinata upload output/ --jwt=$PINATA_JWT
