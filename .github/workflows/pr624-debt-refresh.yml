name: PR624 Debt Refresh

on:
  push:
    branches:
      - agent/fix-singbox-113-wireguard-runtime
    paths:
      - '.github/workflows/pr624-debt-refresh.yml'

permissions:
  contents: write

concurrency:
  group: pr624-debt-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-singbox-113-wireguard-runtime
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate deterministic debt matrix
        run: |
          python scripts/generate_debt_matrix.py
          python scripts/generate_debt_matrix.py --check
      - name: Commit exact generated debt evidence
        run: |
          if git diff --quiet -- docs/DEBT_MATRIX.md docs/debt_matrix.json; then
            echo "Debt matrix already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json
          git commit -m "chore(governance): refresh debt matrix"
          git push origin HEAD:agent/fix-singbox-113-wireguard-runtime
