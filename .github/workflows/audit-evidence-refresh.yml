name: Audit Evidence Refresh

on:
  push:
    branches: [agent/fix-preempt-trigger-race]
    paths:
      - '.github/workflows/audit-evidence-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Regenerate exact governance evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_debt_matrix.py
      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/exception-boundary-budget.json docs/DEBT_MATRIX.md docs/debt_matrix.json
          if git diff --cached --quiet; then
            echo 'Governance evidence already current.'
            exit 0
          fi
          git commit -m 'chore(governance): refresh audit evidence'
          git push origin HEAD:agent/fix-preempt-trigger-race
