name: ConfigStream Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "sources/batch_*.txt"
      - "sources/backup_dynamic/**"
  pull_request:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

# One mutable publication run per ref. A newer run supersedes an older run
# rather than allowing two runs to race on tags, artifacts, or state.
concurrency:
  group: configstream-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Source and Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run contract and security tests
        run: |
          set -euo pipefail
          pytest -q
          python scripts/validate_versions.py
          python scripts/validate_capability_registry.py
          python scripts/validate_core_compatibility.py
          python scripts/validate_module_ownership.py

  build_container:
    name: Build Immutable Runtime Image
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image repository
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Build and push exact source image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=runtime-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Require immutable digest
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.build.outputs.digest }}'
          case '${{ steps.build.outputs.digest }}' in
            sha256:*) ;;
            *) echo 'Invalid image digest' >&2; exit 1 ;;
          esac

  setup_matrix:
    name: Resolve Shards
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(find sources -maxdepth 1 -type f -name 'batch_*.txt' -printf '%f\n' \
            | sed -E 's/^batch_([0-9]+)\.txt$/\1/' \
            | sort -n \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          test "$matrix" != '[]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build_wasm:
    name: Build Browser Tester
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: src/go/tester/go.sum
      - name: Build WASM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          ./scripts/build_wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-wasm-${{ github.run_id }}
          path: |
            frontend/assets/wasm/tester.wasm
            frontend/assets/js/wasm_exec.js
          if-no-files-found: error
          retention-days: 7

  pipeline:
    name: Validate Shard ${{ matrix.batch_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: [build_container, setup_matrix]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        batch_number: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    container:
      image: ${{ needs.build_container.outputs.repository }}@${{ needs.build_container.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        PYTHONPATH: /app/src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.sha }}' > runtime-source-sha.txt
          printf '%s\n' '${{ needs.build_container.outputs.digest }}' > runtime-image-digest.txt
      - name: Download current intelligence databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: python -m configstream.cli update-databases
      - name: Run shard fail closed
        env:
          BATCH_NUMBER: ${{ matrix.batch_number }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
          UPDATE_INTERVAL_HOURS: "4"
          BATCH_TIME_LIMIT_SECONDS: "14400"
          BATCH_TIME_LIMIT_GRACE_SECONDS: "2700"
          FAIL_ON_ZERO_WORKING: "true"
          STRICT_SECURITY: "true"
          INCLUDE_INSECURE_PROXIES: "false"
          FORCE_SCANNER: "false"
          ALLOW_ACTIVE_SCANNING: "false"
        shell: bash
        run: |
          set -euo pipefail
          python -m configstream.cli merge \
            --sources "sources/batch_${BATCH_NUMBER}.txt" \
            --output "output_batch_${BATCH_NUMBER}" \
            --max-workers 50 \
            --timeout 24 \
            --max-latency 6000 \
            2>&1 | tee "pipeline_batch_${BATCH_NUMBER}.log"
          test -s "output_batch_${BATCH_NUMBER}/proxies.json"
          test -s "output_batch_${BATCH_NUMBER}/metadata.json"
      - name: Package unique shard state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          private="shard_private_${{ matrix.batch_number }}"
          mkdir -p "$private/data"
          for file in source_quality.db anomaly.db history.db timeout_history.json test_cache.json; do
            if [ -f "data/$file" ]; then cp "data/$file" "$private/data/$file"; fi
          done
          cp runtime-source-sha.txt runtime-image-digest.txt "$private/"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: shard-${{ github.run_id }}-${{ matrix.batch_number }}
          path: |
            output_batch_${{ matrix.batch_number }}/
            shard_private_${{ matrix.batch_number }}/
            pipeline_batch_${{ matrix.batch_number }}.log
          if-no-files-found: error
          retention-days: 7

  merge_results:
    name: Reduce, Validate, and Seal Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [pipeline, build_wasm, build_container]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: src/go/tester/go.sum
      - name: Install reducer dependencies
        run: pip install -e ".[dev]"
      - name: Download run-scoped shard artifacts without path merging
        uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ github.run_id }}-*
          path: artifacts
          merge-multiple: false
      - name: Restore uniquely namespaced shard directories
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' directory; do
            cp -R "$directory" .
            count=$((count + 1))
          done < <(find artifacts -type d -name 'output_batch_*' -print0)
          test "$count" -gt 0
          find artifacts -type f -name 'pipeline_batch_*.log' -exec cp {} . \;
          find artifacts -type d -name 'shard_private_*' -exec cp -R {} . \;
      - name: Verify every shard provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='${{ github.sha }}'
          expected_digest='${{ needs.build_container.outputs.digest }}'
          found=0
          for directory in shard_private_*; do
            test -d "$directory"
            test "$(cat "$directory/runtime-source-sha.txt")" = "$expected_sha"
            test "$(cat "$directory/runtime-image-digest.txt")" = "$expected_digest"
            found=$((found + 1))
          done
          test "$found" -gt 0
      - name: Build native reducer tester
        shell: bash
        run: |
          set -euo pipefail
          cd src/go/tester
          go build -o "$GITHUB_WORKSPACE/configstream-tester" \
            -tags 'with_quic with_dhcp with_wireguard with_ech with_utls with_reality_server with_clash_api with_gvisor' .
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Merge successful shards only
        env:
          WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
          FAIL_ON_ZERO_WORKING: "true"
          STRICT_SECURITY: "true"
          INCLUDE_INSECURE_PROXIES: "false"
        run: python -m scripts.merge_batches
      - name: Generate source reshard recommendation
        run: python scripts/dynamic_reshard.py
      - name: Upload source reshard recommendation
        uses: actions/upload-artifact@v7
        with:
          name: source-reshard-recommendation-${{ github.run_id }}
          path: sources/batch_*.txt
          if-no-files-found: error
          retention-days: 30
      - name: Add immutable frontend and WASM assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-wasm-${{ github.run_id }}
          path: frontend
      - name: Prepare public tree
        shell: bash
        run: |
          set -euo pipefail
          cp -R frontend/. output/
          mkdir -p output/api
          cp output/proxies.json output/api/proxies
          cp output/metadata.json output/api/stats
          touch output/.nojekyll
          python scripts/validate_frontend_placeholders.py --inject-env output
      - name: Validate output schemas and clients
        run: |
          set -euo pipefail
          python scripts/validate_pages_artifact.py --refresh-contract output
          python scripts/validate_pages_artifact.py --native-client-check output
      - name: Purge private state and seal release
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_release.py output \
            --source-sha "$GITHUB_SHA" \
            --workflow-sha "$GITHUB_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --expires-minutes 60
          test -s output/release_manifest.json
      - name: Generate evidence bundle
        run: |
          set -euo pipefail
          mkdir -p pipeline-evidence
          python scripts/generate_evidence_bundle.py \
            --output-dir output \
            --evidence-dir pipeline-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-output-${{ github.run_id }}
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-evidence-${{ github.run_id }}
          path: pipeline-evidence/
          if-no-files-found: error
          retention-days: 30
