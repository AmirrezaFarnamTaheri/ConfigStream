name: "Config's Stream"

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sources/runtime/**'
  pull_request:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIN_SOURCE_COVERAGE: "0.80"
  SOURCE_SHARD_PARTS: "4"
  SING_BOX_VERSION: "1.13.14"
  XRAY_VERSION: "v26.3.27"
  MIHOMO_VERSION: "v1.19.20"

jobs:
  quality:
    name: Static and Unit Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Validate remediation scripts
        run: |
          python -m py_compile \
            scripts/aggregate_shard_health.py \
            scripts/finalize_release_outputs.py \
            scripts/native_client_checks.py \
            scripts/normalize_legacy_profiles.py \
            scripts/release_gate.py \
            scripts/shard_sources.py \
            src/configstream/testers/python.py
          pytest -q tests/unit/test_release_remediation.py --disable-warnings --maxfail=1

  build_container:
    name: Build and Push Container
    if: github.event_name != 'pull_request'
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  build_wasm:
    name: Build WASM Module
    if: github.event_name != 'pull_request'
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: src/go/tester/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-wasm-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            frontend/assets/wasm/tester.wasm
            frontend/assets/js/wasm_exec.js
          if-no-files-found: error

  setup_matrix:
    name: Generate Runtime Source Matrix
    if: github.event_name != 'pull_request'
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          python scripts/shard_sources.py \
            --parts "$SOURCE_SHARD_PARTS" \
            --matrix-output source-matrix.json \
            > matrix.stdout.json
          echo "value=$(cat source-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: source-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            sources/runtime/
            source-matrix.json
          if-no-files-found: error

  pipeline:
    name: Run Source Shard ${{ matrix.batch }}.${{ matrix.part }}
    if: github.event_name != 'pull_request'
    needs: [build_container, setup_matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    container:
      image: ${{ needs.build_container.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        PYTHONPATH: /app/src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: source-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: .
      - name: Run bounded shard
        env:
          CS_PUBLIC_KEY: ${{ secrets.CS_PUBLIC_KEY }}
          CS_IPNS_KEY: ${{ secrets.CS_IPNS_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
          CANARY_URL: "https://httpbin.org"
          BATCH_TIME_LIMIT_SECONDS: 9000
          BATCH_TIME_LIMIT_GRACE_SECONDS: 900
          FORCE_SCANNER: "false"
          ALLOW_ACTIVE_SCANNING: "false"
          BATCH: ${{ matrix.batch }}
          PART: ${{ matrix.part }}
          SOURCE_FILE: ${{ matrix.source_file }}
          SOURCE_COUNT: ${{ matrix.source_count }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
        run: |
          set -euo pipefail
          output="output_batch_${BATCH}_part_${PART}"
          export started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python -m configstream.cli merge \
            --sources "$SOURCE_FILE" \
            --output "$output" \
            --max-workers 40 \
            --timeout 24 \
            --max-latency 6000 2>&1 | tee "pipeline_batch_${BATCH}_part_${PART}.log"
          export completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python - "$output/shard_lineage.json" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "batch": os.environ["BATCH"],
              "part": int(os.environ["PART"]),
              "source_file": os.environ["SOURCE_FILE"],
              "source_count": int(os.environ["SOURCE_COUNT"]),
              "source_sha256": os.environ["SOURCE_SHA256"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "started_at": os.environ.get("started_at"),
              "completed_at": os.environ.get("completed_at"),
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.batch }}-${{ matrix.part }}
          path: |
            output_batch_${{ matrix.batch }}_part_${{ matrix.part }}/
            pipeline_batch_${{ matrix.batch }}_part_${{ matrix.part }}.log
          if-no-files-found: error
          retention-days: 7

  merge_validate_publish:
    name: Merge, Validate, and Publish
    if: github.event_name != 'pull_request' && needs.pipeline.result == 'success'
    needs: [pipeline, build_wasm]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      CS_PUBLIC_KEY: ${{ secrets.CS_PUBLIC_KEY }}
      CS_IPNS_KEY: ${{ secrets.CS_IPNS_KEY }}
      WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
      STEGO_KEY: ${{ secrets.STEGO_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: src/go/tester/go.sum
      - run: pip install -e .[dev] huggingface_hub
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ github.sha }}-${{ github.run_attempt }}-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-wasm-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/assets
      - name: Restore isolated shard outputs
        run: |
          set -euo pipefail
          find artifacts -mindepth 1 -maxdepth 1 -type d -name 'output_batch_*' -exec mv {} . \;
          find artifacts -type f -name 'pipeline_batch_*.log' -exec mv {} . \;
          test "$(find . -maxdepth 1 -type d -name 'output_batch_*' | wc -l)" -gt 0
      - name: Merge and reconcile shard evidence
        run: |
          python -m scripts.merge_batches
          python scripts/aggregate_shard_health.py --parts "$SOURCE_SHARD_PARTS"
      - name: Generate source reshard recommendation
        run: python scripts/dynamic_reshard.py
      - name: Upload source reshard recommendation
        uses: actions/upload-artifact@v7
        with:
          name: source-reshard-recommendation
          path: sources/batch_*.txt
          if-no-files-found: error
          retention-days: 30
      - name: Prepare public output artifact
        run: |
          set -euo pipefail
          mkdir -p output/docs
          mkdir -p output/tools output/api
          test ! -d docs/wiki || cp -R docs/wiki output/docs/
          cp -R frontend/. output/
          cp tools/lab-scanner.py output/tools/lab-scanner.py
          cp tools/lab-runner.sh output/tools/lab-runner.sh
          python scripts/validate_frontend_placeholders.py --inject-env output
          python scripts/normalize_legacy_profiles.py output
          python scripts/finalize_release_outputs.py output --repo-root . --min-source-coverage "$MIN_SOURCE_COVERAGE"
          cp output/proxies.json output/api/proxies
          cp output/metadata.json output/api/stats
          touch output/.nojekyll
          if [ ! -s output/pipeline_events.jsonl ]; then
            printf '{"timestamp":"%s","stage":"artifact_prepare","level":"info","event_type":"artifact_prepare","message":"pipeline event telemetry initialized during public artifact preparation"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > output/pipeline_events.jsonl
          fi
          python scripts/validate_pages_artifact.py --refresh-contract output
      - name: Install pinned native validators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/native"
          gh release download "v${SING_BOX_VERSION}" --repo SagerNet/sing-box --pattern "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          install -m 0755 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$HOME/.local/bin/sing-box"
          gh release download "$XRAY_VERSION" --repo XTLS/Xray-core --pattern "Xray-linux-64.zip"
          mkdir xray && unzip -q Xray-linux-64.zip -d xray
          install -m 0755 xray/xray "$HOME/.local/bin/xray"
          asset=$(gh api "repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" --jq '.assets[].name | select(test("^mihomo-linux-amd64-v[0-9]+-v[0-9.]+\\.gz$"))' | head -1)
          test -n "$asset"
          gh release download "$MIHOMO_VERSION" --repo MetaCubeX/mihomo --pattern "$asset"
          gzip -dc "$asset" > "$HOME/.local/bin/mihomo"
          chmod 0755 "$HOME/.local/bin/mihomo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mandatory native validation
        run: |
          mkdir -p pipeline-evidence
          python scripts/native_client_checks.py output --report pipeline-evidence/native_client_check_report.json
      - name: Fail-closed release gate
        run: |
          python scripts/release_gate.py output \
            --native-report pipeline-evidence/native_client_check_report.json \
            --min-source-coverage "$MIN_SOURCE_COVERAGE" \
            --promote
      - name: Validate data release output contract
        run: |
          python scripts/validate_pages_artifact.py \
            --native-client-check \
            --native-report-file pipeline-evidence/native_client_check_report.json \
            output
      - name: Generate evidence
        run: |
          python scripts/generate_evidence_bundle.py \
            --output-dir output \
            --evidence-dir pipeline-evidence \
            --native-report pipeline-evidence/native_client_check_report.json
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline-evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-output
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish to IPFS
        if: env.PINATA_JWT != ''
        run: python scripts/publish_ipfs.py --file output/ --domain fallback.example.com
      - name: Upload to Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python scripts/upload_telegram.py
      - name: Upload to Hugging Face
        if: env.HF_TOKEN != ''
        run: python scripts/upload_hf.py --path output/ --repo-id "$HF_REPO_ID"
      - name: Upload to Google Drive
        if: env.GDRIVE_FOLDER_ID != ''
        run: |
          pip install google-api-python-client google-auth
          python scripts/upload_gdrive.py --path output/ --folder-id "$GDRIVE_FOLDER_ID"
      - name: Prepare release assets
        id: assets
        run: |
          files=$(python scripts/prepare_release_assets.py --output-dir output)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: ConfigStream ${{ steps.assets.outputs.tag }}
          files: ${{ steps.assets.outputs.files }}
          draft: false
          prerelease: false
