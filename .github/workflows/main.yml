name: "Config's Stream"

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sources/runtime/**'
  pull_request:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIN_SOURCE_COVERAGE: "0.80"
  SOURCE_SHARD_PARTS: "6"
  SING_BOX_VERSION: "1.13.18"
  XRAY_VERSION: "v26.7.28"
  MIHOMO_VERSION: "v1.19.29"

jobs:
  quality:
    name: Static and Unit Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Validate workflow resilience controls
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/resilient_stage.py \
            scripts/prepare_public_candidate.py \
            scripts/aggregate_shard_health.py \
            scripts/finalize_release_outputs.py \
            scripts/reconcile_release_metadata.py \
            scripts/preflight_release_inputs.py \
            scripts/normalize_source_timing_logs.py \
            scripts/native_client_checks.py \
            scripts/release_gate.py \
            scripts/validate_workflows.py
          bash -n scripts/install_native_validators.sh
          python scripts/validate_bandit_suppressions.py --require-active
          python scripts/validate_workflows.py
          python scripts/verify_repository.py --profile static
          pytest -q \
            tests/unit/test_validate_frontend_placeholders.py \
            tests/unit/test_install_native_validators.py \
            tests/unit/test_preflight_release_inputs.py \
            tests/unit/test_normalize_source_timing_logs.py \
            tests/unit/test_release_remediation.py \
            tests/unit/test_validate_workflows.py \
            tests/unit/test_validate_workflows_resilient.py \
            tests/unit/test_prepare_public_candidate.py \
            tests/unit/test_resilient_stage.py \
            --disable-warnings --maxfail=1
      - name: Validate main release prerequisites
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CS_PUBLIC_KEY: ${{ secrets.CS_PUBLIC_KEY }}
          CS_SIGNING_PRIVATE_KEY_HEX: ${{ secrets.CS_SIGNING_PRIVATE_KEY_HEX }}
        run: python scripts/preflight_release_inputs.py

  build_container:
    name: Build Container
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ci-runner
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  build_wasm:
    name: Build WASM Module
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/go/tester/go.sum
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binaryen
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-wasm-${{ github.run_id }}
          path: |
            frontend/assets/wasm/tester.wasm
            frontend/assets/js/wasm_exec.js
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  setup_matrix:
    name: Generate Runtime Source Matrix
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      status: ${{ steps.matrix.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrix
        name: Generate matrix with diagnostic fallback
        run: |
          set -uo pipefail
          set +e
          python scripts/shard_sources.py \
            --parts "$SOURCE_SHARD_PARTS" \
            --matrix-output source-matrix.json \
            > matrix.stdout.json 2> matrix.stderr.log
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json
          import pathlib
          import sys

          rc = int(sys.argv[1])
          path = pathlib.Path("source-matrix.json")
          payload = None
          if rc == 0 and path.is_file():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  payload = None
          valid = (
              isinstance(payload, dict)
              and isinstance(payload.get("include"), list)
              and bool(payload["include"])
          )
          if not valid:
              payload = {
                  "include": [
                      {
                          "enabled": False,
                          "batch": "diagnostic",
                          "part": 0,
                          "source_file": "",
                          "source_count": 0,
                          "source_sha256": "",
                      }
                  ]
              }
              status = "degraded"
          else:
              for row in payload["include"]:
                  row["enabled"] = True
              status = "ready"
          path.write_text(json.dumps(payload, separators=(",", ":")), encoding="utf-8")
          pathlib.Path("matrix-status.txt").write_text(status, encoding="utf-8")
          PY
          echo "value=$(cat source-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "status=$(cat matrix-status.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: source-matrix-${{ github.run_id }}
          path: |
            sources/runtime/
            source-matrix.json
            matrix.stdout.json
            matrix.stderr.log
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  pipeline:
    name: Run Source Shard ${{ matrix.batch }}.${{ matrix.part }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build_container.result == 'success' && needs.setup_matrix.outputs.status == 'ready'
    needs: [build_container, setup_matrix]
    runs-on: ubuntu-latest
    # 270 min covers the 14400s batch window + grace and artifact steps.
    # The window must stay >= dynamic_reshard.TARGET_BATCH_SECONDS (4h):
    # the resharder balances batches to that target, so a shorter force-end
    # would mark healthy runs time_limited every time.
    timeout-minutes: 270
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.setup_matrix.outputs.matrix || '{"include":[{"enabled":false,"batch":"diagnostic","part":0,"source_file":"","source_count":0,"source_sha256":""}]}') }}
    container:
      image: ${{ needs.build_container.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        PYTHONPATH: /app/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.enabled == true
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.enabled == true
        with:
          name: source-matrix-${{ github.run_id }}
          path: .
      - name: Run bounded shard and always write lineage
        if: matrix.enabled == true
        shell: bash
        env:
          CS_PUBLIC_KEY: ${{ secrets.CS_PUBLIC_KEY }}
          CS_IPNS_KEY: ${{ secrets.CS_IPNS_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          WARP_KEY_POOL: ${{ secrets.WARP_KEY_POOL }}
          CANARY_URL: "https://httpbin.org"
          # Must stay >= dynamic_reshard.TARGET_BATCH_SECONDS (14400s): the
          # resharder balances every batch to that target, so a shorter
          # force-end would mark healthy runs time_limited.
          BATCH_TIME_LIMIT_SECONDS: 14400
          BATCH_TIME_LIMIT_GRACE_SECONDS: 900
          FORCE_SCANNER: "false"
          ALLOW_ACTIVE_SCANNING: "false"
          BATCH: ${{ matrix.batch }}
          PART: ${{ matrix.part }}
          SOURCE_FILE: ${{ matrix.source_file }}
          SOURCE_COUNT: ${{ matrix.source_count }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
        run: |
          set -euo pipefail
          output="output_batch_${BATCH}_part_${PART}"
          mkdir -p "$output"
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export started_at
          python - "$output/shard_lineage.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          target = pathlib.Path(sys.argv[1])
          payload = {
              "batch": os.environ["BATCH"],
              "part": int(os.environ["PART"]),
              "source_file": os.environ["SOURCE_FILE"],
              "source_count": int(os.environ["SOURCE_COUNT"]),
              "source_sha256": os.environ["SOURCE_SHA256"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "started_at": os.environ["started_at"],
              "completed_at": None,
              "exit_code": 125,
              "status": "failed",
          }
          temporary = target.with_suffix(".json.tmp")
          temporary.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          temporary.replace(target)
          PY
          set +e
          python -m configstream.cli merge \
            --sources "$SOURCE_FILE" \
            --output "$output" \
            --max-workers 64 \
            --timeout 24 \
            --max-latency 6000 2>&1 | tee "pipeline_batch_${BATCH}_part_${PART}.log"
          rc=${PIPESTATUS[0]}
          set -e
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export rc completed_at
          if ! python - "$output/shard_lineage.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          target = pathlib.Path(sys.argv[1])
          payload = {
              "batch": os.environ["BATCH"],
              "part": int(os.environ["PART"]),
              "source_file": os.environ["SOURCE_FILE"],
              "source_count": int(os.environ["SOURCE_COUNT"]),
              "source_sha256": os.environ["SOURCE_SHA256"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "started_at": os.environ["started_at"],
              "completed_at": os.environ["completed_at"],
              "exit_code": int(os.environ["rc"]),
              "status": "success" if os.environ["rc"] == "0" else "failed",
          }
          temporary = target.with_suffix(".json.tmp")
          temporary.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          temporary.replace(target)
          PY
          then
            rc=125
          fi
          exit "$rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && matrix.enabled == true
        with:
          name: shard-${{ github.run_id }}-${{ matrix.batch }}-${{ matrix.part }}
          path: |
            output_batch_${{ matrix.batch }}_part_${{ matrix.part }}/
            pipeline_batch_${{ matrix.batch }}_part_${{ matrix.part }}.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  merge_validate_publish:
    name: Merge, Diagnose, Gate, and Publish
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, build_container, build_wasm, setup_matrix, pipeline]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
      - name: Install Python dependencies with evidence
        run: |
          python scripts/resilient_stage.py run \
            --name install-python-dependencies \
            --timeout 900 \
            -- bash -lc '
              set -euo pipefail
              python -m pip install -r requirements-dev.txt
              python -m pip install -e . --no-deps
              python -m pip check
            '
      - name: Capture workflow context
        run: |
          set -euo pipefail
          mkdir -p pipeline-evidence/stages
          python scripts/resilient_stage.py context --output pipeline-evidence/workflow_context.json
          python scripts/resilient_stage.py record --name quality-job --status "${{ needs.quality.result }}"
          python scripts/resilient_stage.py record --name container-job --status "${{ needs.build_container.result }}"
          python scripts/resilient_stage.py record --name wasm-job --status "${{ needs.build_wasm.result }}"
          python scripts/resilient_stage.py record --name matrix-job --status "${{ needs.setup_matrix.result }}"
          matrix_status="${{ needs.setup_matrix.outputs.status }}"
          if [ -z "$matrix_status" ]; then matrix_status=failure; fi
          python scripts/resilient_stage.py record --name matrix-status --status "$matrix_status"
          python scripts/resilient_stage.py record --name shard-jobs --status "${{ needs.pipeline.result }}"
      - name: Download shard artifacts
        id: shard_download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: shard-${{ github.run_id }}-*
          path: artifacts
          merge-multiple: true
      - name: Download WASM artifact
        id: wasm_download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: frontend-wasm-${{ github.run_id }}
          path: wasm-artifact
      - name: Record artifact downloads
        if: always()
        run: |
          python scripts/resilient_stage.py record --name shard-download --status "${{ steps.shard_download.outcome }}"
          python scripts/resilient_stage.py record --name wasm-download --status "${{ steps.wasm_download.outcome }}"
      - name: Restore available artifacts
        run: |
          python scripts/resilient_stage.py run --name restore-shards -- bash -lc '
            set -euo pipefail
            shopt -s nullglob globstar
            found=0
            for dir in artifacts/**/output_batch_*; do
              [ -d "$dir" ] || continue
              dest=$(basename "$dir")
              rm -rf "$dest"
              mv "$dir" "$dest"
              found=$((found+1))
            done
            find artifacts -type f -name "pipeline_batch_*.log" -exec cp {} . \; 2>/dev/null || true
            [ "$found" -gt 0 ]
          '
          python scripts/resilient_stage.py run --name restore-wasm -- bash -lc '
            set -euo pipefail
            tester=$(find wasm-artifact -type f -name tester.wasm | head -1)
            execjs=$(find wasm-artifact -type f -name wasm_exec.js | head -1)
            [ -n "$tester" ] && [ -n "$execjs" ]
            mkdir -p frontend/assets/wasm frontend/assets/js
            cp "$tester" frontend/assets/wasm/tester.wasm
            cp "$execjs" frontend/assets/js/wasm_exec.js
          '
      - name: Merge and reconcile all available shard evidence
        run: |
          python scripts/resilient_stage.py run --name merge-batches -- python -m scripts.merge_batches
          python scripts/resilient_stage.py run --name aggregate-shard-health -- python scripts/aggregate_shard_health.py --parts "$SOURCE_SHARD_PARTS"
          python scripts/resilient_stage.py run --name normalize-source-timings -- python scripts/normalize_source_timing_logs.py --evidence pipeline-evidence/source_timing.jsonl
          python scripts/resilient_stage.py run --name dynamic-reshard -- python scripts/dynamic_reshard.py
      - name: Upload source reshard recommendation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        continue-on-error: true
        with:
          name: source-reshard-recommendation
          path: sources/batch_*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Prepare public output artifact transactionally
        env:
          CS_PUBLIC_KEY: ${{ secrets.CS_PUBLIC_KEY }}
          CS_IPNS_KEY: ${{ secrets.CS_IPNS_KEY }}
          CS_SIGNING_PRIVATE_KEY_HEX: ${{ secrets.CS_SIGNING_PRIVATE_KEY_HEX }}
        run: |
          set -euo pipefail
          python scripts/resilient_stage.py run \
            --name prepare-public-candidate \
            -- python scripts/prepare_public_candidate.py output output --frontend frontend --repo-root .
          prepare_status="$(python -c 'import json; print(json.load(open("pipeline-evidence/stages/prepare-public-candidate.json", encoding="utf-8"))["status"])')"
          if [ "$prepare_status" = success ]; then
            python scripts/resilient_stage.py run --name frontend-public-boundary -- python scripts/validate_frontend_placeholders.py --inject-env --strict output
            python scripts/resilient_stage.py run --name normalize-legacy-profiles -- python scripts/normalize_legacy_profiles.py output
            python scripts/resilient_stage.py run --name finalize-release -- python scripts/finalize_release_outputs.py output --repo-root . --min-source-coverage "$MIN_SOURCE_COVERAGE"
            python scripts/resilient_stage.py run --name reconcile-release-metadata -- python scripts/reconcile_release_metadata.py output
            python scripts/resilient_stage.py run --name refresh-output-contract -- python scripts/validate_pages_artifact.py --refresh-contract output
          else
            for stage in frontend-public-boundary normalize-legacy-profiles finalize-release reconcile-release-metadata refresh-output-contract; do
              python scripts/resilient_stage.py record \
                --name "$stage" \
                --status skipped \
                --description "Skipped because transactional public candidate preparation failed"
            done
          fi
      - name: Install authenticated native validators without aborting diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/install_native_validators.sh
          python scripts/resilient_stage.py run \
            --name install-native-validators \
            --timeout 900 \
            -- bash scripts/install_native_validators.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run every mandatory release gate
        run: |
          set -euo pipefail
          mkdir -p pipeline-evidence
          python scripts/resilient_stage.py run --name native-validation -- python scripts/native_client_checks.py output --report pipeline-evidence/native_client_check_report.json
          CS_SIGNING_PRIVATE_KEY_HEX="${{ secrets.CS_SIGNING_PRIVATE_KEY_HEX }}" python scripts/resilient_stage.py run --name release-gate -- python scripts/release_gate.py output --native-report pipeline-evidence/native_client_check_report.json --min-source-coverage "$MIN_SOURCE_COVERAGE" --promote
          python scripts/resilient_stage.py run --name final-contract -- python scripts/validate_pages_artifact.py --native-client-check output
          python scripts/resilient_stage.py run --name evidence-bundle -- python scripts/generate_evidence_bundle.py --output-dir output --evidence-dir pipeline-evidence --native-report pipeline-evidence/native_client_check_report.json
      - name: Evaluate release readiness
        id: readiness
        run: |
          set -euo pipefail
          python scripts/resilient_stage.py evaluate \
            --required-stage install-python-dependencies \
            --required-stage quality-job \
            --required-stage container-job \
            --required-stage wasm-job \
            --required-stage matrix-job \
            --required-stage matrix-status \
            --required-stage shard-jobs \
            --required-stage shard-download \
            --required-stage wasm-download \
            --required-stage restore-shards \
            --required-stage restore-wasm \
            --required-stage merge-batches \
            --required-stage aggregate-shard-health \
            --required-stage normalize-source-timings \
            --required-stage dynamic-reshard \
            --required-stage prepare-public-candidate \
            --required-stage frontend-public-boundary \
            --required-stage normalize-legacy-profiles \
            --required-stage finalize-release \
            --required-stage reconcile-release-metadata \
            --required-stage refresh-output-contract \
            --required-stage install-native-validators \
            --required-stage native-validation \
            --required-stage release-gate \
            --required-stage final-contract \
            --required-stage evidence-bundle \
            --required-file pipeline-evidence/source_timing.jsonl \
            --required-file output/metadata.json \
            --required-file output/proxies.json \
            --required-file output/assets/wasm/tester.wasm \
            --required-file output/assets/js/wasm_exec.js \
            --output pipeline-evidence/release_readiness.json
          ready=$(python -c 'import json; print(str(json.load(open("pipeline-evidence/release_readiness.json", encoding="utf-8"))["publish_ready"]).lower())')
          echo "publish_ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Upload complete diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        continue-on-error: true
        with:
          name: pipeline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload diagnostic candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        continue-on-error: true
        with:
          name: pipeline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Upload canonical pipeline output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.readiness.outputs.publish_ready == 'true' && github.ref == 'refs/heads/main'
        with:
          name: pipeline-output
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Final self-describing summary
        if: always()
        run: |
          set -euo pipefail
          python scripts/resilient_stage.py summary --output pipeline-evidence/stage_summary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          readiness_path = Path("pipeline-evidence/release_readiness.json")
          readiness = (
              json.loads(readiness_path.read_text(encoding="utf-8"))
              if readiness_path.exists()
              else {
                  "status": "unknown",
                  "publish_ready": False,
                  "blockers": ["readiness report missing"],
              }
          )
          summary_path = Path("pipeline-evidence/stage_summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          failed_stages = [
              stage.get("name")
              for stage in summary.get("stages", [])
              if (
                  stage.get("status") == "failed"
                  and stage.get("criticality", "required") == "required"
              )
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Final release disposition\n")
              handle.write(f"- Status: **{readiness.get('status')}**\n")
              handle.write(
                  f"- Canonical publication allowed: **{readiness.get('publish_ready', False)}**\n"
              )
              for blocker in readiness.get("blockers", []):
                  handle.write(f"- Blocker: `{blocker}`\n")
              for stage in failed_stages:
                  handle.write(f"- Failed stage: `{stage}`\n")
          if not readiness.get("publish_ready", False) or failed_stages:
              raise SystemExit("release workflow completed with blocking failures")
          PY
