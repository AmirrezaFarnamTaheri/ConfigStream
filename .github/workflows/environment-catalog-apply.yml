name: Environment Catalog Apply

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0
    paths:
      - '.github/workflows/environment-catalog-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Regenerate environment catalog
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/ConfigStream' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/post-audit-remediation-v3.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/post-audit-remediation-v3.1.0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Regenerate and verify environment catalog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/generate_environment_catalog.py --check
          git diff --check -- docs/generated/environment-variables.json docs/generated/environment-variables.md
          git add -- docs/generated/environment-variables.json docs/generated/environment-variables.md
          if git diff --cached --quiet; then
            echo 'Environment catalog was already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh generated environment catalog'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${TARGET_BRANCH}"
