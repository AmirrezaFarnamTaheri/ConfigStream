name: Apply fail-closed lifecycle batch

on:
  push:
    branches: [agent/full-audit-remediation]
    paths: [.github/workflows/apply-fail-closed.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-audit-remediation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          cat > src/configstream/pipeline/outcomes.py <<'PY'
          # SPDX-License-Identifier: AGPL-3.0-or-later
          from dataclasses import dataclass
          from enum import Enum
          from typing import Protocol

          class RunDisposition(str, Enum):
              SUCCESS = 'success'
              FAILED_NO_INPUT = 'failed_no_input'
              FAILED_NO_PARSED = 'failed_no_parsed'
              FAILED_NO_TESTS = 'failed_no_tests'
              FAILED_ZERO_WORKING = 'failed_zero_working'
              FAILED_TIME_LIMIT = 'failed_time_limit'

          @dataclass(frozen=True, slots=True)
          class PublicationDecision:
              disposition: RunDisposition
              publishable: bool
              reason: str

          class RunStats(Protocol):
              total_configured_sources: int
              parsed: int
              tested: int
              working: int
              time_limited: bool

          def classify_run(stats: RunStats) -> PublicationDecision:
              checks = (
                  (stats.total_configured_sources <= 0, RunDisposition.FAILED_NO_INPUT, 'No configured sources were available.'),
                  (stats.parsed <= 0, RunDisposition.FAILED_NO_PARSED, 'No candidates were parsed.'),
                  (stats.tested <= 0, RunDisposition.FAILED_NO_TESTS, 'No candidates reached validation.'),
                  (stats.working <= 0, RunDisposition.FAILED_ZERO_WORKING, 'No candidates passed validation.'),
                  (stats.time_limited, RunDisposition.FAILED_TIME_LIMIT, 'The run is incomplete because its time limit was reached.'),
              )
              for failed, disposition, reason in checks:
                  if failed:
                      return PublicationDecision(disposition, False, reason)
              return PublicationDecision(RunDisposition.SUCCESS, True, 'Stable publication predicates passed.')
          PY
          python - <<'PY'
          from pathlib import Path

          producer = Path('src/configstream/pipeline/producer.py')
          text = producer.read_text()
          old = '''    except Exception as e:
              safe_error = SecurityValidator.sanitize_log_message(str(e))
              logger.error(f"Producer failed: {safe_error}")
          finally:
              # If absolutely nothing was provided, log a clear warning – this would
              # otherwise result in a silent zero-output run.
              if not sources and not proxies:
                  logger.warning(
                      "No sources or pre-supplied proxies provided - pipeline will produce zero results"
                  )

              # Signal all consumers to exit
              for _ in range(num_consumers):
                  await work_queue.put(None)
          '''
          new = '''    except Exception as e:
              safe_error = SecurityValidator.sanitize_log_message(str(e))
              logger.error(f"Producer failed: {safe_error}")
              if event_stream:
                  event_stream.emit("critical", f"Producer failed: {safe_error}")
              raise
          else:
              if not sources and not proxies:
                  logger.warning(
                      "No sources or pre-supplied proxies provided - pipeline will produce zero results"
                  )
              for _ in range(num_consumers):
                  await work_queue.put(None)
          '''
          if text.count(old) != 1:
              raise SystemExit('producer guard mismatch')
          producer.write_text(text.replace(old, new, 1))

          core = Path('src/configstream/pipeline/core.py')
          text = core.read_text()
          import_old = 'from configstream.pipeline_stats import PipelineStats, PipelineResult\n'
          import_new = import_old + 'from configstream.pipeline.outcomes import classify_run\n'
          if text.count(import_old) != 1:
              raise SystemExit('core import guard mismatch')
          text = text.replace(import_old, import_new, 1)
          start = text.index('            _zero_working = stats.tested > 0 and stats.working == 0\n')
          end = text.index('            from configstream.filtering import (\n', start)
          text = text[:start] + text[end:]
          marker = '            stats.duration = float(duration)\n\n'
          gate = '''            stats.duration = float(duration)

              decision = classify_run(stats)
              if not decision.publishable:
                  logger.error("Publication rejected: %s", decision.reason)
                  return PipelineResult(False, stats, {}, decision.reason)

          '''
          if text.count(marker) != 1:
              raise SystemExit('publication gate marker mismatch')
          text = text.replace(marker, gate, 1)
          tail_start = text.index('            should_fail = (\n')
          tail_end = text.index('\n\n        finally:', tail_start)
          replacement = '''            logger.info("Pipeline execution completed")
              return PipelineResult(True, stats, generated_files, None)'''
          text = text[:tail_start] + replacement + text[tail_end:]
          core.write_text(text)
          PY
          cat > tests/unit/test_pipeline_fail_closed.py <<'PY'
          import asyncio
          from unittest.mock import MagicMock, patch
          import pytest
          from configstream.pipeline.outcomes import RunDisposition, classify_run
          from configstream.pipeline.producer import source_producer
          from configstream.pipeline_stats import PipelineStats

          @pytest.mark.parametrize('values,expected', [
              ((0,0,0,0,False), RunDisposition.FAILED_NO_INPUT),
              ((1,0,0,0,False), RunDisposition.FAILED_NO_PARSED),
              ((1,1,0,0,False), RunDisposition.FAILED_NO_TESTS),
              ((1,1,1,0,False), RunDisposition.FAILED_ZERO_WORKING),
              ((1,1,1,1,True), RunDisposition.FAILED_TIME_LIMIT),
              ((1,1,1,1,False), RunDisposition.SUCCESS),
          ])
          def test_disposition(values, expected):
              stats = PipelineStats()
              stats.total_configured_sources, stats.parsed, stats.tested, stats.working, stats.time_limited = values
              assert classify_run(stats).disposition is expected

          @pytest.mark.asyncio
          async def test_producer_failure_has_no_success_sentinel():
              queue = asyncio.Queue()
              quality = MagicMock(); quality.should_fetch.return_value = True
              with patch('configstream.producer.read_multiple_files_async', side_effect=RuntimeError('injected')):
                  with pytest.raises(RuntimeError, match='injected'):
                      await source_producer(['broken'], queue, None, quality, MagicMock(), None, None, None, num_consumers=2)
              assert queue.empty()
          PY
      - name: Validate and commit
        run: |
          python -m black src/configstream/pipeline/outcomes.py src/configstream/pipeline/producer.py src/configstream/pipeline/core.py tests/unit/test_pipeline_fail_closed.py
          pytest -q tests/unit/test_pipeline_fail_closed.py tests/unit/test_pipeline_stages.py
          rm .github/workflows/apply-fail-closed.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/pipeline/outcomes.py src/configstream/pipeline/producer.py src/configstream/pipeline/core.py tests/unit/test_pipeline_fail_closed.py .github/workflows/apply-fail-closed.yml
          git commit -m 'fix: fail closed before publication'
          git push origin HEAD:agent/full-audit-remediation
