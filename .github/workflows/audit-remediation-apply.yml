name: Materialize audited workflow commit

on:
  push:
    branches: [codex/fix-run-34268254683-audit]
    paths:
      - '.github/workflows/audit-remediation-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.ref == 'refs/heads/codex/fix-run-34268254683-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 20
          persist-credentials: false
      - name: Reconstruct exact locally-verified workflow edits
        shell: bash
        run: |
          set -euo pipefail
          source_commit=""
          while read -r commit; do
            if git cat-file -e "$commit:scripts/.audit_patch_00" 2>/dev/null && \
               git cat-file -e "$commit:scripts/apply_audit_remediation_patch.py" 2>/dev/null; then
              source_commit="$commit"
              break
            fi
          done < <(git rev-list HEAD)
          if [ -z "$source_commit" ]; then
            echo 'Unable to locate audited patch transport in branch history.' >&2
            exit 1
          fi

          python - "$source_commit" <<'PY'
          import base64
          import pathlib
          import subprocess
          import sys
          import zlib

          commit = sys.argv[1]
          encoded = "".join(
              subprocess.check_output(
                  ["git", "show", f"{commit}:scripts/.audit_patch_{index:02d}"],
                  text=True,
              ).strip()
              for index in range(4)
          )
          pathlib.Path("/tmp/audit-workflows.patch").write_bytes(
              zlib.decompress(base64.b64decode(encoded))
          )
          pathlib.Path("/tmp/audit-applicator.py").write_text(
              subprocess.check_output(
                  ["git", "show", f"{commit}:scripts/apply_audit_remediation_patch.py"],
                  text=True,
              ),
              encoding="utf-8",
          )
          PY

          git apply --check \
            --include='.github/workflows/ci.yml' \
            --include='.github/workflows/deploy-pages.yml' \
            /tmp/audit-workflows.patch
          git apply \
            --include='.github/workflows/ci.yml' \
            --include='.github/workflows/deploy-pages.yml' \
            /tmp/audit-workflows.patch

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("audit_applicator", "/tmp/audit-applicator.py")
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load audit applicator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.patch_main_workflow()
          PY

          git diff --check -- \
            .github/workflows/main.yml \
            .github/workflows/ci.yml \
            .github/workflows/deploy-pages.yml
          python scripts/validate_workflows.py
          python scripts/validate_container_shells.py
      - name: Create inert Git objects for connector promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/git"

          create_blob() {
            local file="$1"
            local request response
            request=$(mktemp)
            response=$(mktemp)
            python - "$file" > "$request" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          payload = pathlib.Path(sys.argv[1]).read_bytes()
          print(json.dumps({
              "content": base64.b64encode(payload).decode("ascii"),
              "encoding": "base64",
          }))
          PY
            curl --fail-with-body -sS \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@$request" \
              "$api/blobs" > "$response"
            python - "$response" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          sha = payload.get("sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit(f"blob creation failed: {payload}")
          print(sha)
          PY
            rm -f "$request" "$response"
          }

          main_blob=$(create_blob .github/workflows/main.yml)
          ci_blob=$(create_blob .github/workflows/ci.yml)
          pages_blob=$(create_blob .github/workflows/deploy-pages.yml)
          base_tree=$(git rev-parse 'HEAD^{tree}')
          parent=$(git rev-parse HEAD)

          python - "$base_tree" "$main_blob" "$ci_blob" "$pages_blob" > /tmp/tree.json <<'PY'
          import json
          import sys

          base_tree, main_blob, ci_blob, pages_blob = sys.argv[1:]
          print(json.dumps({
              "base_tree": base_tree,
              "tree": [
                  {"path": ".github/workflows/main.yml", "mode": "100644", "type": "blob", "sha": main_blob},
                  {"path": ".github/workflows/ci.yml", "mode": "100644", "type": "blob", "sha": ci_blob},
                  {"path": ".github/workflows/deploy-pages.yml", "mode": "100644", "type": "blob", "sha": pages_blob},
              ],
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/tree.json \
            "$api/trees" > /tmp/tree-response.json
          tree_sha=$(python - <<'PY'
          import json
          payload = json.load(open('/tmp/tree-response.json', encoding='utf-8'))
          sha = payload.get('sha')
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit(f"tree creation failed: {payload}")
          print(sha)
          PY
          )

          python - "$tree_sha" "$parent" > /tmp/commit.json <<'PY'
          import json
          import sys

          tree_sha, parent = sys.argv[1:]
          print(json.dumps({
              "message": "fix(ci): harden release workflow contracts",
              "tree": tree_sha,
              "parents": [parent],
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/commit.json \
            "$api/commits" > /tmp/commit-response.json
          commit_sha=$(python - <<'PY'
          import json
          payload = json.load(open('/tmp/commit-response.json', encoding='utf-8'))
          sha = payload.get('sha')
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit(f"commit creation failed: {payload}")
          print(sha)
          PY
          )

          echo "WORKFLOW_COMMIT_SHA=$commit_sha"
          echo "Created inert workflow remediation commit: $commit_sha" >> "$GITHUB_STEP_SUMMARY"
