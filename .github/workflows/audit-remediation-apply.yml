name: Export audited workflow payloads

on:
  push:
    branches: [codex/fix-run-34268254683-audit]
    paths:
      - '.github/workflows/audit-remediation-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.ref == 'refs/heads/codex/fix-run-34268254683-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 30
          persist-credentials: true

      - name: Reconstruct and validate exact audited workflows
        shell: bash
        run: |
          set -euo pipefail
          source_commit=""
          while read -r commit; do
            if git cat-file -e "$commit:scripts/.audit_patch_00" 2>/dev/null && \
               git cat-file -e "$commit:scripts/apply_audit_remediation_patch.py" 2>/dev/null; then
              source_commit="$commit"
              break
            fi
          done < <(git rev-list HEAD)
          if [ -z "$source_commit" ]; then
            echo 'Unable to locate audited patch transport in branch history.' >&2
            exit 1
          fi

          python - "$source_commit" <<'PY'
          import base64
          import pathlib
          import subprocess
          import sys
          import zlib

          commit = sys.argv[1]
          encoded = "".join(
              subprocess.check_output(
                  ["git", "show", f"{commit}:scripts/.audit_patch_{index:02d}"],
                  text=True,
              ).strip()
              for index in range(4)
          )
          pathlib.Path("/tmp/audit-workflows.patch").write_bytes(
              zlib.decompress(base64.b64decode(encoded))
          )
          pathlib.Path("/tmp/audit-applicator.py").write_text(
              subprocess.check_output(
                  ["git", "show", f"{commit}:scripts/apply_audit_remediation_patch.py"],
                  text=True,
              ),
              encoding="utf-8",
          )
          PY

          git apply --check \
            --include='.github/workflows/ci.yml' \
            --include='.github/workflows/deploy-pages.yml' \
            /tmp/audit-workflows.patch
          git apply \
            --include='.github/workflows/ci.yml' \
            --include='.github/workflows/deploy-pages.yml' \
            /tmp/audit-workflows.patch

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("audit_applicator", "/tmp/audit-applicator.py")
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load audit applicator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.patch_main_workflow()
          PY

          git diff --check -- \
            .github/workflows/main.yml \
            .github/workflows/ci.yml \
            .github/workflows/deploy-pages.yml
          python scripts/validate_workflows.py
          python scripts/validate_container_shells.py

          test "$(git hash-object .github/workflows/main.yml)" = '5c53f11cdcb7bc7ea019a3919b3d88475c9c0520'
          test "$(git hash-object .github/workflows/ci.yml)" = 'c80cc9ee5e9a87ca7b5ddb3440f87ed8a954a8ba'
          test "$(git hash-object .github/workflows/deploy-pages.yml)" = '5acf929ae799929ba1ef3ab1a6d3ed6c820ce2cc'

      - name: Commit exact workflows as non-workflow payload files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-workflow-payload
          mkdir -p .audit-workflow-payload
          cp .github/workflows/main.yml .audit-workflow-payload/main.yml
          cp .github/workflows/ci.yml .audit-workflow-payload/ci.yml
          cp .github/workflows/deploy-pages.yml .audit-workflow-payload/deploy-pages.yml

          git restore --source=HEAD -- \
            .github/workflows/main.yml \
            .github/workflows/ci.yml \
            .github/workflows/deploy-pages.yml

          git add .audit-workflow-payload
          git diff --cached --check
          test "$(git hash-object .audit-workflow-payload/main.yml)" = '5c53f11cdcb7bc7ea019a3919b3d88475c9c0520'
          test "$(git hash-object .audit-workflow-payload/ci.yml)" = 'c80cc9ee5e9a87ca7b5ddb3440f87ed8a954a8ba'
          test "$(git hash-object .audit-workflow-payload/deploy-pages.yml)" = '5acf929ae799929ba1ef3ab1a6d3ed6c820ce2cc'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: export exact audited workflow payloads'
          git push origin HEAD:codex/fix-run-34268254683-audit
