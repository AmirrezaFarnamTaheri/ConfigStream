name: Apply audit remediation patch

on:
  push:
    branches: [codex/fix-run-34268254683-audit]
    paths:
      - '.github/workflows/audit-remediation-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    # Retry 2: remove this temporary workflow from the working tree before permanent workflow validation.
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.ref == 'refs/heads/codex/fix-run-34268254683-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - name: Apply exact verified remediation
        run: python scripts/apply_audit_remediation_patch.py
      - name: Remove one-shot transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/.audit_patch_00 \
            scripts/.audit_patch_01 \
            scripts/.audit_patch_02 \
            scripts/.audit_patch_03 \
            scripts/apply_audit_remediation_patch.py \
            .github/workflows/audit-remediation-apply.yml
      - name: Verify and commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: apply audited runtime and release hardening'
          git push origin HEAD:codex/fix-run-34268254683-audit
