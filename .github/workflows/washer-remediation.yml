name: Washer Exception Remediation

on:
  push:
    branches: [agent/post-615-hardening]
    paths:
      - '.github/workflows/washer-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/post-615-hardening
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Narrow washer recovery boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/configstream/intelligence/washer/core.py')
          text = path.read_text(encoding='utf-8')

          old = '''            try:\n                decoded = base64.b64decode(cleaned, validate=False)\n            except Exception:\n                logging.getLogger(__name__).debug("Suppressed broad exception")\n                return None\n'''
          new = '''            try:\n                decoded = base64.b64decode(cleaned, validate=False)\n            except (binascii.Error, ValueError):\n                return None\n'''
          if old not in text:
              raise SystemExit('normalization broad boundary not found')
          text = text.replace(old, new, 1)

          def unwrap_expected_delegate(source: str, first_body_line: str, handler: str) -> str:
              try_line = '                try:\n'
              anchor = try_line + first_body_line
              start = source.find(anchor)
              if start < 0:
                  raise SystemExit(f'try block not found: {first_body_line.strip()}')
              except_start = source.find(handler, start)
              if except_start < 0:
                  raise SystemExit(f'handler not found for: {first_body_line.strip()}')
              handler_end = except_start + len(handler)
              body = source[start + len(try_line):except_start]
              deindented = ''.join(
                  line[4:] if line.startswith('    ') else line
                  for line in body.splitlines(keepends=True)
              )
              return source[:start] + deindented + source[handler_end:]

          text = unwrap_expected_delegate(
              text,
              '                    scraper = WarpScraper()\n',
              '                except Exception as e:\n                    logger.warning(f"WARP scraper failed: {e}")\n',
          )
          text = unwrap_expected_delegate(
              text,
              '                    vwarp = VwarpTool()\n',
              '                except Exception as e:\n                    logger.warning(f"Vwarp scanner failed: {e}")\n',
          )
          text = unwrap_expected_delegate(
              text,
              '                    logger.info("Attempting active IP scan...")\n',
              '                except Exception as e:\n                    logger.error(f"Active scan failed: {e}")\n',
          )
          text = unwrap_expected_delegate(
              text,
              '                    new_account = await self.key_gen.generate_account()\n',
              '                except Exception as e:\n                    logger.error(f"Key generation failed: {e}")\n',
          )

          old = '''                    except Exception:  # nosec B110\n                        logging.getLogger(__name__).debug("Suppressed broad exception")\n                        pass\n'''
          new = '''                    except (httpx.HTTPError, OSError) as exc:\n                        logger.debug(\n                            "Static clean-IP source failed for %s: %s",\n                            source_url,\n                            type(exc).__name__,\n                        )\n'''
          if old not in text:
              raise SystemExit('static fetch broad boundary not found')
          text = text.replace(old, new, 1)

          old = '''        except Exception:\n            logging.getLogger(__name__).debug("Suppressed broad exception")\n            return False\n'''
          new = '''        except (asyncio.TimeoutError, OSError) as exc:\n            logger.debug("Vwarp SOCKS probe unavailable: %s", type(exc).__name__)\n            return False\n'''
          if old not in text:
              raise SystemExit('Vwarp availability broad boundary not found')
          text = text.replace(old, new, 1)

          old = '''            except Exception:  # nosec B110\n                logging.getLogger(__name__).debug("Suppressed broad exception")\n                pass\n'''
          new = '''            except (KeyError, TypeError, ValueError) as exc:\n                logger.debug(\n                    "Relay optimization skipped for %s: %s",\n                    relay.id,\n                    type(exc).__name__,\n                )\n'''
          if old not in text:
              raise SystemExit('relay optimization broad boundary not found')
          text = text.replace(old, new, 1)

          if 'except Exception' in text:
              raise SystemExit('washer core still contains a broad exception boundary')
          path.write_text(text, encoding='utf-8')

          vwarp_tests = Path('tests/unit/test_vwarp_runtime_availability.py')
          tests = vwarp_tests.read_text(encoding='utf-8')
          marker = 'test_vwarp_probe_surfaces_unexpected_programming_failures'
          if marker not in tests:
              tests += '''\n\n@pytest.mark.asyncio\nasync def test_vwarp_probe_treats_socket_failure_as_unavailable(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    washer = ProxyWasher("[]")\n    monkeypatch.setenv("USE_VWARP_TUNNEL", "true")\n    monkeypatch.setattr(\n        "asyncio.open_connection",\n        AsyncMock(side_effect=OSError("connection refused")),\n    )\n\n    assert await washer.is_vwarp_available_async() is False\n\n\n@pytest.mark.asyncio\nasync def test_vwarp_probe_surfaces_unexpected_programming_failures(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    washer = ProxyWasher("[]")\n    monkeypatch.setenv("USE_VWARP_TUNNEL", "true")\n    monkeypatch.setattr(\n        "asyncio.open_connection",\n        AsyncMock(side_effect=RuntimeError("unexpected bug")),\n    )\n\n    with pytest.raises(RuntimeError, match="unexpected bug"):\n        await washer.is_vwarp_available_async()\n'''
              vwarp_tests.write_text(tests, encoding='utf-8')

          contract = Path('tests/unit/test_washer_exception_contracts.py')
          contract.write_text('''# SPDX-License-Identifier: AGPL-3.0-or-later\nimport base64\n\nimport pytest\n\nimport configstream.intelligence.washer.core as washer_core\nfrom configstream.intelligence.washer.core import ProxyWasher\nfrom configstream.models import Proxy\n\n\nclass _BuggyScraper:\n    async def scrape_warp_sources(self):\n        raise RuntimeError("scraper programming failure")\n\n    def get_scraped_endpoints(self):\n        return []\n\n\n@pytest.mark.asyncio\nasync def test_fetch_clean_ips_surfaces_unexpected_scraper_failure(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    washer = ProxyWasher("[]")\n    monkeypatch.setattr(washer_core, "WarpScraper", _BuggyScraper)\n\n    with pytest.raises(RuntimeError, match="scraper programming failure"):\n        await washer.fetch_clean_ips()\n\n\ndef test_wash_batch_surfaces_unexpected_optimizer_failure(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    key = base64.b64encode(b"k" * 32).decode("ascii")\n    washer = ProxyWasher("[]")\n    washer.warp_keys = [{"private_key": key, "id": "test-key"}]\n    relay = Proxy(\n        config="socks5://1.2.3.4:1080",\n        protocol="socks5",\n        address="1.2.3.4",\n        port=1080,\n        is_working=True,\n        country_code="US",\n        latency=10.0,\n    )\n    monkeypatch.setattr(\n        washer_core,\n        "to_singbox_outbound",\n        lambda proxy: {\n            "type": "socks",\n            "server": proxy.address,\n            "server_port": proxy.port,\n        },\n    )\n\n    def _raise_optimizer_bug(*args, **kwargs):\n        raise RuntimeError("optimizer programming failure")\n\n    monkeypatch.setattr(washer_core, "find_optimal_relay", _raise_optimizer_bug)\n\n    with pytest.raises(RuntimeError, match="optimizer programming failure"):\n        washer.wash_batch([relay])\n''', encoding='utf-8')
          PY
      - name: Install pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Ratchet exception budget and regenerate final-tree evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_environment_catalog.py
          helper='.github/workflows/washer-remediation.yml'
          backup="$RUNNER_TEMP/washer-remediation.yml"
          mv "$helper" "$backup"
          restore() {
            if [ -f "$backup" ]; then
              mv "$backup" "$helper"
            fi
          }
          trap restore EXIT
          python scripts/generate_debt_matrix.py
          python scripts/generate_triage_report.py
          restore
          trap - EXIT
      - name: Run washer regressions
        run: |
          python -m pytest -q \
            tests/unit/test_washer.py \
            tests/unit/test_vwarp_runtime_availability.py \
            tests/unit/coverage_boost/test_washer_coverage.py \
            tests/unit/test_washer_exception_contracts.py \
            tests/unit/test_validate_exception_boundaries.py
      - name: Verify final static repository contracts
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/washer-remediation.yml'
          backup="$RUNNER_TEMP/washer-remediation.yml"
          mv "$helper" "$backup"
          restore() {
            if [ -f "$backup" ]; then
              mv "$backup" "$helper"
            fi
          }
          trap restore EXIT
          python scripts/verify_repository.py --profile static
          restore
          trap - EXIT
      - name: Commit washer remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/configstream/intelligence/washer/core.py \
            tests/unit/test_vwarp_runtime_availability.py \
            tests/unit/test_washer_exception_contracts.py \
            config/exception-boundary-budget.json \
            docs/DEBT_MATRIX.md \
            docs/debt_matrix.json \
            docs/generated/environment-variables.md \
            docs/generated/environment-variables.json \
            TRIAGE_REPORT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No washer remediation changes to commit'
            exit 1
          fi
          git commit -m 'fix(washer): make recovery boundaries fail explicit'
          git push origin HEAD:agent/post-615-hardening
