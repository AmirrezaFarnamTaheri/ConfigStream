name: Pipeline Health Check

on:
  # Run 30 minutes after pipeline (which runs every 6 hours)
  schedule:
    - cron: '30 */6 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run after pipeline completes
  workflow_run:
    workflows: ["ConfigStream Pipeline"]
    types:
      - completed

permissions:
  contents: read
  issues: write  # For creating issues on failure

jobs:
  healthcheck:
    name: Check Pipeline Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Always check main branch output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run health checks
        id: health
        run: |
          python scripts/healthcheck.py \
            --min-proxies 100 \
            --min-success-rate 0.3 \
            --max-age-hours 12 \
            --min-protocols 3 \
            --min-countries 5 \
            --max-avg-latency 5000
        continue-on-error: true

      - name: Create issue on failure
        if: failure() && steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Pipeline Health Check Failed';
            const body = `## Pipeline Health Check Failure

            The automated health check detected issues with the latest pipeline run.

            **Time:** ${new Date().toISOString()}
            **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Possible Issues
            - Low proxy count (<100)
            - Poor success rate (<30%)
            - Stale data (>12 hours old)
            - Low protocol diversity (<3 protocols)
            - Low geographic diversity (<5 countries)
            - High average latency (>5000ms)

            ### Action Required
            Please review the pipeline logs and investigate the root cause.

            **Auto-generated by:** [healthcheck workflow](.github/workflows/healthcheck.yml)
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check-failure',
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['health-check-failure', 'automated'],
              });
              console.log('Created new health check failure issue');
            } else {
              // Update existing issue
              const issueNumber = issues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ Health check failed again at ${new Date().toISOString()}\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              });
              console.log(`Updated existing issue #${issueNumber}`);
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Close any open health check issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check-failure',
            });

            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Health check passed at ${new Date().toISOString()}. Closing issue.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              });

              console.log(`Closed issue #${issue.number}`);
            }

      - name: Send Discord alert (optional)
        if: failure() && steps.health.outcome == 'failure' && secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "⚠️ ConfigStream Health Check Failed",
                "description": "The pipeline health check detected issues. Please investigate.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "${{ github.repository }}",
                    "inline": true
                  },
                  {
                    "name": "Time",
                    "value": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",
                    "inline": true
                  },
                  {
                    "name": "Workflow",
                    "value": "[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }'
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.health.outcome }}" = "success" ]; then
            echo "✅ All health checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Health check failed. Please review logs." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
