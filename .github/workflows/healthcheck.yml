name: Pipeline Health Check

on:
  # Run 30 minutes after pipeline (which runs every 6 hours)
  schedule:
    - cron: '30 */6 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run after pipeline completes
  workflow_run:
    workflows: ["ConfigStream Pipeline"]
    types:
      - completed

concurrency:
  # Isolate by repo and workflow reference to avoid cross-branch/fork collisions
  group: healthcheck-${{ github.repository }}-${{ github.workflow_ref || github.run_workflow_ref || github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read     # Only read code
  issues: write      # Create/update failure alerts
  actions: read      # Read workflow status

jobs:
  healthcheck:
    # Run if:
    # - scheduled/manual: always
    # - workflow_run: only when the triggering workflow concluded successfully
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name != 'workflow_run')
    name: Check Pipeline Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Checkout the commit associated with the triggering context (no hardcoded ref)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify pipeline outputs exist
        id: verify
        run: |
          outputs_exist=true
          if [ ! -f output/proxies.json ] || [ ! -f output/metadata.json ]; then
            echo "⚠️ Pipeline outputs not found."
            outputs_exist=false
          fi
          echo "outputs_exist=${outputs_exist}" >> "$GITHUB_OUTPUT"
          # If this was triggered by a successful pipeline run, missing outputs is a hard failure
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" = "success" ] && [ "$outputs_exist" = "false" ]; then
            echo "❌ Outputs missing after successful triggering workflow. Failing." >&2
            exit 1
          fi
          if [ "$outputs_exist" = "true" ]; then
            echo "✓ Pipeline outputs found."
          else
            echo "⏭️ Skipping health check for non-workflow_run or non-success contexts."
          fi

      - name: Run health checks
        id: health
        if: steps.verify.outputs.outputs_exist == 'true'
        shell: bash
        run: |
          set +e
          python scripts/healthcheck.py \
            --min-proxies 100 \
            --min-success-rate 0.3 \
            --max-age-hours 12 \
            --min-protocols 3 \
            --min-countries 5 \
            --max-avg-latency 5000
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Create issue on failure
        if: steps.health.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Pipeline Health Check Failed';
            const body = `## Pipeline Health Check Failure

            The automated health check detected issues with the latest pipeline run.

            **Time:** ${new Date().toISOString()}
            **Workflow:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            ### Possible Issues
            - Low proxy count (<100)
            - Poor success rate (<30%)
            - Stale data (>12 hours old)
            - Low protocol diversity (<3 protocols)
            - Low geographic diversity (<5 countries)
            - High average latency (>5000ms)

            ### Action Required
            Please review the pipeline logs and investigate the root cause.

            **Auto-generated by:** healthcheck workflow
            `;

            // Fetch up to 100 matching issues to avoid pagination misses
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check-failure',
              per_page: 100,
            });

            const existing = openIssues.find(i => i.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health-check-failure', 'automated'],
              });
              console.log('Created new health check failure issue');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `❌ Health check failed again at ${new Date().toISOString()}\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              console.log(`Updated existing issue #${existing.number}`);
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Pipeline Health Check Failed';
            let page = 1;
            let toClose = [];
            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'health-check-failure',
                per_page: 100,
                page,
              });
              if (!data.length) break;
              toClose.push(...data.filter(i => i.title === title));
              page += 1;
            }

            for (const issue of toClose) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Health check passed at ${new Date().toISOString()}. Closing issue.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              console.log(`Closed issue #${issue.number}`);
            }

      - name: Send Discord alert (optional)
        if: steps.health.outputs.exit_code != '0'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            payload=$(jq -nc \
              --arg repo "${{ github.repository }}" \
              --arg time "$now" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                embeds: [{
                  title: "⚠️ ConfigStream Health Check Failed",
                  description: "The pipeline health check detected issues. Please investigate.",
                  color: 15158332,
                  fields: [
                    { name: "Repository", value: $repo, inline: true },
                    { name: "Time", value: $time, inline: true },
                    { name: "Workflow", value: ("[View Run](" + $url + ")") }
                  ],
                  timestamp: $time
                }]
              }')
            # Retry up to 3 times with exponential backoff; cap request time to 10s
            attempt=1
            until curl --fail --silent --show-error --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                --data-binary "$payload"; do
              if [ $attempt -ge 3 ]; then
                echo "Discord alert failed after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((2 ** attempt))
              attempt=$((attempt + 1))
            done
            echo "Discord alert sent."
          else
            echo "DISCORD_WEBHOOK_URL not set; skipping alert."
          fi
        timeout-minutes: 2

      - name: Summary
        if: always()
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.health.outcome }}" = "success" ]; then
            echo "✅ All health checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Health check failed. Please review logs." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
