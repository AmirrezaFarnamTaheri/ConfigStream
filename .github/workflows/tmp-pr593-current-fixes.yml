name: PR593 current-head one-shot

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-current-fixes.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - name: Apply exact current-head fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          tui = "src/configstream/tools/dns_scanner/python/dnsscanner_tui.py"
          replace_once(
              tui,
              '''    def get_platform_key(self) -> str:
                  """Return an architecture-specific key present in the pinned manifest."""
          ''',
              '''    def is_supported(self) -> bool:
                  """Return whether this platform has a pinned Slipstream artifact."""
                  return f"{self.system}-{self.machine}" in self.ARTIFACTS

              def get_platform_key(self) -> str:
                  """Return an architecture-specific key present in the pinned manifest."""
          ''',
          )
          replace_once(
              tui,
              '''        self.slipstream_manager = SlipstreamManager()
                  self.slipstream_path = str(self.slipstream_manager.get_executable_path())
                  self.slipstream_domain = ""
          ''',
              '''        self.slipstream_manager = SlipstreamManager()
                  self.slipstream_path = ""
                  self.slipstream_domain = ""
          ''',
          )
          replace_once(
              tui,
              '''        # Check if slipstream needs to be downloaded
                  if self.test_slipstream and not self.slipstream_manager.is_installed():
                      self.notify(
                          "Slipstream not found. Starting download...", severity="information"
                      )
                      self.run_worker(self._download_and_start_scan(), exclusive=True)
                      return
          ''',
              '''        # Resolve the optional Slipstream dependency only when requested.
                  if self.test_slipstream:
                      if not self.slipstream_manager.is_supported():
                          self.notify(
                              "Slipstream is not supported on "
                              f"{self.slipstream_manager.system} {self.slipstream_manager.machine}.",
                              severity="error",
                          )
                          return
                      if self.slipstream_manager.is_installed():
                          self.slipstream_path = str(
                              self.slipstream_manager.get_executable_path()
                          )
                      else:
                          self.notify(
                              "Slipstream not found. Starting download...",
                              severity="information",
                          )
                          self.run_worker(self._download_and_start_scan(), exclusive=True)
                          return
          ''',
          )

          replace_once(
              "tests/unit/test_backup_extended.py",
              '''def test_restore_rejects_oversized_gzip_before_publication(
                  data_dir, backup_dir, monkeypatch
              ):
          ''',
              '''def test_restore_rejects_oversized_gzip_before_publication(
                  data_dir: Path, backup_dir: Path, monkeypatch: pytest.MonkeyPatch
              ) -> None:
          ''',
          )
          replace_once(
              "tests/unit/test_cache_paths.py",
              '''from unittest.mock import patch

              from configstream.test_cache import TestResultCache
          ''',
              '''from pathlib import Path
              from unittest.mock import patch

              import pytest

              from configstream.test_cache import TestResultCache
          ''',
          )
          replace_once(
              "tests/unit/test_cache_paths.py",
              '''def test_oversized_cache_file_fails_empty(tmp_path, monkeypatch):
          ''',
              '''def test_oversized_cache_file_fails_empty(
                  tmp_path: Path, monkeypatch: pytest.MonkeyPatch
              ) -> None:
          ''',
          )
          replace_once(
              "tests/unit/test_cli_extended.py",
              '''def test_update_databases_rejects_pinned_mirror_digest_mismatch(runner):
          ''',
              '''def test_update_databases_rejects_pinned_mirror_digest_mismatch(
                  runner: CliRunner,
              ) -> None:
          ''',
          )
          replace_once(
              "tests/unit/test_publication_policy.py",
              '''import json
              from datetime import datetime, timedelta, timezone

              import pytest
          ''',
              '''import json
              from datetime import datetime, timedelta, timezone
              from pathlib import Path

              import pytest
          ''',
          )
          replace_once(
              "tests/unit/test_publication_policy.py",
              '''def test_sanitized_event_stream_is_public_when_allowlisted(tmp_path):
          ''',
              '''def test_sanitized_event_stream_is_public_when_allowlisted(tmp_path: Path) -> None:
          ''',
          )

          lifecycle = Path("tests/unit/test_dnsscanner_tui_lifecycle.py")
          text = lifecycle.read_text(encoding="utf-8")
          replacements = {
              "async def test_cancel_and_await_tasks_runs_task_finalizers():": "async def test_cancel_and_await_tasks_runs_task_finalizers() -> None:",
              "    async def worker():": "    async def worker() -> None:",
              "async def test_kill_and_reap_processes_waits_for_children():": "async def test_kill_and_reap_processes_waits_for_children() -> None:",
              "async def test_kill_and_reap_processes_reaps_already_exited_child():": "async def test_kill_and_reap_processes_reaps_already_exited_child() -> None:",
              "        def __init__(self):": "        def __init__(self) -> None:",
              "        def kill(self):": "        def kill(self) -> None:",
              "        async def wait(self):": "        async def wait(self) -> int | None:",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if "test_tui_initialization_defers_unsupported_slipstream_resolution" not in text:
              text += '''


def test_tui_initialization_defers_unsupported_slipstream_resolution(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    from configstream.tools.dns_scanner.python import dnsscanner_tui

    monkeypatch.setattr(dnsscanner_tui.platform, "system", lambda: "Linux")
    monkeypatch.setattr(dnsscanner_tui.platform, "machine", lambda: "armv7l")

    app = dnsscanner_tui.DNSScannerTUI()

    assert app.slipstream_manager.is_supported() is False
    assert app.slipstream_path == ""
'''
          lifecycle.write_text(text, encoding="utf-8")
          PY

          python -m py_compile \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py \
            tests/unit/test_backup_extended.py \
            tests/unit/test_cache_paths.py \
            tests/unit/test_cli_extended.py \
            tests/unit/test_dnsscanner_tui_lifecycle.py \
            tests/unit/test_publication_policy.py
          git diff --check
      - name: Commit fixes and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/tmp-pr593-current-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): restore narrow current-head fixes"
          for attempt in 1 2 3; do
            if git push origin HEAD:codex/fix-run-34268254683-audit; then
              exit 0
            fi
            git fetch origin codex/fix-run-34268254683-audit
            git rebase origin/codex/fix-run-34268254683-audit
          done
          exit 1
