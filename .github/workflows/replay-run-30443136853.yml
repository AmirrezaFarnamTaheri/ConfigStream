name: Replay failed release run 30443136853

on:
  pull_request:
    paths:
      - '.github/workflows/replay-run-30443136853.yml'
      - '.github/workflows/main.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/validate_frontend_placeholders.py'
      - 'scripts/validate_pages_artifact.py'
      - 'scripts/finalize_release_outputs.py'
      - 'scripts/release_gate.py'
      - 'scripts/native_client_checks.py'
      - 'tests/unit/test_validate_frontend_placeholders.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: replay-30443136853-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOURCE_RUN: '30443136853'
  EXPECTED_SHA: '31c6796cf16b5b05d7d3619fb156de90cb93ed4f'
  SOURCE_SHARD_PARTS: '4'
  MIN_SOURCE_COVERAGE: '0.80'
  SING_BOX_VERSION: '1.13.14'
  XRAY_VERSION: 'v26.3.27'
  MIHOMO_VERSION: 'v1.19.20'
  CS_PUBLIC_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
  CS_IPNS_KEY: 'replay-only-public-routing-key'

jobs:
  replay:
    name: Replay masked release gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: Install dependencies
        run: pip install -e .[dev] huggingface_hub
      - name: Verify source run identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.head_sha' <<<"$metadata")" = "$EXPECTED_SHA"
          test "$(jq -r '.head_branch' <<<"$metadata")" = main
          test "$(jq -r '.head_repository.full_name' <<<"$metadata")" = "$REPOSITORY"
          test "$(jq -r '.name' <<<"$metadata")" = "Config's Stream"
      - name: Download exact source-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$SOURCE_RUN" --dir artifacts
      - name: Restore isolated shard and WASM outputs
        run: |
          set -euo pipefail
          find artifacts -type d -name 'output_batch_*' -print0 | while IFS= read -r -d '' path; do
            mv "$path" .
          done
          find artifacts -type f -name 'pipeline_batch_*.log' -exec cp {} . \;
          mkdir -p frontend/assets/wasm frontend/assets/js
          wasm_file=$(find artifacts -type f -name tester.wasm -print -quit)
          wasm_exec=$(find artifacts -type f -name wasm_exec.js -print -quit)
          test -n "$wasm_file"
          test -n "$wasm_exec"
          cp "$wasm_file" frontend/assets/wasm/tester.wasm
          cp "$wasm_exec" frontend/assets/js/wasm_exec.js
          test "$(find . -maxdepth 1 -type d -name 'output_batch_*' | wc -l)" -gt 0
      - name: Merge and reconcile shard evidence
        run: |
          set -euo pipefail
          python -m scripts.merge_batches
          python scripts/aggregate_shard_health.py --parts "$SOURCE_SHARD_PARTS"
      - name: Prepare complete public output artifact
        run: |
          set -euo pipefail
          mkdir -p output/docs output/tools output/api
          test ! -d docs/wiki || cp -R docs/wiki output/docs/
          cp -R frontend/. output/
          cp tools/lab-scanner.py output/tools/lab-scanner.py
          cp tools/lab-runner.sh output/tools/lab-runner.sh
          python scripts/validate_frontend_placeholders.py --inject-env --strict output
          python scripts/normalize_legacy_profiles.py output
          python scripts/finalize_release_outputs.py output --repo-root . --min-source-coverage "$MIN_SOURCE_COVERAGE"
          cp output/proxies.json output/api/proxies
          cp output/metadata.json output/api/stats
          touch output/.nojekyll
          if [ ! -s output/pipeline_events.jsonl ]; then
            printf '{"timestamp":"%s","stage":"artifact_prepare","level":"info","event_type":"artifact_prepare","message":"pipeline event telemetry initialized during release replay"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > output/pipeline_events.jsonl
          fi
          python scripts/validate_pages_artifact.py --refresh-contract output
      - name: Install pinned native validators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/native"
          gh release download "v${SING_BOX_VERSION}" --repo SagerNet/sing-box --pattern "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          install -m 0755 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$HOME/.local/bin/sing-box"
          gh release download "$XRAY_VERSION" --repo XTLS/Xray-core --pattern 'Xray-linux-64.zip'
          mkdir xray && unzip -q Xray-linux-64.zip -d xray
          install -m 0755 xray/xray "$HOME/.local/bin/xray"
          asset=$(gh api "repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" --jq '.assets[].name | select(test("^mihomo-linux-amd64-v[0-9].*\\.gz$"))' | head -1)
          test -n "$asset"
          gh release download "$MIHOMO_VERSION" --repo MetaCubeX/mihomo --pattern "$asset"
          gzip -dc "$asset" > "$HOME/.local/bin/mihomo"
          chmod 0755 "$HOME/.local/bin/mihomo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mandatory native validation
        run: |
          set -euo pipefail
          mkdir -p pipeline-evidence
          python scripts/native_client_checks.py output --report pipeline-evidence/native_client_check_report.json
      - name: Fail-closed release gate
        run: |
          set -euo pipefail
          python scripts/release_gate.py output \
            --native-report pipeline-evidence/native_client_check_report.json \
            --min-source-coverage "$MIN_SOURCE_COVERAGE" \
            --promote
      - name: Validate final release output contract
        run: |
          set -euo pipefail
          python scripts/validate_pages_artifact.py \
            --native-client-check \
            --native-report-file pipeline-evidence/native_client_check_report.json \
            output
      - name: Generate evidence
        run: |
          set -euo pipefail
          python scripts/generate_evidence_bundle.py \
            --output-dir output \
            --evidence-dir pipeline-evidence \
            --native-report pipeline-evidence/native_client_check_report.json
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-30443136853-${{ github.run_id }}
          path: |
            output/
            pipeline-evidence/
            pipeline_batch_*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
