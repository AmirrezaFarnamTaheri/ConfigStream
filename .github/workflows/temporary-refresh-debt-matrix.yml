name: Temporary refresh debt matrix

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

concurrency:
  group: temporary-refresh-debt-matrix-pr593
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Regenerate debt matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          git diff --check
          if git diff --quiet -- docs/DEBT_MATRIX.md docs/debt_matrix.json; then
            echo "Debt matrix already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json
          git commit -m "docs: refresh debt matrix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
