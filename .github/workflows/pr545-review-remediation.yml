name: PR 545 Review Remediation

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  remediate:
    if: >-
      github.repository == 'AmirrezaFarnamTaheri/ConfigStream' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 545 &&
      github.event.comment.user.login == 'AmirrezaFarnamTaheri' &&
      github.event.comment.body == '/remediate-pr545-reviews-20260807-b1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/post-audit-remediation-v3.1.0
          fetch-depth: 0
          persist-credentials: true

      - name: Apply review remediations
        shell: bash
        env:
          EXPECTED_HEAD: 6bdfe930f00f3287f7e098693bbe20eb7c81d2dd
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          python - <<'PY'
