            --json databaseId,url,status,headSha > /tmp/dispatched-run.json
          cat /tmp/dispatched-run.json

      - name: Report completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url=$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/dispatched-run.json').read_text(encoding='utf-8'))
          print(rows[0]['url'] if rows else 'workflow dispatch accepted')
          PY
          )
          gh pr comment 545 --body "Review remediation completed and targeted tests passed. Full Config's Stream workflow dispatched on the PR branch: ${run_url}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 545 --body "Review remediation workflow failed. Inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
