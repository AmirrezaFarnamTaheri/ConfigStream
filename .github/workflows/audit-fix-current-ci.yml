name: Apply current acceptance fixes

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: read

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - name: Show exact exception-boundary ratchet delta
        run: python scripts/validate_exception_boundaries.py
