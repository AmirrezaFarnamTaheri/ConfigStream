name: Regenerate Debt Matrix Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Regenerate canonical debt matrix artifacts and push once
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/generate_debt_matrix.py --check
          git add -- docs/DEBT_MATRIX.md docs/debt_matrix.json
          if git diff --cached --quiet; then
            echo "Debt matrix artifacts are already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate debt matrix after formatting"
          git push origin "HEAD:${BRANCH}"
