name: PR Autofix Source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore and format remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/pr-autofix.yml').read_text(encoding='utf-8')
          payloads = re.findall(r"printf '%s' '([^']+)' \| base64 --decode \| gzip -d > ([^\n]+)", workflow)
          if len(payloads) != 3:
              raise SystemExit(f'expected 3 embedded payloads, found {len(payloads)}')
          for encoded, target in payloads:
              destination = Path(target.strip())
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/autofix_patch.py
          git checkout -- .github/workflows/ci.yml
          python -m pip install black
          python -m black --target-version py310 \
            scripts/native_client_checks.py \
            scripts/aggregate_shard_health.py \
            scripts/prepare_release_assets.py \
            scripts/shard_sources.py \
            scripts/normalize_legacy_profiles.py \
            scripts/release_gate.py \
            tests/unit/test_release_remediation.py \
            src/configstream/testers/python.py \
            scripts/finalize_release_outputs.py
          python -m black --check --fast --target-version py310 \
            scripts/native_client_checks.py \
            scripts/aggregate_shard_health.py \
            scripts/prepare_release_assets.py \
            scripts/shard_sources.py \
            scripts/normalize_legacy_profiles.py \
            scripts/release_gate.py \
            tests/unit/test_release_remediation.py \
            src/configstream/testers/python.py \
            scripts/finalize_release_outputs.py
          python -m py_compile \
            scripts/native_client_checks.py \
            scripts/aggregate_shard_health.py \
            scripts/prepare_release_assets.py \
            scripts/shard_sources.py \
            scripts/normalize_legacy_profiles.py \
            scripts/release_gate.py \
            tests/unit/test_release_remediation.py \
            src/configstream/testers/python.py \
            scripts/finalize_release_outputs.py
      - name: Commit source remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/native_client_checks.py \
            scripts/aggregate_shard_health.py \
            scripts/prepare_release_assets.py \
            scripts/shard_sources.py \
            scripts/normalize_legacy_profiles.py \
            scripts/release_gate.py \
            tests/unit/test_release_remediation.py \
            src/configstream/testers/python.py \
            scripts/finalize_release_outputs.py
          git diff --cached --check
          git commit -m 'fix: format remediation scripts and resolve mypy errors'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
