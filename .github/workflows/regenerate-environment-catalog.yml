name: Regenerate Environment Catalog

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0
    paths:
      - .github/workflows/regenerate-environment-catalog.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Regenerate catalog
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          git diff --check
      - name: Commit generated evidence
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/generated/environment-variables.json docs/generated/environment-variables.md; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md
          git commit -m "chore: regenerate environment catalog"
          git push origin HEAD:feat/post-audit-remediation-v3.1.0
