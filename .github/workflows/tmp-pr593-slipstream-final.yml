name: PR593 one-shot Slipstream startup fix

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-slipstream-final.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - name: Patch, verify, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/fix-run-34268254683-audit
          python - <<'PY'
          from pathlib import Path

          path = Path("src/configstream/tools/dns_scanner/python/dnsscanner_tui.py")
          text = path.read_text(encoding="utf-8")

          old = '''    def get_platform_key(self) -> str:\n        """Return an architecture-specific key present in the pinned manifest."""\n        key = f"{self.system}-{self.machine}"\n        if key not in self.ARTIFACTS:\n            raise RuntimeError(f"Unsupported platform: {self.system} {self.machine}")\n        return key\n'''
          new = '''    def is_supported(self) -> bool:\n        """Return whether this platform has a pinned Slipstream artifact."""\n        return f"{self.system}-{self.machine}" in self.ARTIFACTS\n\n    def get_platform_key(self) -> str:\n        """Return an architecture-specific key present in the pinned manifest."""\n        key = f"{self.system}-{self.machine}"\n        if key not in self.ARTIFACTS:\n            raise RuntimeError(f"Unsupported platform: {self.system} {self.machine}")\n        return key\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Slipstream platform-key anchor missing")
              text = text.replace(old, new, 1)

          old = '''        self.slipstream_manager = SlipstreamManager()\n        self.slipstream_path = str(self.slipstream_manager.get_executable_path())\n        self.slipstream_domain = ""\n'''
          new = '''        self.slipstream_manager = SlipstreamManager()\n        self.slipstream_path = ""\n        self.slipstream_domain = ""\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Slipstream constructor anchor missing")
              text = text.replace(old, new, 1)

          old = '''        # Check if slipstream needs to be downloaded\n        if self.test_slipstream and not self.slipstream_manager.is_installed():\n            self.notify(\n                "Slipstream not found. Starting download...", severity="information"\n            )\n            self.run_worker(self._download_and_start_scan(), exclusive=True)\n            return\n'''
          new = '''        # Resolve the optional Slipstream dependency only when requested.\n        if self.test_slipstream:\n            if not self.slipstream_manager.is_supported():\n                self.notify(\n                    "Slipstream is not supported on "\n                    f"{self.slipstream_manager.system} {self.slipstream_manager.machine}.",\n                    severity="error",\n                )\n                return\n            if self.slipstream_manager.is_installed():\n                self.slipstream_path = str(\n                    self.slipstream_manager.get_executable_path()\n                )\n            else:\n                self.notify(\n                    "Slipstream not found. Starting download...",\n                    severity="information",\n                )\n                self.run_worker(self._download_and_start_scan(), exclusive=True)\n                return\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Slipstream scan-start anchor missing")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_dnsscanner_tui_lifecycle.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_tui_initialization_defers_unsupported_slipstream("
          if marker not in tests:
              tests += '''\n\n\ndef test_tui_initialization_defers_unsupported_slipstream(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from configstream.tools.dns_scanner.python import dnsscanner_tui\n\n    monkeypatch.setattr(dnsscanner_tui.platform, "system", lambda: "Linux")\n    monkeypatch.setattr(dnsscanner_tui.platform, "machine", lambda: "armv7l")\n\n    app = dnsscanner_tui.DNSScannerTUI()\n\n    assert app.slipstream_path == ""\n    assert app.slipstream_manager.is_supported() is False\n    assert app.slipstream_manager.get_download_url() is None\n    with pytest.raises(RuntimeError, match="Unsupported platform"):\n        app.slipstream_manager.get_executable_path()\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY

          python -m py_compile \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py \
            tests/unit/test_dnsscanner_tui_lifecycle.py
          git diff --check

          rm -f .github/workflows/tmp-pr593-slipstream-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dns): defer optional Slipstream platform resolution"
          git push origin HEAD:codex/fix-run-34268254683-audit
