name: Codex Finalize PR 593

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install exact formatter
        run: python -m pip install --disable-pip-version-check black==26.5.1
      - name: Format CI-blocking files
        run: python -m black --fast --target-version py310 scripts/dynamic_reshard.py src/configstream/backup.py
      - name: Regenerate governed debt artifacts
        run: python scripts/generate_debt_matrix.py
      - name: Verify formatter and generated artifacts
        run: |
          python -m black --check --fast --target-version py310 scripts/dynamic_reshard.py src/configstream/backup.py
          python scripts/generate_debt_matrix.py --check
      - name: Commit exact generated result
        shell: bash
        run: |
          git add scripts/dynamic_reshard.py src/configstream/backup.py docs/DEBT_MATRIX.md docs/debt_matrix.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: finalize PR 593 formatting and debt references"
          git push origin HEAD:codex/fix-run-34268254683-audit
