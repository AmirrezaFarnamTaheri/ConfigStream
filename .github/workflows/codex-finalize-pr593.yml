name: Codex Finalize PR 593

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Harden public event persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/configstream/event_stream.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "import queue\nimport threading\n",
                  "import queue\nimport re\nimport threading\n",
              ),
              (
                  'EVENT_LOG_FILENAME = "pipeline_events.jsonl"\nlogger = logging.getLogger(__name__)\n',
                  'EVENT_LOG_FILENAME = "pipeline_events.jsonl"\n'
                  '_PUBLIC_URI_RE = re.compile(r"\\b[a-zA-Z][a-zA-Z0-9+.-]*://\\S+")\n'
                  'logger = logging.getLogger(__name__)\n',
              ),
              (
                  "    @staticmethod\n    def _event_record(event_type: str, message: str) -> Dict[str, str]:\n",
                  "    @staticmethod\n"
                  "    def _public_message(event_type: str, message: str) -> str:\n"
                  "        if event_type == \"fetch_blocked\":\n"
                  "            return \"Source blocked by anomaly policy.\"\n"
                  "        return _PUBLIC_URI_RE.sub(\"[source]\", message)\n\n"
                  "    @staticmethod\n"
                  "    def _event_record(event_type: str, message: str) -> Dict[str, str]:\n",
              ),
              (
                  "        persisted = self._append_event_record(\n"
                  "            self._event_record(event_type, safe_message)\n"
                  "        )\n",
                  "        public_message = self._public_message(event_type, safe_message)\n"
                  "        persisted = self._append_event_record(\n"
                  "            self._event_record(event_type, public_message)\n"
                  "        )\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected event_stream anchor missing: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_public_event_redaction.py")
          test_path.write_text(
              '''# SPDX-License-Identifier: AGPL-3.0-or-later\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nimport pytest\n\nfrom configstream.event_stream import EventStream\n\n\n@pytest.mark.asyncio\nasync def test_public_event_persistence_redacts_source_and_block_reason(\n    tmp_path: Path,\n) -> None:\n    stream = EventStream(tmp_path)\n    source = "https://provider.example/subscription?token=private-value"\n    stream.emit("fetch_success", f"Fetched 4 proxies from {source} (Fetch: 1.2s)")\n    stream.emit("fetch_blocked", f"Blocked source {source}: detector raw detail")\n    await stream.aclose()\n\n    payload = (tmp_path / "pipeline_events.jsonl").read_text(encoding="utf-8")\n    assert "provider.example" not in payload\n    assert "private-value" not in payload\n    assert "detector raw detail" not in payload\n\n    records = [json.loads(line) for line in payload.splitlines()]\n    assert records[0]["message"] == "Fetched 4 proxies from [source] (Fetch: 1.2s)"\n    assert records[1]["message"] == "Source blocked by anomaly policy."\n''',
              encoding="utf-8",
          )
          PY
      - name: Format changed Python files
        run: python -m black --fast --target-version py310 src/configstream/event_stream.py tests/unit/test_public_event_redaction.py
      - name: Verify focused regression
        run: python -m pytest -q tests/unit/test_public_event_redaction.py tests/unit/test_event_stream.py tests/unit/test_publication_policy.py
      - name: Verify formatter
        run: python -m black --check --fast --target-version py310 src/configstream/event_stream.py tests/unit/test_public_event_redaction.py
      - name: Commit public-event hardening
        shell: bash
        run: |
          git add src/configstream/event_stream.py tests/unit/test_public_event_redaction.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: redact source details from public pipeline events"
          git push origin HEAD:codex/fix-run-34268254683-audit
