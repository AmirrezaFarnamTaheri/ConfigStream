name: PR531 CI Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr531-ci-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 531
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: unify-all-prs
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply focused compatibility and typing repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_or_verify(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
              elif new not in text:
                  raise SystemExit(f"expected repair pattern missing in {path}")

          replace_or_verify(
              "src/configstream/quality/storage.py",
              (
                  "            with src:\n"
                  "                source_rows = src.execute(\"SELECT * FROM source_stats\")\n"
                  "                try:\n"
                  "                    run_rows = src.execute(\"SELECT * FROM source_runs\")\n"
                  "                except sqlite3.OperationalError:\n"
                  "                    run_rows = []\n"
                  "                try:\n"
                  "                    history_rows = src.execute(\"SELECT * FROM proxy_history\")\n"
                  "                except sqlite3.OperationalError:\n"
                  "                    history_rows = []\n"
              ),
              (
                  "            with src:\n"
                  "                source_rows: list[sqlite3.Row] = src.execute(\n"
                  "                    \"SELECT * FROM source_stats\"\n"
                  "                ).fetchall()\n"
                  "                try:\n"
                  "                    run_rows: list[sqlite3.Row] = src.execute(\n"
                  "                        \"SELECT * FROM source_runs\"\n"
                  "                    ).fetchall()\n"
                  "                except sqlite3.OperationalError:\n"
                  "                    run_rows = []\n"
                  "                try:\n"
                  "                    history_rows: list[sqlite3.Row] = src.execute(\n"
                  "                        \"SELECT * FROM proxy_history\"\n"
                  "                    ).fetchall()\n"
                  "                except sqlite3.OperationalError:\n"
                  "                    history_rows = []\n"
              ),
          )

          replace_or_verify(
              "src/configstream/server/routes/lab.py",
              (
                  "    try:\n"
                  "        async with asyncio.timeout(settings.LAB_TEST_TIMEOUT_SECONDS):\n"
                  "            clean_config = await _validate_and_build_lab_config(config)\n"
                  "    except TimeoutError as exc:\n"
              ),
              (
                  "    try:\n"
                  "        clean_config = await asyncio.wait_for(\n"
                  "            _validate_and_build_lab_config(config),\n"
                  "            timeout=settings.LAB_TEST_TIMEOUT_SECONDS,\n"
                  "        )\n"
                  "    except asyncio.TimeoutError as exc:\n"
              ),
          )
          PY
      - name: Format repaired Python files
        run: |
          python -m black \
            scripts/release_gate.py \
            src/configstream/quality/storage.py \
            src/configstream/server/routes/lab.py \
            tests/unit/test_client_format_contracts.py
      - name: Validate typing
        run: python -m mypy .
      - name: Validate Python 3.10 regressions
        run: |
          pytest -q \
            tests/unit/test_server.py \
            tests/unit/test_client_format_contracts.py \
            tests/unit/quality/test_quality_components.py
      - name: Publish validated source repairs
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/release_gate.py \
            src/configstream/quality/storage.py \
            src/configstream/server/routes/lab.py \
            tests/unit/test_client_format_contracts.py; then
            echo 'No source repair changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/release_gate.py \
            src/configstream/quality/storage.py \
            src/configstream/server/routes/lab.py \
            tests/unit/test_client_format_contracts.py
          git commit -m 'fix: restore Python 3.10 and typing CI'
          git push origin HEAD:unify-all-prs
