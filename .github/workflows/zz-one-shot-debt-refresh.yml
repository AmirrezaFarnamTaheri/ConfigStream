name: One-shot debt evidence refresh

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-runtime-release-audit

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/fix-runtime-release-audit
          fetch-depth: 0

      - name: Regenerate debt evidence
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/generate_triage_report.py

      - name: Commit generated evidence only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/debt_matrix.json docs/DEBT_MATRIX.md TRIAGE_REPORT.md
          if git diff --cached --quiet; then
            echo 'Generated debt evidence already current.'
            exit 0
          fi
          git commit -m 'chore: refresh debt evidence'
          git push origin HEAD:codex/fix-runtime-release-audit
