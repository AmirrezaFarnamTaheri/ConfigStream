name: PR593 final one-shot review fixes

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

concurrency:
  group: pr593-final-one-shot-review-fixes
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Apply, validate, commit, and self-remove
        shell: bash
        run: |
          set +e
          rc=0
          python -m pip install -r requirements-dev.txt >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m pip install -e . --no-deps >/dev/null || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python scripts/tmp_pr593_final_review_fixes.py || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python -m black --fast --target-version py310 \
              src/configstream/database_maintenance.py \
              src/configstream/anomaly.py \
              src/configstream/backup.py \
              src/configstream/quality/storage.py \
              src/configstream/tools/dns_scanner/python/dnsscanner_tui.py \
              tests/unit/test_database_maintenance.py || rc=$?
          fi

          # Temporary branch-write machinery must never survive into the validated tree.
          git rm -f .github/workflows/tmp-pr593-final-review-fixes.yml \
            scripts/tmp_pr593_final_review_fixes.py >/dev/null 2>&1 || true

          if [ "$rc" -eq 0 ]; then
            python scripts/generate_debt_matrix.py || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python scripts/generate_environment_catalog.py || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python scripts/generate_triage_report.py || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python scripts/validate_workflows.py || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python -m py_compile \
              src/configstream/database_maintenance.py \
              src/configstream/anomaly.py \
              src/configstream/backup.py \
              src/configstream/quality/storage.py \
              src/configstream/tools/dns_scanner/python/dnsscanner_tui.py || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            pytest -q \
              tests/unit/test_database_maintenance.py \
              tests/unit/test_backup.py \
              tests/unit/test_backup_extended.py \
              tests/unit/test_anomaly_extended.py \
              tests/unit/quality/test_quality_components.py \
              tests/unit/test_dnsscanner_tui_lifecycle.py \
              tests/unit/test_main_artifact_semantics.py \
              tests/unit/test_validate_workflow_shells.py \
              --disable-warnings --maxfail=1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python scripts/verify_repository.py --profile static || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check || rc=$?
          fi

          if [ "$rc" -ne 0 ]; then
            echo "Validation failed with exit code $rc; reverting functional edits and removing helpers only."
            git reset --hard "$GITHUB_SHA"
            git rm -f .github/workflows/tmp-pr593-final-review-fixes.yml \
              scripts/tmp_pr593_final_review_fixes.py
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$rc" -eq 0 ]; then
            git commit -m "fix(review): close remaining functional PR593 findings"
          else
            git commit -m "chore(ci): remove failed PR593 one-shot helpers"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit "$rc"
