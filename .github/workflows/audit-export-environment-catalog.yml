name: Export refreshed environment catalog

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate catalog
        run: python scripts/generate_environment_catalog.py
      - name: Upload catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refreshed-environment-catalog
          path: |
            docs/generated/environment-variables.json
            docs/generated/environment-variables.md
          if-no-files-found: error
          retention-days: 1
