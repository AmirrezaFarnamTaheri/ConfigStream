name: Commit refreshed environment catalog

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - name: Regenerate authoritative catalog
        run: python scripts/generate_environment_catalog.py
      - name: Commit generated evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(docs): refresh environment catalog'
          git push origin HEAD:codex/fix-run-34268254683-audit
