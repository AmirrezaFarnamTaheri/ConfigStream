name: Refresh dependency inventory after detour

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install generator dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Regenerate and verify dependency inventory
        run: |
          set -euo pipefail
          python scripts/generate_dependency_inventory.py
          python scripts/generate_dependency_inventory.py --check
      - name: Commit generated inventory
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/dependency-inventory.json docs/generated/dependency-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(generated): refresh dependency inventory'
          git push origin HEAD:codex/fix-run-34268254683-audit
