name: Apply bounded shard state merge fixes

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Patch bounded transactional shard merges
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          quality = Path('src/configstream/quality/storage.py')
          q = quality.read_text()
          q = q.replace(
              'SCHEMA_VERSION = 4\n',
              'SCHEMA_VERSION = 4\nMERGE_FETCH_BATCH_SIZE = 1000\nMAX_MERGE_ROWS_PER_TABLE = 500_000\n',
              1,
          )
          start = q.index('    def merge_from(self, other_db_path: Path) -> None:\n')
          replacement = '''    def merge_from(self, other_db_path: Path) -> None:\n        \"\"\"Idempotently merge a shard database without unbounded materialization.\"\"\"\n\n        other = Path(other_db_path)\n        if not other.exists():\n            return\n        src: Optional[sqlite3.Connection] = None\n\n        def bounded_rows(\n            connection: sqlite3.Connection, query: str, table: str, *, optional: bool = False\n        ) -> Iterator[sqlite3.Row]:\n            try:\n                cursor = connection.execute(query)\n            except sqlite3.OperationalError:\n                if optional:\n                    return\n                raise\n            seen = 0\n            try:\n                while True:\n                    batch = cursor.fetchmany(MERGE_FETCH_BATCH_SIZE)\n                    if not batch:\n                        break\n                    seen += len(batch)\n                    if seen > MAX_MERGE_ROWS_PER_TABLE:\n                        raise QualityStorageError(\n                            f\"refusing to merge {table}: row limit exceeded\"\n                        )\n                    yield from batch\n            finally:\n                cursor.close()\n\n        try:\n            src = sqlite3.connect(other, timeout=20)\n            src.row_factory = sqlite3.Row\n            src.execute(\"PRAGMA query_only=ON\")\n\n            with self._transaction() as dst:\n                for row in bounded_rows(\n                    src, \"SELECT * FROM source_stats\", \"source_stats\"\n                ):\n                    existing = dst.execute(\n                        \"SELECT state_sequence, last_checked FROM source_stats WHERE url = ?\",\n                        (row[\"url\"],),\n                    ).fetchone()\n                    source_sequence = (\n                        int(row[\"state_sequence\"] or 0)\n                        if \"state_sequence\" in row.keys()\n                        else 0\n                    )\n                    source_checked = int(row[\"last_checked\"] or 0)\n                    if existing:\n                        destination_order = (int(existing[0] or 0), int(existing[1] or 0))\n                        if (source_sequence, source_checked) <= destination_order:\n                            continue\n                    dst.execute(\n                        \"\"\"\n                        INSERT INTO source_stats(\n                            url, total_fetched, total_working, consecutive_failures,\n                            last_checked, reliability_score, diversity_score,\n                            trust_score, status, state_sequence\n                        ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n                        ON CONFLICT(url) DO UPDATE SET\n                            total_fetched=excluded.total_fetched,\n                            total_working=excluded.total_working,\n                            consecutive_failures=excluded.consecutive_failures,\n                            last_checked=excluded.last_checked,\n                            reliability_score=excluded.reliability_score,\n                            diversity_score=excluded.diversity_score,\n                            trust_score=excluded.trust_score,\n                            status=excluded.status,\n                            state_sequence=excluded.state_sequence\n                        \"\"\",\n                        (\n                            row[\"url\"], row[\"total_fetched\"], row[\"total_working\"],\n                            row[\"consecutive_failures\"], row[\"last_checked\"],\n                            row[\"reliability_score\"], row[\"diversity_score\"],\n                            row[\"trust_score\"] if \"trust_score\" in row.keys() else 50.0,\n                            row[\"status\"] if \"status\" in row.keys() else \"active\",\n                            source_sequence,\n                        ),\n                    )\n\n                for row in bounded_rows(\n                    src, \"SELECT * FROM source_runs\", \"source_runs\", optional=True\n                ):\n                    data = dict(row)\n                    run_url = str(data.get(\"url\") or \"\")\n                    if not run_url:\n                        continue\n                    dst.execute(\n                        \"INSERT INTO source_stats(url) VALUES (?) ON CONFLICT(url) DO NOTHING\",\n                        (run_url,),\n                    )\n                    run_key = data.get(\"run_key\") or self._run_key(run_url, data)\n                    dst.execute(\n                        \"\"\"\n                        INSERT OR IGNORE INTO source_runs(\n                            run_key, url, timestamp, duration_ms, fetched_count,\n                            working_count, geoip_json, failure_modes_json, batch_source\n                        ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)\n                        \"\"\",\n                        (\n                            run_key, run_url, data.get(\"timestamp\"),\n                            data.get(\"duration_ms\", 0.0), data.get(\"fetched_count\", 0),\n                            data.get(\"working_count\", 0), data.get(\"geoip_json\", \"{}\"),\n                            data.get(\"failure_modes_json\", \"{}\"), data.get(\"batch_source\"),\n                        ),\n                    )\n\n                for row in bounded_rows(\n                    src, \"SELECT * FROM proxy_history\", \"proxy_history\", optional=True\n                ):\n                    data = dict(row)\n                    event_key = data.get(\"event_key\") or hashlib.sha256(\n                        json.dumps(\n                            {\n                                \"proxy_id\": data.get(\"proxy_id\"),\n                                \"timestamp\": data.get(\"timestamp\"),\n                                \"session_id\": data.get(\"session_id\"),\n                                \"is_working\": data.get(\"is_working\"),\n                                \"failure_reason\": data.get(\"failure_reason\"),\n                            },\n                            sort_keys=True, separators=(\",\", \":\"),\n                        ).encode(\"utf-8\")\n                    ).hexdigest()\n                    dst.execute(\n                        \"\"\"\n                        INSERT OR IGNORE INTO proxy_history(\n                            proxy_id, timestamp, is_working, latency, country_code,\n                            session_id, failure_reason, event_key\n                        ) VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n                        \"\"\",\n                        (\n                            data.get(\"proxy_id\"), data.get(\"timestamp\"),\n                            data.get(\"is_working\"), data.get(\"latency\"),\n                            data.get(\"country_code\"), data.get(\"session_id\"),\n                            data.get(\"failure_reason\"), event_key,\n                        ),\n                    )\n            logger.info(\"Idempotently merged source quality state from %s\", other)\n        except Exception as exc:\n            if isinstance(exc, QualityStorageError):\n                raise\n            raise QualityStorageError(\n                f\"failed to merge source quality DB {other}: {_safe_message(exc)}\"\n            ) from exc\n        finally:\n            if src is not None:\n                try:\n                    src.close()\n                except sqlite3.Error:\n                    logger.debug(\"Failed to close merged source database\", exc_info=True)\n'''
          quality.write_text(q[:start] + replacement + '\n')

          anomaly = Path('src/configstream/anomaly.py')
          a = anomaly.read_text()
          a = a.replace(
              'logger = logging.getLogger(__name__)\n',
              'logger = logging.getLogger(__name__)\n\nMERGE_FETCH_BATCH_SIZE = 1000\nMAX_MERGE_HISTORY_ROWS = 500_000\n',
              1,
          )
          astart = a.index('    def merge_from(self, other_db_path: Path):\n')
          aend = a.index('    def close(self) -> None:\n', astart)
          amerge = '''    def merge_from(self, other_db_path: Path):\n        \"\"\"Merge anomaly history transactionally with bounded memory and rows.\"\"\"\n        if not other_db_path.exists():\n            return\n\n        src = None\n        try:\n            with self._lock:\n                if self._conn is None:\n                    self._init_db()\n                dst = self._conn\n                if dst is None:\n                    logger.error(\"Cannot merge anomaly DB: destination is unavailable\")\n                    return\n\n                src = sqlite3.connect(other_db_path)\n                src.execute(\"PRAGMA query_only=ON\")\n                cursor = src.execute(\"SELECT url, count, timestamp FROM history\")\n                seen = 0\n                dst.execute(\"BEGIN IMMEDIATE\")\n                try:\n                    while True:\n                        batch = cursor.fetchmany(MERGE_FETCH_BATCH_SIZE)\n                        if not batch:\n                            break\n                        seen += len(batch)\n                        if seen > MAX_MERGE_HISTORY_ROWS:\n                            raise ValueError(\"anomaly merge row limit exceeded\")\n                        for url, count, ts in batch:\n                            exists = dst.execute(\n                                \"SELECT 1 FROM history WHERE url = ? AND timestamp = ?\",\n                                (url, ts),\n                            ).fetchone()\n                            if not exists:\n                                dst.execute(\n                                    \"INSERT INTO history (url, count, timestamp) VALUES (?, ?, ?)\",\n                                    (url, count, ts),\n                                )\n                    dst.commit()\n                except Exception:\n                    dst.rollback()\n                    raise\n                finally:\n                    cursor.close()\n                logger.info(\"Merged anomaly stats from %s\", other_db_path)\n        except Exception as e:  # pylint: disable=broad-exception-caught\n            logger.error(\"Failed to merge anomaly DB %s: %s\", other_db_path, safe_log_text(e))\n        finally:\n            if src is not None:\n                try:\n                    src.close()\n                except sqlite3.Error:\n                    logger.debug(\"Failed to close anomaly merge source\", exc_info=True)\n\n'''
          anomaly.write_text(a[:astart] + amerge + a[aend:])

          qtests = Path('tests/unit/quality/test_quality_components.py')
          qt = qtests.read_text()
          qaddition = '''\n\ndef test_storage_merge_row_limit_rolls_back(tmp_path, monkeypatch):\n    destination = QualityStorage(tmp_path / "dest.db")\n    source = QualityStorage(tmp_path / "source.db")\n    for index in range(3):\n        source.upsert_stats(f"https://source-{index}.example", {"last_checked": index + 1})\n    source.close()\n    monkeypatch.setattr("configstream.quality.storage.MAX_MERGE_ROWS_PER_TABLE", 2)\n    with pytest.raises(QualityStorageError, match="row limit exceeded"):\n        destination.merge_from(tmp_path / "source.db")\n    count = destination.get_connection().execute("SELECT COUNT(*) FROM source_stats").fetchone()[0]\n    assert count == 0\n    destination.close()\n'''
          if 'test_storage_merge_row_limit_rolls_back' not in qt:\n              qt += qaddition\n          qtests.write_text(qt)\n\n          atests = Path('tests/unit/test_anomaly_extended.py')\n          at = atests.read_text()\n          aaddition = '''\n\ndef test_merge_row_limit_rolls_back(detector, tmp_path, monkeypatch):\n    other_db = tmp_path / "oversized-anomaly.db"\n    other = AnomalyDetector(other_db)\n    with patch("time.time", side_effect=[1000, 1001, 1002]):\n        other.record("http://one", 10)\n        other.record("http://two", 20)\n        other.record("http://three", 30)\n    other.close()\n    monkeypatch.setattr("configstream.anomaly.MAX_MERGE_HISTORY_ROWS", 2)\n    detector.merge_from(other_db)\n    with sqlite3.connect(detector.db_path) as conn:\n        assert conn.execute("SELECT COUNT(*) FROM history").fetchone()[0] == 0\n'''
          if 'test_merge_row_limit_rolls_back' not in at:\n              at += aaddition\n          atests.write_text(at)\n          PY
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/unit/quality/test_quality_components.py tests/unit/test_anomaly_extended.py --disable-warnings --maxfail=1
          python -m py_compile src/configstream/quality/storage.py src/configstream/anomaly.py
      - name: Commit permanent fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/quality/storage.py src/configstream/anomaly.py tests/unit/quality/test_quality_components.py tests/unit/test_anomaly_extended.py
          git commit -m 'fix(state): bound transactional shard database merges'
          git push origin HEAD:codex/fix-run-34268254683-audit
