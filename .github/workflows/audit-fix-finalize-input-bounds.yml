name: Apply finalizer input bounds

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Bound finalizer reads before parse and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('scripts/finalize_release_outputs.py')
          text = target.read_text()
          text = text.replace(
              'MAX_SELECTOR_MEMBERS = int(os.environ.get("MAX_SELECTOR_MEMBERS", "96"))\n',
              'MAX_SELECTOR_MEMBERS = int(os.environ.get("MAX_SELECTOR_MEMBERS", "96"))\nMAX_RELEASE_INPUT_BYTES = 64 * 1024 * 1024\n',
              1,
          )
          old_load = '''def _load(path: Path, default: Any = None) -> Any:\n    try:\n        return json.loads(path.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError):\n        return default\n'''
          new_load = '''def _checked_text(path: Path) -> str:\n    if path.stat().st_size > MAX_RELEASE_INPUT_BYTES:\n        raise ValueError(f"release input exceeds size limit: {path}")\n    return path.read_text(encoding="utf-8")\n\n\ndef _load(path: Path, default: Any = None) -> Any:\n    try:\n        return json.loads(_checked_text(path))\n    except (OSError, json.JSONDecodeError):\n        return default\n'''
          if old_load not in text:
              raise SystemExit('finalizer _load block not found')
          text = text.replace(old_load, new_load, 1)
          old_yaml = '        loaded = yaml.safe_load(resolved.read_text(encoding="utf-8")) or {}\n'
          new_yaml = '        loaded = yaml.safe_load(_checked_text(resolved)) or {}\n'
          if old_yaml not in text:
              raise SystemExit('mihomo read block not found')
          text = text.replace(old_yaml, new_yaml, 1)
          old_cleanup = '''        try:\n            text = path.read_text(encoding="utf-8")\n        except (OSError, UnicodeDecodeError):\n            continue\n'''
          new_cleanup = '''        try:\n            text = _checked_text(path)\n        except (OSError, UnicodeDecodeError):\n            continue\n'''
          if old_cleanup not in text:
              raise SystemExit('cleanup read block not found')
          target.write_text(text.replace(old_cleanup, new_cleanup, 1))

          tests = Path('tests/unit/test_finalize_release_output_bounds.py')
          tests.write_text('''# SPDX-License-Identifier: AGPL-3.0-or-later\nfrom pathlib import Path\n\nimport pytest\n\nfrom scripts import finalize_release_outputs\n\n\ndef test_load_rejects_oversized_release_input(tmp_path: Path, monkeypatch) -> None:\n    payload = tmp_path / "proxies.json"\n    payload.write_text("[]", encoding="utf-8")\n    monkeypatch.setattr(finalize_release_outputs, "MAX_RELEASE_INPUT_BYTES", 1)\n    with pytest.raises(ValueError, match="size limit"):\n        finalize_release_outputs._load(payload, [])\n\n\ndef test_cleanup_rejects_oversized_text_before_read(tmp_path: Path, monkeypatch) -> None:\n    payload = tmp_path / "huge.txt"\n    payload.write_text("abcd", encoding="utf-8")\n    monkeypatch.setattr(finalize_release_outputs, "MAX_RELEASE_INPUT_BYTES", 1)\n    with pytest.raises(ValueError, match="size limit"):\n        finalize_release_outputs._cleanup(tmp_path)\n''')
          PY
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/unit/test_finalize_release_output_bounds.py --disable-warnings --maxfail=1
          python -m py_compile scripts/finalize_release_outputs.py
      - name: Commit permanent fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/finalize_release_outputs.py tests/unit/test_finalize_release_output_bounds.py
          git commit -m 'fix(release): bound finalizer artifact reads'
          git push origin HEAD:codex/fix-run-34268254683-audit
