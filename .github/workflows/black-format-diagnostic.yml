name: Black Format Apply

on:
  push:
    branches:
      - fix/frontend-public-key-injection

permissions:
  contents: write

jobs:
  apply:
    name: Apply canonical Black output
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.actor == 'AmirrezaFarnamTaheri' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/frontend-public-key-injection
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/frontend-public-key-injection
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact CI formatter
        run: pip install 'black==26.5.1'
      - name: Format allowlisted modules
        run: |
          set -euo pipefail
          python -m black \
            --fast \
            --target-version py310 \
            scripts/resilient_stage.py \
            scripts/validate_workflows.py
          python -m black \
            --check \
            --fast \
            --target-version py310 \
            scripts/prepare_public_candidate.py \
            scripts/validate_bandit_suppressions.py \
            tests/unit/test_resilient_stage.py \
            tests/unit/test_validate_frontend_placeholders.py \
            tests/unit/test_validate_workflows_resilient.py \
            scripts/validate_workflows.py \
            scripts/resilient_stage.py
      - name: Commit exact formatted contents through GitHub API
        run: |
          set -euo pipefail
          update_file() {
            path="$1"
            current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha)
            encoded=$(base64 -w0 "$path")
            jq -n \
              --arg message "style: apply Black 26.5.1 to ${path}" \
              --arg content "$encoded" \
              --arg sha "$current_sha" \
              --arg branch "$TARGET_BRANCH" \
              '{message: $message, content: $content, sha: $sha, branch: $branch}' \
              | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input - >/dev/null
          }
          update_file scripts/resilient_stage.py
          update_file scripts/validate_workflows.py
