name: Apply artifact JSON and log bounds

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Bound cache, JSON, and log artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cache = Path('src/configstream/test_cache.py')
          c = cache.read_text()
          c = c.replace(
              'logger = logging.getLogger(__name__)\n',
              'logger = logging.getLogger(__name__)\n\nMAX_CACHE_FILE_BYTES = 64 * 1024 * 1024\n',
              1,
          )
          marker = 'def _find_project_root() -> Optional[Path]:\n'
          helper = '''def _load_cache_payload(path: Path) -> Any:\n    if path.stat().st_size > MAX_CACHE_FILE_BYTES:\n        raise ValueError("cache file exceeds the safety limit")\n    with path.open("r", encoding="utf-8") as handle:\n        return json.load(handle)\n\n\n'''
          if helper not in c:
              c = c.replace(marker, helper + marker, 1)
          c = c.replace(
              '            with self.db_path.open("r", encoding="utf-8") as handle:\n                payload = json.load(handle)\n',
              '            payload = _load_cache_payload(self.db_path)\n',
              1,
          )
          c = c.replace(
              '                with self.db_path.open("r", encoding="utf-8") as handle:\n                    disk_cache = self._normalize_cache(json.load(handle))\n',
              '                disk_cache = self._normalize_cache(_load_cache_payload(self.db_path))\n',
              1,
          )
          cache.write_text(c)

          merge = Path('scripts/merge_batches.py')
          m = merge.read_text()
          m = m.replace(
              'logger = logging.getLogger(__name__)\n',
              'logger = logging.getLogger(__name__)\n\nMAX_ARTIFACT_JSON_BYTES = 64 * 1024 * 1024\nMERGED_CACHE_MAX_ENTRIES = 100_000\nMAX_LOG_FILE_BYTES = 64 * 1024 * 1024\nMAX_CONSOLIDATED_LOG_BYTES = 256 * 1024 * 1024\nLOG_COPY_CHUNK_CHARS = 1024 * 1024\n',
              1,
          )
          old = '''def _load_json(path: Path) -> Optional[Any]:\n    try:\n        return json.loads(path.read_text(encoding="utf-8"))\n    except Exception as e:\n        logger.error(f"Failed to read JSON {path}: {e}")\n        return None\n'''
          new = '''def _load_json(path: Path) -> Optional[Any]:\n    try:\n        if path.stat().st_size > MAX_ARTIFACT_JSON_BYTES:\n            raise ValueError("artifact JSON exceeds the safety limit")\n        return json.loads(path.read_text(encoding="utf-8"))\n    except Exception as e:\n        logger.error(f"Failed to read JSON {path}: {e}")\n        return None\n'''
          if old not in m:
              raise SystemExit('merge _load_json block not found')
          m = m.replace(old, new, 1)
          needle = '''            merged_cache[str(phash)] = _merge_cache_entry(\n                merged_cache.get(str(phash)), incoming\n            )\n\n    out_path = Path(output_dir) / "data" / "test_cache.json"\n'''
          replacement = '''            merged_cache[str(phash)] = _merge_cache_entry(\n                merged_cache.get(str(phash)), incoming\n            )\n        if len(merged_cache) > MERGED_CACHE_MAX_ENTRIES:\n            newest = sorted(\n                merged_cache.items(),\n                key=lambda item: (float(item[1].get("tested_at", 0.0)), item[0]),\n                reverse=True,\n            )[:MERGED_CACHE_MAX_ENTRIES]\n            merged_cache = dict(newest)\n\n    out_path = Path(output_dir) / "data" / "test_cache.json"\n'''
          if needle not in m:
              raise SystemExit('cache merge insertion point not found')
          m = m.replace(needle, replacement, 1)
          old_logs = '''    consolidated = output_path / "consolidated_pipeline.log"\n    with consolidated.open("w", encoding="utf-8") as out_f:\n        for log_path in log_files:\n            out_f.write(f"===== {log_path.name} =====\\n")\n            out_f.write(log_path.read_text(encoding="utf-8", errors="ignore"))\n            out_f.write("\\n\\n")\n    logger.info(f"Wrote consolidated log to {consolidated}.")\n'''
          new_logs = '''    consolidated = output_path / "consolidated_pipeline.log"\n    total_written = 0\n    with consolidated.open("w", encoding="utf-8") as out_f:\n        for log_path in log_files:\n            if total_written >= MAX_CONSOLIDATED_LOG_BYTES:\n                logger.warning("Consolidated log byte limit reached; remaining logs skipped.")\n                break\n            header = f"===== {log_path.name} =====\\n"\n            out_f.write(header)\n            total_written += len(header.encode("utf-8"))\n            file_written = 0\n            with log_path.open("r", encoding="utf-8", errors="ignore") as source:\n                while file_written < MAX_LOG_FILE_BYTES and total_written < MAX_CONSOLIDATED_LOG_BYTES:\n                    chunk = source.read(LOG_COPY_CHUNK_CHARS)\n                    if not chunk:\n                        break\n                    encoded = chunk.encode("utf-8")\n                    remaining_file = MAX_LOG_FILE_BYTES - file_written\n                    remaining_total = MAX_CONSOLIDATED_LOG_BYTES - total_written\n                    allowed = min(len(encoded), remaining_file, remaining_total)\n                    if allowed < len(encoded):\n                        chunk = encoded[:allowed].decode("utf-8", errors="ignore")\n                        encoded = chunk.encode("utf-8")\n                    out_f.write(chunk)\n                    file_written += len(encoded)\n                    total_written += len(encoded)\n                    if allowed <= 0:\n                        break\n            out_f.write("\\n\\n")\n            total_written += 2\n    logger.info(f"Wrote consolidated log to {consolidated}.")\n'''
          if old_logs not in m:
              raise SystemExit('log merge block not found')
          merge.write_text(m.replace(old_logs, new_logs, 1))

          cache_tests = Path('tests/unit/test_cache_paths.py')
          ct = cache_tests.read_text()
          if 'test_oversized_cache_file_fails_empty' not in ct:
              ct += '''\n\ndef test_oversized_cache_file_fails_empty(tmp_path, monkeypatch):\n    cache_path = tmp_path / "cache.json"\n    cache_path.write_text('{"entry": {"tested_at": 1}}', encoding="utf-8")\n    monkeypatch.setattr("configstream.test_cache.MAX_CACHE_FILE_BYTES", 1)\n    cache = TestResultCache(cache_path, ttl_seconds=60)\n    assert cache._cache == {}\n'''
          cache_tests.write_text(ct)

          merge_tests = Path('tests/unit/test_merge_batches.py')
          mt = merge_tests.read_text()
          mt = mt.replace(
              'from scripts.merge_batches import _merge_metadata, _proxy_from_dict\n',
              'from scripts.merge_batches import _load_json, _merge_metadata, _proxy_from_dict\n',
              1,
          )
          if 'test_load_json_rejects_oversized_artifact' not in mt:
              mt += '''\n\ndef test_load_json_rejects_oversized_artifact(tmp_path: Path, monkeypatch) -> None:\n    path = tmp_path / "oversized.json"\n    path.write_text('{"ok": true}', encoding="utf-8")\n    monkeypatch.setattr("scripts.merge_batches.MAX_ARTIFACT_JSON_BYTES", 1)\n    assert _load_json(path) is None\n'''
          merge_tests.write_text(mt)
          PY
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/unit/test_cache_paths.py tests/unit/test_merge_batches.py --disable-warnings --maxfail=1
          python -m py_compile src/configstream/test_cache.py scripts/merge_batches.py
      - name: Commit permanent fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/test_cache.py scripts/merge_batches.py tests/unit/test_cache_paths.py tests/unit/test_merge_batches.py
          git commit -m 'fix(merge): bound JSON cache and log artifacts'
          git push origin HEAD:codex/fix-run-34268254683-audit
