name: PR583 Format Artifact

on:
  push:
    branches:
      - tmp/pr583-format-5007016

permissions:
  contents: write

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Apply exact type fix
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("src/configstream/pipeline/consumer.py"); s=p.read_text(); s=s.replace("            failure_modes: Dict[str, int] = {}", "            source_failure_modes: Dict[str, int] = {}", 1); s=s.replace("                failure_modes.update(metadata.get(\"drop_stats\", {}))", "                source_failure_modes.update(metadata.get(\"drop_stats\", {}))", 1); s=s.replace("            failure_modes[\"parse_empty\"] = (", "            source_failure_modes[\"parse_empty\"] = (", 1); s=s.replace("                failure_modes.get(\"parse_empty\", 0) + len(raw_lines)", "                source_failure_modes.get(\"parse_empty\", 0) + len(raw_lines)", 1); s=s.replace("                failure_modes=failure_modes,", "                failure_modes=source_failure_modes,", 1); p.write_text(s)'
          grep -q 'source_failure_modes: Dict\[str, int\]' src/configstream/pipeline/consumer.py
      - name: Format reported files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.5.1'
          python -m black \
            src/configstream/pipeline/consumer.py \
            src/configstream/source_run_aggregation.py \
            tests/unit/test_source_run_aggregation.py
          python -m black --check \
            src/configstream/pipeline/consumer.py \
            src/configstream/source_run_aggregation.py \
            tests/unit/test_source_run_aggregation.py
          python -m py_compile \
            src/configstream/pipeline/consumer.py \
            src/configstream/source_run_aggregation.py \
            tests/unit/test_source_run_aggregation.py
          git diff --check
          git diff -- \
            src/configstream/pipeline/consumer.py \
            src/configstream/source_run_aggregation.py \
            tests/unit/test_source_run_aggregation.py > pr583-format.patch
      - name: Create unreferenced Git blobs for explicit application
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > pr583-blob-shas.txt
          for path in \
            src/configstream/pipeline/consumer.py \
            src/configstream/source_run_aggregation.py \
            tests/unit/test_source_run_aggregation.py
          do
            encoded="$(base64 -w0 "$path")"
            payload="$(jq -nc --arg content "$encoded" '{content:$content,encoding:"base64"}')"
            response="$(curl -fsS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -d "$payload")"
            sha="$(jq -er '.sha' <<<"$response")"
            printf '%s %s\n' "$path" "$sha" >> pr583-blob-shas.txt
          done
      - name: Upload explicit patch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr583-format-artifact
          path: |
            pr583-format.patch
            pr583-blob-shas.txt
          if-no-files-found: error
          retention-days: 1
