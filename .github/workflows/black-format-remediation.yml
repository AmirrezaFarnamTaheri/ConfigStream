name: Black Format Remediation

on:
  push:
    branches: [agent/bound-source-test-work]
    paths:
      - '.github/workflows/black-format-remediation.yml'

permissions:
  contents: write

concurrency:
  group: black-format-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/bound-source-test-work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Format changed Python and regenerate line-sensitive evidence
        run: |
          set -euo pipefail
          FILES=(
            src/configstream/candidate_budget.py
            src/configstream/config.py
            src/configstream/pipeline/producer.py
            src/configstream/testers/go_tester/manager.py
            tests/unit/test_candidate_budget.py
            tests/unit/test_go_tester_runtime_budget.py
            tests/unit/test_configuration_documentation_contract.py
            tests/unit/test_go_tester_streaming.py
          )
          black "${FILES[@]}"
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/validate_function_size_budget.py --write
          black --check "${FILES[@]}"
      - name: Validate formatting-only result
        run: |
          set -euo pipefail
          python -m py_compile \
            src/configstream/candidate_budget.py \
            src/configstream/config.py \
            src/configstream/pipeline/producer.py \
            src/configstream/testers/go_tester/manager.py
          python -m pytest -q \
            tests/unit/test_candidate_budget.py \
            tests/unit/test_go_tester_runtime_budget.py \
            tests/unit/test_go_tester_streaming.py \
            tests/unit/test_configuration_documentation_contract.py
          python scripts/generate_environment_catalog.py --check
          python scripts/generate_debt_matrix.py --check
          python scripts/validate_function_size_budget.py
      - name: Commit formatting and regenerated evidence
        run: |
          set -euo pipefail
          git config user.name 'configstream-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/configstream/candidate_budget.py \
            src/configstream/config.py \
            src/configstream/pipeline/producer.py \
            src/configstream/testers/go_tester/manager.py \
            tests/unit/test_candidate_budget.py \
            tests/unit/test_go_tester_runtime_budget.py \
            tests/unit/test_configuration_documentation_contract.py \
            tests/unit/test_go_tester_streaming.py \
            docs/generated/environment-variables.json \
            docs/generated/environment-variables.md \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md \
            config/function-size-budget.json
          if git diff --cached --quiet; then
            echo 'No formatting delta to commit.'
            exit 0
          fi
          git commit -m 'style: format runtime remediation'
          git push origin HEAD:agent/bound-source-test-work
