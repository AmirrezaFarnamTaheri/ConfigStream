name: Retention Test Fixture Fix

on:
  push:
    branches:
      - fix/frontend-public-key-injection

permissions:
  contents: write

jobs:
  apply:
    name: Isolate numeric retention fixture
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.actor == 'AmirrezaFarnamTaheri' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/frontend-public-key-injection
      TARGET_PATH: tests/unit/test_validate_workflows.py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/frontend-public-key-injection
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Isolate the retention parser test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_validate_workflows.py")
          content = path.read_text(encoding="utf-8")
          start = content.index(
              "def test_validate_workflows_accepts_numeric_string_pipeline_retention("
          )
          end = content.index("\ndef ", start + 1)
          section = content[start:end]
          old = '''    monkeypatch.setattr(validate_workflows, "WORKFLOW_DIR", workflow_dir)

              assert validate_workflows.main() == 0
          '''
          new = '''    monkeypatch.setattr(validate_workflows, "WORKFLOW_DIR", workflow_dir)
              monkeypatch.setattr(
                  validate_workflows, "_main_resilient_contract", lambda data: []
              )

              assert validate_workflows.main() == 0
          '''
          if section.count(old) != 1:
              raise SystemExit("numeric retention fixture anchor was not found exactly once")
          path.write_text(content[:start] + section.replace(old, new) + content[end:], encoding="utf-8")
          PY
          pip install 'black==26.5.1'
          python -m black --fast --target-version py310 "$TARGET_PATH"
          python -m black --check --fast --target-version py310 "$TARGET_PATH"
          python -m py_compile "$TARGET_PATH"
      - name: Commit exact test fixture through GitHub API
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}" --jq .sha)
          encoded=$(base64 -w0 "$TARGET_PATH")
          jq -n \
            --arg message "test(ci): isolate numeric retention parsing" \
            --arg content "$encoded" \
            --arg sha "$current_sha" \
            --arg branch "$TARGET_BRANCH" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}" --input - >/dev/null
