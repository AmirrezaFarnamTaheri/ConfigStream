name: Fix Client Contract Regressions

on:
  push:
    branches:
      - fix/pages-artifact-contract-drift

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pages-artifact-contract-drift
          fetch-depth: 0
          persist-credentials: false
