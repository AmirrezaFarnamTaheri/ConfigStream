name: Fix Client Contract Regressions

on:
  push:
    branches:
      - fix/pages-artifact-contract-drift

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pages-artifact-contract-drift
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply focused regression fixes
        run: python scripts/fix_client_contract_regressions.py
      - name: Regenerate output documentation
        run: python scripts/generate_output_docs.py
      - name: Format changed Python files
        run: |
          python -m black \
            scripts/finalize_release_outputs.py \
            scripts/validate_output_matrix.py \
            src/configstream/output/singbox_contract.py \
            tests/unit/test_output.py \
            tests/unit/test_output_generators.py \
            tests/unit/test_validate_pages_artifact.py
      - name: Run focused validation
        run: |
          python -m py_compile \
            scripts/finalize_release_outputs.py \
            scripts/validate_output_matrix.py \
            src/configstream/output/singbox_contract.py \
            tests/unit/test_output.py \
            tests/unit/test_output_generators.py \
            tests/unit/test_validate_pages_artifact.py
          python scripts/validate_output_matrix.py
          python scripts/generate_output_docs.py --check
          pytest -q \
            tests/unit/test_validate_pages_artifact.py \
            tests/unit/test_validate_output_matrix.py \
            tests/unit/test_output_generators.py \
            tests/unit/test_output.py \
            --disable-warnings --maxfail=1
          git diff --check
      - name: Commit validated changes through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          expected_sha = os.environ["EXPECTED_SHA"]
          api_root = f"https://api.github.com/repos/{repository}"

          def request(method: str, path: str, payload: object | None = None) -> dict:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          current_ref = request("GET", f"/git/ref/heads/{encoded_branch}")
          current_sha = current_ref["object"]["sha"]
          if current_sha != expected_sha:
              raise SystemExit(
                  f"branch moved during repair: expected {expected_sha}, found {current_sha}"
              )

          status_lines = subprocess.check_output(
              ["git", "diff", "--name-status", "--no-renames", "HEAD"],
              text=True,
          ).splitlines()
          if not status_lines:
              raise SystemExit("repair produced no changes")

          parent = request("GET", f"/git/commits/{expected_sha}")
          entries: list[dict[str, object]] = []
          for line in status_lines:
              status, path = line.split("\t", 1)
              if status == "D":
                  entries.append(
                      {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  )
                  continue
              if status != "M":
                  raise SystemExit(f"unsupported working-tree status {status}: {path}")
              content = base64.b64encode(open(path, "rb").read()).decode("ascii")
              blob = request(
                  "POST", "/git/blobs", {"content": content, "encoding": "base64"}
              )
              entries.append(
                  {
                      "path": path,
                      "mode": "100644",
                      "type": "blob",
                      "sha": blob["sha"],
                  }
              )

          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": parent["tree"]["sha"], "tree": entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "fix(outputs): close client contract regressions",
                  "tree": tree["sha"],
                  "parents": [expected_sha],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{encoded_branch}",
              {"sha": commit["sha"], "force": False},
          )
          print(f"created validated commit {commit['sha']}")
          PY
