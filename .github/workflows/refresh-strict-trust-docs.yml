name: Refresh Strict Trust Docs

on:
  push:
    branches: [agent/fix-active-audit-items]
    paths:
      - '.github/workflows/refresh-strict-trust-docs.yml'

permissions:
  contents: write

concurrency:
  group: refresh-strict-trust-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Align security-sensitive documentation with runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/wiki/project/getting_started.md'): [
                  (
                      '''cd src/go/tester\ngo mod tidy\ngo build -o configstream-tester .\nmv configstream-tester ../../../\ncd ../../..''',
                      '''cd src/go/tester\ngo mod download\ngo build -trimpath -mod=readonly -o ../../../configstream-tester .\ncd ../../..\nsha256sum configstream-tester | awk '{print $1}' > configstream-tester.sha256\nchmod 0444 configstream-tester.sha256''',
                  ),
              ],
              Path('docs/wiki/project/09-contributing.md'): [
                  (
                      '''cd src/go/tester\ngo mod tidy\ngo build -o configstream-tester .\nmv configstream-tester ../../../''',
                      '''cd src/go/tester\ngo mod download\ngo build -trimpath -mod=readonly -o ../../../configstream-tester .\ncd ../../..\nsha256sum configstream-tester | awk '{print $1}' > configstream-tester.sha256\nchmod 0444 configstream-tester.sha256''',
                  ),
              ],
              Path('docs/wiki/project/10-troubleshooting.md'): [
                  (
                      '''*   **Fix:** Compile it: `cd src/go/tester && go build -o configstream-tester .`''',
                      '''*   **Fix:** Build the tester and create its strict-trust digest sidecar: `cd src/go/tester && go build -trimpath -mod=readonly -o ../../../configstream-tester . && cd ../../.. && sha256sum configstream-tester | awk '{print $1}' > configstream-tester.sha256 && chmod 0444 configstream-tester.sha256`. Production-mode startup intentionally rejects an unpinned tester.''',
                  ),
              ],
              Path('docs/wiki/project/02-architecture.md'): [
                  (
                      '''*   **Frontend Integration:** The `STEGO_KEY` (Fernet) is injected into the frontend JS at build time so the browser can decrypt the latest steganography image.''',
                      '''*   **Frontend Integration:** The symmetric `STEGO_KEY` is never published in frontend JavaScript. Output generation removes any legacy literal fail-closed; secret-assisted decryption must happen in a trusted/private client or authenticated channel rather than a public GitHub Pages bundle.''',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one documentation anchor, found {count}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit corrected docs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            docs/wiki/project/getting_started.md \
            docs/wiki/project/09-contributing.md \
            docs/wiki/project/10-troubleshooting.md \
            docs/wiki/project/02-architecture.md
          do
            sha="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha')"
            encoded="$(base64 -w0 "$path")"
            gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='docs(security): align strict trust and stego guidance' \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch="$GITHUB_REF_NAME" \
              >/dev/null
          done
