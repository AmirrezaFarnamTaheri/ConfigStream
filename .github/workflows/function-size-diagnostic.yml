name: Function Size Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/function-size-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Show exact function-size budget drift
        run: python scripts/validate_function_size_budget.py
