name: Codex Regenerate Debt Matrix

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Regenerate debt artifacts
        run: python scripts/generate_debt_matrix.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate debt matrix after PR consolidation"
          git push origin HEAD:codex/fix-run-34268254683-audit
