name: Python Format And Governance Refresh

on:
  push:
    branches: [agent/fix-singbox-wireguard-runtime-conformance]
    paths:
      - '.github/workflows/python-format-refresh.yml'

permissions:
  contents: write

concurrency:
  group: python-format-governance-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/fix-singbox-wireguard-runtime-conformance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Apply CI-equivalent Python formatting
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.5.1
          python -m black --fast --target-version py310             src/configstream/converters/singbox.py             src/configstream/testers/python.py             scripts/finalize_release_outputs.py             tests/test_python_tester.py             tests/unit/converters/test_singbox_converters.py             tests/unit/test_release_remediation.py
      - name: Regenerate and validate governed evidence
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/validate_exception_boundaries.py
          python scripts/validate_function_size_budget.py
          python scripts/generate_triage_report.py
          python scripts/generate_environment_catalog.py
      - name: Commit exact formatted and generated state
        shell: bash
        run: |
          set -euo pipefail
          git add             src/configstream/converters/singbox.py             src/configstream/testers/python.py             scripts/finalize_release_outputs.py             tests/test_python_tester.py             tests/unit/converters/test_singbox_converters.py             tests/unit/test_release_remediation.py             docs/debt_matrix.json docs/DEBT_MATRIX.md TRIAGE_REPORT.md             docs/generated/environment-variables.json docs/generated/environment-variables.md
          if git diff --cached --quiet; then
            echo "Formatting and governed evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Python formatter and refresh governance evidence"
          git push origin HEAD:agent/fix-singbox-wireguard-runtime-conformance
