name: Apply lifecycle fail-closed batch

on:
  push:
    branches: [agent/full-audit-remediation]
    paths:
      - ".github/workflows/apply-lifecycle-fail-closed.yml"

permissions:
  contents: write

concurrency:
  group: apply-lifecycle-fail-closed
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-audit-remediation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Apply fail-closed lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat > src/configstream/pipeline/outcomes.py <<'PY'
          # SPDX-License-Identifier: AGPL-3.0-or-later
          """Typed terminal outcomes for pipeline publication decisions."""

          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum
          from typing import Protocol


          class RunDisposition(str, Enum):
              SUCCESS = "success"
              FAILED_NO_INPUT = "failed_no_input"
              FAILED_NO_PARSED = "failed_no_parsed"
              FAILED_NO_TESTS = "failed_no_tests"
              FAILED_ZERO_WORKING = "failed_zero_working"
              FAILED_TIME_LIMIT = "failed_time_limit"


          @dataclass(frozen=True, slots=True)
          class PublicationDecision:
              disposition: RunDisposition
              publishable: bool
              reason: str


          class _RunStats(Protocol):
              total_configured_sources: int
              parsed: int
              tested: int
              working: int
              time_limited: bool


          def classify_run(stats: _RunStats) -> PublicationDecision:
              """Classify a completed run before any public output is generated."""
              if stats.total_configured_sources <= 0:
                  return PublicationDecision(
                      RunDisposition.FAILED_NO_INPUT,
                      False,
                      "No configured sources were available.",
                  )
              if stats.parsed <= 0:
                  return PublicationDecision(
                      RunDisposition.FAILED_NO_PARSED,
                      False,
                      "No candidates were parsed from configured sources.",
                  )
              if stats.tested <= 0:
                  return PublicationDecision(
                      RunDisposition.FAILED_NO_TESTS,
                      False,
                      "No candidates reached validation.",
                  )
              if stats.working <= 0:
                  return PublicationDecision(
                      RunDisposition.FAILED_ZERO_WORKING,
                      False,
                      "No candidates passed validation.",
                  )
              if stats.time_limited:
                  return PublicationDecision(
                      RunDisposition.FAILED_TIME_LIMIT,
                      False,
                      "The run ended under a time limit and is incomplete.",
                  )
              return PublicationDecision(
                  RunDisposition.SUCCESS,
                  True,
                  "All stable publication predicates passed.",
              )
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          producer = Path("src/configstream/pipeline/producer.py")
          text = producer.read_text(encoding="utf-8")
          pattern = re.compile(
              r"    except Exception as e:\n"
              r"        safe_error = SecurityValidator\.sanitize_log_message\(str\(e\)\)\n"
              r"        logger\.error\(f\"Producer failed: \{safe_error\}\"\)\n"
              r"    finally:\n"
              r"        # If absolutely nothing was provided, log a clear warning – this would\n"
              r"        # otherwise result in a silent zero-output run\.\n"
              r"        if not sources and not proxies:\n"
              r"            logger\.warning\(\n"
              r"                \"No sources or pre-supplied proxies provided - pipeline will produce zero results\"\n"
              r"            \)\n\n"
              r"        # Signal all consumers to exit\n"
              r"        for _ in range\(num_consumers\):\n"
              r"            await work_queue\.put\(None\)\n"
          )
          replacement = '''    except Exception as e:
              safe_error = SecurityValidator.sanitize_log_message(str(e))
              logger.error(f"Producer failed: {safe_error}")
              if event_stream:
                  event_stream.emit("critical", f"Producer failed: {safe_error}")
              raise
              
          else:
              if not sources and not proxies:
                  logger.warning(
                      "No sources or pre-supplied proxies provided - pipeline will produce zero results"
                  )
              # A normal sentinel represents successful end-of-stream only.
              for _ in range(num_consumers):
                  await work_queue.put(None)
          '''
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"producer fail-closed patch matched {count} blocks")
          producer.write_text(updated, encoding="utf-8")

          stats = Path("src/configstream/pipeline_stats.py")
          text = stats.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import Dict, Optional, Any\n",
              "from typing import Dict, Optional, Any\n\nfrom configstream.pipeline.outcomes import RunDisposition\n",
              1,
          )
          old = '''        output_files: dict,
                  error: Optional[str] = None,
              ):
                  self.success = success
                  self.stats = stats
                  self.output_files = output_files
                  self.error = error
          '''
          new = '''        output_files: dict,
                  error: Optional[str] = None,
                  disposition: RunDisposition | None = None,
              ):
                  self.success = success
                  self.stats = stats
                  self.output_files = output_files
                  self.error = error
                  self.disposition = disposition or (
                      RunDisposition.SUCCESS if success else None
                  )
          '''
          if old not in text:
              raise SystemExit("PipelineResult constructor block not found")
          stats.write_text(text.replace(old, new, 1), encoding="utf-8")

          core = Path("src/configstream/pipeline/core.py")
          text = core.read_text(encoding="utf-8")
          text = text.replace(
              "from configstream.pipeline_stats import PipelineStats, PipelineResult\n",
              "from configstream.pipeline_stats import PipelineStats, PipelineResult\n"
              "from configstream.pipeline.outcomes import RunDisposition, classify_run\n",
              1,
          )
          zero_block = re.compile(
              r"            _zero_working = stats\.tested > 0 and stats\.working == 0\n"
              r"            if _zero_working:\n"
              r"                logger\.warning\(\n"
              r"                    f\"All \{stats\.tested\} proxy tests failed across all sources\. \"\n"
              r"                    \"Output will still be generated with is_working=False so downstream \"\n"
              r"                    \"consumers can attempt their own connectivity checks\.\"\n"
              r"                \)\n\n"
          )
          text, count = zero_block.subn("", text)
          if count != 1:
              raise SystemExit(f"zero-working legacy block matched {count}")

          marker = '''            stats.duration = float(duration)

              if self.context.quality_tracker:
          '''
          replacement = '''            stats.duration = float(duration)

              decision = classify_run(stats)
              if not decision.publishable:
                  logger.error(
                      "Publication gate rejected run: %s (%s)",
                      decision.reason,
                      decision.disposition.value,
                  )
                  return PipelineResult(
                      success=False,
                      stats=stats,
                      output_files={},
                      error=decision.reason,
                      disposition=decision.disposition,
                  )

              if self.context.quality_tracker:
          '''
          if marker not in text:
              raise SystemExit("publication decision insertion marker not found")
          text = text.replace(marker, replacement, 1)

          tail = re.compile(
              r"            should_fail = \(.*?"
              r"            return PipelineResult\(\n"
              r"                success=not should_fail,\n"
              r"                stats=stats,\n"
              r"                output_files=generated_files,\n"
              r"                error=\"0 working proxies detected\" if should_fail else None,\n"
              r"            \)\n",
              re.DOTALL,
          )
          new_tail = '''            logger.info("Pipeline execution completed")
              return PipelineResult(
                  success=True,
                  stats=stats,
                  output_files=generated_files,
                  error=None,
                  disposition=RunDisposition.SUCCESS,
              )
          '''
          text, count = tail.subn(new_tail, text)
          if count != 1:
              raise SystemExit(f"legacy publication tail matched {count}")
          core.write_text(text, encoding="utf-8")
          PY

          cat > tests/unit/test_pipeline_fail_closed.py <<'PY'
          # SPDX-License-Identifier: AGPL-3.0-or-later
          from __future__ import annotations

          import asyncio
          from unittest.mock import MagicMock, patch

          import pytest

          from configstream.pipeline.outcomes import RunDisposition, classify_run
          from configstream.pipeline.producer import source_producer
          from configstream.pipeline_stats import PipelineStats


          @pytest.mark.parametrize(
              ("configured", "parsed", "tested", "working", "time_limited", "expected"),
              [
                  (0, 0, 0, 0, False, RunDisposition.FAILED_NO_INPUT),
                  (10, 0, 0, 0, False, RunDisposition.FAILED_NO_PARSED),
                  (10, 5, 0, 0, False, RunDisposition.FAILED_NO_TESTS),
                  (10, 5, 5, 0, False, RunDisposition.FAILED_ZERO_WORKING),
                  (10, 5, 5, 1, True, RunDisposition.FAILED_TIME_LIMIT),
                  (10, 5, 5, 1, False, RunDisposition.SUCCESS),
              ],
          )
          def test_run_disposition_matrix(
              configured: int,
              parsed: int,
              tested: int,
              working: int,
              time_limited: bool,
              expected: RunDisposition,
          ) -> None:
              stats = PipelineStats()
              stats.total_configured_sources = configured
              stats.parsed = parsed
              stats.tested = tested
              stats.working = working
              stats.time_limited = time_limited

              decision = classify_run(stats)

              assert decision.disposition is expected
              assert decision.publishable is (expected is RunDisposition.SUCCESS)


          @pytest.mark.asyncio
          async def test_producer_failure_does_not_emit_success_sentinel() -> None:
              queue: asyncio.Queue[object] = asyncio.Queue()
              quality = MagicMock()
              quality.should_fetch.return_value = True
              anomaly = MagicMock()

              with patch(
                  "configstream.producer.read_multiple_files_async",
                  side_effect=RuntimeError("injected producer failure"),
              ):
                  with pytest.raises(RuntimeError, match="injected producer failure"):
                      await source_producer(
                          sources=["broken-source.txt"],
                          work_queue=queue,
                          proxies=None,
                          quality_tracker=quality,
                          anomaly_detector=anomaly,
                          event_stream=None,
                          progress=None,
                          task_fetch=None,
                          num_consumers=2,
                      )

              assert queue.empty()
          PY
      - name: Run focused lifecycle regression tests
        run: |
          python -m black --check src/configstream/pipeline/outcomes.py src/configstream/pipeline/producer.py src/configstream/pipeline/core.py src/configstream/pipeline_stats.py tests/unit/test_pipeline_fail_closed.py
          pytest -q tests/unit/test_pipeline_fail_closed.py tests/unit/test_pipeline_stages.py
      - name: Commit successful batch and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-lifecycle-fail-closed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/configstream/pipeline/outcomes.py src/configstream/pipeline/producer.py src/configstream/pipeline/core.py src/configstream/pipeline_stats.py tests/unit/test_pipeline_fail_closed.py .github/workflows/apply-lifecycle-fail-closed.yml
          git commit -m "fix: fail closed before publication"
          git push origin HEAD:agent/full-audit-remediation
