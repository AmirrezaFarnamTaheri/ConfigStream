name: PR583 Auxiliary Debt Regeneration

on:
  push:
    branches:
      - tmp/pr583-debt-regen-8f85281

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Regenerate debt snapshots and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr583-aux-debt-regen.yml
          python scripts/generate_debt_matrix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json .github/workflows/pr583-aux-debt-regen.yml
          git diff --cached --check
          git commit -m "docs: regenerate consumer debt snapshot"
          git push origin HEAD:codex/fix-actions-and-runtime-resilience
