name: Black and Contract Refresh

on:
  push:
    branches:
      - codex/fix-runtime-release-audit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Format exactly the changed Python surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.5.1
          BASE_SHA=a669a410f460094cce0caa95126e95fba31606dc
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py'
          )
          if ((${#python_files[@]} > 0)); then
            python -m black --fast --target-version py310 "${python_files[@]}"
          fi
      - name: Regenerate line-sensitive governed contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/validate_function_size_budget.py --write
          python scripts/generate_triage_report.py
      - name: Commit deterministic formatter and contract output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.py'
          git add -- \
            docs/generated/environment-variables.json \
            docs/generated/environment-variables.md \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md \
            config/function-size-budget.json \
            TRIAGE_REPORT.md
          if git diff --cached --quiet; then
            echo "Formatter and governed contracts are already current."
            exit 0
          fi
          git commit -m "style: format remediation changes and refresh contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
