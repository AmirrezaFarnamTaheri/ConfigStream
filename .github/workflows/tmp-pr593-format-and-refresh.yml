name: PR593 format changed Python and refresh governed artifacts

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-format-and-refresh.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Format changed Python, regenerate debt matrix, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/fix-run-34268254683-audit
          python -m pip install --disable-pip-version-check black==26.5.1

          apply_fixes() {
            git fetch origin main "$branch"
            base=$(git merge-base origin/main HEAD)
            mapfile -t python_files < <(
              git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py'
            )
            if ((${#python_files[@]})); then
              python -m black --fast --target-version py310 "${python_files[@]}"
            fi
            git rm -f --ignore-unmatch \
              .github/workflows/tmp-pr593-format-and-refresh.yml \
              .github/workflows/tmp-pr593-refresh-debt-2.yml
            python scripts/generate_debt_matrix.py
            python scripts/generate_debt_matrix.py --check
            git diff --check
          }

          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          apply_fixes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format PR593 Python changes and refresh debt matrix"

          git fetch origin "$branch"
          if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
            git reset --hard "origin/$branch"
            apply_fixes
            git add -A
            git commit -m "style: format PR593 Python changes and refresh debt matrix"
          fi
          python scripts/generate_debt_matrix.py --check
          git diff --check HEAD^ HEAD
          git push origin "HEAD:$branch"
