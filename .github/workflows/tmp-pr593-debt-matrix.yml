name: PR593 debt matrix diagnostic

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-debt-matrix.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate governed debt matrix
        run: python scripts/generate_debt_matrix.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr593-debt-matrix
          path: |
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
          if-no-files-found: error
          retention-days: 1
