name: PR593 Environment Catalog Refresh

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Generate environment catalog
        run: python scripts/generate_environment_catalog.py
      - name: Commit generated environment catalog only
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/generated/environment-variables.json docs/generated/environment-variables.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md
          git commit -m "chore(generated): refresh environment catalog"
          git push origin HEAD:codex/fix-run-34268254683-audit
