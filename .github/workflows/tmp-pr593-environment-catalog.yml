name: PR593 Environment Catalog Refresh

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Generate environment catalog
        run: python scripts/generate_environment_catalog.py
      - name: Upload generated environment catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr593-environment-catalog-${{ github.sha }}
          path: |
            docs/generated/environment-variables.json
            docs/generated/environment-variables.md
          if-no-files-found: error
          retention-days: 1
