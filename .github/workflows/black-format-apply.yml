name: Black Format Apply

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0
    paths:
      - '.github/workflows/black-format-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply canonical Black output
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/ConfigStream' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/post-audit-remediation-v3.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/post-audit-remediation-v3.1.0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact CI formatter
        run: python -m pip install 'black==26.5.1'
      - name: Apply and verify canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/collect_repository_forensics.py
            scripts/validate_function_size_budget.py
            scripts/generate_environment_catalog.py
            scripts/generate_dependency_inventory.py
            scripts/validate_import_cycles.py
            scripts/snapshot_pages_release.py
            tests/unit/test_debt_matrix.py
            src/configstream/server/routes/proxies.py
            src/configstream/cli.py
            tests/unit/test_snapshot_pages_release.py
          )
          python -m black --fast --target-version py310 "${files[@]}"
          python -m black --check --fast --target-version py310 "${files[@]}"
          git diff --check -- "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply canonical Black formatting'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${TARGET_BRANCH}"
