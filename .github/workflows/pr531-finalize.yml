name: PR531 Finalize

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: unify-all-prs
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply remediation
        run: |
          python scripts/pr531_finalize.py
          python -m black scripts src tests
          npm install --package-lock-only --prefix frontend
      - name: Verify
        run: |
          python -m py_compile scripts/release_gate.py scripts/native_client_checks.py scripts/pr531_finalize.py
          python scripts/release_gate.py --help
          python scripts/native_client_checks.py --help
      - name: Remove temporary tooling
        run: rm -f scripts/pr531_finalize.py .github/workflows/pr531-finalize.yml
      - name: Commit final remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize legacy audits and Qodo CodeRabbit remediation" || true
          git push origin HEAD:unify-all-prs
