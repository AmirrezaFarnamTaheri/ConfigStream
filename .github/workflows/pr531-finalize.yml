name: PR531 Finalize

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: unify-all-prs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -e .[dev]
          if [ -f frontend/package.json ]; then
            npm ci --prefix frontend
          fi
      - name: Apply remediation
        run: |
          python scripts/pr531_finalize.py
          python scripts/pr531_finalize_extra.py
          python -m black scripts src tests
          if [ -f frontend/package.json ]; then
            npm install --package-lock-only --prefix frontend
          fi
      - name: Validate workflows
        run: python scripts/validate_workflows.py
      - name: Validate action pins
        run: python scripts/validate_action_pins.py
      - name: Validate repository state
        run: |
          python -m py_compile scripts/release_gate.py scripts/native_client_checks.py
          python scripts/release_gate.py --help
          python scripts/native_client_checks.py --help
      - name: Run focused regressions
        run: |
          pytest -q tests/unit/test_publication_policy.py tests/unit/quality/test_quality_components.py tests/unit/test_output.py
      - name: Remove temporary tooling
        run: |
          rm -f scripts/pr531_finalize.py scripts/pr531_finalize_extra.py .github/workflows/pr531-finalize.yml
      - name: Commit final remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "fix: finalize legacy audits and Qodo CodeRabbit remediation"
          echo "Changes committed locally; merge follows normal PR checks."