name: PR531 Finalize

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr531-finalize-unify-all-prs
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 531
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: unify-all-prs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install dependencies and repair root lock
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python -m pip install -e '.[dev]'
            npm install --package-lock-only --ignore-scripts
            npm ci
          } 2>&1 | tee pr531-finalizer.log
      - name: Apply remediation and format
        id: apply
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python scripts/pr531_finalize.py
            python scripts/pr531_finalize_extra.py
            python -m black scripts src tests
            npm install --package-lock-only --ignore-scripts
            npm ci
          } 2>&1 | tee -a pr531-finalizer.log
      - name: Remove temporary finalizer tooling
        if: steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f \
            scripts/pr531_finalize.py \
            scripts/pr531_finalize_extra.py \
            .github/workflows/pr531-finalize.yml
      - name: Validate final repository tree
        id: validate
        if: steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python scripts/validate_workflows.py
            python scripts/validate_action_pins.py
            python -m py_compile scripts/release_gate.py scripts/native_client_checks.py
            python scripts/release_gate.py --help
            python scripts/native_client_checks.py --help
            pytest -q \
              tests/unit/test_publication_policy.py \
              tests/unit/quality/test_quality_components.py \
              tests/unit/test_output.py
            npm run build
            npm run test:frontend:no-network
            npm run test:frontend:degraded
            test ! -e scripts/pr531_finalize.py
            test ! -e scripts/pr531_finalize_extra.py
            test ! -e .github/workflows/pr531-finalize.yml
          } 2>&1 | tee -a pr531-finalizer.log
      - name: Report exact finalizer failure
        if: steps.install.outcome != 'success' || steps.apply.outcome == 'failure' || steps.validate.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          log_path = Path('pr531-finalizer.log')
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else 'No log was produced.'
          tail = log[-12000:]
          body = (
              '### PR531 finalizer failure diagnostics\n\n'
              f"- install: `{os.environ.get('INSTALL_OUTCOME', 'unknown')}`\n"
              f"- apply: `{os.environ.get('APPLY_OUTCOME', 'unknown')}`\n"
              f"- validate: `{os.environ.get('VALIDATE_OUTCOME', 'unknown')}`\n\n"
              '```text\n' + tail.replace('```', '` ` `') + '\n```'
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/531/comments",
              data=json.dumps({'body': body}).encode('utf-8'),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=60):
              pass
          PY
          exit 1
      - name: Package validated staged tree
        id: package
        if: steps.install.outcome == 'success' && steps.apply.outcome == 'success' && steps.validate.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path

          parent = os.environ['HEAD_SHA']
          actual_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual_head != parent:
              raise SystemExit(f'checked-out head mismatch: {actual_head} != {parent}')
          base_tree = subprocess.check_output(
              ['git', 'rev-parse', f'{parent}^{{tree}}'], text=True
          ).strip()
          raw_paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          )
          paths = [item.decode('utf-8') for item in raw_paths.split(b'\0') if item]
          payload = Path('pr531-validated-tree')
          blobs = payload / 'blobs'
          blobs.mkdir(parents=True, exist_ok=True)
          entries = []
          for index, path in enumerate(paths):
              index_line = subprocess.check_output(
                  ['git', 'ls-files', '-s', '--', path], text=True
              ).strip()
              if not index_line:
                  entries.append({'path': path, 'deleted': True})
                  continue
              mode, staged_sha, _stage_path = index_line.split(maxsplit=2)
              content = subprocess.check_output(['git', 'show', f':{path}'])
              blob_name = f'{index:04d}-{staged_sha}.bin'
              (blobs / blob_name).write_bytes(content)
              entries.append(
                  {
                      'path': path,
                      'deleted': False,
                      'mode': mode,
                      'staged_blob_sha': staged_sha,
                      'blob_file': f'blobs/{blob_name}',
                      'sha256': hashlib.sha256(content).hexdigest(),
                      'size': len(content),
                  }
              )
          manifest = {
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'parent_commit': parent,
              'base_tree_sha': base_tree,
              'entries': entries,
          }
          (payload / 'manifest.json').write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          with tarfile.open('pr531-validated-tree.tar.gz', 'w:gz') as archive:
              archive.add(payload, arcname=payload.name)
          print(f'Packaged {len(entries)} staged entries from {parent}')
          PY
      - name: Upload validated staged tree
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr531-validated-tree-${{ github.run_id }}
          path: pr531-validated-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
