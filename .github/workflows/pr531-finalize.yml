name: PR531 Finalize

on:
  push:
    branches: [unify-all-prs]
    paths:
      - '.github/workflows/pr531-finalize.yml'
      - 'scripts/pr531_finalize.py'
      - 'scripts/pr531_finalize_extra.py'
  workflow_dispatch:

concurrency:
  group: pr531-finalize-unify-all-prs
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: unify-all-prs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install dependencies and repair root lock
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python -m pip install -e '.[dev]'
            npm install --package-lock-only --ignore-scripts
            npm ci
          } 2>&1 | tee pr531-finalizer.log
      - name: Apply remediation and format
        id: apply
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python scripts/pr531_finalize.py
            python scripts/pr531_finalize_extra.py
            python -m black scripts src tests
            npm install --package-lock-only --ignore-scripts
            npm ci
          } 2>&1 | tee -a pr531-finalizer.log
      - name: Remove temporary finalizer tooling
        if: steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f \
            scripts/pr531_finalize.py \
            scripts/pr531_finalize_extra.py \
            .github/workflows/pr531-finalize.yml
      - name: Validate final repository tree
        id: validate
        if: steps.install.outcome == 'success' && steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python scripts/validate_workflows.py
            python scripts/validate_action_pins.py
            python -m py_compile scripts/release_gate.py scripts/native_client_checks.py
            python scripts/release_gate.py --help
            python scripts/native_client_checks.py --help
            pytest -q \
              tests/unit/test_publication_policy.py \
              tests/unit/quality/test_quality_components.py \
              tests/unit/test_output.py
            npm run build
            npm run test:frontend:no-network
            npm run test:frontend:degraded
            test ! -e scripts/pr531_finalize.py
            test ! -e scripts/pr531_finalize_extra.py
            test ! -e .github/workflows/pr531-finalize.yml
          } 2>&1 | tee -a pr531-finalizer.log
      - name: Report exact finalizer failure
        if: steps.install.outcome != 'success' || steps.apply.outcome == 'failure' || steps.validate.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          log_path = Path('pr531-finalizer.log')
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else 'No log was produced.'
          tail = log[-12000:]
          body = (
              '### PR531 finalizer failure diagnostics\n\n'
              f"- install: `{os.environ.get('INSTALL_OUTCOME', 'unknown')}`\n"
              f"- apply: `{os.environ.get('APPLY_OUTCOME', 'unknown')}`\n"
              f"- validate: `{os.environ.get('VALIDATE_OUTCOME', 'unknown')}`\n\n"
              '```text\n' + tail.replace('```', '` ` `') + '\n```'
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/531/comments",
              data=json.dumps({'body': body}).encode('utf-8'),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=60):
              pass
          PY
          exit 1
      - name: Publish one validated Git commit through GitHub API
        if: steps.install.outcome == 'success' && steps.apply.outcome == 'success' && steps.validate.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalizer changes to publish.'
            exit 0
          fi
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          parent = os.environ['GITHUB_SHA']
          api_root = f'https://api.github.com/repos/{repository}'

          def call(method: str, path: str, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'GitHub API {method} {path} failed: {exc.code}: {body}'
                  ) from exc

          current_ref = call('GET', '/git/ref/heads/unify-all-prs')
          if current_ref['object']['sha'] != parent:
              raise SystemExit(
                  'Branch moved during finalization; refusing a non-fast-forward update.'
              )
          parent_commit = call('GET', f'/git/commits/{parent}')
          base_tree = parent_commit['tree']['sha']
          raw_paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          )
          paths = [
              item.decode('utf-8')
              for item in raw_paths.split(b'\0')
              if item
          ]
          tree = []
          for path in paths:
              file_path = Path(path)
              if file_path.exists() or file_path.is_symlink():
                  index_line = subprocess.check_output(
                      ['git', 'ls-files', '-s', '--', path], text=True
                  ).strip()
                  if not index_line:
                      raise RuntimeError(f'No staged index entry for {path}')
                  mode = index_line.split()[0]
                  content = (
                      os.readlink(file_path).encode('utf-8')
                      if file_path.is_symlink()
                      else file_path.read_bytes()
                  )
                  blob = call(
                      'POST',
                      '/git/blobs',
                      {
                          'content': base64.b64encode(content).decode('ascii'),
                          'encoding': 'base64',
                      },
                  )
                  tree.append(
                      {'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']}
                  )
              else:
                  tree.append(
                      {'path': path, 'mode': '100644', 'type': 'blob', 'sha': None}
                  )

          created_tree = call(
              'POST', '/git/trees', {'base_tree': base_tree, 'tree': tree}
          )
          commit = call(
              'POST',
              '/git/commits',
              {
                  'message': 'fix: finalize legacy audits and Qodo CodeRabbit remediation',
                  'tree': created_tree['sha'],
                  'parents': [parent],
              },
          )
          call(
              'PATCH',
              '/git/refs/heads/unify-all-prs',
              {'sha': commit['sha'], 'force': False},
          )
          print(f"Published finalizer commit {commit['sha']}")
          PY