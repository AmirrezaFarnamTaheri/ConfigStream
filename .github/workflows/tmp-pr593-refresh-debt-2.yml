name: PR593 refresh debt matrix after DNS logging cleanup

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-refresh-debt-2.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - name: Regenerate, verify, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/fix-run-34268254683-audit
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          python scripts/generate_debt_matrix.py
          git rm -f --ignore-unmatch .github/workflows/tmp-pr593-refresh-debt-2.yml
          python scripts/generate_debt_matrix.py --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json
          git commit -m "chore(generated): refresh debt matrix after DNS logging cleanup"
          git fetch origin "$branch"
          git rebase "origin/$branch"
          python scripts/generate_debt_matrix.py
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json
          git commit --amend --no-edit
          python scripts/generate_debt_matrix.py --check
          git diff --check HEAD^ HEAD
          git push origin "HEAD:$branch"
