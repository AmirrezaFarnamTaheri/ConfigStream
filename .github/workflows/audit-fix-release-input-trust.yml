name: Apply release input trust hardening

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Harden public candidate trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          finalize = Path('scripts/finalize_release.py')
          f = finalize.read_text()
          f = f.replace(
              'from configstream.publication import (\n',
              'MAX_REQUIRED_JSON_BYTES = 64 * 1024 * 1024\n\nfrom configstream.publication import (\n',
              1,
          )
          old = '''def _load_json(path: Path) -> Any:\n    try:\n        return json.loads(path.read_text(encoding="utf-8"))\n    except (OSError, UnicodeError, json.JSONDecodeError) as exc:\n        raise SystemExit(f"invalid required JSON file {path}: {exc}") from exc\n'''
          new = '''def _load_json(path: Path) -> Any:\n    try:\n        size = path.stat().st_size\n        if size > MAX_REQUIRED_JSON_BYTES:\n            raise ValueError(\n                f"required JSON exceeds {MAX_REQUIRED_JSON_BYTES} bytes"\n            )\n        return json.loads(path.read_text(encoding="utf-8"))\n    except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as exc:\n        raise SystemExit(f"invalid required JSON file {path}: {exc}") from exc\n'''
          if old not in f:
              raise SystemExit('finalize _load_json block not found')
          finalize.write_text(f.replace(old, new, 1))

          prepare = Path('scripts/prepare_public_candidate.py')
          p = prepare.read_text()
          marker = '\n\ndef _copy_optional(source: Path, destination: Path) -> bool:\n'
          helper = '''\n\ndef _reject_symlinks(root: Path, *, label: str) -> None:\n    if root.is_symlink():\n        raise ValueError(f"{label} root must not be a symbolic link: {root}")\n    for path in root.rglob("*"):\n        if path.is_symlink():\n            raise ValueError(f"{label} contains a symbolic link: {path}")\n'''
          if helper not in p:
              if marker not in p:
                  raise SystemExit('prepare helper insertion point not found')
              p = p.replace(marker, helper + marker, 1)
          needle = '''    if not frontend.is_dir():\n        raise FileNotFoundError(f"frontend directory not found: {frontend}")\n\n    destination.parent.mkdir(parents=True, exist_ok=True)\n'''
          replacement = '''    if not frontend.is_dir():\n        raise FileNotFoundError(f"frontend directory not found: {frontend}")\n\n    _reject_symlinks(merged_output, label="merged output")\n    _reject_symlinks(frontend, label="frontend")\n\n    destination.parent.mkdir(parents=True, exist_ok=True)\n'''
          if needle not in p:
              raise SystemExit('prepare preflight insertion point not found')
          p = p.replace(needle, replacement, 1)
          old_optional = '''def _copy_optional(source: Path, destination: Path) -> bool:\n    if not source.exists():\n        return False\n    if source.is_dir():\n        shutil.copytree(source, destination, dirs_exist_ok=True)\n    else:\n        destination.parent.mkdir(parents=True, exist_ok=True)\n        shutil.copy2(source, destination)\n    return True\n'''
          new_optional = '''def _copy_optional(source: Path, destination: Path) -> bool:\n    if not source.exists():\n        return False\n    if source.is_symlink():\n        raise ValueError(f"optional publication source must not be a symbolic link: {source}")\n    if source.is_dir():\n        _reject_symlinks(source, label="optional publication source")\n        shutil.copytree(source, destination, dirs_exist_ok=True)\n    else:\n        destination.parent.mkdir(parents=True, exist_ok=True)\n        shutil.copy2(source, destination)\n    return True\n'''
          if old_optional not in p:
              raise SystemExit('prepare optional copy block not found')
          prepare.write_text(p.replace(old_optional, new_optional, 1))

          prepare_tests = Path('tests/unit/test_prepare_public_candidate.py')
          pt = prepare_tests.read_text()
          if 'test_prepare_rejects_symlinked_merged_input' not in pt:
              pt += '''\n\ndef test_prepare_rejects_symlinked_merged_input(tmp_path: Path) -> None:\n    merged = tmp_path / "merged"\n    frontend = tmp_path / "frontend"\n    destination = tmp_path / "output"\n    outside = tmp_path / "outside-secret.txt"\n    merged.mkdir()\n    frontend.mkdir()\n    outside.write_text("not-for-publication", encoding="utf-8")\n    (merged / "metadata.json").write_text("{}", encoding="utf-8")\n    (merged / "leak.txt").symlink_to(outside)\n    (frontend / "index.html").write_text("ok", encoding="utf-8")\n\n    try:\n        prepare_public_candidate.prepare(merged, frontend, destination, tmp_path)\n    except ValueError as exc:\n        assert "symbolic link" in str(exc)\n    else:\n        raise AssertionError("symlinked merged input must be rejected")\n    assert not destination.exists()\n'''
          prepare_tests.write_text(pt)

          final_tests = Path('tests/unit/test_finalize_release_input_bounds.py')
          final_tests.write_text('''# SPDX-License-Identifier: AGPL-3.0-or-later\nfrom pathlib import Path\n\nimport pytest\n\nfrom scripts import finalize_release\n\n\ndef test_required_json_rejected_before_parse_when_oversized(tmp_path: Path, monkeypatch) -> None:\n    payload = tmp_path / "proxies.json"\n    payload.write_text("[]", encoding="utf-8")\n    monkeypatch.setattr(finalize_release, "MAX_REQUIRED_JSON_BYTES", 1)\n    with pytest.raises(SystemExit, match="exceeds"):\n        finalize_release._load_json(payload)\n''')
          PY
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/unit/test_prepare_public_candidate.py tests/unit/test_finalize_release_input_bounds.py --disable-warnings --maxfail=1
          python -m py_compile scripts/prepare_public_candidate.py scripts/finalize_release.py
      - name: Commit permanent fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/prepare_public_candidate.py scripts/finalize_release.py tests/unit/test_prepare_public_candidate.py tests/unit/test_finalize_release_input_bounds.py
          git commit -m 'fix(release): reject symlinked and oversized candidate inputs'
          git push origin HEAD:codex/fix-run-34268254683-audit
