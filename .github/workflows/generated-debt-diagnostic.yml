name: Generated Debt Matrix Diagnostic

on:
  push:
    branches:
      - codex/fix-runtime-release-audit

permissions:
  contents: write

jobs:
  debt-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Regenerate debt evidence
        run: python scripts/generate_debt_matrix.py
      - name: Commit exact generated debt evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/debt_matrix.json docs/DEBT_MATRIX.md; then
            echo "Debt evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/debt_matrix.json docs/DEBT_MATRIX.md
          git commit -m "chore(generated): refresh debt matrix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
