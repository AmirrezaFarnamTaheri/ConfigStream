name: Validate merge-state hardening

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Apply current cache-schema and atomic-write fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/merge_batches.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import logging\n', 'import logging\nimport math\n', 1)
          marker = 'from configstream.quality.storage import QualityStorage\n'
          assert marker in text
          text = text.replace(marker, marker + 'from configstream.utils import AtomicFileWriter\n', 1)

          start = text.index('def merge_cache_history(batch_glob: str, output_dir: str) -> None:\n')
          end = text.index('\n\ndef _merge_quality_db', start)
          replacement = '''def _normalize_cache_entry(raw: Any) -> Optional[Dict[str, Any]]:\n    """Normalize the live TestResultCache schema used by shard artifacts."""\n    if not isinstance(raw, dict):\n        return None\n    tested_at = _coerce_float(raw.get("tested_at"))\n    if tested_at is None or not math.isfinite(tested_at) or tested_at < 0:\n        return None\n    test_count = _coerce_int(raw.get("test_count", 0))\n    success_count = _coerce_int(raw.get("success_count", 0))\n    item = {key: value for key, value in raw.items() if key != "config"}\n    item["tested_at"] = tested_at\n    item["test_count"] = max(0, test_count or 0)\n    item["success_count"] = max(0, success_count or 0)\n    return item\n\n\ndef _merge_cache_entry(existing: Optional[Dict[str, Any]], incoming: Dict[str, Any]) -> Dict[str, Any]:\n    if existing is None:\n        return dict(incoming)\n    # Every shard can start from the same inherited cache. Summing counters would\n    # multiply that common baseline by the shard count, so merge counters using\n    # their monotonic maxima and take observable state from the newest result.\n    if incoming["tested_at"] >= existing.get("tested_at", -1):\n        merged = dict(incoming)\n    else:\n        merged = dict(existing)\n    merged["test_count"] = max(\n        int(existing.get("test_count", 0) or 0),\n        int(incoming.get("test_count", 0) or 0),\n    )\n    merged["success_count"] = max(\n        int(existing.get("success_count", 0) or 0),\n        int(incoming.get("success_count", 0) or 0),\n    )\n    return merged\n\n\ndef merge_cache_history(batch_glob: str, output_dir: str) -> None:\n    logger.info("--- Merging Cache History ---")\n    merged_cache: Dict[str, Dict[str, Any]] = {}\n    pattern = os.path.join(batch_glob, "data", "test_cache.json")\n    files = glob.glob(pattern)\n    files.extend(glob.glob(os.path.join(batch_glob, "test_cache.json")))\n    files.extend(glob.glob(os.path.join("data", "test_cache.json")))\n    files = sorted(set(files))\n    logger.info("Found %d cache files.", len(files))\n\n    for fpath in files:\n        data = _load_json(Path(fpath))\n        if not isinstance(data, dict):\n            continue\n        for phash, raw in data.items():\n            incoming = _normalize_cache_entry(raw)\n            if incoming is None:\n                continue\n            merged_cache[str(phash)] = _merge_cache_entry(\n                merged_cache.get(str(phash)), incoming\n            )\n\n    out_path = Path(output_dir) / "data" / "test_cache.json"\n    AtomicFileWriter.write_text(\n        out_path, json.dumps(merged_cache, sort_keys=True, separators=(",", ":"))\n    )\n    logger.info("Total merged entries: %d", len(merged_cache))\n'''
          text = text[:start] + replacement + text[end:]

          old = '''def _merge_timeout_history(batch_dirs: Iterable[Path]) -> None:\n    candidates = []\n    for batch_dir in batch_dirs:\n        candidate = batch_dir / "data" / "timeout_history.json"\n        if candidate.exists():\n            candidates.append(candidate)\n    if not candidates:\n        return\n\n    latest = max(candidates, key=lambda p: p.stat().st_mtime)\n    target = Path("data") / "timeout_history.json"\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(latest.read_text(encoding="utf-8"), encoding="utf-8")\n    logger.info(f"Updated timeout_history.json from {latest}.")\n'''
          new = '''def _merge_timeout_history(batch_dirs: Iterable[Path]) -> None:\n    candidates: List[Path] = []\n    for batch_dir in batch_dirs:\n        candidate = batch_dir / "data" / "timeout_history.json"\n        if not candidate.exists():\n            continue\n        payload = _load_json(candidate)\n        if not isinstance(payload, dict):\n            continue\n        timeout = _coerce_float(payload.get("last_timeout"))\n        if timeout is None or not math.isfinite(timeout) or timeout <= 0:\n            logger.warning("Skipped invalid timeout history: %s", candidate)\n            continue\n        candidates.append(candidate)\n    if not candidates:\n        return\n\n    latest = max(candidates, key=lambda p: p.stat().st_mtime)\n    target = Path("data") / "timeout_history.json"\n    AtomicFileWriter.write_text(target, latest.read_text(encoding="utf-8"))\n    logger.info("Updated timeout_history.json from %s.", latest)\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_merge_batches_state.py')
          tests.write_text('''# SPDX-License-Identifier: AGPL-3.0-or-later\nimport json\nimport os\nfrom pathlib import Path\n\nfrom scripts.merge_batches import _merge_timeout_history, merge_cache_history\n\n\ndef _write(path: Path, payload) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(json.dumps(payload), encoding="utf-8")\n\n\ndef test_cache_merge_uses_current_schema_and_newest_state(tmp_path, monkeypatch):\n    monkeypatch.chdir(tmp_path)\n    first = tmp_path / "batch_a" / "data" / "test_cache.json"\n    second = tmp_path / "batch_b" / "data" / "test_cache.json"\n    _write(first, {"same": {"tested_at": 100.0, "test_count": 5, "success_count": 4, "is_working": 0, "country": "AA"}})\n    _write(second, {"same": {"tested_at": 200.0, "test_count": 6, "success_count": 5, "is_working": 1, "country": "BB"}})\n\n    merge_cache_history(str(tmp_path / "batch_*"), str(tmp_path / "output"))\n    merged = json.loads((tmp_path / "output/data/test_cache.json").read_text(encoding="utf-8"))["same"]\n    assert merged["tested_at"] == 200.0\n    assert merged["test_count"] == 6\n    assert merged["success_count"] == 5\n    assert merged["is_working"] == 1\n    assert merged["country"] == "BB"\n    assert "success" not in merged and "fail" not in merged and "last_seen" not in merged\n\n\ndef test_cache_merge_does_not_multiply_shared_baseline(tmp_path, monkeypatch):\n    monkeypatch.chdir(tmp_path)\n    for name, tested_at in (("batch_a", 100.0), ("batch_b", 101.0)):\n        _write(tmp_path / name / "data/test_cache.json", {"same": {"tested_at": tested_at, "test_count": 10, "success_count": 8, "is_working": 1}})\n    merge_cache_history(str(tmp_path / "batch_*"), str(tmp_path / "output"))\n    merged = json.loads((tmp_path / "output/data/test_cache.json").read_text(encoding="utf-8"))["same"]\n    assert merged["test_count"] == 10\n    assert merged["success_count"] == 8\n\n\ndef test_timeout_history_ignores_newer_corrupt_candidate(tmp_path, monkeypatch):\n    monkeypatch.chdir(tmp_path)\n    valid = tmp_path / "batch_a/data/timeout_history.json"\n    invalid = tmp_path / "batch_b/data/timeout_history.json"\n    _write(valid, {"last_timeout": 12.5})\n    invalid.parent.mkdir(parents=True, exist_ok=True)\n    invalid.write_text("{broken", encoding="utf-8")\n    os.utime(valid, (100, 100))\n    os.utime(invalid, (200, 200))\n\n    _merge_timeout_history([tmp_path / "batch_a", tmp_path / "batch_b"])\n    payload = json.loads((tmp_path / "data/timeout_history.json").read_text(encoding="utf-8"))\n    assert payload == {"last_timeout": 12.5}\n''', encoding='utf-8')
          PY
          python -m py_compile scripts/merge_batches.py tests/unit/test_merge_batches_state.py
          pytest -q tests/unit/test_merge_batches_state.py tests/unit/test_cache_compaction.py --disable-warnings --maxfail=1
      - name: Commit merge-state hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/merge_batches.py tests/unit/test_merge_batches_state.py
          git commit -m 'fix(merge): preserve current cache schema atomically'
          git push origin HEAD:codex/fix-run-34268254683-audit
