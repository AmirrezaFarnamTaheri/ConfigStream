name: PR593 final debt location refresh

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-debt-refresh-final.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - name: Refresh exact debt locations and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/fix-run-34268254683-audit
          python scripts/generate_debt_matrix.py
          git rm -f .github/workflows/tmp-pr593-debt-refresh-final.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(generated): refresh debt locations after DNS logging fix"
          git push origin HEAD:codex/fix-run-34268254683-audit
