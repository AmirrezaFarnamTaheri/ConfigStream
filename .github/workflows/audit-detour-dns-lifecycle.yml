name: Validate DNS scanner lifecycle hardening

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Apply lifecycle cleanup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/configstream/tools/dns_scanner/python/dnsscanner_tui.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Set, AsyncGenerator, Optional, Deque, cast\n',
              'from typing import Set, AsyncGenerator, Optional, Deque, Iterable, cast\n',
              1,
          )
          marker = '''# Uncomment below to enable file logging for debugging\n# logger.add(\n#     "logs/dnsscanner_{time}.log",\n#     rotation="50 MB",\n#     compression="zip",\n#     level="DEBUG",\n# )\n\n\n'''
          helpers = '''async def _cancel_and_await_tasks(tasks: Iterable[asyncio.Task[Any]]) -> None:\n    """Cancel owned tasks and wait for their finalizers to complete."""\n    owned = list(dict.fromkeys(tasks))\n    for task in owned:\n        if not task.done():\n            task.cancel()\n    if owned:\n        await asyncio.gather(*owned, return_exceptions=True)\n\n\nasync def _kill_and_reap_processes(processes: Iterable[Any], timeout: float = 2.0) -> None:\n    """Kill owned child processes and reap them with a bounded wait."""\n    for process in list(dict.fromkeys(processes)):\n        try:\n            if process.returncode is None:\n                try:\n                    process.kill()\n                except ProcessLookupError:\n                    pass\n            try:\n                await asyncio.wait_for(process.wait(), timeout=timeout)\n            except asyncio.TimeoutError:\n                logger.error("Timed out reaping Slipstream child process")\n        except Exception as exc:\n            logger.warning("Failed to reap Slipstream child: %s", str(exc)[:200])\n\n\n'''
          assert marker in text
          text = text.replace(marker, marker + helpers, 1)

          start = text.index('    async def action_quit(self) -> None:\n')
          end = text.index('\n    def on_button_pressed', start)
          replacement = '''    async def action_quit(self) -> None:\n        """Gracefully stop scans and reap every owned Slipstream child."""\n        if self._shutdown_event is not None:\n            self._shutdown_event.set()\n\n        active_tasks = list(self.active_scan_tasks)\n        slipstream_tasks = list(self.slipstream_tasks)\n        processes = list(self.slipstream_processes)\n\n        await _cancel_and_await_tasks(active_tasks + slipstream_tasks)\n        await _kill_and_reap_processes(processes)\n\n        self.active_scan_tasks.clear()\n        self.slipstream_tasks.clear()\n        self.slipstream_processes.clear()\n        self.exit()\n'''
          text = text[:start] + replacement + text[end:]

          old = '''        if self._shutdown_event and self._shutdown_event.is_set():\n            self._log("[yellow]Scan interrupted - cleaning up...[/yellow]")\n            # Cancel remaining tasks\n            for task in active_tasks:\n                if not task.done():\n                    task.cancel()\n            return\n'''
          new = '''        if self._shutdown_event and self._shutdown_event.is_set():\n            self._log("[yellow]Scan interrupted - cleaning up...[/yellow]")\n            await _cancel_and_await_tasks(active_tasks)\n            self.active_scan_tasks.clear()\n            return\n'''
          assert old in text
          text = text.replace(old, new, 1)

          # A timed-out Slipstream wait must cancel/reap the still-running tests\n          # before results are saved; otherwise those tasks continue in the background.\n          old = '''            except asyncio.TimeoutError:\n                self._log(\n                    "[yellow]Timeout waiting for slipstream tests - continuing anyway[/yellow]"\n                )\n            self._rebuild_table()  # Rebuild after all tests complete\n'''
          new = '''            except asyncio.TimeoutError:\n                self._log(\n                    "[yellow]Timeout waiting for slipstream tests - cancelling remaining tests[/yellow]"\n                )\n                await _cancel_and_await_tasks(self.slipstream_tasks)\n            self._rebuild_table()  # Rebuild after all tests complete\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile src/configstream/tools/dns_scanner/python/dnsscanner_tui.py tests/unit/test_dnsscanner_tui_lifecycle.py
          pytest -q tests/unit/test_dnsscanner_tui_lifecycle.py tests/unit/test_slipstream_artifacts.py --disable-warnings --maxfail=1
          pytest -q tests/unit/tools/test_vwarp_sanitize.py --disable-warnings --maxfail=1
      - name: Commit lifecycle hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/tools/dns_scanner/python/dnsscanner_tui.py
          git commit -m 'fix(lifecycle): await DNS scanner shutdown cleanup'
          git push origin HEAD:codex/fix-run-34268254683-audit
