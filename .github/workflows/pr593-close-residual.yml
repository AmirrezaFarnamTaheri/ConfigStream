name: PR593 close residual review findings

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/pr593-close-residual.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - name: Apply only verified residual fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          tui = "src/configstream/tools/dns_scanner/python/dnsscanner_tui.py"
          replace_once(
              tui,
              '''    def get_platform_key(self) -> str:\n        """Return an architecture-specific key present in the pinned manifest."""\n''',
              '''    def is_supported(self) -> bool:\n        """Return whether this platform has a pinned Slipstream artifact."""\n        return f"{self.system}-{self.machine}" in self.ARTIFACTS\n\n    def get_platform_key(self) -> str:\n        """Return an architecture-specific key present in the pinned manifest."""\n''',
          )
          replace_once(
              tui,
              '''        self.slipstream_manager = SlipstreamManager()\n        self.slipstream_path = str(self.slipstream_manager.get_executable_path())\n        self.slipstream_domain = ""\n''',
              '''        self.slipstream_manager = SlipstreamManager()\n        self.slipstream_path = ""\n        self.slipstream_domain = ""\n''',
          )
          replace_once(
              tui,
              '''        # Check if slipstream needs to be downloaded\n        if self.test_slipstream and not self.slipstream_manager.is_installed():\n            self.notify(\n                "Slipstream not found. Starting download...", severity="information"\n            )\n            self.run_worker(self._download_and_start_scan(), exclusive=True)\n            return\n''',
              '''        # Resolve the optional Slipstream dependency only when requested.\n        if self.test_slipstream:\n            if not self.slipstream_manager.is_supported():\n                self.notify(\n                    "Slipstream is not supported on "\n                    f"{self.slipstream_manager.system} {self.slipstream_manager.machine}.",\n                    severity="error",\n                )\n                return\n            if self.slipstream_manager.is_installed():\n                self.slipstream_path = str(\n                    self.slipstream_manager.get_executable_path()\n                )\n            else:\n                self.notify(\n                    "Slipstream not found. Starting download...",\n                    severity="information",\n                )\n                self.run_worker(self._download_and_start_scan(), exclusive=True)\n                return\n''',
          )

          replace_once(
              "tests/unit/test_backup_extended.py",
              '''def test_restore_rejects_oversized_gzip_before_publication(\n    data_dir, backup_dir, monkeypatch\n):\n''',
              '''def test_restore_rejects_oversized_gzip_before_publication(\n    data_dir: Path, backup_dir: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n''',
          )

          replace_once(
              "tests/unit/test_cache_paths.py",
              '''from unittest.mock import patch\n\nfrom configstream.test_cache import TestResultCache\n''',
              '''from pathlib import Path\nfrom unittest.mock import patch\n\nimport pytest\n\nfrom configstream.test_cache import TestResultCache\n''',
          )
          replace_once(
              "tests/unit/test_cache_paths.py",
              '''def test_oversized_cache_file_fails_empty(tmp_path, monkeypatch):\n''',
              '''def test_oversized_cache_file_fails_empty(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n''',
          )

          replace_once(
              "tests/unit/test_cli_extended.py",
              '''def test_update_databases_rejects_pinned_mirror_digest_mismatch(runner):\n''',
              '''def test_update_databases_rejects_pinned_mirror_digest_mismatch(\n    runner: CliRunner,\n) -> None:\n''',
          )

          replace_once(
              "tests/unit/test_publication_policy.py",
              '''import json\nfrom datetime import datetime, timedelta, timezone\n\nimport pytest\n''',
              '''import json\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib import Path\n\nimport pytest\n''',
          )
          replace_once(
              "tests/unit/test_publication_policy.py",
              '''def test_sanitized_event_stream_is_public_when_allowlisted(tmp_path):\n''',
              '''def test_sanitized_event_stream_is_public_when_allowlisted(\n    tmp_path: Path,\n) -> None:\n''',
          )

          lifecycle = Path("tests/unit/test_dnsscanner_tui_lifecycle.py")
          text = lifecycle.read_text(encoding="utf-8")
          replacements = {
              "async def test_cancel_and_await_tasks_runs_task_finalizers():": "async def test_cancel_and_await_tasks_runs_task_finalizers() -> None:",
              "    async def worker():": "    async def worker() -> None:",
              "async def test_kill_and_reap_processes_waits_for_children():": "async def test_kill_and_reap_processes_waits_for_children() -> None:",
              "async def test_kill_and_reap_processes_reaps_already_exited_child():": "async def test_kill_and_reap_processes_reaps_already_exited_child() -> None:",
              "        def __init__(self):": "        def __init__(self) -> None:",
              "        def kill(self):": "        def kill(self) -> None:",
              "        async def wait(self):": "        async def wait(self) -> int | None:",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if "test_tui_initialization_defers_unsupported_slipstream" not in text:
              text += '''\n\n\ndef test_tui_initialization_defers_unsupported_slipstream(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from configstream.tools.dns_scanner.python import dnsscanner_tui\n\n    monkeypatch.setattr(dnsscanner_tui.platform, "system", lambda: "Linux")\n    monkeypatch.setattr(dnsscanner_tui.platform, "machine", lambda: "armv7l")\n\n    app = dnsscanner_tui.DNSScannerTUI()\n\n    assert app.slipstream_path == ""\n    assert app.slipstream_manager.is_supported() is False\n    assert app.slipstream_manager.get_download_url() is None\n    with pytest.raises(RuntimeError, match="Unsupported platform"):\n        app.slipstream_manager.get_executable_path()\n'''
          lifecycle.write_text(text, encoding="utf-8")
          PY

          python -m py_compile \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py \
            tests/unit/test_backup_extended.py \
            tests/unit/test_cache_paths.py \
            tests/unit/test_cli_extended.py \
            tests/unit/test_dnsscanner_tui_lifecycle.py \
            tests/unit/test_publication_policy.py
          python - <<'PY'
          import ast
          from pathlib import Path

          targets = {
              "tests/unit/test_backup_extended.py": {"test_restore_rejects_oversized_gzip_before_publication"},
              "tests/unit/test_cache_paths.py": {"test_oversized_cache_file_fails_empty"},
              "tests/unit/test_cli_extended.py": {"test_update_databases_rejects_pinned_mirror_digest_mismatch"},
              "tests/unit/test_publication_policy.py": {"test_sanitized_event_stream_is_public_when_allowlisted"},
              "tests/unit/test_dnsscanner_tui_lifecycle.py": {
                  "test_cancel_and_await_tasks_runs_task_finalizers",
                  "test_kill_and_reap_processes_waits_for_children",
                  "test_kill_and_reap_processes_reaps_already_exited_child",
                  "test_tui_initialization_defers_unsupported_slipstream",
              },
          }
          for path, names in targets.items():
              tree = ast.parse(Path(path).read_text(encoding="utf-8"))
              found = {
                  node.name: node
                  for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names
              }
              if set(found) != names:
                  raise SystemExit(f"missing annotated targets in {path}: {names - set(found)}")
              for name, node in found.items():
                  if node.returns is None or any(arg.annotation is None for arg in node.args.args):
                      raise SystemExit(f"incomplete signature annotation: {path}:{name}")
          PY
          git diff --check

      - name: Commit fixes and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/pr593-close-residual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): close PR593 residual findings"
          git fetch origin codex/fix-run-34268254683-audit
          git rebase origin/codex/fix-run-34268254683-audit
          git push origin HEAD:codex/fix-run-34268254683-audit
