name: Security Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Bandit
        run: python -m pip install "bandit==1.8.6"
      - name: Generate machine-readable Bandit report
        id: bandit
        continue-on-error: true
        run: |
          bandit -r src/configstream scripts tools frontend/assets/js \
            -f json -o bandit-report.json
      - name: Audit broad exception handlers
        id: exceptions
        continue-on-error: true
        run: |
          python scripts/audit_exception_handlers.py \
            --json exception-audit.json \
            --fail-on-unlogged
      - name: Prepare reviewable exception-hardening patch
        id: hardening
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s exception-audit.json || printf '{"findings": []}\n' > exception-audit.json
          : > exception-hardening.patch
          if ! python scripts/harden_exception_handlers.py \
            --report exception-audit.json \
            --patch-file exception-hardening.patch; then
            printf '# hardening helper failed; inspect exception-audit.json\n' > exception-hardening.patch
            exit 1
          fi
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exception-audit-${{ github.run_id }}
          path: exception-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception-hardening patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exception-hardening-patch-${{ github.run_id }}
          path: exception-hardening.patch
          if-no-files-found: error
          retention-days: 14
      - name: Enforce security diagnostics
        if: steps.bandit.outcome == 'failure' || steps.exceptions.outcome == 'failure' || steps.hardening.outcome == 'failure'
        run: exit 1
