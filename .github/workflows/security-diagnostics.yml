name: Security Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project diagnostics dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture mypy diagnostics
        id: mypy
        continue-on-error: true
        run: |
          python -m mypy . > mypy-diagnostics.txt 2>&1
      - name: Capture Black diagnostics
        id: black
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.py'
          )
          if ((${#python_files[@]} == 0)); then
            printf 'No changed Python files to check.\n' > black-diagnostics.txt
            exit 0
          fi
          python -m black --check --fast --target-version py310 "${python_files[@]}" \
            > black-diagnostics.txt 2>&1
      - name: Install pinned Bandit
        run: python -m pip install "bandit==1.8.6"
      - name: Generate machine-readable Bandit report
        id: bandit
        continue-on-error: true
        run: |
          bandit -r src/configstream scripts tools frontend/assets/js \
            -f json -o bandit-report.json
      - name: Audit broad exception handlers
        id: exceptions
        continue-on-error: true
        run: |
          python scripts/audit_exception_handlers.py \
            --json exception-audit.json \
            --fail-on-unlogged
      - name: Prepare reviewable exception-hardening patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s exception-audit.json || printf '{"findings": []}\n' > exception-audit.json
          : > exception-hardening.patch
          python scripts/harden_exception_handlers.py \
            --report exception-audit.json \
            --patch-file exception-hardening.patch \
            || printf '# hardening helper could not generate a patch; inspect exception-audit.json\n' > exception-hardening.patch
      - name: Upload mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-diagnostics-${{ github.run_id }}
          path: mypy-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Black diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: black-diagnostics-${{ github.run_id }}
          path: black-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exception-audit-${{ github.run_id }}
          path: exception-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception-hardening patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exception-hardening-patch-${{ github.run_id }}
          path: exception-hardening.patch
          if-no-files-found: error
          retention-days: 14
      - name: Enforce diagnostics
        if: steps.mypy.outcome == 'failure' || steps.black.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.exceptions.outcome == 'failure'
        run: exit 1
