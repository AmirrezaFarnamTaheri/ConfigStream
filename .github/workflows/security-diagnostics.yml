name: Security Diagnostics

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Bandit
        run: python -m pip install "bandit==1.8.6"
      - name: Generate machine-readable Bandit report
        id: bandit
        continue-on-error: true
        run: |
          bandit -r src/configstream scripts tools frontend/assets/js \
            -f json -o bandit-report.json
      - name: Validate broad exception boundary budget
        id: exceptions
        continue-on-error: true
        run: python scripts/validate_exception_boundaries.py
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exception-boundary-budget-${{ github.run_id }}
          path: config/exception-boundary-budget.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce security diagnostics
        if: steps.bandit.outcome == 'failure' || steps.exceptions.outcome == 'failure'
        run: exit 1
