name: Security Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project diagnostics dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture source and contract diagnostics
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            pytest -q
            python scripts/validate_versions.py
            python scripts/validate_capability_registry.py
            python scripts/validate_core_compatibility.py
            python scripts/validate_module_ownership.py
          } > contract-diagnostics.txt 2>&1
          status=$?
          tail -n 250 contract-diagnostics.txt
          exit "$status"
      - name: Capture flake8 diagnostics
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          python -m flake8 src/ tests/ > flake8-report.txt 2>&1
      - name: Install pinned Bandit
        run: python -m pip install "bandit==1.8.6"
      - name: Generate machine-readable Bandit report
        id: bandit
        continue-on-error: true
        run: |
          bandit -r src/configstream scripts tools frontend/assets/js \
            -f json -o bandit-report.json
      - name: Audit broad exception handlers
        id: exceptions
        continue-on-error: true
        run: |
          python scripts/audit_exception_handlers.py \
            --json exception-audit.json \
            --fail-on-unlogged
      - name: Prepare reviewable exception-hardening patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s exception-audit.json || printf '{"findings": []}\n' > exception-audit.json
          : > exception-hardening.patch
          python scripts/harden_exception_handlers.py \
            --report exception-audit.json \
            --patch-file exception-hardening.patch \
            || printf '# hardening helper could not generate a patch; inspect exception-audit.json\n' > exception-hardening.patch
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-diagnostics-${{ github.run_id }}
          path: contract-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload flake8 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake8-diagnostics-${{ github.run_id }}
          path: flake8-report.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exception-audit-${{ github.run_id }}
          path: exception-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception-hardening patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exception-hardening-patch-${{ github.run_id }}
          path: exception-hardening.patch
          if-no-files-found: error
          retention-days: 14
      - name: Enforce security diagnostics
        if: steps.contracts.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.exceptions.outcome == 'failure'
        run: exit 1
