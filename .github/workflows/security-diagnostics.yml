name: Security Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare remediation source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remediation-source/src/configstream/pipeline
          mkdir -p remediation-source/src/configstream
          mkdir -p remediation-source/tests/unit
          cp src