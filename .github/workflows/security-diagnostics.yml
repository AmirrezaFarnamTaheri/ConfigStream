name: Security Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Generate machine-readable Bandit report
        id: bandit
        continue-on-error: true
        run: |
          bandit -r src/configstream scripts tools frontend/assets/js \
            -f json -o bandit-report.json
      - name: Audit broad exception handlers
        id: exceptions
        continue-on-error: true
        run: |
          python scripts/audit_exception_handlers.py \
            --json exception-audit.json \
            --fail-on-unlogged
      - name: Prepare reviewable exception-hardening patch
        if: always()
        run: |
          python scripts/harden_exception_handlers.py \
            --report exception-audit.json \
            --patch-file exception-hardening.patch
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exception-audit-${{ github.run_id }}
          path: exception-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exception-hardening patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exception-hardening-patch-${{ github.run_id }}
          path: exception-hardening.patch
          if-no-files-found: error
          retention-days: 14
      - name: Enforce security diagnostics
        if: steps.bandit.outcome == 'failure' || steps.exceptions.outcome == 'failure'
        run: exit 1
