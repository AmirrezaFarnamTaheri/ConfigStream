name: Temporary refresh environment catalog

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

concurrency:
  group: temporary-refresh-env-catalog-pr593
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Regenerate environment catalog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          git diff --check
          if git diff --quiet -- docs/generated/environment-variables.json docs/generated/environment-variables.md; then
            echo "Environment catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md
          git commit -m "docs: refresh environment catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
