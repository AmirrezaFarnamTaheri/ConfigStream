name: Regenerate Debt Matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-scheduled-main-failures
          persist-credentials: true
      - name: Regenerate and commit canonical debt matrix
        env:
          BRANCH: agent/fix-scheduled-main-failures
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json
          git rm .github/workflows/regenerate-debt-matrix.yml
          git commit -m "chore: refresh generated debt matrix"
          git push origin "HEAD:${BRANCH}"
