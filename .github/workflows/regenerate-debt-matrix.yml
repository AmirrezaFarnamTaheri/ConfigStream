name: Regenerate Debt Matrix

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0
    paths:
      - .github/workflows/regenerate-debt-matrix.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Remove helper before scanning tracked tree
        run: git rm .github/workflows/regenerate-debt-matrix.yml
      - name: Regenerate and validate debt evidence
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/generate_debt_matrix.py --check
          git diff --check
      - name: Enforce change allowlist
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/regenerate-debt-matrix.yml',
              'docs/DEBT_MATRIX.md',
              'docs/debt_matrix.json',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected changes: ' + ', '.join(unexpected))
          if not {'docs/DEBT_MATRIX.md', 'docs/debt_matrix.json'} <= changed:
              raise SystemExit('debt matrix regeneration did not update both generated artifacts')
          print('Validated changes:', ', '.join(sorted(changed)))
          PY
      - name: Commit regenerated debt evidence and helper removal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/regenerate-debt-matrix.yml docs/DEBT_MATRIX.md docs/debt_matrix.json
          git commit -m "chore: regenerate debt matrix evidence"
          git push origin HEAD:feat/post-audit-remediation-v3.1.0
