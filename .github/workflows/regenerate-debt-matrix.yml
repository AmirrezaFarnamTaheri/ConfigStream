name: Regenerate Debt Matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Regenerate canonical debt matrix
        run: python scripts/generate_debt_matrix.py
      - name: Upload generated debt matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-debt-matrix-${{ github.run_id }}
          path: |
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
          if-no-files-found: error
          retention-days: 1
