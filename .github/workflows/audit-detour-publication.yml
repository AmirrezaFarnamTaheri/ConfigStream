name: Validate publication privacy remediation

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Apply publication privacy fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          publication = Path('src/configstream/publication.py')
          text = publication.read_text(encoding='utf-8')
          target = '        "pipeline_events.jsonl",\n'
          assert target in text
          text = text.replace(target, '', 1)
          marker = '''def _is_private_path(relative: PurePosixPath) -> bool:\n    if relative.name in _PRIVATE_BASENAMES:\n        return True\n    if relative.suffix.lower() in _PRIVATE_SUFFIXES:\n        return True\n    lowered_parts = {part.lower() for part in relative.parts}\n    return bool(lowered_parts & {"private", "private-state", "fingerprints"})\n'''
          replacement = marker + '''\n\ndef is_private_publication_path(path: str | PurePosixPath) -> bool:\n    """Return whether a runtime path is forbidden from public serving.\n\n    ``pipeline_events.jsonl`` is intentionally public only after EventStream has\n    sanitized each record; caches, databases, logs, locks, temporary files and\n    private-state directories remain fail-closed.\n    """\n    relative = path if isinstance(path, PurePosixPath) else PurePosixPath(path.replace("\\\\", "/"))\n    return _is_private_path(relative)\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          publication.write_text(text, encoding='utf-8')

          server = Path('src/configstream/server/__init__.py')
          text = server.read_text(encoding='utf-8')
          import_marker = 'from configstream.runtime_health import evaluate_runtime_health\n'
          assert import_marker in text
          text = text.replace(
              import_marker,
              import_marker + 'from configstream.publication import is_private_publication_path\n',
              1,
          )
          old = '''    # Static Files\n    try:\n        # check_dir=False keeps the mount resilient: the output directory is\n        # created on startup, but may not exist yet at import time.\n        app.mount(\n            "/output",\n            StaticFiles(directory=str(OUTPUT_DIR), check_dir=False),\n            name="output",\n        )\n    except (OSError, RuntimeError) as exc:\n        logger.warning("Failed to mount /output static files: %s", exc)\n\n        @app.get("/output/{path:path}")\n        async def output_fallback(path: str):\n            raise HTTPException(status_code=503, detail="Output directory unavailable")\n\n'''
          new = '''    # Compatibility output route. Do not use an unrestricted StaticFiles mount:\n    # the runtime output tree also contains caches/databases/logs that publication\n    # policy explicitly forbids. Safe public artifacts keep the legacy /output URL.\n    @app.get("/output/{path:path}")\n    async def output_compat(path: str):\n        if not path or is_private_publication_path(path):\n            raise HTTPException(status_code=404, detail="File not generated yet")\n        return _serve_output_file(path)\n\n'''
          assert old in text
          text = text.replace(old, new, 1)
          server.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_publication_policy.py')
          test_text = tests.read_text(encoding='utf-8')
          assert 'test_sanitized_event_stream_is_public_when_allowlisted' not in test_text
          test_text += '''\n\ndef test_sanitized_event_stream_is_public_when_allowlisted(tmp_path):\n    events = tmp_path / "pipeline_events.jsonl"\n    events.write_text('{"event_type":"info","message":"safe"}\\n', encoding="utf-8")\n    digests = validate_public_artifact(\n        tmp_path, allowed_paths={"pipeline_events.jsonl"}\n    )\n    assert "pipeline_events.jsonl" in digests\n'''
          tests.write_text(test_text, encoding='utf-8')

          server_tests = Path('tests/unit/test_security_headers.py')
          server_text = server_tests.read_text(encoding='utf-8')
          assert 'test_output_compat_route_denies_private_runtime_state' not in server_text
          server_text += '''\n\ndef test_output_compat_route_denies_private_runtime_state(tmp_path, monkeypatch) -> None:\n    monkeypatch.setenv("OUTPUT_DIR", str(tmp_path))\n    (tmp_path / "proxies.json").write_text("[]", encoding="utf-8")\n    data_dir = tmp_path / "data"\n    data_dir.mkdir()\n    (data_dir / "test_cache.json").write_text('{"internal":true}', encoding="utf-8")\n    (data_dir / "source_quality.db").write_bytes(b"private-db")\n    (tmp_path / "pipeline_events.jsonl").write_text(\n        '{"event_type":"info","message":"safe"}\\n', encoding="utf-8"\n    )\n\n    client = TestClient(create_app())\n    assert client.get("/output/proxies.json").status_code == 200\n    assert client.get("/output/pipeline_events.jsonl").status_code == 200\n    assert client.get("/output/data/test_cache.json").status_code == 404\n    assert client.get("/output/data/source_quality.db").status_code == 404\n'''
          server_tests.write_text(server_text, encoding='utf-8')
          PY
          python -m py_compile src/configstream/publication.py src/configstream/server/__init__.py
          pytest -q tests/unit/test_publication_policy.py tests/unit/test_security_headers.py --disable-warnings --maxfail=1
      - name: Commit publication privacy fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/publication.py src/configstream/server/__init__.py tests/unit/test_publication_policy.py tests/unit/test_security_headers.py
          git commit -m 'fix(security): enforce publication privacy on runtime output'
          git push origin HEAD:codex/fix-run-34268254683-audit
