name: Audit Finalize

on:
  push:
    branches:
      - agent/fix-active-audit-items
    paths:
      - .github/workflows/audit-finalize.yml

permissions:
  contents: write

concurrency:
  group: audit-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-active-audit-items
          fetch-depth: 0

      - name: Close server publication-policy bypass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/configstream/server/utils.py",
              "from ..config import AppSettings\nfrom ..logging_config import setup_logging",
              "from ..config import AppSettings\nfrom ..logging_config import setup_logging\nfrom ..publication import is_private_publication_path",
          )
          replace_once(
              "src/configstream/server/utils.py",
              '''def _serve_output_file(rel_path: str, media_type: Optional[str] = None) -> FileResponse:\n    target = _resolve_output_path(rel_path)\n    if not target.exists():\n        raise HTTPException(404, "File not generated yet")\n    return FileResponse(target, media_type=media_type)\n\n\ndef _serve_output_subpath(prefix: str, path: str) -> FileResponse:\n    if not path or ".." in path:\n        raise HTTPException(400, "Invalid path")\n    rel = str(Path(prefix) / path)\n    target = _resolve_output_path(rel)\n    if not target.exists() or not target.is_file():\n        raise HTTPException(404, "File not generated yet")\n    return FileResponse(target)''',
              '''def _serve_output_file(rel_path: str, media_type: Optional[str] = None) -> FileResponse:\n    if is_private_publication_path(rel_path):\n        raise HTTPException(404, "File not generated yet")\n\n    target = _resolve_output_path(rel_path)\n    base = OUTPUT_DIR.resolve()\n    resolved_rel = target.relative_to(base).as_posix()\n    if is_private_publication_path(resolved_rel):\n        raise HTTPException(404, "File not generated yet")\n    if not target.is_file():\n        raise HTTPException(404, "File not generated yet")\n    return FileResponse(target, media_type=media_type)\n\n\ndef _serve_output_subpath(prefix: str, path: str) -> FileResponse:\n    if not path or ".." in path:\n        raise HTTPException(400, "Invalid path")\n    rel = str(Path(prefix) / path)\n    return _serve_output_file(rel)''',
          )

          test_path = Path("tests/unit/test_security_headers.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''    (data_dir / "test_cache.json").write_text('{"internal":true}', encoding="utf-8")\n    (data_dir / "source_quality.db").write_bytes(b"private-db")\n    (tmp_path / "pipeline_events.jsonl").write_text('''
          new = '''    (data_dir / "test_cache.json").write_text('{"internal":true}', encoding="utf-8")\n    (data_dir / "source_quality.db").write_bytes(b"private-db")\n    (data_dir / "public.json").write_text('{"public":true}', encoding="utf-8")\n    (tmp_path / "pipeline_events.jsonl").write_text('''
          if text.count(old) != 1:
              raise SystemExit("tests/unit/test_security_headers.py: fixture target drifted")
          text = text.replace(old, new, 1)
          old_assertions = '''    assert client.get("/output/data/test_cache.json").status_code == 404\n    assert client.get("/output/data/source_quality.db").status_code == 404'''
          new_assertions = '''    assert client.get("/output/data/test_cache.json").status_code == 404\n    assert client.get("/output/data/source_quality.db").status_code == 404\n    assert client.get("/data/test_cache.json").status_code == 404\n    assert client.get("/data/source_quality.db").status_code == 404\n    assert client.get("/data/public.json").status_code == 200'''
          if text.count(old_assertions) != 1:
              raise SystemExit("tests/unit/test_security_headers.py: assertion target drifted")
          test_path.write_text(text.replace(old_assertions, new_assertions, 1), encoding="utf-8")
          PY

      - name: Refresh governed repository evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/generate_supply_chain_evidence.py
          python scripts/generate_dependency_inventory.py
          python scripts/generate_source_admission.py
          python scripts/generate_debt_matrix.py
          python scripts/validate_function_size_budget.py --write
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_triage_report.py
          python scripts/collect_repository_forensics.py

      - name: Commit publication-boundary remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/configstream/server/utils.py \
            tests/unit/test_security_headers.py \
            docs \
            config \
            TRIAGE_REPORT.md \
            src/configstream/data/source-admission.json
          if git diff --cached --quiet; then
            echo "No publication remediation changes to commit."
            exit 0
          fi
          git commit -m "fix(server): enforce publication denylist on subpaths"
          git push origin HEAD:agent/fix-active-audit-items
