name: Validate governed Go verifier and static evidence

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install static verification dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Derive Go verification contract from runtime governance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify_repository.py')
          text = path.read_text(encoding='utf-8')
          old = '''def build_plan(profile: str) -> list[Stage]:\n    python = sys.executable\n    go_environment = (("GOTOOLCHAIN", "go1.24.3"),)\n'''
          new = '''def _runtime_go_contract() -> tuple[tuple[int, ...], str]:\n    """Return the governed Go language floor and toolchain for verification."""\n    manifest = Path(__file__).resolve().parents[1] / "config" / "runtime-versions.json"\n    payload = json.loads(manifest.read_text(encoding="utf-8"))\n    go = payload.get("go")\n    if not isinstance(go, dict):\n        raise ValueError("runtime-versions.json is missing the Go contract")\n    language = str(go.get("language", "")).strip()\n    toolchain = str(go.get("toolchain", "")).strip()\n    try:\n        minimum = tuple(int(part) for part in language.split("."))\n    except ValueError as exc:\n        raise ValueError(f"invalid governed Go language version: {language!r}") from exc\n    if len(minimum) < 2 or not toolchain:\n        raise ValueError("runtime-versions.json contains an incomplete Go contract")\n    return minimum, f"go{toolchain}"\n\n\ndef build_plan(profile: str) -> list[Stage]:\n    python = sys.executable\n    go_minimum, go_toolchain = _runtime_go_contract()\n    go_environment = (("GOTOOLCHAIN", go_toolchain),)\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('minimum_tool_version=(1, 24, 0),', 'minimum_tool_version=go_minimum,')
          text = text.replace('minimum_tool_version=(1, 24, 3),', 'minimum_tool_version=go_minimum,')
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_verify_repository.py')
          test_text = tests.read_text(encoding='utf-8')
          old = '''def test_full_plan_declares_environment_preconditions() -> None:\n    stages = {stage.name: stage for stage in verify_repository.build_plan("full")}\n    assert "aiohttp_socks" in stages["python-unit"].required_python_modules\n    assert stages["go-tester-unit"].minimum_tool_version == (1, 24, 0)\n    assert stages["go-utls-unit"].minimum_tool_version == (1, 24, 3)\n    assert stages["go-tester-unit"].environment == (("GOTOOLCHAIN", "go1.24.3"),)\n'''
          new = '''def test_full_plan_declares_environment_preconditions() -> None:\n    stages = {stage.name: stage for stage in verify_repository.build_plan("full")}\n    runtime = json.loads(\n        Path("config/runtime-versions.json").read_text(encoding="utf-8")\n    )\n    expected_minimum = tuple(\n        int(part) for part in runtime["go"]["language"].split(".")\n    )\n    expected_environment = (("GOTOOLCHAIN", f"go{runtime['go']['toolchain']}"),)\n\n    assert "aiohttp_socks" in stages["python-unit"].required_python_modules\n    for name in (\n        "go-tester-unit",\n        "go-tester-race",\n        "go-tester-fuzz",\n        "go-tester-benchmark",\n        "go-utls-unit",\n        "go-utls-race",\n        "go-utls-fuzz",\n        "go-utls-benchmark",\n    ):\n        assert stages[name].minimum_tool_version == expected_minimum\n        assert stages[name].environment == expected_environment\n'''
          assert old in test_text
          test_text = test_text.replace(old, new, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
          python -m py_compile scripts/verify_repository.py tests/unit/test_verify_repository.py
          pytest -q \
            tests/unit/test_verify_repository.py::test_full_plan_declares_environment_preconditions \
            tests/unit/test_verify_repository.py::test_full_verification_plan_uses_module_workdirs_for_native_checks \
            --disable-warnings --maxfail=1
      - name: Refresh static generated evidence
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/generate_triage_report.py
          python scripts/collect_repository_forensics.py
      - name: Diagnose ratchet deltas
        run: |
          set +e
          python scripts/validate_function_size_budget.py
          python scripts/validate_exception_boundaries.py
          exit 0
      - name: Run complete static verifier without helper scaffolding
        run: |
          set -euo pipefail
          helper=.github/workflows/audit-detour-static-refresh.yml
          hidden=/tmp/audit-detour-static-refresh.yml
          mv "$helper" "$hidden"
          trap 'mv "$hidden" "$helper"' EXIT
          python scripts/verify_repository.py --profile static
      - name: Commit governed verifier and evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/verify_repository.py \
            tests/unit/test_verify_repository.py \
            docs/DEBT_MATRIX.md \
            docs/debt_matrix.json \
            TRIAGE_REPORT.md \
            docs/generated/repository-forensics.json \
            docs/generated/repository-forensics.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix(verification): honor governed Go toolchain'
          git push origin HEAD:codex/fix-run-34268254683-audit
