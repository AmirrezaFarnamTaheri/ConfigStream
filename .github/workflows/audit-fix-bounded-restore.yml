name: Apply bounded database restore fix

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Patch restore bounds and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          backup = Path('src/configstream/backup.py')
          text = backup.read_text()
          text = text.replace(
              'logger = logging.getLogger(__name__)\n',
              'logger = logging.getLogger(__name__)\n\nMAX_RESTORE_DATABASE_BYTES = 2 * 1024 * 1024 * 1024\nRESTORE_COPY_CHUNK_BYTES = 1024 * 1024\n',
              1,
          )
          old = '''        with opener(backup_file, "rb") as f_in, temp_path.open("wb") as f_out:\n            shutil.copyfileobj(f_in, f_out)\n            f_out.flush()\n            os.fsync(f_out.fileno())\n'''
          new = '''        with opener(backup_file, "rb") as f_in, temp_path.open("wb") as f_out:\n            restored_bytes = 0\n            while chunk := f_in.read(RESTORE_COPY_CHUNK_BYTES):\n                restored_bytes += len(chunk)\n                if restored_bytes > MAX_RESTORE_DATABASE_BYTES:\n                    raise ValueError("restored database exceeds the safety limit")\n                f_out.write(chunk)\n            if restored_bytes == 0:\n                raise ValueError("restored database is empty")\n            f_out.flush()\n            os.fsync(f_out.fileno())\n'''
          if old not in text:
              raise SystemExit('restore copy block not found')
          backup.write_text(text.replace(old, new, 1))

          tests = Path('tests/unit/test_backup_extended.py')
          t = tests.read_text()
          if 'import gzip\n' not in t:
              t = t.replace('import pytest\n', 'import pytest\nimport gzip\n', 1)
          addition = '''\n\ndef test_restore_rejects_oversized_gzip_before_publication(data_dir, backup_dir, monkeypatch):\n    target = data_dir / "target.db"\n    create_db(target)\n    original = target.read_bytes()\n    backup = backup_dir / "oversized.db.gz"\n    with gzip.open(backup, "wb") as handle:\n        handle.write(b"x" * 4096)\n\n    monkeypatch.setattr("configstream.backup.MAX_RESTORE_DATABASE_BYTES", 1024)\n\n    assert not restore_database(backup, target)\n    assert target.read_bytes() == original\n    assert not list(target.parent.glob(f".{target.name}.restore-*"))\n'''
          if 'test_restore_rejects_oversized_gzip_before_publication' not in t:
              t += addition
          tests.write_text(t)
          PY
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/unit/test_backup_extended.py --disable-warnings --maxfail=1
          python -m py_compile src/configstream/backup.py
      - name: Commit permanent fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/backup.py tests/unit/test_backup_extended.py
          git commit -m 'fix(backup): bound database restore expansion'
          git push origin HEAD:codex/fix-run-34268254683-audit
