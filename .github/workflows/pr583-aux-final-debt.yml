name: PR583 Auxiliary Final Debt

on:
  push:
    branches:
      - tmp/pr583-debt-final-91b5354

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Regenerate exact debt tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr583-aux-final-debt.yml
          rm -f .github/workflows/pr583-evidence-regeneration.yml
          python scripts/generate_debt_matrix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json .github/workflows/pr583-aux-final-debt.yml .github/workflows/pr583-evidence-regeneration.yml
          git commit -m "docs: regenerate final consumer debt snapshot"
          git push origin HEAD:tmp/pr583-debt-final-91b5354
