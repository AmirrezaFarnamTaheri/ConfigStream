name: Temporary PR 593 formatter

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

concurrency:
  group: temporary-pr593-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Black
        run: python -m pip install black==26.5.1
      - name: Format PR Python changes
        shell: bash
        env:
          BASE_SHA: d9de03f8540946141568796e045b415088b5dec9
        run: |
          set -euo pipefail
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py'
          )
          if ((${#python_files[@]} == 0)); then
            echo "No changed Python files."
            exit 0
          fi
          python -m black --fast --target-version py310 "${python_files[@]}"
          git diff --check
          if git diff --quiet -- '*.py'; then
            echo "Python changes already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: format PR Python changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
