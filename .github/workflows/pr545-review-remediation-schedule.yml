name: PR 545 Scheduled Review Remediation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pr545-review-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'AmirrezaFarnamTaheri/ConfigStream'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/post-audit-remediation-v3.1.0
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and run reviewed patch
        shell: bash
        env:
          EXPECTED_HEAD: 6bdfe930f00f3287f7e098693bbe20eb7c81d2dd
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/pr545-review-remediation.yml > /tmp/remediation-helper.yml
          python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/remediation-helper.yml").read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install development environment"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Unable to extract reviewed remediation script")
          body = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          script = "\n".join(lines) + "\n"
          script = script.replace(
              "new_text, count = pattern.subn(replacement, text)",
              "new_text, count = pattern.subn(lambda _match: replacement, text)",
          )
          Path("/tmp/apply-pr545-review-remediation.py").write_text(
              script, encoding="utf-8"
          )
          PY
          python /tmp/apply-pr545-review-remediation.py

      - name: Install development environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Format and validate changed Python
        shell: bash
        run: |
          set -euo pipefail
          python -m black \
            src/configstream/test_cache.py \
            src/configstream/output_transport.py \
            src/configstream/security/transport.py \
            tests/unit/sources/test_source_policy.py \
            tests/unit/test_pipeline_remediation.py \
            tests/test_output_transport.py \
            tests/unit/security/test_transport.py \
            tests/unit/test_cli_extended.py \
            tests/e2e/test_frontend.py
          python -m py_compile \
            src/configstream/test_cache.py \
            src/configstream/output_transport.py \
            src/configstream/security/transport.py
          python -m flake8 \
            src/configstream/test_cache.py \
            src/configstream/output_transport.py \
            src/configstream/security/transport.py \
            tests/unit/sources/test_source_policy.py \
            tests/unit/test_pipeline_remediation.py \
            tests/test_output_transport.py \
            tests/unit/security/test_transport.py \
            tests/unit/test_cli_extended.py

      - name: Run targeted unit tests
        run: |
          pytest -q \
            tests/unit/sources/test_source_policy.py \
            tests/unit/test_pipeline_remediation.py \
            tests/test_output_transport.py \
            tests/unit/security/test_transport.py \
            tests/unit/test_cli_extended.py \
            --disable-warnings --maxfail=1

      - name: Run browser screenshot smoke
        env:
          CONFIGSTREAM_REQUIRE_PLAYWRIGHT: "1"
        run: |
          python -m playwright install --with-deps chromium
          pytest -q tests/e2e/test_frontend.py::test_homepage_loads \
            --disable-warnings --maxfail=1

      - name: Commit and push remediation
        shell: bash
        env:
          TARGET_BRANCH: feat/post-audit-remediation-v3.1.0
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/configstream/test_cache.py \
            src/configstream/output_transport.py \
            src/configstream/security/transport.py \
            tests/unit/sources/test_source_policy.py \
            tests/unit/test_pipeline_remediation.py \
            tests/test_output_transport.py \
            tests/unit/security/test_transport.py \
            tests/unit/test_cli_extended.py \
            tests/e2e/test_frontend.py
          git diff --cached --check
          git commit -m "fix(review): address PR 545 reliability and testability findings"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Dispatch full pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: feat/post-audit-remediation-v3.1.0
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run main.yml --ref "$TARGET_BRANCH"
          sleep 10
          gh run list \
            --workflow main.yml \
            --branch "$TARGET_BRANCH" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,url,status,headSha > /tmp/dispatched-run.json
          cat /tmp/dispatched-run.json

      - name: Report completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url=$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/dispatched-run.json').read_text(encoding='utf-8'))
          print(rows[0]['url'] if rows else 'workflow dispatch accepted')
          PY
          )
          gh pr comment 545 --body "Review remediation completed and targeted tests passed. Full Config's Stream workflow dispatched on the PR branch: ${run_url}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 545 --body "Scheduled review remediation failed. Inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
