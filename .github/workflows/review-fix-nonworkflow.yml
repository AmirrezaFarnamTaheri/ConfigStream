name: Review Fix Non-Workflow Publish

on:
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  publish-non-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/fix-main-release-gates
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Rebuild exact verified final tree
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('.github/workflows/review-fix-artifact-v2.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['build-verified-patch']['steps']
          by_name = {step.get('name'): step.get('run') for step in steps if isinstance(step, dict)}
          for name in (
              'Replay proven test-generation step',
              'Type the permanent regression test',
              'Replay proven product patch and validation setup',
              'Remove all temporary helper files',
          ):
              run = by_name.get(name)
              if not isinstance(run, str):
                  raise SystemExit(f'missing verified V2 step: {name}')
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', run], check=True)
          PY
      - name: Validate exact helper-free product tree
        run: |
          rm -f .github/workflows/review-fix-finalize.yml
          rm -f .github/workflows/review-fix-nonworkflow.yml
          python scripts/validate_workflows.py
          python -m mypy \
            scripts/normalize_source_timing_logs.py \
            scripts/dynamic_reshard.py \
            scripts/validate_frontend_placeholders.py \
            scripts/validate_workflows.py \
            tests/unit/test_review_fix_regressions.py \
            tests/unit/test_validate_workflows_resilient.py
          python -m pytest -q \
            tests/unit/test_review_fix_regressions.py \
            tests/unit/test_normalize_source_timing_logs.py \
            tests/unit/test_validate_frontend_placeholders.py \
            tests/unit/test_validate_workflows_resilient.py \
            tests/unit/test_release_remediation.py \
            tests/unit/test_require_stage_evidence.py
          python scripts/generate_environment_catalog.py --check
          python scripts/generate_debt_matrix.py --check
      - name: Commit only non-workflow verified files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/normalize_source_timing_logs.py \
            scripts/dynamic_reshard.py \
            scripts/validate_frontend_placeholders.py \
            scripts/validate_workflows.py \
            tests/unit/test_review_fix_regressions.py \
            tests/unit/test_validate_workflows_resilient.py \
            docs/generated/environment-variables.json \
            docs/generated/environment-variables.md \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md
          git diff --cached --name-only
          git commit -m "[autofix] security: address review findings"
          git push origin HEAD:agent/fix-main-release-gates
