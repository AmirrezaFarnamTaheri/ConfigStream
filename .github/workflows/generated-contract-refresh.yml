name: Generated Contract Refresh

on:
  push:
    branches:
      - codex/fix-runtime-release-audit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Regenerate governed static contracts
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/generate_dependency_inventory.py
      - name: Commit generated contract updates
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            docs/generated/environment-variables.json
            docs/generated/environment-variables.md
            docs/debt_matrix.json
            docs/DEBT_MATRIX.md
            docs/generated/dependency-inventory.json
            docs/generated/dependency-inventory.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Generated contracts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore(generated): refresh governed contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
