name: Custom Tester Timeout Remediation

on:
  push:
    branches: [agent/bound-source-test-work]
    paths:
      - '.github/workflows/custom-tester-timeout-remediation.yml'

permissions:
  contents: write

concurrency:
  group: custom-tester-timeout-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/bound-source-test-work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Harden custom result timeout path
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/configstream/testers/go_tester/manager.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one manager replacement target, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''        except asyncio.TimeoutError:\n            logger.error(\n                "IPC drain timed out writing custom configs to Go Tester Daemon."\n            )\n            await self._cleanup_pending(list(reverse_map.keys()), futures)\n            await self._restart_daemon()\n            return {}\n''',
              '''        except asyncio.TimeoutError:\n            self._consecutive_timeouts += 1\n            logger.error(\n                "IPC drain timed out writing custom configs to Go Tester Daemon "\n                "(consecutive: %d/%d).",\n                self._consecutive_timeouts,\n                self._max_consecutive_timeouts,\n            )\n            await self._cleanup_pending(list(reverse_map.keys()), futures)\n            if self._consecutive_timeouts >= self._max_consecutive_timeouts:\n                self.available = False\n                await self.close()\n            else:\n                await self._restart_daemon()\n            return {}\n''',
          )
          replace_once(
              '''            completed = await safe_wait_for(\n                asyncio.gather(*futures, return_exceptions=True),\n                timeout=max(120, min(300, len(inputs) * 2 + 40)),\n            )\n''',
              '''            completed = await safe_wait_for(\n                asyncio.gather(*futures, return_exceptions=True),\n                timeout=self._result_timeout_seconds(len(inputs)),\n            )\n''',
          )
          replace_once(
              '''        except asyncio.TimeoutError:\n            # Cleanup under lock to prevent race with _read_loop\n            async with self._lock:\n                for req_id in reverse_map.keys():\n                    self._pending_futures.pop(req_id, None)\n            for f in futures:\n                if not f.done():\n                    f.cancel()\n            await self._consume_futures(futures)\n            return {}\n\n        results = {}\n''',
              '''        except asyncio.TimeoutError:\n            self._consecutive_timeouts += 1\n            logger.error(\n                "Timed out waiting for custom-config results from Go Tester Daemon "\n                "(consecutive: %d/%d).",\n                self._consecutive_timeouts,\n                self._max_consecutive_timeouts,\n            )\n            # Cleanup under lock to prevent race with _read_loop.\n            async with self._lock:\n                for req_id in reverse_map.keys():\n                    self._pending_futures.pop(req_id, None)\n            for f in futures:\n                if not f.done():\n                    f.cancel()\n            await self._consume_futures(futures)\n            if self._consecutive_timeouts >= self._max_consecutive_timeouts:\n                self.available = False\n                await self.close()\n            else:\n                try:\n                    await safe_wait_for(self._restart_daemon(), timeout=30.0)\n                except (asyncio.TimeoutError, OSError, RuntimeError) as exc:\n                    logger.warning(\n                        "Custom-config daemon restart failed after timeout: %s",\n                        type(exc).__name__,\n                    )\n            return {}\n\n        self._consecutive_timeouts = 0\n        results = {}\n''',
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Regenerate and validate
        run: |
          python scripts/generate_debt_matrix.py
          python -m py_compile src/configstream/testers/go_tester/manager.py
          python -m pytest -q \
            tests/unit/test_go_tester_runtime_budget.py \
            tests/unit/test_go_batch_tester_remediation.py \
            tests/unit/test_go_tester_streaming.py
          python scripts/generate_debt_matrix.py --check
      - name: Commit custom timeout hardening
        run: |
          set -euo pipefail
          git config user.name 'configstream-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/configstream/testers/go_tester/manager.py \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md
          git commit -m 'fix(runtime): bound custom tester timeout recovery'
          git push origin HEAD:agent/bound-source-test-work
