name: Review Fix Artifact V2

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  build-verified-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/fix-main-release-gates
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Replay proven test-generation step
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('.github/workflows/review-fix-artifact.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['build-verified-patch']['steps']
          run = next(step['run'] for step in steps if step.get('name') == 'Write permanent RED-proven regressions')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', run], check=True)
          PY
      - name: Type the permanent regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/test_review_fix_regressions.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "CS_SIGNING_PRIVATE_KEY_HEX" not in step.get("env", {})\n'
          new = (
              '    step_env = step.get("env", {})\n'
              '    assert isinstance(step_env, dict)\n'
              '    assert "CS_SIGNING_PRIVATE_KEY_HEX" not in step_env\n'
          )
          if old not in text:
              raise SystemExit('regression typing marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Replay proven product patch and validation setup
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('.github/workflows/review-fix-artifact.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['build-verified-patch']['steps']
          by_name = {step.get('name'): step.get('run') for step in steps if isinstance(step, dict)}
          for name in (
              'Apply proven review fixes',
              'Apply pinned Black',
              'Regenerate checked-in registries',
              'GREEN - run review and release regressions',
          ):
              run = by_name.get(name)
              if not isinstance(run, str):
                  raise SystemExit(f'missing replay step: {name}')
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', run], check=True)
          PY
      - name: Remove all temporary helper files
        run: |
          rm -f .github/workflows/review-fix-apply.yml
          rm -f .github/workflows/review-fix-artifact.yml
          rm -f .github/workflows/review-fix-artifact-v2.yml
          rm -f .github/.review-fix-trigger
      - name: Validate final-tree static contracts
        run: |
          python scripts/validate_workflows.py
          python -m mypy \
            scripts/normalize_source_timing_logs.py \
            scripts/dynamic_reshard.py \
            scripts/validate_frontend_placeholders.py \
            scripts/validate_workflows.py \
            tests/unit/test_review_fix_regressions.py \
            tests/unit/test_validate_workflows_resilient.py
      - name: Package verified final-tree files
        run: |
          zip -q review-fix-final-tree.zip \
            .github/workflows/main.yml \
            scripts/normalize_source_timing_logs.py \
            scripts/dynamic_reshard.py \
            scripts/validate_frontend_placeholders.py \
            scripts/validate_workflows.py \
            tests/unit/test_review_fix_regressions.py \
            tests/unit/test_validate_workflows_resilient.py \
            docs/generated/environment-variables.json \
            docs/generated/environment-variables.md \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md
      - name: Upload verified final-tree artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-fix-final-tree-v2-${{ github.run_id }}
          path: review-fix-final-tree.zip
          if-no-files-found: error
          retention-days: 1
