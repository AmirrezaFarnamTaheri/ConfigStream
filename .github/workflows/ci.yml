name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e .[dev]
          pip install bandit pip-audit
      - name: Update routing databases
        run: |
          python -m configstream.cli update-databases || echo "Database update failed (non-fatal)"
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps
      - name: Run tests
        run: pytest -q
      - name: Run flake8
        run: python -m flake8 src/ tests/
      - name: Run mypy
        run: python -m mypy .
      - name: Run black
        run: python -m black --check .
      - name: Security Scan (Bandit)
        run: bandit -r src/configstream -q
      - name: Dependency Vulnerability Scan
        run: pip-audit -r requirements-prod.txt --format json || true
      - name: Validate Versions
        run: python scripts/validate_versions.py