name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sources/backup_dynamic/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Gitleaks compares the pull-request base to the checked-out head.
          # A bounded clone can omit that base on a long-lived branch, causing
          # the security scan to fail before it examines any content.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements-prod.txt
            requirements-dev.txt
            requirements-publish.txt
      - name: Install pinned development and audit dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Shift-left security scan (dependency audit)
        id: dependency-audit
        shell: bash
        run: |
          set +e
          pip-audit -r requirements-prod.txt --format json --output pip-audit-report.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-py${{ matrix.python-version }}-${{ github.run_id }}
          path: pip-audit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Shift-left security scan (bandit)
        run: bandit -r src/configstream scripts tools frontend/assets/js -q
      - name: Validate Bandit suppression hygiene
        run: python scripts/validate_bandit_suppressions.py --require-active
      - name: Shift-left security scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Validate Versions
        run: python scripts/validate_versions.py
      - name: Validate capability registry
        run: python scripts/validate_capability_registry.py
      - name: Validate core compatibility report
        run: python scripts/validate_core_compatibility.py
      - name: Validate module ownership map
        run: python scripts/validate_module_ownership.py
      - name: Check SPDX license headers
        run: python scripts/check_license_headers.py
      - name: Check dependency drift
        run: python scripts/check_dependency_drift.py
      - name: Validate workflow syntax
        run: python scripts/validate_workflows.py
      - name: Validate action version pinning
        run: python scripts/validate_action_pins.py
      - name: Validate pytest skip governance
        run: python scripts/validate_test_skips.py
      - name: Run unified static repository verification
        run: python scripts/verify_repository.py --profile static
      - name: Validate generated architecture dashboard
        run: |
          python scripts/generate_comprehensive_topology.py
          python scripts/build_comprehensive_architecture_page.py
          git diff --exit-code -- architecture.html system_topology.json
      - name: Update routing databases
        run: python -m configstream.cli update-databases || echo "Database update failed (non-fatal)"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-diagnostics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            pytest-report.xml
            pytest-output.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Forensic artifact audit (optional)
        run: |
          ARTIFACT=""
          if [ -f pipeline-output.zip ]; then
            ARTIFACT="pipeline-output.zip"
          elif [ -d pipeline-output ]; then
            ARTIFACT="pipeline-output"
          fi
          if [ -n "$ARTIFACT" ]; then
            python scripts/audit_pipeline_outputs.py \
              --artifact "$ARTIFACT" \
              --report pipeline-audit-report.json \
              --strict
          else
            echo "No pipeline-output ZIP or directory found; skipping forensic artifact audit."
          fi
      - name: Upload forensic audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-audit-report-py${{ matrix.python-version }}
          path: pipeline-audit-report.json
          if-no-files-found: ignore
      - name: Run flake8
        id: flake8
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m flake8 src/ tests/ 2>&1 | tee flake8-output.txt
      - name: Upload flake8 diagnostics
        if: always() && steps.flake8.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake8-diagnostics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: flake8-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce flake8
        if: always() && steps.flake8.outcome != 'skipped'
        shell: bash
        env:
          FLAKE8_OUTCOME: ${{ steps.flake8.outcome }}
        run: |
          if [ "$FLAKE8_OUTCOME" != "success" ]; then
            echo "flake8 found lint errors; inspect the uploaded diagnostics artifact."
            exit 1
          fi
      - name: Run mypy
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m mypy . 2>&1 | tee mypy-output.txt
      - name: Upload mypy diagnostics
        if: always() && steps.mypy.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mypy-diagnostics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: mypy-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Run black on changed Python files
        id: black
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          : > black-output.txt
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.py'
          )
          if ((${#python_files[@]} == 0)); then
            echo "No changed Python files to check." | tee black-output.txt
            exit 0
          fi
          python -m black --check --diff --fast --target-version py310 "${python_files[@]}" 2>&1 | tee black-output.txt
      - name: Upload black diagnostics
        if: always() && steps.black.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: black-diagnostics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: black-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce black
        if: always() && steps.black.outcome != 'skipped'
        shell: bash
        env:
          BLACK_OUTCOME: ${{ steps.black.outcome }}
        run: |
          if [ "$BLACK_OUTCOME" != "success" ]; then
            echo "black found formatting differences; inspect the uploaded diagnostics artifact."
            exit 1
          fi
      - name: Enforce mypy
        if: always() && steps.mypy.outcome != 'skipped'
        shell: bash
        env:
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
        run: |
          if [ "$MYPY_OUTCOME" != "success" ]; then
            echo "mypy found type errors; inspect the uploaded diagnostics artifact."
            exit 1
          fi
      - name: Enforce dependency audit
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.dependency-audit.outputs.exit_code }}
        run: |
          if [ "${AUDIT_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Dependency audit found vulnerabilities; inspect the uploaded pip-audit report."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Node Playwright browser
        run: npx playwright install chromium
      - name: Build frontend assets
        run: npm run build
      - name: Same-origin frontend smoke
        run: npm run test:frontend:no-network
      - name: Degraded no-JS frontend smoke
        run: npm run test:frontend:degraded

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Install frontend dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-frontend-browser-${{ hashFiles('requirements-dev.txt', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-frontend-browser-
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium
          npx playwright install chromium
      - name: Run required frontend browser profile
        run: npm run test:frontend:browser

  go-quality:
    name: Go unit race fuzz and benchmark gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.3'
          cache-dependency-path: |
            src/go/tester/go.sum
            src/go/utls_client/go.sum
      - name: Run Go unit tests
        run: |
          cd src/go/tester
          go test ./...
          cd ../utls_client
          go test ./...
      - name: Run Go race detector
        run: |
          cd src/go/tester
          go test -race ./...
      - name: Run bounded Go fuzz targets
        run: |
          cd src/go/tester
          go test . -run=^$ -fuzz=FuzzParseConfig -fuzztime=5s
          cd ../utls_client
          go test . -run=^$ -fuzz=FuzzParseTarget -fuzztime=5s
      - name: Run Go benchmarks
        run: |
          cd src/go/tester
          go test . -run=^$ -bench=. -benchtime=1x
