name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sources/batch_*.txt'
      - 'sources/backup_dynamic/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@f67e24a430187b32086e1643ad3e03d6861f5b15 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install shift-left security tooling
        run: pip install bandit pip-audit
      - name: Shift-left security scan (dependency audit)
        run: pip-audit -r requirements-prod.txt --format json
      - name: Shift-left security scan (bandit)
        run: bandit -r src/configstream scripts tools frontend/assets/js -q
      - name: Validate Bandit suppression hygiene
        run: python scripts/validate_bandit_suppressions.py --require-active
      - name: Shift-left security scan (gitleaks)
        uses: gitleaks/gitleaks-action@f0ab97193b0400b14c330f2fb1640520608fa20e # v2.3.2
        with:
          config-path: .gitleaks.toml
      - name: Validate Versions
        run: python scripts/validate_versions.py
      - name: Validate capability registry
        run: python scripts/validate_capability_registry.py
      - name: Validate core compatibility report
        run: python scripts/validate_core_compatibility.py
      - name: Validate module ownership map
        run: python scripts/validate_module_ownership.py
      - name: Check SPDX license headers
        run: python scripts/check_license_headers.py
      - name: Check dependency drift
        run: python scripts/check_dependency_drift.py
      - name: Install dependencies
        run: |
          pip install -e .[dev]
      - name: Validate workflow syntax
        run: python scripts/validate_workflows.py
      - name: Validate pytest skip governance
        run: python scripts/validate_test_skips.py
      - name: Update routing databases
        run: |
          python -m configstream.cli update-databases || echo "Database update failed (non-fatal)"
      - name: Cache Playwright browsers
        uses: actions/cache@0c907a75c2df011682e883a1779590213020689b # v4.2.1
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps
      - name: Run tests
        run: pytest -q
      - name: Forensic artifact audit (optional)
        run: |
          ARTIFACT=""
          if [ -f pipeline-output.rar ]; then
            ARTIFACT="pipeline-output.rar"
          elif [ -d pipeline-output ]; then
            ARTIFACT="pipeline-output"
          fi
          if [ -n "$ARTIFACT" ]; then
            python scripts/audit_pipeline_outputs.py \
              --artifact "$ARTIFACT" \
              --report pipeline-audit-report.json \
              --strict
          else
            echo "No pipeline-output artifact found; skipping forensic artifact audit."
          fi
      - name: Upload forensic audit report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pipeline-audit-report-py${{ matrix.python-version }}
          path: pipeline-audit-report.json
          if-no-files-found: ignore
      - name: Run flake8
        run: python -m flake8 src/ tests/
      - name: Run mypy
        run: python -m mypy .
      - name: Run black
        run: python -m black --check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Node Playwright browser
        run: npx playwright install chromium
      - name: Build frontend assets
        run: npm run build
      - name: Same-origin frontend smoke
        run: npm run test:frontend:no-network
      - name: Degraded no-JS frontend smoke
        run: npm run test:frontend:degraded

  frontend-browser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@f67e24a430187b32086e1643ad3e03d6861f5b15 # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Python dependencies
        run: pip install -e .[dev]
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium
          npx playwright install chromium
      - name: Run required frontend browser profile
        run: npm run test:frontend:browser
