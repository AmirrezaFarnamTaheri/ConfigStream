name: Runtime Work Remediation

on:
  push:
    branches: [agent/bound-source-test-work]
    paths:
      - '.github/workflows/runtime-work-remediation.yml'

permissions:
  contents: write

concurrency:
  group: runtime-work-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/bound-source-test-work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply bounded runtime work patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/configstream/config.py",
              "    BATCH_TIME_LIMIT_GRACE_SECONDS: int = 2700\n",
              "    BATCH_TIME_LIMIT_GRACE_SECONDS: int = 900\n",
          )
          replace_once(
              "src/configstream/config.py",
              "    GO_TESTER_BATCH_SIZE: int = 500\n    PY_TESTER_BATCH_SIZE: int = 100\n",
              "    GO_TESTER_BATCH_SIZE: int = 500\n    GO_TESTER_MAX_CONSECUTIVE_TIMEOUTS: int = 2\n    PY_TESTER_BATCH_SIZE: int = 100\n",
          )
          replace_once(
              "src/configstream/config.py",
              "    MAX_LINES_PER_SOURCE: int = 250_000\n    MAX_OPENVPN_CONFIG_SIZE: int = 2 * 1024 * 1024\n",
              "    MAX_LINES_PER_SOURCE: int = 250_000\n    MAX_REMOTE_TEST_CANDIDATES_PER_SOURCE: int = 5_000\n    MAX_OPENVPN_CONFIG_SIZE: int = 2 * 1024 * 1024\n",
          )
          replace_once(
              "src/configstream/config.py",
              '            "GO_TESTER_BATCH_SIZE",\n            "PY_TESTER_BATCH_SIZE",\n',
              '            "GO_TESTER_BATCH_SIZE",\n            "GO_TESTER_MAX_CONSECUTIVE_TIMEOUTS",\n            "PY_TESTER_BATCH_SIZE",\n',
          )
          replace_once(
              "src/configstream/config.py",
              '            "MAX_LINES_PER_SOURCE",\n            "MAX_OPENVPN_CONFIG_SIZE",\n',
              '            "MAX_LINES_PER_SOURCE",\n            "MAX_REMOTE_TEST_CANDIDATES_PER_SOURCE",\n            "MAX_OPENVPN_CONFIG_SIZE",\n',
          )

          replace_once(
              "src/configstream/pipeline/producer.py",
              "from configstream.backpressure import (\n",
              "from configstream.candidate_budget import select_source_candidates\nfrom configstream.backpressure import (\n",
          )
          replace_once(
              "src/configstream/pipeline/producer.py",
              "                                # Prepare metadata and fetch time\n                                resp_time = getattr(res, \"response_time\", None)\n",
              "                                lines, exact_duplicate_drops, budget_drops = (\n                                    select_source_candidates(\n                                        lines,\n                                        source=source,\n                                        limit=int(\n                                            settings.MAX_REMOTE_TEST_CANDIDATES_PER_SOURCE\n                                        ),\n                                    )\n                                )\n                                if exact_duplicate_drops:\n                                    drop_stats[\"source_exact_duplicate\"] = (\n                                        int(\n                                            drop_stats.get(\n                                                \"source_exact_duplicate\", 0\n                                            )\n                                        )\n                                        + exact_duplicate_drops\n                                    )\n                                if budget_drops:\n                                    drop_stats[\"source_candidate_budget\"] = (\n                                        int(\n                                            drop_stats.get(\n                                                \"source_candidate_budget\", 0\n                                            )\n                                        )\n                                        + budget_drops\n                                    )\n                                    logger.warning(\n                                        \"Source candidate budget applied: \"\n                                        \"source=%s parsed=%d retained=%d dropped=%d\",\n                                        safe_source,\n                                        count,\n                                        len(lines),\n                                        budget_drops,\n                                    )\n\n                                # Prepare metadata and fetch time\n                                resp_time = getattr(res, \"response_time\", None)\n",
          )
          replace_once(
              "src/configstream/pipeline/producer.py",
              '                                        f"Fetched {count} proxies from {safe_source} (Fetch: {fetch_time})",\n',
              '                                        f"Fetched {count} proxies from {safe_source}; "\n                                        f"retained {len(lines)} for testing (Fetch: {fetch_time})",\n',
          )

          replace_once(
              "src/configstream/testers/go_tester/manager.py",
              "        env_path = AppSettings().CONFIGSTREAM_TESTER_BIN\n",
              "        settings = AppSettings()\n        env_path = settings.CONFIGSTREAM_TESTER_BIN\n",
          )
          replace_once(
              "src/configstream/testers/go_tester/manager.py",
              "        self._max_consecutive_timeouts: int = 5\n",
              "        self._max_consecutive_timeouts: int = max(\n            1, int(settings.GO_TESTER_MAX_CONSECUTIVE_TIMEOUTS)\n        )\n",
          )
          replace_once(
              "src/configstream/testers/go_tester/manager.py",
              "    async def start(self) -> None:\n",
              "    def _result_timeout_seconds(self, input_count: int) -> float:\n        \"\"\"Bound IPC result wait by tester worker waves, not raw batch size.\"\"\"\n\n        count = max(1, int(input_count))\n        waves = max(1, math.ceil(count / max(1, self.workers)))\n        per_wave_seconds = max(1.0, float(self.timeout))\n        return min(300.0, max(60.0, waves * per_wave_seconds + 30.0))\n\n    async def start(self) -> None:\n",
          )
          replace_once(
              "src/configstream/testers/go_tester/manager.py",
              "        # Set a total timeout relative to batch size\n        # Keep a 60s base buffer so Python timeout exceeds Go worker timeout\n        # and gives Python breathing room, especially for WireGuard-heavy batches\n        total_timeout = min(300, len(inputs) * 2 + 60)\n",
              "        # Bound the Python-side IPC wait by the number of tester worker\n        # waves. A 500-record batch with high worker concurrency must not pay\n        # the same five-minute systemic-failure penalty as a low-worker batch.\n        total_timeout = self._result_timeout_seconds(len(inputs))\n",
          )

          replace_once(
              "tests/unit/test_go_tester_streaming.py",
              "    # Per pipeline contract: disable Go daemon after 5 consecutive batch timeouts.\n    assert tester._max_consecutive_timeouts == 5\n\n    # Simulate consecutive timeouts by directly incrementing\n    tester._consecutive_timeouts = 4\n    assert tester._consecutive_timeouts == 4\n\n    # Simulate exceeding threshold\n    tester._consecutive_timeouts = 5\n",
              "    # Per pipeline contract: disable Go daemon after two consecutive systemic timeouts.\n    assert tester._max_consecutive_timeouts == 2\n\n    # Simulate one recoverable timeout.\n    tester._consecutive_timeouts = 1\n    assert tester._consecutive_timeouts == 1\n\n    # Simulate exceeding threshold.\n    tester._consecutive_timeouts = 2\n",
          )

          replace_once(
              "AGENTS.md",
              "`BATCH_TIME_LIMIT_SECONDS = 14400` (4h00m fetch/parse/test) + `BATCH_TIME_LIMIT_GRACE_SECONDS = 2700` (45m for consumers to finish revival, then output generation runs after gather).",
              "`BATCH_TIME_LIMIT_SECONDS = 14400` (4h00m fetch/parse/test) + `BATCH_TIME_LIMIT_GRACE_SECONDS = 900` (15m for consumers to drain in-flight work, then output generation runs after gather).",
          )

          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `TEST_TIMEOUT` | `10` | Timeout in seconds for proxy testing. |",
              "| `TEST_TIMEOUT` | `15` | Timeout in seconds for proxy testing. |",
          )
          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `FETCH_TIMEOUT` | `15` | Timeout in seconds for source fetching. |\n",
              "| `FETCH_TIMEOUT` | `15` | Timeout in seconds for source fetching. |\n| `BATCH_TIME_LIMIT_SECONDS` | `14400` | Soft per-run intake limit in seconds. |\n| `BATCH_TIME_LIMIT_GRACE_SECONDS` | `900` | Hard-stop grace for draining in-flight work after intake stops. |\n",
          )
          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `MAX_LINES_PER_SOURCE` | `250000` | Maximum lines processed per source payload. |\n",
              "| `MAX_LINES_PER_SOURCE` | `250000` | Maximum lines parsed from one source payload as a memory/parser safety bound. |\n| `MAX_REMOTE_TEST_CANDIDATES_PER_SOURCE` | `5000` | Deterministic per-remote-source cap before expensive network testing; full parsed volume still feeds anomaly evidence. |\n",
          )
          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `MAX_SOURCE_URL_LENGTH` | `2048` | Max source URL length. |\n",
              "",
          )
          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `GO_TESTER_BATCH_SIZE` | `0` | Go tester batch size (0 = no chunking). |\n| `PY_TESTER_BATCH_SIZE` | `0` | Python tester batch size (0 = no chunking). |\n",
              "| `GO_TESTER_BATCH_SIZE` | `500` | Maximum Go tester batch size. |\n| `GO_TESTER_MAX_CONSECUTIVE_TIMEOUTS` | `2` | Consecutive systemic Go tester batch timeouts before disabling the daemon and falling back. |\n| `PY_TESTER_BATCH_SIZE` | `100` | Maximum Python fallback tester batch size. |\n",
          )
          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `UPDATE_INTERVAL_HOURS` | `6` | Publish interval reported in `metadata.json` for frontend freshness display. |",
              "| `UPDATE_INTERVAL_HOURS` | `4` | Publish interval reported in `metadata.json` for frontend freshness display. |",
          )
          replace_once(
              "docs/wiki/project/Configuration.md",
              "| `STRICT_SECURITY` | `false` | Enable honeypot probing + stricter tester checks. |",
              "| `STRICT_SECURITY` | `true` | Enable stricter tester/security checks by default. |",
          )

          replace_once(
              ".env.example",
              "MAX_LINES_PER_SOURCE=250000\nMAX_CONFIG_LINE_LENGTH=262144\n",
              "MAX_LINES_PER_SOURCE=250000\nMAX_REMOTE_TEST_CANDIDATES_PER_SOURCE=5000\nMAX_CONFIG_LINE_LENGTH=262144\n",
          )
          replace_once(
              ".env.example",
              "MAX_SOURCE_URL_LENGTH=2048\n",
              "",
          )
          replace_once(
              ".env.example",
              "# Worker Concurrency\nMAX_WORKERS=128\n",
              "# Worker Concurrency\nMAX_WORKERS=128\nGO_TESTER_MAX_CONSECUTIVE_TIMEOUTS=2\n",
          )
          PY
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Regenerate governed evidence
        run: |
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
      - name: Validate targeted contracts
        run: |
          python -m py_compile \
            src/configstream/candidate_budget.py \
            src/configstream/config.py \
            src/configstream/pipeline/producer.py \
            src/configstream/testers/go_tester/manager.py
          python -m pytest -q \
            tests/unit/test_candidate_budget.py \
            tests/unit/test_go_tester_runtime_budget.py \
            tests/unit/test_go_tester_streaming.py \
            tests/unit/test_configuration_documentation_contract.py
          python scripts/generate_environment_catalog.py --check
          python scripts/generate_debt_matrix.py --check
      - name: Commit remediation
        run: |
          set -euo pipefail
          git config user.name 'configstream-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/configstream/config.py \
            src/configstream/pipeline/producer.py \
            src/configstream/testers/go_tester/manager.py \
            tests/unit/test_go_tester_streaming.py \
            AGENTS.md \
            docs/wiki/project/Configuration.md \
            .env.example \
            docs/generated/environment-variables.json \
            docs/generated/environment-variables.md \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md
          if git diff --cached --quiet; then
            echo 'No generated remediation delta to commit.'
            exit 0
          fi
          git commit -m 'fix(runtime): bound per-source testing and tester failover'
          git push origin HEAD:agent/bound-source-test-work
