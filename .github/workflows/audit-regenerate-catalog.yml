name: Regenerate audit environment catalog

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Regenerate authoritative environment catalog
        run: python scripts/generate_environment_catalog.py
      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: regenerate environment variable catalog'
          git push origin HEAD:codex/fix-run-34268254683-audit
