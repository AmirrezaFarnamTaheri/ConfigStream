name: Export audited workflow payloads

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - name: Build exact workflow payloads
        run: python scripts/export_audit_workflow_payloads.py
      - name: Commit ordinary payload blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit-workflow-payload/main.yml .audit-workflow-payload/deploy-pages.yml
          git commit -m 'chore: export exact audited workflow payloads'
          git push origin HEAD:codex/fix-run-34268254683-audit
