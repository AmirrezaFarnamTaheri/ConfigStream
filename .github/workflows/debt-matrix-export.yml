name: Debt Matrix Export

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debt-matrix-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Regenerate debt matrix deterministically
        run: python scripts/generate_debt_matrix.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-debt-matrix-${{ github.run_id }}
          path: |
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
          if-no-files-found: error
          retention-days: 1
