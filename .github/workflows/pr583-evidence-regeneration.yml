name: PR583 Evidence Regeneration

on:
  push:
    branches:
      - codex/fix-actions-and-runtime-resilience

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Regenerate and finalize governed evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr583-evidence-regeneration.yml
          python scripts/generate_debt_matrix.py
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_triage_report.py
          python scripts/collect_repository_forensics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEBT_MATRIX.md docs/debt_matrix.json config/exception-boundary-budget.json TRIAGE_REPORT.md docs/generated/repository-forensics.json docs/generated/repository-forensics.md .github/workflows/pr583-evidence-regeneration.yml
          git diff --cached --check
          git commit -m "docs: regenerate source-run governance evidence"
          git push origin HEAD:codex/fix-actions-and-runtime-resilience
