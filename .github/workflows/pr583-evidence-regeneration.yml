name: PR583 Evidence Regeneration

on:
  push:
    branches:
      - codex/fix-actions-and-runtime-resilience

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Regenerate governed evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/validate_exception_boundaries.py --write
          python scripts/generate_triage_report.py
          python scripts/collect_repository_forensics.py
          git diff --name-only | sort > pr583-generated-files.txt
          git diff --check
          python scripts/verify_repository.py --profile static
      - name: Upload generated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr583-generated-evidence
          path: |
            TRIAGE_REPORT.md
            config/exception-boundary-budget.json
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
            pr583-generated-files.txt
          if-no-files-found: error
          retention-days: 1
