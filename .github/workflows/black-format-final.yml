name: Black Format Final

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/black-format-final.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact remaining Black output
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/post-audit-remediation-v3.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/post-audit-remediation-v3.1.0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact CI formatter
        run: python -m pip install 'black==26.5.1'
      - name: Apply and verify exact remaining formatting
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            scripts/collect_repository_forensics.py
            scripts/generate_dependency_inventory.py
            scripts/generate_environment_catalog.py
            scripts/snapshot_pages_release.py
            scripts/validate_function_size_budget.py
            scripts/validate_import_cycles.py
            src/configstream/__init__.py
            src/configstream/cli.py
            src/configstream/pipeline/models.py
            src/configstream/security/reporting/__init__.py
            src/configstream/testers/go_tester/__init__.py
            src/configstream/utils.py
            tests/test_backpressure_resilience.py
            tests/test_cert_verification.py
            tests/test_chain_membership_computation.py
            tests/test_cookie_security.py
            tests/test_direct_mode.py
            tests/test_fetcher_security.py
            tests/test_history_size_cap.py
            tests/test_input_validation.py
            tests/test_manifest_path_traversal.py
            tests/test_pipeline_no_deadlock.py
            tests/test_pipeline_security_admission.py
            tests/test_source_admission.py
            tests/unit/test_deps_lock.py
            tests/unit/test_environment_catalog.py
            tests/unit/test_exception_boundary_drift.py
            tests/unit/test_generated_code_drift.py
            tests/unit/test_go_tester_binary_security.py
            tests/unit/test_maintainer_annotations.py
          )
          files=()
          for file in "${candidates[@]}"; do
            if [[ -f "$file" ]]; then
              files+=("$file")
            else
              echo "Skipping absent changed path: $file"
            fi
          done
          python -m black --fast --target-version py310 "${files[@]}"
          python -m black --check --fast --target-version py310 "${files[@]}"
          git diff --check -- "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply remaining canonical Black formatting'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${TARGET_BRANCH}"
