name: Server Auth Remediation

on:
  push:
    branches: [agent/fix-active-audit-items]
    paths:
      - '.github/workflows/server-auth-remediation.yml'

permissions:
  contents: write

concurrency:
  group: server-auth-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Harden server authorization boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match in {path}, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/configstream/server/utils.py',
              '''    if not auth_header or not auth_header.startswith("Bearer "):\n        raise HTTPException(401, "Unauthorized: Bearer token required.")\n\n    provided_key = auth_header.split(" ")[1]\n    if not secrets.compare_digest(provided_key, api_key):\n''',
              '''    if not auth_header:\n        raise HTTPException(401, "Unauthorized: Bearer token required.")\n\n    scheme, separator, provided_key = auth_header.partition(" ")\n    if (\n        scheme.casefold() != "bearer"\n        or separator != " "\n        or not provided_key\n        or any(char.isspace() for char in provided_key)\n    ):\n        raise HTTPException(401, "Unauthorized: Bearer token required.")\n\n    if not secrets.compare_digest(provided_key, api_key):\n''',
          )

          replace_once(
              'src/configstream/server/routes/lab.py',
              'from ..utils import _is_nonproduction_environment, limiter, settings\n',
              'from ..utils import (\n    _is_nonproduction_environment,\n    _require_admin_auth,\n    limiter,\n    settings,\n)\n',
          )
          replace_once(
              'src/configstream/server/routes/lab.py',
              '''    if not _is_nonproduction_environment(settings.ENVIRONMENT):\n        if not settings.LAB_LIVE_TEST_ENABLED:\n            raise HTTPException(\n                status_code=403,\n                detail="Live lab testing is disabled in production.",\n            )\n        _require_payload_api_key(payload, settings.ADMIN_API_KEY)\n\n    config = payload.get("config") if isinstance(payload, dict) else None\n''',
              '''    is_nonproduction = _is_nonproduction_environment(settings.ENVIRONMENT)\n    if not is_nonproduction:\n        if not settings.LAB_LIVE_TEST_ENABLED:\n            raise HTTPException(\n                status_code=403,\n                detail="Live lab testing is disabled in production.",\n            )\n        _require_payload_api_key(payload, settings.ADMIN_API_KEY)\n    else:\n        # A development/test environment is not an authentication boundary.\n        # Reuse the admin policy so unauthenticated live network execution is\n        # possible only through the explicit ALLOW_UNAUTHENTICATED_ADMIN opt-in.\n        _require_admin_auth(request, settings.ADMIN_API_KEY, True)\n\n    config = payload.get("config") if isinstance(payload, dict) else None\n''',
          )

          test_path = Path('tests/unit/test_server.py')
          tests = test_path.read_text(encoding='utf-8')
          old_env = '    monkeypatch.setenv("ENVIRONMENT", "test")\n'
          lab_section_start = tests.index('async def test_lab_test_chain_missing_config')
          prefix = tests[:lab_section_start]
          lab_and_after = tests[lab_section_start:]
          replacement = (\n              '    monkeypatch.setenv("ENVIRONMENT", "test")\n'\n              '    monkeypatch.setenv("ALLOW_UNAUTHENTICATED_ADMIN", "true")\n'\n          )
          lab_and_after = lab_and_after.replace(old_env, replacement)
          tests = prefix + lab_and_after

          admin_anchor = '''\n\n@pytest.mark.asyncio\nasync def test_admin_notify_allows_unkeyed_development(async_client, monkeypatch):\n'''
          admin_test = '''\n\n@pytest.mark.asyncio\nasync def test_admin_notify_rejects_bearer_token_with_trailing_fields(\n    async_client, monkeypatch\n):\n    monkeypatch.setenv("ADMIN_API_KEY", "secret")\n    monkeypatch.setenv("ENVIRONMENT", "production")\n\n    response = await async_client.post(\n        "/api/admin/notify-update",\n        json={},\n        headers={"Authorization": "Bearer secret extra"},\n    )\n\n    assert response.status_code == 401\n    assert "Bearer token required" in response.text\n'''
          if tests.count(admin_anchor) != 1:
              raise SystemExit('admin regression insertion anchor missing')
          tests = tests.replace(admin_anchor, admin_test + admin_anchor, 1)

          lab_anchor = '''\n\n@pytest.mark.asyncio\nasync def test_lab_test_chain_missing_config(async_client, monkeypatch):\n'''
          lab_test = '''\n\n@pytest.mark.asyncio\nasync def test_lab_test_chain_requires_explicit_nonproduction_auth_bypass(\n    async_client, monkeypatch\n):\n    monkeypatch.setenv("ENVIRONMENT", "test")\n    monkeypatch.delenv("ADMIN_API_KEY", raising=False)\n    monkeypatch.delenv("ALLOW_UNAUTHENTICATED_ADMIN", raising=False)\n\n    response = await async_client.post(\n        "/api/lab/test-chain",\n        json={"config": {"outbounds": [{"type": "direct", "tag": "direct"}]}},\n    )\n\n    assert response.status_code == 403\n    assert "ADMIN_API_KEY not configured" in response.text\n'''
          if tests.count(lab_anchor) != 1:
              raise SystemExit('lab regression insertion anchor missing')
          tests = tests.replace(lab_anchor, lab_test + lab_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m py_compile \
            src/configstream/server/utils.py \
            src/configstream/server/routes/lab.py \
            tests/unit/test_server.py
      - name: Commit reviewed non-workflow files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            src/configstream/server/utils.py \
            src/configstream/server/routes/lab.py \
            tests/unit/test_server.py; do
            sha="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha')"
            encoded="$(base64 -w0 "$path")"
            gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='fix: harden server authentication boundaries' \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch="$GITHUB_REF_NAME" \
              >/dev/null
          done
