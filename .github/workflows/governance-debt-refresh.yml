name: Governance Debt Refresh

on:
  push:
    branches: [agent/fix-singbox-wireguard-runtime-conformance]
    paths:
      - '.github/workflows/governance-debt-refresh.yml'

permissions:
  contents: write

concurrency:
  group: governance-debt-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/fix-singbox-wireguard-runtime-conformance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Regenerate governed debt evidence
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/validate_exception_boundaries.py
          python scripts/validate_function_size_budget.py
          python scripts/generate_triage_report.py
          python scripts/generate_environment_catalog.py --check
      - name: Commit exact generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git add docs/debt_matrix.json docs/DEBT_MATRIX.md TRIAGE_REPORT.md
          if git diff --cached --quiet; then
            echo "Governance evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): regenerate debt and triage evidence"
          git push origin HEAD:agent/fix-singbox-wireguard-runtime-conformance
# rerun after exact function-size ratchet
