name: Debt Matrix Repair Artifact

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-run-32447443100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/fix-run-32447443100
          persist-credentials: true
      - name: Generate debt matrix
        run: python scripts/generate_debt_matrix.py
      - name: Commit generated debt artifacts
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DEBT_MATRIX.md docs/debt_matrix.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/DEBT_MATRIX.md docs/debt_matrix.json
          git commit -m "chore: regenerate debt matrix"
          git push origin HEAD:agent/fix-run-32447443100
