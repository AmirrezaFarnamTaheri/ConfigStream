name: Retest

on:
  schedule:
    - cron: "0 */4 * * *"
    - cron: "30 1-23/4 * * *" # Alternating every 2h (4h base with 30m offset)
  workflow_dispatch:

# Concurrency: only one retest run active at a time.
# cancel-in-progress: false -> queues one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  schedule_gate:
    name: Schedule Gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check schedule eligibility
        id: gate
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAIN_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/main.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // empty' 2>/dev/null || true)
          RETEST_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/retest.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // empty' 2>/dev/null || true)

          if [ -n "$MAIN_RUN" ] && [ -n "$RETEST_RUN" ]; then
            MAIN_TIME=$(echo "$MAIN_RUN" | jq -r '.updated_at')
            RETEST_TIME=$(echo "$RETEST_RUN" | jq -r '.updated_at')
            if [ "$MAIN_TIME" \> "$RETEST_TIME" ]; then
              LAST_RUN="$MAIN_RUN"
            else
              LAST_RUN="$RETEST_RUN"
            fi
          elif [ -n "$MAIN_RUN" ]; then
            LAST_RUN="$MAIN_RUN"
          elif [ -n "$RETEST_RUN" ]; then
            LAST_RUN="$RETEST_RUN"
          else
            echo "No previous run found - proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.conclusion')
          UPDATED_AT=$(echo "$LAST_RUN" | jq -r '.updated_at')
          NOW_EPOCH=$(date +%s)
          LAST_EPOCH=$(date -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo 0)
          ELAPSED=$(( NOW_EPOCH - LAST_EPOCH ))

          echo "Last run conclusion: $CONCLUSION"
          echo "Elapsed since last run: ${ELAPSED}s"

          if [ "$CONCLUSION" = "success" ]; then
            if [ "$ELAPSED" -lt 7200 ]; then
              echo "Success cooldown active (${ELAPSED}s < 7200s) - skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ]; then
            if [ "$ELAPSED" -lt 14400 ]; then
              echo "Failure retry cooldown (${ELAPSED}s < 14400s) - skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Gate passed - proceeding"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  retest:
    name: Retest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [schedule_gate]
    if: "!needs.schedule_gate.outputs.proceed || needs.schedule_gate.outputs.proceed == 'true'"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-prod.txt
            requirements-dev.txt
            requirements-publish.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Check for concurrent main pipeline run
        id: check_pipeline
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for active main-branch pipeline runs..."
          ACTIVE_RUN=$(gh run list \
            --workflow="main.yml" \
            --branch=main \
            --status="in_progress" \
            --json databaseId,startedAt,status \
            --limit 1 \
            --jq '.[0] | select(.status == "in_progress")')

          if [ -z "$ACTIVE_RUN" ]; then
            echo "No active main pipeline run found. Proceeding with retest."
            echo "should_cancel=false" >> "$GITHUB_OUTPUT"
          else
            START_TIME=$(echo "$ACTIVE_RUN" | jq -r '.startedAt')
            START_EPOCH=$(date -d "$START_TIME" +%s)
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            ELAPSED_HOURS=$((ELAPSED / 3600))

            echo "Active main pipeline found. Started at: $START_TIME"
            echo "Elapsed time: ${ELAPSED}s (${ELAPSED_HOURS}h)"

            if [ $ELAPSED -lt 5400 ]; then
              echo "Pipeline started less than 1.5 hours ago. Cancelling retest to avoid conflicts."
              echo "should_cancel=true" >> "$GITHUB_OUTPUT"
            else
              echo "Pipeline has been running for more than 1.5 hours. Proceeding with retest."
              echo "should_cancel=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Exit if pipeline is running
        if: steps.check_pipeline.outputs.should_cancel == 'true'
        run: |
          echo "Retest cancelled: main pipeline is currently running and started less than 1.5 hours ago."
          echo "The next retest will run at the next scheduled window."
          exit 0

      - name: Download latest successful main pipeline output
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_RUN=$(gh run list \
            --workflow=main.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId,headBranch,event \
            --jq '.[0] | select(.headBranch == "main" and .event != "pull_request") | .databaseId')
          if [ -z "$LATEST_RUN" ]; then
            echo "No successful main-branch pipeline run found; skipping retest."
            exit 0
          fi
          if ! gh run download "$LATEST_RUN" \
            --name pipeline-output \
            --dir output; then
            echo "Failed to download pipeline-output artifact; skipping retest."
            exit 0
          fi

          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "No output directory found after download; skipping retest."
            exit 0
          fi

      - name: Check previous output existence
        id: check_output
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        run: |
          if [ ! -s output/proxies.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No previous output/proxies.json or file is empty; skipping retest."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Retest last export
        if: steps.check_pipeline.outputs.should_cancel != 'true' && steps.check_output.outputs.skip != 'true'
        run: python -m configstream.cli retest --input output/proxies.json --output output --timeout 310 --max-workers 50 --leniency

      - name: Validate retested proxy schema
        if: steps.check_pipeline.outputs.should_cancel != 'true' && steps.check_output.outputs.skip != 'true'
        run: python -m jsonschema -i output/proxies.json schema/proxy.schema.json

      - name: Verify output directory for upload
        id: verify_output
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        run: |
          if [ -d "output" ] && [ -s "output/proxies.json" ] && [ -s "output/metadata.json" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "No output directory or missing critical files; skipping artifact upload."
          fi

      - name: Upload pipeline output artifact
        if: steps.verify_output.outputs.upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-output
          path: output/
          retention-days: 30
