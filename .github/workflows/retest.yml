name: Retest Sealed Release

on:
  workflow_run:
    workflows: ["ConfigStream Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: "Exact successful ConfigStream Pipeline run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: retest-${{ github.event.workflow_run.id || inputs.parent_run_id }}
  cancel-in-progress: true

jobs:
  retest:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact retest implementation
        run: pip install -e ".[dev]"
      - name: Resolve exact parent run
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.parent_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$EVENT_RUN_ID"
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            run_id="$MANUAL_RUN_ID"
          fi
          case "$run_id" in (*[!0-9]*|'') echo 'Invalid run ID' >&2; exit 1;; esac
          metadata=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id")
          test "$(jq -r '.conclusion' <<<"$metadata")" = success
          test "$(jq -r '.name' <<<"$metadata")" = 'ConfigStream Pipeline'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head_sha' <<<"$metadata")" >> "$GITHUB_OUTPUT"
      - name: Download exact parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ steps.parent.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$PARENT_RUN_ID" \
            --name "pipeline-output-$PARENT_RUN_ID" \
            --dir parent
          test -s parent/proxies.json
          test -s parent/release_manifest.json
      - name: Record parent release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          manifest = json.loads(Path('parent/release_manifest.json').read_text())
          expires = datetime.fromisoformat(manifest['expires_at'].replace('Z', '+00:00'))
          if datetime.now(timezone.utc) >= expires:
              raise SystemExit('parent release expired before retest')
          for key in ('release_id', 'source_commit_sha', 'image_digest'):
              value = manifest.get(key)
              if not value:
                  raise SystemExit(f'missing parent {key}')
              print(f'{key}={value}')
          PY
      - name: Retest parent proxy records
        env:
          FAIL_ON_ZERO_WORKING: "true"
          STRICT_SECURITY: "true"
          INCLUDE_INSECURE_PROXIES: "false"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output
          python -m configstream.cli retest \
            --input parent/proxies.json \
            --output output \
            --timeout 310 \
            --max-workers 50
          test -s output/proxies.json
          test -s output/metadata.json
      - name: Validate schemas and clients
        run: |
          set -euo pipefail
          jsonschema -i output/proxies.json schema/proxy.schema.json
          python scripts/validate_pages_artifact.py --refresh-contract output
          python scripts/validate_pages_artifact.py --native-client-check output
      - name: Seal retest as a child release
        env:
          PARENT_RELEASE_DIGEST: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_release.py output \
            --source-sha '${{ steps.release.outputs.source_commit_sha }}' \
            --workflow-sha '${{ github.sha }}' \
            --image-digest '${{ steps.release.outputs.image_digest }}' \
            --expires-minutes 60
      - uses: actions/upload-artifact@v7
        with:
          name: retest-output-${{ github.run_id }}
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
