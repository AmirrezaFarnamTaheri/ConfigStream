name: Retest

on:
  schedule:
    - cron: "0 */4 * * *"
    - cron: "30 1-23/4 * * *" # Alternating every 2h (4h base with 30m offset)
  workflow_dispatch:

# Concurrency: only one retest run active at a time.
# cancel-in-progress: false → queues ONE pending run; GitHub automatically
# drops any further queued runs, so at most 1 running + 1 waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --- Schedule Gate ---
  # Enforces smart scheduling for cron-triggered runs:
  #   • After a SUCCESS (main OR retest): wait at least 2 h since last run finished.
  #   • After a FAILURE (main OR retest): if 4 h have elapsed, start instantly; otherwise wait.
  #   • workflow_dispatch: always proceed.
  schedule_gate:
    name: Schedule Gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check schedule eligibility
        id: gate
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          # Non-schedule triggers always proceed
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Query the last completed run of BOTH main and retest workflows on this branch
          MAIN_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/main.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // empty' 2>/dev/null || true)
          RETEST_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/retest.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // empty' 2>/dev/null || true)

          # Find the most recent of the two
          if [ -n "$MAIN_RUN" ] && [ -n "$RETEST_RUN" ]; then
            MAIN_TIME=$(echo "$MAIN_RUN" | jq -r '.updated_at')
            RETEST_TIME=$(echo "$RETEST_RUN" | jq -r '.updated_at')
            if [ "$MAIN_TIME" \> "$RETEST_TIME" ]; then
              LAST_RUN="$MAIN_RUN"
            else
              LAST_RUN="$RETEST_RUN"
            fi
          elif [ -n "$MAIN_RUN" ]; then
            LAST_RUN="$MAIN_RUN"
          elif [ -n "$RETEST_RUN" ]; then
            LAST_RUN="$RETEST_RUN"
          else
            echo "No previous run found — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.conclusion')
          UPDATED_AT=$(echo "$LAST_RUN" | jq -r '.updated_at')
          NOW_EPOCH=$(date +%s)
          LAST_EPOCH=$(date -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo 0)
          ELAPSED=$(( NOW_EPOCH - LAST_EPOCH ))

          echo "Last run conclusion: $CONCLUSION"
          echo "Elapsed since last run: ${ELAPSED}s"

          if [ "$CONCLUSION" = "success" ]; then
            # After success: require at least 2 h (7200 s) gap
            if [ "$ELAPSED" -lt 7200 ]; then
              echo "Success cooldown active (${ELAPSED}s < 7200s) — skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ]; then
            # After failure: require 4 h (14400 s) before retry
            if [ "$ELAPSED" -lt 14400 ]; then
              echo "Failure retry cooldown (${ELAPSED}s < 14400s) — skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Gate passed — proceeding"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  retest:
    name: Retest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [schedule_gate]
    if: "!needs.schedule_gate.outputs.proceed || needs.schedule_gate.outputs.proceed == 'true'"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .[dev]

      - name: Check for concurrent pipeline run
        id: check_pipeline
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for active pipeline runs..."

          # Check if main pipeline workflow is running
          ACTIVE_RUN=$(gh run list \
            --workflow="main.yml" \
            --status="in_progress" \
            --json databaseId,startedAt,status \
            --limit 1 \
            --jq '.[0] | select(.status == "in_progress")')

          if [ -z "$ACTIVE_RUN" ]; then
            echo "No active pipeline run found. Proceeding with retest."
            echo "should_cancel=false" >> $GITHUB_OUTPUT
          else
            # Extract start time
            START_TIME=$(echo "$ACTIVE_RUN" | jq -r '.startedAt')
            START_EPOCH=$(date -d "$START_TIME" +%s)
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            ELAPSED_HOURS=$((ELAPSED / 3600))

            echo "Active pipeline found. Started at: $START_TIME"
            echo "Elapsed time: ${ELAPSED}s (${ELAPSED_HOURS}h)"

            # Check if pipeline started less than 1.5 hours ago (5400 seconds)
            if [ $ELAPSED -lt 5400 ]; then
              echo "Pipeline started less than 1.5 hours ago. Cancelling retest to avoid conflicts."
              echo "should_cancel=true" >> $GITHUB_OUTPUT
            else
              echo "Pipeline has been running for more than 1.5 hours. Proceeding with retest."
              echo "should_cancel=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Exit if pipeline is running
        if: steps.check_pipeline.outputs.should_cancel == 'true'
        run: |
          echo "⚠️ Retest cancelled: Main pipeline is currently running and started less than 1.5 hours ago."
          echo "ℹ️ Note: Dynamic cron rescheduling is not supported by GitHub Actions."
          echo "ℹ️ The next retest will run according to the standard 3-hour schedule."
          exit 0

      - name: Download latest pipeline output
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_RUN=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$LATEST_RUN" ]; then
            echo "No successful pipeline run found; skipping retest."
            exit 0
          fi
          if ! gh run download "$LATEST_RUN" \
            --name pipeline-output \
            --dir output; then
            echo "⚠️ Failed to download pipeline-output artifact; skipping retest."
            exit 0
          fi

          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "No output directory found after download; skipping retest."
            exit 0
          fi

      - name: Check previous output existence
        id: check_output
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        run: |
          if [ ! -s output/proxies.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No previous output/proxies.json or file is empty; skipping retest."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Retest last export
        if: steps.check_pipeline.outputs.should_cancel != 'true' && steps.check_output.outputs.skip != 'true'
        run: python -m configstream.cli retest --input output/proxies.json --output output --timeout 310 --max-workers 50 --leniency
      - name: Validate JSON (non-blocking)
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        run: |
          pip install jsonschema || true
          jsonschema -i output/proxies.json schema/proxy.schema.json || echo "::warning ::schema validation failed"

      - name: Verify output directory for upload
        id: verify_output
        if: steps.check_pipeline.outputs.should_cancel != 'true'
        run: |
          if [ -d "output" ] && [ -s "output/proxies.json" ] && [ -s "output/metadata.json" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "No output directory or missing critical files; skipping artifact upload."
          fi

      - name: Upload pipeline output artifact
        if: steps.verify_output.outputs.upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-output
          path: output/
          retention-days: 30

