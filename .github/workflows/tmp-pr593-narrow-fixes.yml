name: PR593 narrow one-shot

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit
    paths:
      - .github/workflows/tmp-pr593-narrow-fixes.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 0
      - name: Apply exact-anchor fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_pr593_narrow_fixes.py
          python -m py_compile \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py \
            tests/unit/test_backup_extended.py \
            tests/unit/test_cache_paths.py \
            tests/unit/test_cli_extended.py \
            tests/unit/test_dnsscanner_tui_lifecycle.py \
            tests/unit/test_publication_policy.py
          git diff --check
      - name: Commit fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp_pr593_narrow_fixes.py \
            .github/workflows/tmp-pr593-narrow-fixes.yml
          git config user.name "Farnam"
          git config user.email "taheri.farnam@gmail.com"
          git add -A
          git commit -m "fix(review): finish PR593 narrow findings"
          git push origin HEAD:codex/fix-run-34268254683-audit
