name: Stage Canonical Pages Source

on:
  push:
    branches: [agent/harden-release-deploy-integrity]
    paths:
      - '.github/workflows/stage-canonical-pages-source.yml'

permissions:
  contents: write

concurrency:
  group: stage-canonical-pages-source
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Transform and stage exact workflow bytes
        run: |
          set -euo pipefail
          python scripts/_stage_canonical_pages_source.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-staging/deploy-pages.yml
          git commit -m 'ci: stage canonical Pages workflow bytes'
          git push
