name: Validate Vwarp process reaping

on:
  push:
    branches: [codex/fix-run-34268254683-audit]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-run-34268254683-audit
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Apply and verify process reaping fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/configstream/tools/vwarp/tunnel.py')
          text = path.read_text(encoding='utf-8')
          old = '''    async def stop(self) -> None:\n        """Stops the background tunnel process."""\n        if self._proc:\n            try:\n                self._proc.terminate()\n                with suppress(asyncio.TimeoutError):\n                    await safe_wait_for(self._proc.wait(), timeout=2.0)\n            except ProcessLookupError:\n                pass\n            finally:\n                self._proc = None\n\n        for task in list(self._stream_tasks):\n            task.cancel()\n        self._stream_tasks.clear()\n        self._cleanup_config_file()\n'''
          new = '''    async def stop(self) -> None:\n        """Stop and reap the tunnel process and all owned stream tasks."""\n        process = self._proc\n        try:\n            if process is not None:\n                if process.returncode is None:\n                    with suppress(ProcessLookupError):\n                        process.terminate()\n                try:\n                    await safe_wait_for(process.wait(), timeout=2.0)\n                except asyncio.TimeoutError:\n                    logger.warning("Vwarp did not terminate in time; killing it.")\n                    if process.returncode is None:\n                        with suppress(ProcessLookupError):\n                            process.kill()\n                    try:\n                        await safe_wait_for(process.wait(), timeout=2.0)\n                    except asyncio.TimeoutError:\n                        logger.error("Vwarp process could not be reaped after kill.")\n        except Exception as exc:\n            logger.warning(\n                "Vwarp process cleanup failed: %s",\n                SecurityValidator.sanitize_log_message(str(exc)),\n            )\n        finally:\n            self._proc = None\n            tasks = list(self._stream_tasks)\n            for task in tasks:\n                task.cancel()\n            if tasks:\n                await asyncio.gather(*tasks, return_exceptions=True)\n            self._stream_tasks.clear()\n            self._cleanup_config_file()\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/tools/test_vwarp_tool.py')
          test_text = tests.read_text(encoding='utf-8')
          assert 'test_tunnel_stop_kills_reaps_and_awaits_stream_tasks' not in test_text
          test_text += '''\n\n@pytest.mark.asyncio\nasync def test_tunnel_stop_kills_reaps_and_awaits_stream_tasks(monkeypatch):\n    from configstream.tools.vwarp import tunnel as tunnel_module\n\n    class _Process:\n        returncode = None\n        terminated = False\n        killed = False\n        waited = 0\n\n        def terminate(self):\n            self.terminated = True\n\n        def kill(self):\n            self.killed = True\n\n        async def wait(self):\n            self.waited += 1\n            self.returncode = -9 if self.killed else 0\n            return self.returncode\n\n    calls = 0\n\n    async def _wait(awaitable, timeout):\n        nonlocal calls\n        calls += 1\n        if calls == 1:\n            close = getattr(awaitable, "close", None)\n            if close is not None:\n                close()\n            raise asyncio.TimeoutError\n        return await awaitable\n\n    monkeypatch.setattr(tunnel_module, "safe_wait_for", _wait)\n    process = _Process()\n    tunnel = VwarpTunnel("/tmp/vwarp")\n    tunnel._proc = process\n\n    finalized = asyncio.Event()\n\n    async def _reader():\n        try:\n            await asyncio.Event().wait()\n        finally:\n            finalized.set()\n\n    task = asyncio.create_task(_reader())\n    await asyncio.sleep(0)\n    tunnel._stream_tasks.add(task)\n\n    await tunnel.stop()\n\n    assert process.terminated is True\n    assert process.killed is True\n    assert process.waited == 1\n    assert tunnel._proc is None\n    assert task.done()\n    assert finalized.is_set()\n    assert tunnel._stream_tasks == set()\n'''
          tests.write_text(test_text, encoding='utf-8')
          PY
          python -m py_compile src/configstream/tools/vwarp/tunnel.py tests/unit/tools/test_vwarp_tool.py
          pytest -q tests/unit/tools/test_vwarp_tool.py --disable-warnings --maxfail=1
      - name: Commit Vwarp reaping fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/configstream/tools/vwarp/tunnel.py tests/unit/tools/test_vwarp_tool.py
          git commit -m 'fix(lifecycle): kill and reap stubborn Vwarp children'
          git push origin HEAD:codex/fix-run-34268254683-audit
