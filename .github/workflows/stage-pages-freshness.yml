name: Stage Final Pages Freshness Controls

on:
  push:
    branches: [agent/harden-release-deploy-integrity]
    paths:
      - '.github/workflows/stage-pages-freshness.yml'

permissions:
  contents: write

concurrency:
  group: stage-pages-freshness
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Transform and stage exact workflow bytes
        run: |
          set -euo pipefail
          # Enforce current-main freshness and suppress rollback before any deployment attempt.
          python scripts/_stage_pages_freshness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-staging/deploy-pages.yml
          git commit -m 'ci: stage Pages freshness workflow bytes'
          git push
