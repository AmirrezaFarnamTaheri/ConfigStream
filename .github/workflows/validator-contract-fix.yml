name: Validator Contract Fix

on:
  push:
    branches:
      - fix/frontend-public-key-injection

permissions:
  contents: write

jobs:
  apply:
    name: Enforce resilient workflow contract
    if: ${{ github.repository == 'AmirrezaFarnamTaheri/ConfigStream' && github.actor == 'AmirrezaFarnamTaheri' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/frontend-public-key-injection
      TARGET_PATH: scripts/validate_workflows.py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/frontend-public-key-injection
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact fail-closed contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_workflows.py")
          content = path.read_text(encoding="utf-8")
          old = '''def _main_resilient_contract(data: dict[Any, Any]) -> list[str]:
              if not _has_command(data, "scripts/resilient_stage.py"):
                  return []
          '''
          new = '''def _main_resilient_contract(data: dict[Any, Any]) -> list[str]:
              if not _has_command(data, "scripts/resilient_stage.py"):
                  return [
                      "main workflow must orchestrate stages through scripts/resilient_stage.py"
                  ]
          '''
          if content.count(old) != 1:
              raise SystemExit("expected resilient contract block was not found exactly once")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY
          pip install 'black==26.5.1'
          python -m black --fast --target-version py310 "$TARGET_PATH"
          python -m black --check --fast --target-version py310 "$TARGET_PATH"
          python -m py_compile "$TARGET_PATH"
      - name: Commit exact validator content through GitHub API
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}" --jq .sha)
          encoded=$(base64 -w0 "$TARGET_PATH")
          jq -n \
            --arg message "fix(ci): require resilient workflow orchestration" \
            --arg content "$encoded" \
            --arg sha "$current_sha" \
            --arg branch "$TARGET_BRANCH" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}" --input - >/dev/null
