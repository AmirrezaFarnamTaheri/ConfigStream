name: Producer Size Remediation

on:
  push:
    branches: [agent/bound-source-test-work]
    paths:
      - '.github/workflows/producer-size-remediation.yml'

permissions:
  contents: write

concurrency:
  group: producer-size-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/bound-source-test-work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Extract remote-source assessment boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/configstream/pipeline/producer.py')
          text = path.read_text(encoding='utf-8')

          helper_anchor = '''\n\ndef _is_direct_proxy(candidate: str) -> bool:\n'''
          helper = '''\n\nasync def _validate_and_budget_remote_source(\n    loop: asyncio.AbstractEventLoop,\n    anomaly_detector: AnomalyDetector,\n    settings: AppSettings,\n    source: str,\n    safe_source: str,\n    lines: List[str],\n    drop_stats: dict[str, int],\n    raw_count: int,\n    enable_anomaly_detection: bool,\n) -> tuple[List[str], bool, str]:\n    \"\"\"Score a full remote source, then bound candidates before testing.\"\"\"\n\n    if enable_anomaly_detection:\n        try:\n            is_safe, reason = await loop.run_in_executor(\n                None, anomaly_detector.is_safe, source, raw_count\n            )\n        except Exception as ad_err:\n            safe_err = SecurityValidator.sanitize_log_message(str(ad_err))\n            logger.warning(\n                \"Anomaly check failed for %s (%s); failing open\",\n                safe_source,\n                safe_err,\n            )\n            is_safe, reason = (\n                True,\n                f\"Anomaly detector error (Fail Open): {safe_err}\",\n            )\n    else:\n        is_safe, reason = True, \"Anomaly detection disabled\"\n\n    if not is_safe:\n        return lines, False, reason\n\n    logger.debug(\n        \"Anomaly check passed for %s (Count: %d)\",\n        safe_source,\n        raw_count,\n    )\n    if enable_anomaly_detection:\n        try:\n            await loop.run_in_executor(None, anomaly_detector.record, source, raw_count)\n        except Exception as rec_err:\n            safe_rec_err = SecurityValidator.sanitize_log_message(str(rec_err))\n            logger.debug(\n                \"Anomaly record failed for %s: %s\", safe_source, safe_rec_err\n            )\n\n    selected, exact_duplicate_drops, budget_drops = select_source_candidates(\n        lines,\n        source=source,\n        limit=int(settings.MAX_REMOTE_TEST_CANDIDATES_PER_SOURCE),\n    )\n    if exact_duplicate_drops:\n        drop_stats[\"source_exact_duplicate\"] = (\n            int(drop_stats.get(\"source_exact_duplicate\", 0))\n            + exact_duplicate_drops\n        )\n    if budget_drops:\n        drop_stats[\"source_candidate_budget\"] = (\n            int(drop_stats.get(\"source_candidate_budget\", 0)) + budget_drops\n        )\n        logger.warning(\n            \"Source candidate budget applied: \"\n            \"source=%s parsed=%d retained=%d dropped=%d\",\n            safe_source,\n            raw_count,\n            len(selected),\n            budget_drops,\n        )\n    return selected, True, reason\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('producer helper anchor not unique')
          if '_validate_and_budget_remote_source' in text:
              raise SystemExit('producer helper already present')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          start_marker = '''                        # Offload anomaly check to executor to avoid blocking on DB/ML\n'''
          end_marker = '''\n                                # Prepare metadata and fetch time\n'''
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('producer anomaly block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('producer anomaly block end not found')
          replacement = '''                        lines, is_safe, reason = await _validate_and_budget_remote_source(\n                            loop,\n                            anomaly_detector,\n                            settings,\n                            source,\n                            safe_source,\n                            lines,\n                            drop_stats,\n                            count,\n                            enable_anomaly_detection,\n                        )\n\n                        if is_safe:\n                            if lines:\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Regenerate ratchets and validate
        run: |
          set -euo pipefail
          python scripts/generate_debt_matrix.py
          python scripts/validate_function_size_budget.py --write
          python -m py_compile src/configstream/pipeline/producer.py
          python -m pytest -q \
            tests/unit/test_candidate_budget.py \
            tests/unit/test_configuration_documentation_contract.py \
            tests/unit/test_go_tester_runtime_budget.py \
            tests/unit/test_go_tester_streaming.py
          python scripts/generate_debt_matrix.py --check
          python scripts/validate_function_size_budget.py
          python scripts/verify_repository.py --profile static
      - name: Commit refactor and lower size budget
        run: |
          set -euo pipefail
          git config user.name 'configstream-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/configstream/pipeline/producer.py \
            config/function-size-budget.json \
            docs/debt_matrix.json \
            docs/DEBT_MATRIX.md
          git commit -m 'refactor(runtime): extract remote source assessment boundary'
          git push origin HEAD:agent/bound-source-test-work
