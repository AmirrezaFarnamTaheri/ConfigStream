name: PR583 Debt Artifact

on:
  push:
    branches:
      - aux/pr583-debt-artifact-d030501e

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Generate debt matrix
        run: python3 scripts/generate_debt_matrix.py
      - name: Create unreferenced generated blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          create_blob() {
            local file="$1"
            local label="$2"
            local payload sha
            payload="$(base64 -w0 "$file" | jq -Rs '{content: ., encoding: "base64"}')"
            sha="$(curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/blobs" \
              -d "$payload" | jq -r '.sha')"
            test -n "$sha" && test "$sha" != "null"
            echo "${label}=${sha}"
          }
          create_blob docs/debt_matrix.json DEBT_JSON_BLOB
          create_blob docs/DEBT_MATRIX.md DEBT_MD_BLOB
      - name: Upload generated debt matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr583-debt-matrix
          path: |
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
          if-no-files-found: error
          retention-days: 1
