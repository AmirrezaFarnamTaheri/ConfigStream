name: Regenerate Audit Evidence

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Ratchet fetcher recovery boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/configstream/pipeline/fetcher.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''# Use AppSettings if available, otherwise default\ntry:\n    MAX_RESPONSE_SIZE = AppSettings().MAX_RESPONSE_SIZE\nexcept Exception:\n    logging.getLogger(__name__).debug("Suppressed broad exception")\n    MAX_RESPONSE_SIZE = 10 * 1024 * 1024\n''': '''# Conservative module fallback; per-run settings remain authoritative.\nMAX_RESPONSE_SIZE = 10 * 1024 * 1024\n''',
              '''    breaker = None\n    if breaker_manager:\n        try:\n            parsed = urlparse(source)\n            host = parsed.netloc\n            key = host\n        except Exception:\n            logging.getLogger(__name__).debug("Suppressed broad exception")\n            key = source\n\n        breaker = await breaker_manager.get_breaker(key)\n''': '''    breaker = None\n    if breaker_manager:\n        key = urlparse(source).netloc or source\n        breaker = await breaker_manager.get_breaker(key)\n''',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit("expected fetcher ratchet block was not found")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate deterministic supply-chain evidence
        run: python scripts/generate_supply_chain_evidence.py
      - name: Validate ratchet and generated evidence
        run: |
          python scripts/validate_exception_boundaries.py
          python scripts/generate_supply_chain_evidence.py --check
      - name: Commit generated and ratcheted files if changed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/configstream/pipeline/fetcher.py
            docs/generated/sbom.cdx.json
            docs/generated/dependency-licenses.json
            docs/generated/dependency-licenses.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Audit ratchet and generated evidence are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "chore: refresh audited evidence and exception ratchet"
          git push origin "HEAD:${GITHUB_REF_NAME}"
