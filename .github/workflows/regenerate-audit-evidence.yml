name: Regenerate Audit Evidence

on:
  push:
    branches:
      - feat/post-audit-remediation-v3.1.0

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Regenerate deterministic supply-chain evidence
        run: python scripts/generate_supply_chain_evidence.py
      - name: Commit generated evidence if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            docs/generated/sbom.cdx.json \
            docs/generated/dependency-licenses.json \
            docs/generated/dependency-licenses.md; then
            echo "Generated supply-chain evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/generated/sbom.cdx.json \
            docs/generated/dependency-licenses.json \
            docs/generated/dependency-licenses.md
          git commit -m "chore: regenerate supply-chain evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
