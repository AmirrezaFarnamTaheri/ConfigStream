name: Remediation CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/configstream/testers/python.py'
      - 'tests/unit/test_release_remediation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .[dev]
      - name: Compile changed Python
        run: |
          python -m py_compile \
            scripts/aggregate_shard_health.py \
            scripts/finalize_release_outputs.py \
            scripts/native_client_checks.py \
            scripts/normalize_legacy_profiles.py \
            scripts/release_gate.py \
            scripts/shard_sources.py \
            src/configstream/testers/python.py
      - name: Run remediation regression tests
        id: pytest
        continue-on-error: true
        run: pytest -q tests/unit/test_release_remediation.py --junitxml=pytest-remediation.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: remediation-pytest-${{ github.sha }}-${{ github.run_attempt }}
          path: pytest-remediation.xml
          if-no-files-found: error
      - name: Enforce test result
        if: steps.pytest.outcome != 'success'
        run: exit 1

  repair-client-contracts:
    if: github.head_ref == 'fix/pages-artifact-contract-drift' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply focused regression fixes
        run: python scripts/fix_client_contract_regressions.py
      - name: Regenerate output documentation
        run: python scripts/generate_output_docs.py
      - name: Restore trusted workflow definition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:.github/workflows/remediation-ci.yml" > .github/workflows/remediation-ci.yml
      - name: Format changed Python files
        run: |
          python -m black \
            scripts/finalize_release_outputs.py \
            scripts/validate_output_matrix.py \
            src/configstream/output/singbox_contract.py \
            tests/unit/test_output.py \
            tests/unit/test_output_generators.py \
            tests/unit/test_validate_pages_artifact.py
      - name: Compile focused Python files
        id: focused_compile
        continue-on-error: true
        run: |
          set -o pipefail
          python -m py_compile \
            scripts/finalize_release_outputs.py \
            scripts/validate_output_matrix.py \
            src/configstream/output/singbox_contract.py \
            tests/unit/test_output.py \
            tests/unit/test_output_generators.py \
            tests/unit/test_validate_pages_artifact.py 2>&1 | tee focused-compile.log
      - name: Validate output matrix
        id: focused_matrix
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/validate_output_matrix.py 2>&1 | tee focused-matrix.log
      - name: Check generated output documentation
        id: focused_docs
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/generate_output_docs.py --check 2>&1 | tee focused-docs.log
      - name: Run focused contract tests
        id: focused_tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q \
            tests/unit/test_validate_pages_artifact.py \
            tests/unit/test_validate_output_matrix.py \
            tests/unit/test_output_generators.py \
            tests/unit/test_output.py \
            --disable-warnings --maxfail=1 \
            --junitxml=focused-tests.xml 2>&1 | tee focused-tests.log
      - name: Check patch whitespace
        id: focused_diff
        continue-on-error: true
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee focused-diff.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-contract-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            focused-compile.log
            focused-matrix.log
            focused-docs.log
            focused-tests.log
            focused-tests.xml
            focused-diff.log
          if-no-files-found: error
      - name: Enforce focused validation
        if: >-
          steps.focused_compile.outcome != 'success' ||
          steps.focused_matrix.outcome != 'success' ||
          steps.focused_docs.outcome != 'success' ||
          steps.focused_tests.outcome != 'success' ||
          steps.focused_diff.outcome != 'success'
        run: exit 1
      - name: Commit validated changes through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          expected_sha = os.environ["EXPECTED_SHA"]
          api_root = f"https://api.github.com/repos/{repository}"

          def request(method: str, path: str, payload: object | None = None) -> dict:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          current_ref = request("GET", f"/git/ref/heads/{encoded_branch}")
          current_sha = current_ref["object"]["sha"]
          if current_sha != expected_sha:
              raise SystemExit(
                  f"branch moved during repair: expected {expected_sha}, found {current_sha}"
              )

          status_lines = subprocess.check_output(
              ["git", "diff", "--name-status", "--no-renames", "HEAD"],
              text=True,
          ).splitlines()
          if not status_lines:
              raise SystemExit("repair produced no changes")

          parent = request("GET", f"/git/commits/{expected_sha}")
          entries: list[dict[str, object]] = []
          for line in status_lines:
              status, path = line.split("\t", 1)
              if status == "D":
                  entries.append(
                      {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  )
                  continue
              if status != "M":
                  raise SystemExit(f"unsupported working-tree status {status}: {path}")
              content = base64.b64encode(open(path, "rb").read()).decode("ascii")
              blob = request(
                  "POST", "/git/blobs", {"content": content, "encoding": "base64"}
              )
              entries.append(
                  {
                      "path": path,
                      "mode": "100644",
                      "type": "blob",
                      "sha": blob["sha"],
                  }
              )

          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": parent["tree"]["sha"], "tree": entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "fix(outputs): close client contract regressions",
                  "tree": tree["sha"],
                  "parents": [expected_sha],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{encoded_branch}",
              {"sha": commit["sha"], "force": False},
          )
          print(f"created validated commit {commit['sha']}")
          PY
