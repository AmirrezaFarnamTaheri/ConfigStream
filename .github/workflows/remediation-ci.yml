name: Remediation CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/configstream/testers/python.py'
      - 'tests/unit/test_release_remediation.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions