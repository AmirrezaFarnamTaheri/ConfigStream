name: Black Format Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned formatter
        run: python -m pip install -r requirements-dev.txt
      - name: Format changed Python files and push once
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py'
          )
          if ((${#python_files[@]} == 0)); then
            echo "No changed Python files to format."
            exit 0
          fi
          python -m black --fast --target-version py310 "${python_files[@]}"
          python -m black --check --fast --target-version py310 "${python_files[@]}"
          if git diff --quiet -- "${python_files[@]}"; then
            echo "Changed Python files are already Black-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${python_files[@]}"
          git diff --cached --check
          git commit -m "style: format changed Python files with black"
          git push origin "HEAD:${BRANCH}"
