name: Refresh Release Governance Evidence

on:
  push:
    branches: [agent/harden-release-deploy-integrity]
    paths:
      - '.github/workflows/refresh-release-governance.yml'

permissions:
  contents: write

concurrency:
  group: refresh-release-governance
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Regenerate governed evidence
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/environment-variables.json docs/generated/environment-variables.md docs/DEBT_MATRIX.md docs/debt_matrix.json
          if git diff --cached --quiet; then
            echo 'Governed evidence already current.'
            exit 0
          fi
          git commit -m 'docs: refresh governed release evidence'
          git push
