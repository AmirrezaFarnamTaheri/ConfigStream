name: PR593 one-shot review fixes

on:
  push:
    branches:
      - codex/fix-run-34268254683-audit

permissions:
  contents: write

concurrency:
  group: pr593-one-shot-review-fixes
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Apply exact review fixes
        run: python scripts/tmp_pr593_review_fixes.py
      - name: Validate exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pip install -e . --no-deps >/dev/null
          python -m black --check --fast --target-version py310 \
            scripts/tmp_pr593_review_fixes.py \
            scripts/validate_workflows.py scripts/verify_repository.py \
            src/configstream/cli.py src/configstream/anomaly.py \
            src/configstream/backup.py src/configstream/quality/storage.py \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py
          python scripts/validate_workflows.py
          python scripts/generate_debt_matrix.py --check
          python scripts/generate_environment_catalog.py --check
          git diff --check
      - name: Commit fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr593-review-fixes.yml scripts/tmp_pr593_review_fixes.py
          git add \
            .github/workflows/main.yml \
            scripts/validate_workflows.py scripts/verify_repository.py \
            src/configstream/cli.py src/configstream/anomaly.py \
            src/configstream/backup.py src/configstream/quality/storage.py \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py
          git commit -m "fix(review): close functional PR593 findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
