name: Stage Audited Main Workflow

on:
  push:
    branches: [agent/fix-active-audit-items]
    paths:
      - '.github/workflows/surgical-remediation.yml'

permissions:
  contents: write

concurrency:
  group: stage-audited-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Build exact audited workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/main.yml')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('  SOURCE_SHARD_PARTS: "6"', '  SOURCE_SHARD_PARTS: "9"'),
              (
                  '      - name: Run every mandatory release gate\n        run: |\n',
                  '      - name: Run every mandatory release gate\n'
                  '        env:\n'
                  '          CS_PUBLIC_KEY: ${{ secrets.CS_PUBLIC_KEY }}\n'
                  '        run: |\n',
              ),
              (
                  '            tests/unit/test_resilient_stage.py \\\n            --disable-warnings --maxfail=1',
                  '            tests/unit/test_resilient_stage.py \\\n            tests/unit/test_active_audit_remediation.py \\\n            --disable-warnings --maxfail=1',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one workflow replacement for {old!r}')
              text = text.replace(old, new, 1)
          Path('audit-main.yml').write_text(text, encoding='utf-8')
          PY
      - name: Stage workflow as a non-workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 audit-main.yml)"
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/audit-main.yml?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          args=(
            --method PUT
            -H 'Accept: application/vnd.github+json'
            "/repos/${GITHUB_REPOSITORY}/contents/audit-main.yml"
            -f message='chore: stage audited main workflow blob'
            -f content="$encoded"
            -f branch="$GITHUB_REF_NAME"
          )
          if [ -n "$existing" ]; then
            args+=( -f sha="$existing" )
          fi
          gh api "${args[@]}" >/dev/null
