name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["ConfigStream Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download Pipeline Output
        uses: dawidd6/action-download-artifact@v3
        with:
          name: pipeline-output
          path: output
          workflow: pipeline.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Verify output directory exists
        run: |
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "Error: output directory is missing or empty"
            exit 1
          fi
          # Verify critical files exist
          test -f output/metadata.json
          test -f output/proxies.json

      - name: Build Pages artifact
        run: |
          set -euxo pipefail

          # The pipeline output artifact already contains the fully generated site.
          # We just need to add API simulation and ensure .nojekyll.

          # Create API simulation structure
          mkdir -p output/api
          cp output/proxies.json output/api/proxies
          cp output/metadata.json output/api/stats

          # Ensure .nojekyll exists
          touch output/.nojekyll

          # Update cache version
          ts=$(date +%Y%m%d%H%M%S)
          if [ -f output/assets/js/cache-config.js ]; then
             sed -i "s/const VERSION = '[^']*'/const VERSION = '${ts}'/" output/assets/js/cache-config.js
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: 'echo "Pages deployed to: ${{ steps.deployment.outputs.page_url }}"'
