name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Config's Stream", "Retest"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Locate, Verify