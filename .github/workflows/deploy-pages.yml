name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["ConfigStream Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download Pipeline Output
        uses: dawidd6/action-download-artifact@v3
        with:
          name: pipeline-output
          path: output
          workflow: pipeline.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Verify output directory exists
        run: |
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "Error: output directory is missing or empty"
            exit 1
          fi
          # Verify critical files exist
          test -f output/metadata.json
          test -f output/proxies.json

      - name: Build Pages artifact
        run: |
          set -euxo pipefail
          rm -rf github_pages_root
          mkdir -p github_pages_root
          mkdir -p github_pages_root/api # API Simulation
          mkdir -p github_pages_root/wiki
          mkdir -p github_pages_root/about

          cp -v .nojekyll github_pages_root/.nojekyll || true

          # Move pages to expected structure for clean URLs and relative path support
          cp frontend/index.html github_pages_root/
          cp frontend/proxies.html github_pages_root/
          cp frontend/analytics.html github_pages_root/

          # Move sub-pages to their folders
          cp frontend/wiki.html github_pages_root/wiki/index.html
          cp frontend/about.html github_pages_root/about/index.html

          cp frontend/service-worker.js github_pages_root/

          cp -rv frontend/assets github_pages_root/assets

          # Use the output from the repository (already committed by pipeline)
          # 'output' artifacts should be placed in 'output/' inside pages root
          # Note: The download step places them in 'output' folder in workspace.
          cp -rv output github_pages_root/

          # API Simulation
          # Tricks the frontend into thinking it's hitting an API
          cp output/proxies.json github_pages_root/api/proxies
          cp output/metadata.json github_pages_root/api/stats

          # Fallback Simulation (Static Hosting Support)
          # Copies JSON files to root so utils.js fallback fetch works (e.g. fetch('proxies.json'))
          [ -f output/proxies.json ] && cp output/proxies.json github_pages_root/ || true
          [ -f output/metadata.json ] && cp output/metadata.json github_pages_root/ || true
          [ -f output/statistics.json ] && cp output/statistics.json github_pages_root/ || true

          ts=$(date +%Y%m%d%H%M%S)
          sed -i "s/const VERSION = '[^']*'/const VERSION = '${ts}'/" github_pages_root/assets/js/cache-config.js

          test -s github_pages_root/index.html
          test -d github_pages_root/output
          test -s github_pages_root/api/proxies
          # Ensure there is some data to deploy
          test -n "$(find github_pages_root/output -name '*.json' -print -quit)"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github_pages_root
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: 'echo "Pages deployed to: ${{ steps.deployment.outputs.page_url }}"'
