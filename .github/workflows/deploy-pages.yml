name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Config's Stream", "Retest"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Init deploy flags
        run: |
          echo "HAS_OUTPUT=false" >> "$GITHUB_ENV"

      - name: Download Pipeline Output (from workflow_run)
        if: github.event_name == 'workflow_run'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download artifact from the triggering workflow run using GitHub CLI
          if ! gh run download ${{ github.event.workflow_run.id }} \
              --name pipeline-output \
              --dir output; then
            if [ "${{ github.event.workflow_run.name }}" = "Retest" ]; then
              echo "⚠️ No pipeline-output artifact found for Retest run; skipping Pages deploy."
              exit 0
            fi
            echo "Error: Failed to download pipeline-output artifact"
            exit 1
          fi

          # Verify download succeeded
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            if [ "${{ github.event.workflow_run.name }}" = "Retest" ]; then
              echo "⚠️ output directory is missing/empty for Retest run; skipping Pages deploy."
              exit 0
            fi
            echo "Error: output directory is missing or empty after download"
            exit 1
          fi

          echo "HAS_OUTPUT=true" >> "$GITHUB_ENV"

      - name: Download Pipeline Output (from workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GH_TOKEN: ${{ github.token }}
        run: |
          # For manual dispatch, download from the latest successful pipeline run
          LATEST_RUN=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')

          if [ -z "$LATEST_RUN" ]; then
            echo "Error: No successful pipeline run found"
            exit 1
          fi

          echo "Downloading artifact from run: $LATEST_RUN"
          gh run download $LATEST_RUN \
            --name pipeline-output \
            --dir output

          # Verify download succeeded
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "Error: Failed to download pipeline-output artifact"
            exit 1
          fi

          echo "HAS_OUTPUT=true" >> "$GITHUB_ENV"

      - name: Verify output directory exists
        if: env.HAS_OUTPUT == 'true'
        run: |
          if [ ! -d "output" ] || [ -z "$(ls -A output)" ]; then
            echo "Error: output directory is missing or empty"
            exit 1
          fi
          # Verify critical files exist
          test -f output/metadata.json
          test -f output/proxies.json

      - name: Setup Python
        if: env.HAS_OUTPUT == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Build Pages artifact
        if: env.HAS_OUTPUT == 'true'
        run: |
          set -euxo pipefail

          # The pipeline output artifact contains data outputs; we add frontend assets,
          # API simulation, and ensure .nojekyll for a complete Pages site.
          
          # Merge frontend assets into output for GitHub Pages
          if [ -d "frontend" ]; then
            cp -R frontend/. output/
          fi

          # Create API simulation structure
          mkdir -p output/api

          # Required artifacts: fail fast with clear message if missing
          # Keep this list aligned with frontend references to avoid silent 404s on GitHub Pages.
          # Some subscription files can be legitimately empty (e.g. during hostile CI networking
          # when all tests fail, or when sources are temporarily down). For those, we require
          # existence but do not require non-empty.
          required_exists=(
            output/proxies.json
            output/metadata.json
            output/base64.txt
            output/base64-dns-safe.txt
            output/base64-dns-hardened.txt
            output/proxies.txt
            output/proxies-dns-safe.txt
            output/proxies-dns-hardened.txt
            output/singbox.json
            output/singbox-dns-safe.json
            output/singbox-dns-hardened.json
            output/singbox-vpn.json
            output/singbox-vpn-dns-safe.json
            output/singbox-vpn-dns-hardened.json
            output/clash.yaml
            output/clash-dns-safe.yaml
            output/clash-dns-hardened.yaml
            output/singbox-chains.json
            output/singbox-chains-dns-safe.json
            output/singbox-chains-dns-hardened.json
            output/chains.json
            output/chains-dns-safe.json
            output/chains-dns-hardened.json
            output/side_products.zip
            output/side_products-dns-safe.zip
            output/side_products-dns-hardened.zip
            output/chosen/base64.txt
            output/chosen/base64-dns-safe.txt
            output/chosen/base64-dns-hardened.txt
            output/data/clean_ips.json
            output/data/proxy_history_viz.json
            output/data/active_proxy_trend.json
            output/data/evasion_trend.json
            output/docs/wiki/index.md
            output/index.html
          )

          required_nonempty=(
            output/proxies.json
            output/metadata.json
            output/singbox.json
            output/singbox-dns-safe.json
            output/singbox-dns-hardened.json
            output/singbox-vpn.json
            output/singbox-vpn-dns-safe.json
            output/singbox-vpn-dns-hardened.json
            output/clash.yaml
            output/clash-dns-safe.yaml
            output/clash-dns-hardened.yaml
            output/singbox-chains.json
            output/singbox-chains-dns-safe.json
            output/singbox-chains-dns-hardened.json
            output/chains.json
            output/chains-dns-safe.json
            output/chains-dns-hardened.json
            output/side_products.zip
            output/side_products-dns-safe.zip
            output/side_products-dns-hardened.zip
            output/data/clean_ips.json
            output/data/proxy_history_viz.json
            output/data/active_proxy_trend.json
            output/data/evasion_trend.json
            output/docs/wiki/index.md
            output/index.html
          )

          for f in "${required_exists[@]}"; do
            [ -f "$f" ] || { echo "ERROR: missing required file: $f"; exit 1; }
          done
          for f in "${required_nonempty[@]}"; do
            [ -s "$f" ] || { echo "ERROR: required file is empty: $f"; exit 1; }
          done

          cp output/proxies.json output/api/proxies
          cp output/metadata.json output/api/stats

          # Ensure .nojekyll exists
          touch output/.nojekyll

          # Exclude test_cache.json from deploy (audit: ~18 MB, not needed for static site)
          rm -f output/data/test_cache.json

          # Update cache version
          ts=$(date +%Y%m%d%H%M%S)
          cache_version="v${ts}"
          if [ -f output/assets/js/cache-config.js ]; then
             sed -i "s/VERSION: '[^']*'/VERSION: '${cache_version}'/" output/assets/js/cache-config.js
             sed -i "s/CACHE_NAME: 'configstream-cache-[^']*'/CACHE_NAME: 'configstream-cache-${cache_version}'/" output/assets/js/cache-config.js
          fi

      - name: List deployment files
        if: env.HAS_OUTPUT == 'true'
        run: |
          echo "=== Files to be deployed ==="
          find output -type f | head -20
          echo ""
          echo "=== Critical files verification ==="
          ls -lh output/proxies.json output/metadata.json
          echo ""
          echo "=== Total size ==="
          du -sh output

      - name: Upload pages artifact
        if: env.HAS_OUTPUT == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: env.HAS_OUTPUT == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10

      - name: Verify deployment
        if: env.HAS_OUTPUT == 'true'
        run: |
          echo "✅ Pages deployed successfully!"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployment completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          # Output deployment details
          echo ""
          echo "=== Deployment Summary ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"

      - name: Trigger CDN cache purge
        if: always() && env.HAS_OUTPUT == 'true'
        run: |
          # Add cache-busting hint for browsers
          echo "NOTE: If you don't see updates immediately, clear your browser cache or use Ctrl+F5"
          echo "The deployment URL includes a cache version timestamp to force refreshes"
