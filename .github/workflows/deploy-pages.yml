name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Config's Stream", "Retest"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Locate, Verify, and Deploy Sealed Artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Initialise deployment evidence
        run: |
          set -euo pipefail
          mkdir -p deploy-evidence/stages
          python scripts/resilient_stage.py context --output deploy-evidence/workflow_context.json
          echo "HAS_OUTPUT=false" >> "$GITHUB_ENV"
          echo "DEPLOY_READY=false" >> "$GITHUB_ENV"
      - name: Locate and download exact canonical artifact
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          selected=""
          rc=1
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            selected="$TRIGGER_RUN_ID"
            if gh run download "$selected" --repo "$REPOSITORY" --name pipeline-output --dir output; then rc=0; fi
          fi
          if [ "$rc" -eq 0 ] && [ -s output/metadata.json ] && [ -s output/proxies.json ]; then
            echo "HAS_OUTPUT=true" >> "$GITHUB_ENV"
            echo "source_run_id=$selected" >> "$GITHUB_OUTPUT"
            python scripts/resilient_stage.py record --name locate-pipeline-output --status success
          else
            rm -rf output
            echo "source_run_id=${selected:-none}" >> "$GITHUB_OUTPUT"
            python scripts/resilient_stage.py record --name locate-pipeline-output --status failed --description "Canonical pipeline output unavailable"
          fi
      - name: Verify artifact without mutation
        id: verify
        if: env.HAS_OUTPUT == 'true'
        run: |
          set -euo pipefail
          python scripts/resilient_stage.py run --name verify-sealed-pages-artifact --timeout 600 -- bash -lc '
            set -euo pipefail
            before=$(find output -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d" " -f1)
            python scripts/validate_frontend_placeholders.py --strict output
            python scripts/validate_pages_artifact.py output
            after=$(find output -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d" " -f1)
            test "$before" = "$after"
          '
          echo "DEPLOY_READY=true" >> "$GITHUB_ENV"
      - name: Upload sealed Pages artifact
        id: pages_artifact
        if: env.DEPLOY_READY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
          retention-days: 30
      - name: Deploy to GitHub Pages
        id: deployment
        if: env.DEPLOY_READY == 'true' && steps.pages_artifact.outcome == 'success'
        uses: actions/deploy-pages@v5
      - name: Smoke deployed Pages URL
        if: steps.deployment.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/resilient_stage.py run --name smoke-pages --timeout 600 -- python scripts/verify_pages_deployment.py "${{ steps.deployment.outputs.page_url }}" --report-file deploy-evidence/smoke-report.json
      - name: Generate deployment evidence bundle
        if: always()
        run: |
          set -euo pipefail
          if [ -d output ]; then
            python scripts/resilient_stage.py run --name deployment-evidence-bundle --report-dir deploy-evidence/stages -- python scripts/generate_evidence_bundle.py --output-dir output --evidence-dir deploy-evidence --smoke-report deploy-evidence/smoke-report.json
          fi
          python scripts/resilient_stage.py summary --report-dir deploy-evidence/stages --output deploy-evidence/stage_summary.json
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Deployment disposition
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          path = Path("deploy-evidence/stage_summary.json")
          summary = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"stages": []}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Pages deployment disposition\n")
              for stage in summary.get("stages", []):
                  handle.write(f"- `{stage.get('name')}`: **{stage.get('status')}**\n")
          if any(stage.get("status") == "failed" for stage in summary.get("stages", [])):
              raise SystemExit("Pages deployment failed closed")
          PY
