name: Deploy Sealed Release to GitHub Pages

on:
  workflow_run:
    workflows: ["ConfigStream Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Exact successful ConfigStream Pipeline run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve exact source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_run' ]; then
            run_id="$EVENT_RUN_ID"
            head_sha="$EVENT_HEAD_SHA"
          else
            run_id="$MANUAL_RUN_ID"
            test -n "$run_id"
            metadata=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id")
            conclusion=$(jq -r '.conclusion' <<<"$metadata")
            workflow_name=$(jq -r '.name' <<<"$metadata")
            test "$conclusion" = 'success'
            test "$workflow_name" = 'ConfigStream Pipeline'
            head_sha=$(jq -r '.head_sha' <<<"$metadata")
          fi
          case "$run_id" in (*[!0-9]*|'') echo 'Invalid run ID' >&2; exit 1;; esac
          case "$head_sha" in ([0-9a-f][0-9a-f]*) ;; (*) echo 'Invalid head SHA' >&2; exit 1;; esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Download exact sealed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --name "pipeline-output-$RUN_ID" \
            --dir output
          test -s output/proxies.json
          test -s output/metadata.json
          test -s output/release_manifest.json
      - name: Verify release identity, expiry, and every artifact digest
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$EXPECTED_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("output")
          manifest = json.loads((root / "release_manifest.json").read_text())
          expected_sha = sys.argv[1]
          if manifest.get("source_commit_sha") != expected_sha:
              raise SystemExit("source SHA mismatch")
          expires = datetime.fromisoformat(str(manifest["expires_at"]).replace("Z", "+00:00"))
          if datetime.now(timezone.utc) >= expires:
              raise SystemExit("release expired")
          expected = manifest.get("artifact_digests")
          if not isinstance(expected, dict) or not expected:
              raise SystemExit("missing artifact digest map")
          for rel, digest in sorted(expected.items()):
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f"missing sealed artifact: {rel}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"artifact digest mismatch: {rel}")
          actual_files = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and p.name != "release_manifest.json"
          }
          if actual_files != set(expected):
              raise SystemExit("sealed file membership mismatch")
          print(manifest["release_id"])
          PY
      - name: Validate deploy artifact without mutation
        run: |
          set -euo pipefail
          python scripts/validate_pages_artifact.py --native-client-check output
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output
          retention-days: 30
      - id: deployment
        uses: actions/deploy-pages@v5
        timeout-minutes: 10
      - name: Smoke test deployed release
        run: |
          set -euo pipefail
          python scripts/verify_pages_deployment.py \
            '${{ steps.deployment.outputs.page_url }}' \
            --report-file smoke-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-evidence-${{ steps.source.outputs.run_id }}
          path: smoke-report.json
          if-no-files-found: error
          retention-days: 30
