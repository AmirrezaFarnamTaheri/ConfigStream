name: Suppression Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install bandit
      - name: Validate suppressions with active findings
        id: validate
        continue-on-error: true
        run: |
          python scripts/validate_bandit_suppressions.py --require-active \
            > suppression-diagnostics.txt 2>&1
      - name: Upload suppression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suppression-diagnostics-${{ github.run_id }}
          path: suppression-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce suppression result
        if: steps.validate.outcome == 'failure'
        run: exit 1
