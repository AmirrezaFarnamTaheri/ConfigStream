name: Apply verified CI failure fixes

on:
  push:
    branches: [agent/full-audit-remediation]
    paths: [.github/workflows/apply-ci-failure-fixes.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-audit-remediation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Apply guarded fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/unit/test_documentation_hygiene.py',
              '''    assert "not production-ready" in normalized
              assert "repository production gate | **open**" in normalized
              assert "release gate | **blocked**" in normalized
              assert "remediation in progress" in normalized
''',
              '''    assert "fail — release blocked" in normalized
              assert "must not be called production-ready" in normalized
              assert "machine-readable release gate" in normalized
              assert "pr #510" in normalized
''',
          )
          replace_once(
              'tests/unit/test_documentation_hygiene.py',
              '''    assert "Development Status :: 5 - Production/Stable" in pyproject
              assert "Development Status :: 4 - Beta" not in pyproject
              assert "production-ready as of v3.1.0" in readme
              assert "older production-ready claims are superseded" not in readme
''',
              '''    assert "Development Status :: 4 - Beta" in pyproject
              assert "Development Status :: 5 - Production/Stable" not in pyproject
              assert "production-ready as of v3.1.0" not in readme
              assert "older production-ready claims are superseded" in readme
''',
          )

          replace_once(
              'tests/unit/test_security_headers.py',
              '    assert response.status_code == 200\n',
              '    assert response.status_code == 503\n    assert response.json()["ready"] is False\n',
          )
          replace_once(
              'tests/unit/test_security_validator_extra.py',
              '''        assert len(secure) == 2
              assert secure[0].address == "1.1.1.1"
              assert proxies[1].is_secure is False
''',
              '''        assert len(secure) == 1
              assert secure[0].address == "1.1.1.1"
              assert proxies[1].is_secure is False
              assert proxies[1] not in secure
''',
          )
          replace_once(
              'tests/unit/test_server_new.py',
              '''    assert response.status_code == 200
              # output_dir removed from health endpoint for security (no filesystem path exposure)
              assert "output_available" in response.json()
''',
              '''    assert response.status_code == 503
              payload = response.json()
              assert payload["status"] == "degraded"
              assert payload["ready"] is False
              assert payload["missing_public_files"]
              assert "output_dir" not in payload
''',
          )

          replace_once(
              'tests/unit/test_server.py',
              '''        assert response.status_code == 200
              json_resp = response.json()
              assert json_resp["status"] == "ok"
              assert "output_available" in json_resp
''',
              '''        assert response.status_code == 503
              json_resp = response.json()
              assert json_resp["status"] == "degraded"
              assert json_resp["ready"] is False
              assert json_resp["missing_public_files"]
              assert "output_dir" not in json_resp
''',
          )
          replace_once(
              'tests/unit/test_server.py',
              '    assert "Invalid API key" in response.text\n',
              '    assert "invalid API key" in response.text\n',
          )
          replace_once(
              'tests/unit/test_server.py',
              '''        response = await async_client.post(
                  "/api/lab/test-chain",
                  json={
                      "api_key": "secret",
                      "config": {"outbounds": [{"type": "direct", "tag": "direct"}]},
                  },
              )
''',
              '''        response = await async_client.post(
                  "/api/lab/test-chain",
                  json={"config": {"outbounds": [{"type": "direct", "tag": "direct"}]}},
                  headers={"Authorization": "Bearer secret"},
              )
''',
          )
          replace_once(
              'tests/unit/test_server.py',
              '    assert "internal hostnames" in response.text\n',
              '    assert "literal globally routable IP" in response.text\n',
          )
          replace_once(
              'tests/unit/test_server.py',
              '    assert "resolves to private" in response.text\n',
              '    assert "literal globally routable IP" in response.text\n',
          )

          replace_once(
              'tests/unit/test_output.py',
              '''        "window.CS_RUNTIME_CONFIG = { PUBLIC_KEY: 'x', STEGO_KEY: 'x' };",
''',
              '''        "window.CS_RUNTIME_CONFIG = { PUBLIC_KEY: 'x' };",
''',
          )

          schema_path = Path('schema/proxy.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          defs = schema['$defs']
          defs['shadowsocks_details']['required'] = ['method']
          defs['shadowsocks_details']['properties'].pop('password', None)
          defs['wireguard_details']['required'] = ['peer_public_key']
          for key in ('private_key', 'pre_shared_key', 'presharedKey'):
              defs['wireguard_details']['properties'].pop(key, None)
          defs['trojan_details']['properties'].pop('password', None)
          defs['trojan_details'].pop('anyOf', None)
          defs['hysteria2_details']['properties'].pop('password', None)
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'tests/unit/test_proxy_schema.py',
              '''            "details": {
                          "private_key": "6M6tfYfQ6B0fLF8A3XJ2Z2z8jz4Yb9k+f0z8xN2aM0E=",
                          "peer_public_key": "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=",
                      },
''',
              '''            "details": {
                          "peer_public_key": "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=",
                      },
''',
          )
          replace_once(
              'tests/unit/test_proxy_schema.py',
              '''    broken = deepcopy(payload)
              broken["details"]["private_key"] = "invalid-key"
              with pytest.raises(jsonschema.exceptions.ValidationError):
                  validator.validate(broken)
''',
              '''    broken = deepcopy(payload)
              broken["details"]["private_key"] = "should-never-be-public"
              with pytest.raises(jsonschema.exceptions.ValidationError):
                  validator.validate(broken)
''',
          )

          replace_once(
              'scripts/validate_workflows.py',
              '''def _main_contract(path: Path, data: dict[Any, Any]) -> list[str]:
              text = _content(path)
              errors: list[str] = []
''',
              '''def _main_contract(path: Path, data: dict[Any, Any]) -> list[str]:
              text = _content(path)
              normalized = " ".join(text.replace("\\\\\n", " ").split())
              errors: list[str] = []
''',
          )
          replace_once(
              'scripts/validate_workflows.py',
              '''    if not all(
                  token in text
                  for token in (
''',
              '''    if not all(
                  " ".join(token.split()) in normalized
                  for token in (
''',
          )
          PY
      - name: Validate targeted failures
        run: |
          python -m black --check tests/unit/test_documentation_hygiene.py tests/unit/test_security_headers.py tests/unit/test_security_validator_extra.py tests/unit/test_server.py tests/unit/test_server_new.py tests/unit/test_output.py tests/unit/test_proxy_schema.py scripts/validate_workflows.py
          pytest -q \
            tests/unit/coverage_boost/test_server_coverage.py \
            tests/unit/test_documentation_hygiene.py \
            tests/unit/test_output.py::test_generated_public_artifact_fixture_matches_pages_contract \
            tests/unit/test_security_headers.py \
            tests/unit/test_security_validator_extra.py::test_validate_batch_configs \
            tests/unit/test_server.py::test_health_check \
            tests/unit/test_server.py::test_lab_test_chain_requires_admin_key_when_enabled_in_production \
            tests/unit/test_server.py::test_lab_test_chain_allows_valid_admin_key_when_enabled_in_production \
            tests/unit/test_server.py::test_lab_test_chain_rejects_internal_hostname \
            tests/unit/test_server.py::test_lab_test_chain_rejects_resolving_private_destination \
            tests/unit/test_server_new.py::test_health_check \
            tests/unit/test_validate_workflows.py::test_validate_workflows_accepts_numeric_string_pipeline_retention \
            tests/unit/test_validate_workflows.py::test_validate_workflows_accepts_build_wasm_dependency_for_wasm_download \
            tests/unit/test_proxy_schema.py
      - name: Commit fixes
        run: |
          rm .github/workflows/apply-ci-failure-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/coverage_boost/test_server_coverage.py tests/unit/test_documentation_hygiene.py tests/unit/test_security_headers.py tests/unit/test_security_validator_extra.py tests/unit/test_server.py tests/unit/test_server_new.py tests/unit/test_output.py tests/unit/test_proxy_schema.py schema/proxy.schema.json scripts/validate_workflows.py .github/workflows/apply-ci-failure-fixes.yml
          git commit -m 'fix: align tests with hardened contracts'
          git push origin HEAD:agent/full-audit-remediation
