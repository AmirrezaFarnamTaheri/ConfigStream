name: Validate zero-working remediation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'fix/actions-zero-working-shards'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply coordinated remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          payload = Path(
              ".github/workflows/one-shot-zero-working-remediation.yml"
          ).read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          terminator = "\n          PY\n"
          if marker not in payload or terminator not in payload:
              raise SystemExit("Could not locate the embedded remediation payload")
          script = payload.split(marker, 1)[1].split(terminator, 1)[0]
          exec(compile(textwrap.dedent(script), "remediation_payload.py", "exec"))

          # Preserve the CLI's pre-existing security-mode behaviour. Availability
          # failure policy is now explicit and independent; this remediation must
          # not silently enable unrelated strict-security processing.
          cli_path = Path("src/configstream/cli.py")
          cli_text = cli_path.read_text(encoding="utf-8")
          strict_line = "                strict_security=settings.STRICT_SECURITY,\n"
          if cli_text.count(strict_line) != 1:
              raise SystemExit("Expected one temporary strict-security CLI line")
          cli_path.write_text(cli_text.replace(strict_line, "", 1), encoding="utf-8")

          test_path = Path("tests/unit/test_zero_working_policy.py")
          test_text = test_path.read_text(encoding="utf-8")
          assertion = '    assert captured["strict_security"] is True\n'
          if test_text.count(assertion) != 1:
              raise SystemExit("Expected one temporary strict-security assertion")
          test_path.write_text(test_text.replace(assertion, "", 1), encoding="utf-8")
          PY
      - name: Install validation dependencies
        run: pip install -e .[dev]
      - name: Validate source, policy, workflow, and compatibility
        run: |
          set -euo pipefail
          python -m py_compile \
            src/configstream/config.py \
            src/configstream/cli.py \
            src/configstream/pipeline/core.py \
            src/configstream/pipeline/policy.py
          pytest -q \
            tests/unit/test_release_remediation.py \
            tests/unit/test_zero_working_policy.py \
            --disable-warnings --maxfail=1
          python - <<'PY'
          from pathlib import Path

          core = Path("src/configstream/pipeline/core.py").read_text(encoding="utf-8")
          cli = Path("src/configstream/cli.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/main.yml").read_text(encoding="utf-8")
          env = Path(".env.example").read_text(encoding="utf-8")

          assert "self.context.strict_security\n                    or bool(" not in core
          assert "strict or getattr(settings, \"FAIL_ON_ZERO_WORKING\"" not in cli
          assert 'FAIL_ON_ZERO_WORKING: "false"' in workflow
          for invalid in (
              "MAX_LINES_PER_SOURCE=0",
              "MAX_CONFIG_LINE_LENGTH=0",
              "MAX_SEEN_KEYS=0",
              "MAX_B64_INPUT_SIZE=0",
              "MAX_B64_OUTPUT_SIZE=0",
              "MAX_OPENVPN_CONFIG_SIZE=0",
              "MAX_RESPONSE_SIZE=0",
              "MAX_WORKERS=0",
              "DNS_SAFE_RESOLVE_LIMIT=0",
          ):
              assert invalid not in env, invalid
          PY
          git diff --check
      - name: Commit validated remediation
        run: |
          set -euo pipefail
          rm \
            .github/workflows/one-shot-zero-working-remediation.yml \
            .github/workflows/pr-run-zero-working-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): centralize zero-working policy and unblock source shards"
          git push origin HEAD:${{ github.head_ref }}
