name: PR531 Final Review Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

concurrency:
  group: pr531-final-review-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    if: github.event.pull_request.number == 531 && github.event.pull_request.head.ref == 'unify-all-prs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply reviewed production fixes
        run: python scripts/pr531_final_review_patch.py
      - name: Format reviewed files
        run: |
          python -m black \
            scripts/native_client_checks.py \
            scripts/release_gate.py \
            src/configstream/quality/storage.py \
            tests/unit/test_pr531_review_regressions.py
      - name: Validate typing
        run: python -m mypy .
      - name: Validate focused review regressions
        run: |
          pytest -q \
            tests/unit/test_pr531_review_regressions.py \
            tests/unit/test_client_format_contracts.py \
            tests/unit/quality/test_quality_components.py
      - name: Package validated source files
        run: |
          set -euo pipefail
          git diff --check
          mkdir -p pr531-reviewed-tree/scripts pr531-reviewed-tree/src/configstream/quality pr531-reviewed-tree/tests/unit
          cp scripts/native_client_checks.py pr531-reviewed-tree/scripts/
          cp scripts/release_gate.py pr531-reviewed-tree/scripts/
          cp src/configstream/quality/storage.py pr531-reviewed-tree/src/configstream/quality/
          cp tests/unit/test_pr531_review_regressions.py pr531-reviewed-tree/tests/unit/
      - name: Upload validated source files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: pr531-reviewed-tree
          path: pr531-reviewed-tree
          if-no-files-found: error
          retention-days: 1
