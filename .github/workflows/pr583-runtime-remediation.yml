name: PR583 Runtime Remediation

on:
  push:
    branches:
      - codex/fix-actions-and-runtime-resilience
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-runtime-remediation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: codex/fix-actions-and-runtime-resilience

      - name: Reconstruct and verify remediation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/pr583-runtime.part.* | wc -c)" -eq 62632
          for offset in 0 5000 10000; do
            dd if=.github/pr583-runtime.part.01 bs=1 skip="$offset" count=5000 status=none | sha256sum
          done
          cat .github/pr583-runtime.part.* > /tmp/pr583-runtime.patch.gz.b64
          printf '%s  %s\n' '3ff4a66b18d6dd9de9220c7ec1a1750c7001938c5b4771af8f4a0f17b281e8c8' /tmp/pr583-runtime.patch.gz.b64 | sha256sum -c -
          base64 --decode /tmp/pr583-runtime.patch.gz.b64 | gzip --decompress > /tmp/pr583-runtime.patch
          printf '%s  %s\n' '83326b6130e378f76dd83b1b1eded98d23ff68b942f0fa0a8ce2f8b1a7ea3b80' /tmp/pr583-runtime.patch | sha256sum -c -

      - name: Apply runtime remediation atomically
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --index /tmp/pr583-runtime.patch
          git rm -- .github/pr583-runtime.part.00 .github/pr583-runtime.part.01 .github/pr583-runtime.part.02 .github/pr583-runtime.part.03 .github/workflows/pr583-runtime-remediation.yml

      - name: Regenerate governed repository evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_environment_catalog.py
          python scripts/validate_function_size_budget.py --write
          python scripts/generate_debt_matrix.py
          python scripts/generate_triage_report.py
          python scripts/collect_repository_forensics.py
          python scripts/generate_comprehensive_topology.py
          python scripts/build_comprehensive_architecture_page.py

      - name: Validate remediation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/configstream scripts tests/unit
          python scripts/generate_environment_catalog.py --check
          python scripts/validate_exception_boundaries.py
          python scripts/validate_function_size_budget.py
          python scripts/generate_debt_matrix.py --check
          python scripts/validate_workflows.py
          git diff --check

      - name: Commit exact remediation tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce pipeline lifecycle invariants'
          git push origin HEAD:codex/fix-actions-and-runtime-resilience
