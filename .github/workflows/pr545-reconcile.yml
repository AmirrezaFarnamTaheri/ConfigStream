name: Reconcile ConfigStream PR 545

on:
  push:
    branches:
      - pr545-reconcile-helper-v2

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    name: Merge main, resolve conflicts, and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile target branch
        shell: bash
        env:
          ORIGINAL_HEAD: 7b7190e4890f95a423d081cbce83e4e6b605ac86
          TARGET_BRANCH: feat/post-audit-remediation-v3.1.0
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "${TARGET_BRANCH}" main

          remote_target="$(git rev-parse "origin/${TARGET_BRANCH}")"
          if [[ "$remote_target" != "$ORIGINAL_HEAD" ]]; then
            echo "Target branch moved unexpectedly: $remote_target" >&2
            exit 1
          fi

          git checkout --detach "$ORIGINAL_HEAD"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -ne 0 ]] && [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Merge failed without resolvable file conflicts." >&2
            exit "$merge_rc"
          fi

          has_stage() {
            local path="$1"
            local stage="$2"
            git ls-files -u -- "$path" | awk -v wanted="$stage" '$3 == wanted { found = 1 } END { exit(found ? 0 : 1) }'
          }

          resolve_with_stage() {
            local path="$1"
            local stage="$2"
            local label="$3"
            if has_stage "$path" "$stage"; then
              if [[ "$stage" == "2" ]]; then
                git checkout --ours -- "$path"
              else
                git checkout --theirs -- "$path"
              fi
              git add -- "$path"
              echo "Resolved $path with $label"
            else
              git rm -f --ignore-unmatch -- "$path"
              echo "Resolved $path as deletion from $label"
            fi
          }

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Conflicts detected (%s):\n' "${#conflicts[@]}"
          printf '  %s\n' "${conflicts[@]}"

          for path in "${conflicts[@]}"; do
            case "$path" in
              .github/workflows/*|docs/readiness.json|package.json|pyproject.toml|requirements*.txt)
                resolve_with_stage "$path" 3 "main"
                ;;
              scripts/*|src/*|tests/*)
                resolve_with_stage "$path" 2 "PR branch"
                ;;
              *)
                echo "Unexpected conflict outside the approved resolution policy: $path" >&2
                exit 1
                ;;
            esac
          done

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          docker = dockerfile.read_text(encoding="utf-8")
          install_marker = "RUN apt-get update && apt-get install -y --no-install-recommends \\\n"
          if install_marker not in docker:
              raise SystemExit("Dockerfile apt install block was not found")
          block_start = docker.index(install_marker) + len(install_marker)
          block_end = docker.find("    && rm -rf /var/lib/apt/lists/*", block_start)
          if block_end < 0:
              raise SystemExit("Dockerfile apt install block terminator was not found")
          install_block = docker[block_start:block_end]
          if "    bash \\\n" not in install_block:
              docker = docker[:block_start] + "    bash \\\n" + docker[block_start:]
              dockerfile.write_text(docker, encoding="utf-8")

          workflow = Path(".github/workflows/main.yml")
          text = workflow.read_text(encoding="utf-8")
          anchor = (
              "      - name: Run bounded shard and always write lineage\n"
              "        if: matrix.enabled == true\n"
          )
          replacement = anchor + "        shell: bash\n"
          if replacement not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("Expected exactly one shard step anchor")
              workflow.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.2"
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_paths = sorted(Path(".github/workflows").glob("*.yml")) + sorted(
              Path(".github/workflows").glob("*.yaml")
          )
          for path in workflow_paths:
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          main = yaml.safe_load(Path(".github/workflows/main.yml").read_text(encoding="utf-8"))
          shard_step = next(
              step
              for step in main["jobs"]["pipeline"]["steps"]
              if step.get("name") == "Run bounded shard and always write lineage"
          )
          if shard_step.get("shell") != "bash":
              raise SystemExit("Shard step does not declare shell: bash")
          Path("/tmp/configstream-shard.sh").write_text(shard_step["run"], encoding="utf-8")

          bashisms = (
              "${PIPESTATUS",
              "[[",
              "mapfile",
              "readarray",
              "declare -a",
              "set -o pipefail",
              "set -euo pipefail",
          )
          violations = []
          for path in workflow_paths:
              data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              for job_name, job in (data.get("jobs") or {}).items():
                  if not isinstance(job, dict) or "container" not in job:
                      continue
                  for index, step in enumerate(job.get("steps") or []):
                      if not isinstance(step, dict) or "run" not in step:
                          continue
                      script = str(step["run"])
                      if any(token in script for token in bashisms):
                          shell = str(step.get("shell", ""))
                          if not shell.startswith("bash"):
                              violations.append(f"{path}:{job_name}:step {index + 1}")
          if violations:
              raise SystemExit(
                  "Container run steps with bashisms but no bash shell: " + ", ".join(violations)
              )
          PY

          bash -n /tmp/configstream-shard.sh
          python scripts/validate_workflows.py
          grep -Eq '^[[:space:]]+bash \\$' Dockerfile
          git diff --check

          docker build --build-arg TARGETARCH=amd64 --target ci-runner -t configstream-pr545-ci .
          docker run --rm --entrypoint bash configstream-pr545-ci -lc 'set -euo pipefail; false | true; rc=${PIPESTATUS[0]}; test "$rc" -eq 1'

          git add -A
          git diff --cached --check
          git commit -m "merge(main): reconcile PR 545 and fix shard shell"
          new_head="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${ORIGINAL_HEAD}" origin "${new_head}:refs/heads/${TARGET_BRANCH}"
