name: Final Subprocess Remediation

on:
  push:
    branches: [agent/fix-active-audit-items]
    paths:
      - '.github/workflows/final-subprocess-remediation.yml'

permissions:
  contents: write

concurrency:
  group: final-subprocess-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Isolate Slipstream child environment and refresh governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/configstream/tools/dns_scanner/python/dnsscanner_tui.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import asyncio\nimport ipaddress\n'
          if text.count(old_import) != 1:
              raise SystemExit('DNS scanner import anchor missing')
          text = text.replace(old_import, 'import asyncio\nimport ipaddress\nimport os\n', 1)

          logger_anchor = '''logger = logging.getLogger(__name__)\nlogger.addHandler(logging.NullHandler())\nlogger.propagate = False\n\n\nclass SlipstreamManager:\n'''
          helper = '''logger = logging.getLogger(__name__)\nlogger.addHandler(logging.NullHandler())\nlogger.propagate = False\n\n_SUBPROCESS_ENV_ALLOWLIST = (\n    "PATH",\n    "HOME",\n    "USERPROFILE",\n    "SYSTEMROOT",\n    "WINDIR",\n    "TMPDIR",\n    "TMP",\n    "TEMP",\n    "SSL_CERT_FILE",\n    "SSL_CERT_DIR",\n    "LANG",\n    "LC_ALL",\n    "TZ",\n)\n\n\ndef _minimal_child_environment() -> dict[str, str]:\n    \"\"\"Return only non-secret runtime context needed by Slipstream.\"\"\"\n    environment = {\n        key: value for key in _SUBPROCESS_ENV_ALLOWLIST if (value := os.environ.get(key))\n    }\n    environment.setdefault("PATH", os.defpath)\n    environment["TMPDIR"] = os.environ.get("TMPDIR") or __import__("tempfile").gettempdir()\n    return environment\n\n\nclass SlipstreamManager:\n'''
          if text.count(logger_anchor) != 1:
              raise SystemExit('DNS scanner helper anchor missing')
          text = text.replace(logger_anchor, helper, 1)

          old_spawn = '''            process = await asyncio.create_subprocess_exec(\n                *cmd,\n                stdout=asyncio.subprocess.PIPE,\n                stderr=asyncio.subprocess.STDOUT,\n                creationflags=(\n                    getattr(subprocess, "CREATE_NO_WINDOW", 0)\n                    if sys.platform == "win32"\n                    else 0\n                ),\n            )\n'''
          new_spawn = '''            process = await asyncio.create_subprocess_exec(\n                *cmd,\n                stdout=asyncio.subprocess.PIPE,\n                stderr=asyncio.subprocess.STDOUT,\n                env=_minimal_child_environment(),\n                creationflags=(\n                    getattr(subprocess, "CREATE_NO_WINDOW", 0)\n                    if sys.platform == "win32"\n                    else 0\n                ),\n            )\n'''
          if text.count(old_spawn) != 1:
              raise SystemExit('Slipstream spawn anchor missing')
          path.write_text(text.replace(old_spawn, new_spawn, 1), encoding='utf-8')

          test_path = Path('tests/unit/test_dnsscanner_tui_lifecycle.py')
          tests = test_path.read_text(encoding='utf-8')
          tests += '''\n\ndef test_slipstream_spawn_uses_minimal_child_environment() -> None:\n    \"\"\"The verified Slipstream binary must not inherit pipeline secrets.\"\"\"\n    tree = _tui_source_tree()\n    tui_class = next(\n        node\n        for node in tree.body\n        if isinstance(node, ast.ClassDef) and node.name == "DNSScannerTUI"\n    )\n    test_proxy = next(\n        node\n        for node in tui_class.body\n        if isinstance(node, ast.AsyncFunctionDef)\n        and node.name == "_test_slipstream_proxy"\n    )\n    spawn = next(\n        node\n        for node in ast.walk(test_proxy)\n        if isinstance(node, ast.Call)\n        and isinstance(node.func, ast.Attribute)\n        and node.func.attr == "create_subprocess_exec"\n    )\n    env_keyword = next(keyword for keyword in spawn.keywords if keyword.arg == "env")\n    assert isinstance(env_keyword.value, ast.Call)\n    assert isinstance(env_keyword.value.func, ast.Name)\n    assert env_keyword.value.func.id == "_minimal_child_environment"\n\n    source = TUI_SOURCE.read_text(encoding="utf-8")\n    for secret_name in (\n        "CS_PUBLIC_KEY",\n        "CS_IPNS_KEY",\n        "VT_API_KEY",\n        "WARP_KEY_POOL",\n        "CS_SIGNING_PRIVATE_KEY_HEX",\n    ):\n        assert secret_name not in source[source.index("_SUBPROCESS_ENV_ALLOWLIST"):source.index("class SlipstreamManager")]\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile \
            src/configstream/security/utls_wrapper.py \
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py \
            tests/unit/security/test_utls_wrapper.py \
            tests/unit/test_dnsscanner_tui_lifecycle.py
          python scripts/generate_environment_catalog.py
          python scripts/generate_debt_matrix.py
          python scripts/generate_triage_report.py
      - name: Commit subprocess hardening and exact governed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/configstream/tools/dns_scanner/python/dnsscanner_tui.py
            tests/unit/test_dnsscanner_tui_lifecycle.py
            docs/generated/environment-variables.md
            docs/generated/environment-variables.json
            docs/DEBT_MATRIX.md
            docs/debt_matrix.json
            TRIAGE_REPORT.md
          )
          for path in "${files[@]}"; do
            if git diff --quiet -- "$path"; then
              continue
            fi
            sha="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha')"
            encoded="$(base64 -w0 "$path")"
            gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='fix: isolate remaining external child process environment' \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch="$GITHUB_REF_NAME" \
              >/dev/null
          done
