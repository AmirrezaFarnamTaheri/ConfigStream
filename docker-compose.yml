services:
  # 1. Web Dashboard (Always Running)
  web:
    build: .
    image: configstream_web:latest
    container_name: configstream_web
    restart: unless-stopped
    command: ["python", "-m", "configstream.server"]
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output # Read results
      - ./frontend:/app/frontend # Dev mode: hot reload frontend changes
    environment:
      - OUTPUT_DIR=/app/output
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
    networks:
      - confignet

  # 2. Aggregator Worker (Runs Interval Loop)
  worker:
    image: configstream_web:latest
    container_name: configstream_worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data # Persist GeoIP/Cache DBs
      - ./output:/app/output # Write results
      - ./sources:/app/sources # Read sources
    # Simple shell loop to run pipeline every 6 hours
    command: >
      sh -c "
      echo '🔄 Updating GeoIP databases via CLI...';
      # Use application logic instead of curl redundancy
      python -m configstream.cli update-databases;

      while true; do
        echo \"🚀 Starting Config's Stream...\";
        configstream merge --sources sources/batch_1.txt --output output/ --max-workers 30 --timeout 12 --strict;
        echo '✅ Run Complete. Sleeping for 6 hours...';
        sleep 21600;
      done"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G # Limit to prevent OOM on host if possible
    networks:
      - confignet

networks:
  confignet:
    driver: bridge


