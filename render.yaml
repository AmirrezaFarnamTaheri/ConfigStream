# Render deployment is an ephemeral demonstration surface only.
# GitHub Pages remains the supported publication target. Generated output is
# not durable on this free web service and no cross-service filesystem is used.
services:
  - type: web
    name: configstream-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /live
    dockerCommand: python -m configstream.server
    envVars:
      - key: CONFIGSTREAM_DEPLOYMENT_MODE
        value: ephemeral-demo
      - key: CONFIGSTREAM_HOST
        value: 0.0.0.0
      - key: OUTPUT_DIR
        value: /tmp/configstream-output
      - key: CONFIGSTREAM_HEALTHCHECK_HTTP
        value: "1"
