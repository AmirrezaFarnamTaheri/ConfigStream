[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configstream"
version = "3.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "playwright",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-aiohttp",
    "pytest-playwright",
    "pytest-base-url",
    "pyfakefs",
    "types-PyYAML",
    "types-ps