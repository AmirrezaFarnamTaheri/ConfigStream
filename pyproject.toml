[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configstream"
version = "3.0.2"
description = "High-performance VPN configuration aggregator with smart scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Amirreza 'Farnam' Taheri", email = "taherifarnam@gmail.com"}
]
keywords = ["vpn", "v2ray", "clash", "sing-box", "proxy", "aggregator", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Network Core
    "tenacity",
    "cachetools>=5.3.3",
    "httpx[http2]>=0.28.1",
    "h2>=4.1.0",
    "sniffio>=1.3.1",
    "aiohttp>=3.13.2",
    "aiohttp-socks>=0.11.0",
    "aiodns>=3.6.1",
    "pycares>=4.11.0",
    "aiohttp-proxy",
    "requests==2.32.5", # Kept for legacy compatibility if needed, but discouraged

    # Parsing & Logic
    "PyYAML>=6.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "singbox2proxy~=0.2.4",

    # I/O & Async
    "aiofiles>=25.1.0",
    "orjson>=3.11.5",
    "nest-asyncio>=1.6.0",
    "wasmtime>=40.0.0",
    "slowapi>=0.1.9",

    # CLI & UI
    "click>=8.3.1",
    "rich>=14.2.0",
    "python-telegram-bot>=22.5",

    # Geo & Sys
    "geoip2>=5.2.0",
    "geopy>=2.3.0",
    "psutil>=7.2.1; sys_platform != 'win32'",

    # Web Server
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",

    # Crypto (for WARP)
    "cryptography>=46.0.3",

    # HTML Parsing (Security)
    "beautifulsoup4"
]

[project.optional-dependencies]
dev = [
    "playwright==1.55.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-aiohttp",
    "pytest-playwright",
    "pytest-base-url",
    "pyfakefs",
    "types-PyYAML",
    "types-requests",
    "types-psutil",
    "types-cachetools",
    "flake8>=7.3.0",
    "black",
    "mypy",
    "respx>=0.22.0",
    "hypothesis>=6.0.0",
    "types-aiofiles",
    "types-orjson"
]

[project.scripts]
configstream = "configstream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers -p no:warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: End to End tests",
    "slow: Slow tests",
    "asyncio: AsyncIO tests"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
