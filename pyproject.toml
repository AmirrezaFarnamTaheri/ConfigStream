[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "configstream"
version = "3.1.0"
description = "High-performance VPN configuration aggregator with smart scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Amirreza 'Farnam' Taheri", email = "taherifarnam@gmail.com"}
]
keywords = ["vpn", "v2ray", "clash", "sing-box", "proxy", "aggregator", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tenacity>=8.2,<10",
    "cachetools>=5.3.3,<7",
    "httpx[http2]>=0.27.0,<1",
    "h2>=4.1.0,<5",
    "sniffio>=1.3.0,<2",
    "aiohttp>=3.9.0,<4",
    "aiohttp-socks>=0.8.0,<1",
    "aiodns>=3.6.1,<4",
    "pycares>=4.4,<5.0.0",
    "aiohttp-proxy>=0.1.2,<1",
    "PyYAML>=6.0,<7",
    "pydantic>=2.12.4,<3",
    "pydantic-settings>=2.6,<3",
    "singbox2proxy~=0.2.4",
    "aiofiles>=23.2.0,<25",
    "orjson>=3.9.0,<4",
    "nest-asyncio>=1.6,<2",
    "wasmtime>=40.0.0,<41",
    "slowapi>=0.1.9,<1",
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "python-telegram-bot>=20.0,<23",
    "geoip2>=4.8,<6",
    "geopy>=2.3.0,<3",
    "psutil>=5.9.0,<8; sys_platform != 'win32'",
    "fastapi>=0.109.0,<1",
    "uvicorn[standard]>=0.27.0,<1",
    "cryptography>=42,<47",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.45,<2",
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-cov>=4.1.0,<8",
    "pytest-aiohttp>=1.0,<2",
    "pytest-playwright>=0.5,<1",
    "pytest-base-url>=2.1,<3",
    "pyfakefs>=5.6,<6",
    "types-PyYAML>=6.0,<7",
    "types-psutil>=5.9,<8",
    "types-cachetools>=5.3,<7",
    "flake8>=7,<8",
    "black>=24,<27",
    "mypy>=1.11,<2",
    "respx>=0.21,<1",
    "hypothesis>=6.0.0,<7",
    "types-aiofiles>=23.2,<25",
    "types-orjson>=3.6,<4",
]

[project.scripts]
configstream = "configstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers -p no:warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: End to End tests",
    "frontend_browser: browser-backed frontend tests",
    "degraded: degraded/no-JS behavior tests",
    "slow: Slow tests",
    "asyncio: AsyncIO tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["union-attr"]
exclude = "^(invvest|Latest Outputs to investigate|output|data)(/|\\\\)"

[[tool.mypy.overrides]]
module = ["configstream.testers.go_tester", "src.configstream.testers.go_tester"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["tests.unit.test_ws_origin", "test_ws_origin"]
disable_error_code = ["arg-type"]
