[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configstream"
version = "2.0.11"
description = "High-performance VPN configuration aggregator with smart scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Amirreza 'Farnam' Taheri", email = "taherifarnam@gmail.com"}
]
keywords = ["vpn", "v2ray", "clash", "sing-box", "proxy", "aggregator", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Network Core
    "cachetools>=5.3.3",
    "httpx[http2]>=0.27.0",
    "h2>=4.1.0",
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.0",
    "aiodns>=3.1.0",
    "pycares<5.0.0",
    "aiohttp-proxy",
    "requests",

    # Parsing & Logic
    "PyYAML>=6.0",
    "pydantic>=2.12.4",
    "pydantic-settings",
    "singbox2proxy~=0.2.4",

    # I/O & Async
    "aiofiles>=23.2.0",
    "orjson>=3.9.0",
    "nest-asyncio",
    "wasmtime>=39.0.0",

    # CLI & UI
    "click",
    "rich",
    "python-telegram-bot>=20.0",

    # Geo & Sys
    "geoip2",
    "geopy>=2.3.0",
    "psutil>=5.9.0; sys_platform != 'win32'", # Optional for adaptive workers

    # Web Server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Crypto (for WARP)
    "cryptography",

    # Data Science (Anomaly Detection)
    "scikit-learn",
    "numpy",
    "scipy",

    # HTML Parsing (Security)
    "beautifulsoup4"
]

[project.optional-dependencies]
dev = [
    "playwright",
    "pytest>=8.0.0",
    "pytest-asyncio==0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-aiohttp",
    "pytest-playwright",
    "pytest-base-url",
    "pyfakefs",
    "types-PyYAML",
    "types-requests",
    "types-psutil",
    "types-cachetools",
    "flake8",
    "black",
    "mypy",
    "respx",
    "hypothesis>=6.0.0",
    "types-aiofiles",
    "types-orjson"
]

[project.scripts]
configstream = "configstream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers -p no:warnings"
asyncio_mode = "auto"
markers = [
    "e2e: End to End tests",
    "slow: Slow tests",
    "asyncio: AsyncIO tests"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
