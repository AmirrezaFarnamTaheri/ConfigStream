[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configstream"
version = "1.2.0"
description = "High-performance VPN configuration aggregator with smart scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "Amirreza 'Farnam' Taheri", email = "taherifarnam@gmail.com"}
]
keywords = ["vpn", "v2ray", "clash", "sing-box", "proxy", "aggregator", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Network Core
    "httpx[http2]>=0.27.0",
    "h2>=4.1.0",
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.0",
    "aiodns>=3.1.0",

    # Parsing & Logic
    "PyYAML>=6.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "singbox2proxy>=0.2.4",

    # I/O & Async
    "aiofiles>=23.2.0",
    "orjson>=3.9.0",
    "nest-asyncio>=1.6.0",

    # CLI & UI
    "click>=8.1.0",
    "rich>=13.7.0",

    # Geo & Sys
    "geoip2>=4.8.0",
    "psutil>=5.9.0; sys_platform != 'win32'", # Optional for adaptive workers
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-aiohttp",
    "pyfakefs",
    "types-PyYAML",
    "types-requests",
    "types-psutil",
    "flake8",
    "black",
    "mypy",
    "respx",
]

[project.scripts]
configstream = "configstream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers -p no:warnings"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
