repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
      - id: validate-workflows
        name: validate GitHub workflow YAML
        entry: python scripts/validate_workflows.py
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

# NEW: Secret Scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        name: Detect Secrets
        description: "Detect hardcoded secrets like passwords, API keys, and tokens."
        entry: gitleaks detect --source . --verbose --redact
