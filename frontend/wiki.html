<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfigStream Wiki - Documentation</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        .wiki-container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            gap: 30px;
        }

        .wiki-sidebar {
            flex: 0 0 250px;
            position: sticky;
            top: 80px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            padding-right: 20px;
        }

        .wiki-content {
            flex: 1;
            min-width: 0; /* Prevent overflow */
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .wiki-nav-item {
            display: block;
            padding: 10px 15px;
            margin-bottom: 5px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .wiki-nav-item:hover, .wiki-nav-item.active {
            background: var(--primary-color);
            color: white;
        }

        /* Markdown Styles */
        .markdown-body {
            color: var(--text-primary);
            line-height: 1.6;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: var(--text-primary);
        }

        .markdown-body pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .markdown-body code {
            font-family: 'Fira Code', monospace;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .wiki-container {
                flex-direction: column;
            }
            .wiki-sidebar {
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="assets/img/logo.svg" alt="ConfigStream Logo" class="nav-logo">
            <span>ConfigStream</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="analytics.html">Analytics</a>
            <a href="proxies.html">Proxies</a>
            <a href="wiki.html" class="active">Wiki</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="wiki-container">
            <aside class="wiki-sidebar" id="wikiSidebar">
                <!-- Navigation generated by JS -->
            </aside>
            <main class="wiki-content">
                <div id="wikiRenderer" class="markdown-body">
                    <!-- Content injected here -->
                    <div class="loading-spinner">Loading documentation...</div>
                </div>
            </main>
        </div>
    </div>

    <script src="assets/js/wiki.js"></script>
</body>
</html>
