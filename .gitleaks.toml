[allowlist]
    paths = [
        '''output/.*''',
        '''data/.*''',
        '''test_anomaly.db''',
        '''tests/fixtures/.*'''
    ]

[[rules]]
    description = "Proxy subscription token"
    id = "proxy-subscription-token"
    regex = '''(?i)(?:token|sub|secret|auth|password|client_secret|access_token|api_key)=[^&#\s]{6,}'''
    keywords = ["token", "sub", "secret", "auth", "password", "client_secret", "access_token", "api_key"]
    path = '''sources/.*'''
