[mypy]
ignore_missing_imports = True
exclude = ^(invvest|Latest Outputs to investigate|output|data)(/|\\)

# typeshed models getaddrinfo() socket-address element 0 as str | int.
# This module only requests INET/INET6 stream addresses, whose host is a string.
[mypy-configstream.pipeline.fetcher]
disable_error_code = union-attr
