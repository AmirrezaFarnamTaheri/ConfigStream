<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" width="1280" height="180" role="img" aria-label="ConfigStream five-stage pipeline">
  <title>ConfigStream five-stage pipeline</title>
  <rect width="1280" height="180" rx="14" fill="#090D16"/>
  <rect x="1" y="1" width="1278" height="178" rx="13" fill="none" stroke="#334155"/>
  <g transform="translate(35,35)"><rect width="210" height="105" rx="10" fill="#141E33" stroke="#06B6D4"/><text x="16" y="28" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11" fill="#06B6D4">01</text><text x="16" y="58" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">INGESTION</text><text x="16" y="84" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#94A3B8">validated stage</text></g>
