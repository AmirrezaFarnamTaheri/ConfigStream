<g transform="translate(280,35)"><rect width="210" height="105" rx="10" fill="#141E33" stroke="#8B5CF6"/><text x="16" y="28" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11" fill="#8B5CF6">02</text><text x="16" y="58" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">ADMISSION</text><text x="16" y="84" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#94A3B8">validated stage</text></g>
<line x1="490" y1="87" x2="525" y2="87" stroke="#334155" stroke-width="2"/><circle cy="87" r="3" fill="#8B5CF6"><animate attributeName="cx" values="494;521;494" dur="1.7s" repeatCount="indefinite"/></circle>
