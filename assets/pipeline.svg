<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" width="1280" height="180" role="img" aria-label="ConfigStream Multi-Stage Pipeline">
  <title>ConfigStream — 5-Stage Verification &amp; Distribution Pipeline</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <pattern id="pgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#64748B" fill-opacity="0.2"/>
    </pattern>
    <clipPath id="pcard"><rect x="0" y="0" width="1280" height="180" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#pcard)">
    <rect width="1280" height="180" fill="url(#pbg)"/>
    <rect width="1280" height="180" fill="url(#pgrid)"/>
    <rect x="0.75" y="0.75" width="1278.5" height="178.5" rx="12" fill="none" stroke="#334B75" stroke-width="1.5"/>

    <!-- Pipeline Stages -->
    <g transform="translate(42, 32)"><rect width="216" height="114" rx="10" fill="#111B30" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.65"/><!-- Header Pill --><rect x="12" y="12" width="30" height="18" rx="4" fill="#00E5FF" fill-opacity="0.15" stroke="#00E5FF" stroke-width="1"/><text x="27" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10" font-weight="700" fill="#00E5FF">01</text><text x="50" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">INGESTION</text><!-- Description --><text x="12" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">Git, Telegram, HTTP Feeds</text><!-- Divider Line --><line x1="12" y1="74" x2="204" y2="74" stroke="#1E2C4A" stroke-width="1"/><!-- Metric Tag --><circle cx="20" cy="92" r="3" fill="#00E5FF"/><text x="30" y="96" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10.5" font-weight="600" fill="#00E5FF">10,000+ Raw</text></g><g transform="translate(261, 89)"><line x1="0" y1="0" x2="20" y2="0" stroke="#334B75" stroke-width="2" stroke-dasharray="3 3"/><polygon points="20,0 14,-3.5 14,3.5" fill="#00E5FF"/><circle cx="10" cy="0" r="3.5" fill="#00E5FF"><animate attributeName="cx" values="2;18;2" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle></g><g transform="translate(284, 32)"><rect width="216" height="114" rx="10" fill="#111B30" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.65"/><!-- Header Pill --><rect x="12" y="12" width="30" height="18" rx="4" fill="#A855F7" fill-opacity="0.15" stroke="#A855F7" stroke-width="1"/><text x="27" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10" font-weight="700" fill="#A855F7">02</text><text x="50" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">ADMISSION</text><!-- Description --><text x="12" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">SSRF Guard &amp; AST Dedupe</text><!-- Divider Line --><line x1="12" y1="74" x2="204" y2="74" stroke="#1E2C4A" stroke-width="1"/><!-- Metric Tag --><circle cx="20" cy="92" r="3" fill="#A855F7"/><text x="30" y="96" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10.5" font-weight="600" fill="#A855F7">Zero-Trust Safe</text></g><g transform="translate(503, 89)"><line x1="0" y1="0" x2="20" y2="0" stroke="#334B75" stroke-width="2" stroke-dasharray="3 3"/><polygon points="20,0 14,-3.5 14,3.5" fill="#A855F7"/><circle cx="10" cy="0" r="3.5" fill="#A855F7"><animate attributeName="cx" values="2;18;2" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle></g><g transform="translate(526, 32)"><rect width="216" height="114" rx="10" fill="#111B30" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.65"/><!-- Header Pill --><rect x="12" y="12" width="30" height="18" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/><text x="27" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10" font-weight="700" fill="#10B981">03</text><text x="50" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">VERIFICATION</text><!-- Description --><text x="12" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">Go Fast TCP &amp; HTTP/204</text><!-- Divider Line --><line x1="12" y1="74" x2="204" y2="74" stroke="#1E2C4A" stroke-width="1"/><!-- Metric Tag --><circle cx="20" cy="92" r="3" fill="#10B981"/><text x="30" y="96" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10.5" font-weight="600" fill="#10B981">&lt; 120ms Latency</text></g><g transform="translate(745, 89)"><line x1="0" y1="0" x2="20" y2="0" stroke="#334B75" stroke-width="2" stroke-dasharray="3 3"/><polygon points="20,0 14,-3.5 14,3.5" fill="#10B981"/><circle cx="10" cy="0" r="3.5" fill="#10B981"><animate attributeName="cx" values="2;18;2" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle></g><g transform="translate(768, 32)"><rect width="216" height="114" rx="10" fill="#111B30" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.65"/><!-- Header Pill --><rect x="12" y="12" width="30" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/><text x="27" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10" font-weight="700" fill="#F59E0B">04</text><text x="50" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">STREAM WASHER</text><!-- Description --><text x="12" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">WARP &amp; MASQUE Chains</text><!-- Divider Line --><line x1="12" y1="74" x2="204" y2="74" stroke="#1E2C4A" stroke-width="1"/><!-- Metric Tag --><circle cx="20" cy="92" r="3" fill="#F59E0B"/><text x="30" y="96" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10.5" font-weight="600" fill="#F59E0B">100% Unblocked</text></g><g transform="translate(987, 89)"><line x1="0" y1="0" x2="20" y2="0" stroke="#334B75" stroke-width="2" stroke-dasharray="3 3"/><polygon points="20,0 14,-3.5 14,3.5" fill="#F59E0B"/><circle cx="10" cy="0" r="3.5" fill="#F59E0B"><animate attributeName="cx" values="2;18;2" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle></g><g transform="translate(1010, 32)"><rect width="216" height="114" rx="10" fill="#111B30" stroke="#FB7185" stroke-width="1.2" stroke-opacity="0.65"/><!-- Header Pill --><rect x="12" y="12" width="30" height="18" rx="4" fill="#FB7185" fill-opacity="0.15" stroke="#FB7185" stroke-width="1"/><text x="27" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10" font-weight="700" fill="#FB7185">05</text><text x="50" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">DISTRIBUTION</text><!-- Description --><text x="12" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">Clash, Sing-box, B64</text><!-- Divider Line --><line x1="12" y1="74" x2="204" y2="74" stroke="#1E2C4A" stroke-width="1"/><!-- Metric Tag --><circle cx="20" cy="92" r="3" fill="#FB7185"/><text x="30" y="96" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace" font-size="10.5" font-weight="600" fill="#FB7185">Universal CDN</text></g>
  </g>
</svg>
