<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ConfigStream Wiki - Documentation and Guides">
    <title>ConfigStream Wiki - Documentation</title>
    <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">
    <link rel="alternate icon" href="assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/state-manager.css">
    <link rel="stylesheet" href="assets/css/error-handler.css">
    <link rel="stylesheet" href="assets/css/loading.css">
    <link rel="stylesheet" href="assets/css/header-animation.css">
    <link rel="stylesheet" href="assets/css/logo-animations.css">

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* Language Selector */
        .lang-selector {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .lang-selector option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Wiki Specific Styles */
        .wiki-container {
            display: flex;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 20px;
            gap: 30px;
            min-height: 80vh;
        }

        .wiki-sidebar {
            flex: 0 0 280px;
            position: sticky;
            top: 100px;
            height: calc(100vh - 140px);
            overflow-y: auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .wiki-content {
            flex: 1;
            min-width: 0; /* Prevent overflow */
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .wiki-nav-header {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .wiki-nav-item {
            display: block;
            padding: 10px 15px;
            margin-bottom: 5px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .wiki-nav-item:hover {
            background: var(--bg-secondary);
            color: var(--brand-primary);
        }

        .wiki-nav-item.active {
            background: rgba(var(--brand-primary-rgb), 0.1);
            color: var(--brand-primary);
            border-left: 3px solid var(--brand-primary);
        }

        /* Markdown Styles */
        .markdown-body {
            color: var(--text-primary);
            line-height: 1.7;
            font-family: 'Inter', sans-serif;
        }

        .markdown-body h1 {
            font-size: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5em;
            margin-bottom: 1em;
            color: var(--brand-primary);
        }

        .markdown-body h2 {
            font-size: 1.8rem;
            margin-top: 1.5em;
            margin-bottom: 0.8em;
            color: var(--text-primary);
        }

        .markdown-body h3 {
            font-size: 1.4rem;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
        }

        .markdown-body p {
            margin-bottom: 1.2em;
        }

        .markdown-body a {
            color: var(--brand-primary);
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        .markdown-body pre {
            background: #282c34; /* Atom One Dark bg */
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5em 0;
        }

        .markdown-body code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
        }

        .markdown-body :not(pre) > code {
             background: var(--bg-secondary);
             padding: 0.2em 0.4em;
             border-radius: 4px;
             color: var(--brand-secondary);
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--brand-secondary);
            margin: 1.5em 0;
            padding-left: 1em;
            color: var(--text-secondary);
            background: rgba(var(--brand-secondary-rgb), 0.05);
            padding: 1em;
            border-radius: 0 8px 8px 0;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 2em 0;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        .markdown-body th {
            background: var(--bg-secondary);
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            .wiki-container {
                flex-direction: column;
                padding: 10px;
            }
            .wiki-sidebar {
                position: relative;
                top: 0;
                height: auto;
                max-height: 300px;
                flex: none;
                width: 100%;
            }
            .wiki-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
      <div class="loading-container">
        <div class="loader-logo">
          <object data="assets/svg/logo-loading.svg" type="image/svg+xml" aria-label="ConfigStream Logo"></object>
        </div>
        <div class="loading-message">
          <p class="loading-text">Loading Documentation...</p>
          <div class="loading-dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-overlay"></div>
    <header class="header">
        <div class="container">
            <div class="header-logo-wrapper">
              <svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" class="header-logo" id="headerLogo" aria-label="ConfigStream Logo">
                <!-- Reusing gradient/filter defs from main CSS or JS -->
                <defs>
                    <linearGradient id="logo-gradient-header" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="var(--brand-primary)">
                            <animate attributeName="stop-color" values="var(--brand-primary);var(--brand-tertiary);var(--brand-secondary);var(--brand-primary)" dur="8s" repeatCount="indefinite"></animate>
                        </stop>
                        <stop offset="50%" stop-color="var(--brand-tertiary)">
                            <animate attributeName="stop-color" values="var(--brand-tertiary);var(--brand-secondary);var(--brand-primary);var(--brand-tertiary)" dur="8s" repeatCount="indefinite"></animate>
                        </stop>
                        <stop offset="100%" stop-color="var(--brand-secondary)">
                            <animate attributeName="stop-color" values="var(--brand-secondary);var(--brand-primary);var(--brand-tertiary);var(--brand-secondary)" dur="8s" repeatCount="indefinite"></animate>
                        </stop>
                    </linearGradient>
                </defs>
                <g>
                    <path d="M33 8C40.1797 8 46 13.8203 46 21C46 28.1797 40.1797 34 33 34H17" stroke="url(#logo-gradient-header)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M17 42C9.8203 42 4 36.1797 4 29C4 21.8203 9.8203 16 17 16H33" stroke="url(#logo-gradient-header)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </g>
              </svg>
              <span class="header-logo-text">ConfigStream</span>
            </div>
            <nav class="nav" id="main-nav" aria-label="Main navigation">
                <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
                <a href="proxies.html" class="nav-link" data-i18n="nav.proxies">Proxy List</a>
                <a href="analytics.html" class="nav-link" data-i18n="nav.analytics">Analytics</a>
                <a href="wiki.html" class="nav-link active">Wiki</a>
                <a href="about.html" class="nav-link" data-i18n="nav.about">About</a>
            </nav>
            <div class="header-actions">
                 <select id="lang-selector" class="lang-selector" aria-label="Select Language">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ru">Русский</option>
                    <option value="fa">فارسی</option>
                    <option value="ar">العربية</option>
                </select>
                <button id="theme-switcher" class="theme-btn" aria-label="Toggle theme">
                    <div class="theme-btn-inner">
                        <i data-feather="moon" class="moon-icon"></i>
                        <i data-feather="sun" class="sun-icon"></i>
                    </div>
                </button>
                <a href="https://github.com/AmirrezaFarnamTaheri/ConfigStream" class="github-btn" target="_blank" rel="noopener noreferrer" aria-label="View on GitHub">
                    <i data-feather="github"></i>
                </a>
                <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-nav">
                    <i data-feather="menu" class="menu-icon"></i>
                    <i data-feather="x" class="close-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="wiki-container">
            <aside class="wiki-sidebar">
                <div class="wiki-nav-header">Documentation</div>
                <div id="wikiSidebar">
                    <!-- Navigation generated by JS -->
                </div>
            </aside>
            <main class="wiki-content">
                <div id="wikiRenderer" class="markdown-body">
                    <!-- Content injected here -->
                </div>
            </main>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="social-links">
                <a href="https://github.com/AmirrezaFarnamTaheri/ConfigStream" target="_blank" rel="noopener noreferrer" aria-label="Visit our GitHub page"><i data-feather="github"></i></a>
                <a href="https://github.com/AmirrezaFarnamTaheri/ConfigStream/issues" target="_blank" rel="noopener noreferrer" aria-label="Report an issue"><i data-feather="alert-circle"></i></a>
            </div>
            <p data-i18n="footer.love">A passion project for a free and open internet. ✨</p>
            <p class="last-updated">Last updated: <span id="footerUpdate" class="loading">checking...</span></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/cache-config.js" defer></script>
    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/error-handler.js" defer></script>
    <script src="assets/js/state-manager.js" defer></script>
    <script src="assets/js/utils.js" defer></script>
    <script src="assets/js/loading-controller.js" defer></script>
    <script src="assets/js/wiki.js" defer></script>
    <script src="assets/js/inline-icons.js"></script>
    <script>
        // Init Feather Icons if inline-icons.js doesn't catch it or if we need it immediately
        // Actually inline-icons.js handles replacement.

        // Bind language selector
        document.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('lang-selector');
            if(selector && window.i18n) {
                selector.value = window.i18n.currentLang;
                selector.addEventListener('change', (e) => {
                    window.i18n.setLanguage(e.target.value);
                });
            }

            // Theme switcher logic (reused from utils/main but ensuring it works here)
            const themeSwitcher = document.getElementById('theme-switcher');
            if(themeSwitcher) {
                themeSwitcher.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }

            // Load saved theme
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
    </script>
</body>
</html>
